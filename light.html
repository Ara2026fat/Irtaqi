/* ═══════════════════════════════════════════════════════════════════
   بانِي المنهج · وشاشةُ المنهج الواحد
   ───────────────────────────────────────────────────────────────────
   هنا تتحوّل النيّةُ المبهمة إلى عهدٍ له تاريخ. وكان البناءُ يسأل
   الطالبَ أربعةَ أسئلةٍ فيُخرج له جدولًا؛ والجدولُ يقول «متى» ولا
   يقول «كيف». فصُدِّر عليه معرضُ المنهجيّات: يختار الطالبُ طريقةً
   مجرّبةً فتُضبط خطّتُه عليها وتُعرض خطواتُ يومه، ومن أراد أن يَبني
   بنفسه فالمسارُ الحرُّ باقٍ كما كان.

   والحكمُ (تاريخُ الختام) مُقدَّمٌ في المسارين كليهما ولصيقٌ بأسفل
   الشاشة يتبدّل مع كلّ لمسة. ولا حسابَ في هذه الوحدة — الحسابُ
   كلُّه في 05-plans.js، والمنهجيّاتُ في 45-manhaj.js.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var P = App.Plans, Q = App.Quran, ar = App.ar, el = App.el;

  /* ── صيغُ الجمع ──────────────────────────────────────────────────
     العربيّةُ تُفرد وتُثنّي وتجمع، والرقمُ الجافُّ مع المفرد («٩ يوم»)
     يُفسد وقارَ الحكم. فيُصاغ النصُّ صياغةً صحيحة لا تُركَّب تركيبًا. */
  /* ── الطريقُ القصيرُ تحت التجربة ──────────────────────────────
     يُفتَح بإضافةِ ‎?easy=1‎ إلى العنوان، فيُجرَّب على التطبيقِ
     المنشورِ نفسِه دون ملفٍّ ثانٍ ولا بناءٍ ثانٍ — ويُقارَن بالأصلِ
     بتبديلِ حرفٍ في الرابط. فإذا رُضي صار هو الأصلَ وسقط الشرط. */
  if (App.EASY == null) {
    try { App.EASY = /[?&]easy=1/.test(location.search); }
    catch (e) { App.EASY = false; }
  }

  function phrase(n, one, two, few, many) {
    if (n === 1) return one;
    if (n === 2) return two;
    if (n % 100 >= 3 && n % 100 <= 10) return ar(n) + ' ' + few;
    return ar(n) + ' ' + many;
  }
  function pagesPhrase(n) { return phrase(n, 'صفحةٌ واحدة', 'صفحتان', 'صفحات', 'صفحة'); }
  function daysPhrase(n)  { return phrase(n, 'يومٌ واحد', 'يومان', 'أيّام', 'يومًا'); }
  function weeksPhrase(n) { return phrase(n, 'أسبوعٌ واحد', 'أسبوعان', 'أسابيع', 'أسبوعًا'); }
  function weekPhrase(n)  {
    return phrase(n, 'يومٌ واحدٌ في الأسبوع', 'يومان في الأسبوع',
                  'أيّامٍ في الأسبوع', 'يومًا في الأسبوع');
  }
  /* في المِقدار يُكتب العددُ كبيرًا فوق هذا السطر، فلا يُعاد فيه */
  function rateUnit(n) {
    return n === 1 ? 'صفحةٌ واحدةٌ في الجلسة'
         : n === 2 ? 'صفحتان في الجلسة'
         : 'صفحةً في الجلسة';
  }
  /* وفي المعاينة لا عددَ قبلَه، فيُذكر كاملًا بصيغته الصحيحة */
  function ratePhrase(n) {
    return phrase(n, 'صفحةٌ واحدةٌ في الجلسة', 'صفحتان في الجلسة',
                  'صفحاتٍ في الجلسة', 'صفحةً في الجلسة');
  }

  /* خطابُ الطالبة يختلف عن خطاب الطالب، والتطبيقُ يعرف صاحبَه */
  function vg(m, f) {
    return (App.state.profile && App.state.profile.gender === 'f') ? f : m;
  }

  /* ── الأرقامُ المكتوبة ───────────────────────────────────────────
     لوحةُ الهاتف تُدخل أرقامًا لاتينيّة، والواجهةُ لا تعرض إلّا
     الهنديّة؛ فيُقرأ الإدخالُ بالوجهين ويُعاد عرضُه بوجهٍ واحد. */
  function toLatin(s) {
    return String(s).replace(/[٠-٩]/g, function (d) {
      return String(d.charCodeAt(0) - 1632);
    }).replace(/[^0-9]/g, '');
  }

  /* ── حالةُ البناء ────────────────────────────────────────────────
     تبقى خارجَ دالّة الرسم ليعود الطالبُ إلى اختياره كما تركه، ولأنّ
     لوحةَ الحكم تُحدَّث في مكانها بلا إعادة رسمٍ تُفقد التركيز. */
  var draft = null;
  function freshDraft() {
    return {
      kind: 'hifz', scope: 'juz',
      juz: [1, 1], sur: [1, 1], pg: [1, 20],

      if (!draft) draft = freshDraft();

      if (p.scope) draft.scope = p.scope;

  var CSS = [

    '.k-tilawa .kring-pat{stroke-dasharray:1.3 4}',
    '.k-tathbit .kring-pat{stroke-dasharray:1.3 3 7 3}',

    /* اختيارُ النوع: شريطُ خيارٍ مُقسَّمٌ لا أربعُ بطاقاتٍ بعرض الشاشة.
       ولونُ كلِّ خيارٍ ونقشُه حاضرانِ قبل اللمس، فيرى الطالبُ ما سيختار. */
    '.bld-kseg{display:flex;gap:6px}',
    '.bld-kb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;',
    'justify-content:center;gap:6px;min-height:var(--tap);padding:9px 3px;',
    'background:var(--surface);color:var(--ink-mut);border:1.5px solid var(--hair);',
    'border-radius:var(--r-md);font:inherit;font-size:13px;font-weight:600;cursor:pointer;',
    'transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}',
    /* المختارُ يُثخِن حدَّه ويأخذ لونَ نوعه: الثخَنُ يُرى بلا لون */
    '.bld-kb[aria-checked="true"]{background:var(--kind-dim);border-color:var(--kind);',
    'border-width:3px;padding:7.5px 1.5px;color:var(--kind);font-weight:700}',
    '.bld-ksw{width:22px;height:22px;flex:0 0 auto}',
    '.bld-kname{white-space:nowrap}',
    '.bld-kdesc{margin:11px 2px 0;font-size:13.5px;line-height:1.7;color:var(--ink-mut)}',

    /* مُقسّمُ النطاق */
    '.bld-seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;',
    'border-radius:var(--r-pill);margin-bottom:12px}',
    '.bld-seg>button{flex:1 1 0;min-height:var(--tap);border:0;background:transparent;',
    'color:var(--ink-mut);font:inherit;font-size:15px;font-weight:600;cursor:pointer;',
    'border-radius:var(--r-pill);transition:background var(--fast) var(--ease)}',
    '.bld-seg>button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}',

    '.bld-range{display:grid;grid-template-columns:1fr 1fr;gap:10px}',
    '.bld-lbl{display:block;font-size:13px;color:var(--ink-mut);margin-bottom:6px}',
    '.bld-field{position:relative}',
    '.bld-field select,.bld-field input{width:100%;min-height:50px;box-sizing:border-box;',
    'background:var(--surface-2);color:var(--ink);border:1px solid var(--hair);',
    'border-radius:var(--r-sm);font:inherit;font-size:16px;font-weight:600;',
    'padding-inline:14px 34px;-webkit-appearance:none;appearance:none}',
    '.bld-field input{padding-inline:14px;text-align:center}',
    '.bld-field.sel::after{content:"";position:absolute;inset-inline-start:14px;top:50%;',
    'width:7px;height:7px;margin-top:-6px;border-inline-start:2px solid var(--ink-mut);',
    'border-bottom:2px solid var(--ink-mut);transform:rotate(-45deg);pointer-events:none}',
    '.bld-hint{font-size:12px;color:var(--ink-mut);margin-top:8px;line-height:1.6}',

    /* مقدارُ الجلسة */
    '.bld-step{display:flex;align-items:center;gap:12px}',
    '.bld-step>button{width:52px;height:52px;flex:0 0 auto;border-radius:var(--r-pill);',
    'border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);',
    'font:inherit;font-size:26px;font-weight:700;line-height:1;cursor:pointer}',
    '.bld-step>button:disabled{opacity:.4;cursor:default}',
    '.bld-step-v{flex:1 1 auto;text-align:center}',
    '.bld-step-n{display:block;font-size:30px;font-weight:700;line-height:1.1}',
    '.bld-step-u{display:block;font-size:13px;color:var(--ink-mut);margin-top:2px}',

    /* أيّامُ الأسبوع */
    /* سبعةُ أيّامٍ في عرض الهاتف: الفُرجةُ ٤ لا ٦ حتّى يبلغ كلُّ يومٍ
       ٤٤ عرضًا على شاشةِ ٣٩٠ — ولولا ذلك نزل إلى ٤٠. */
    '.bld-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}',
    '.bld-day{min-height:52px;border-radius:var(--r-sm);border:1px solid var(--hair);',
    'background:var(--surface-2);color:var(--ink-mut);font:inherit;font-size:11px;',
    /* كما في شريطِ «اليوم»: اسمُ اليومِ لا يُكسَر بين حروفه مهما ضاق
       به خانتُه — يُقَصّ بنقاطٍ ولا يَصير عمودًا من الحروف. */
    'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:3px;',
    'font-weight:700;cursor:pointer;transition:background var(--fast) var(--ease)}',
    '.bld-day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);',
    'border-color:var(--accent)}',
    '.bld-days-n{font-size:12px;color:var(--ink-mut);margin-top:8px}',

    /* لوحةُ الحكم: لصيقةٌ بالأسفل لأنّها هي المقصود */
    '.bld-slab{position:sticky;bottom:0;z-index:5;margin:18px -2px 0;padding:14px 16px 16px;',
    'background:var(--surface);border:1px solid var(--gold-soft);border-top-color:var(--gold);',
    'border-radius:var(--r-lg);box-shadow:0 -10px 28px -14px var(--ground)}',
    '.bld-slab .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--gold);',
    'text-transform:none;margin:0 0 2px}',
    '.hij{font-size:25px;font-weight:700;line-height:1.3;color:var(--ink);',
    'letter-spacing:-.01em}',
    '.bld-greg{font-size:13px;color:var(--ink-mut);margin-top:2px}',
    '.bld-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}',
    '.bld-nums .stat{background:var(--surface-2);border-radius:var(--r-sm);',
    'padding:8px 6px;text-align:center;min-width:0}',
    '.bld-num-v{display:block;font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}',
    '.bld-num-l{display:block;font-size:11px;color:var(--ink-mut);margin-top:2px}',
    '.bld-bad{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:15px;',
    'font-weight:600;line-height:1.5;padding:6px 0 12px}',
    '.bld-slab .btn{width:100%}',

    /* ── معرضُ المنهجيّات ─────────────────────────────────────────
       بطاقةٌ واسعةٌ لكلّ منهجيّة: الاسمُ لا يكفي، فالطالبُ يختار على
       سطرِ الوصف وعلى الشاراتِ لا على الاسم وحدَه. */
    '.mnj-lead{font-size:14.5px;color:var(--ink-mut);line-height:1.8;margin:0 0 4px}',
    '.mnj-gal{display:flex;flex-direction:column;gap:10px}',
    /* ── بوّابةُ الأغراض ──────────────────────────────────────────
       كان شريطُ تصفيةٍ يُخفي أربعَ بطاقاتٍ من سبع — عملٌ كثيرٌ لكسبٍ
       قليل. صار أربعَ لوحاتٍ متداخلةٍ بشرائطَ مائلة: اللحظةُ مفترقُ
       طريقٍ فتأخذ مساحةَ مفترقٍ لا سطرًا مضغوطًا.
       والتداخلُ بـclip-path، وهو يقطع الأحداثَ كما يقطع الصورة، فكلُّ
       لوحةٍ تستقبل لمسَ ما يُرى منها لا ما يُخفيه جارُها. */
    '.pgate{display:flex;flex-direction:column}',
    /* ١٠٦ لا ١١٦، والحشوُ ١٦ لا ٢٢: الشكوى كانت تمريرًا في شاشةٍ هي
       مفترقُ طريقٍ يُرى كلُّه أو لا يُرى. والمقصوصُ من الفراغِ لا من
       الحرفِ ولا من هدفِ اللمس — وأدنى بطاقةٍ هنا ١٠٦ وحدُّ اللمس ٤٤. */
    '.pg-b{position:relative;width:100%;min-height:106px;display:flex;',
    '  align-items:center;gap:13px;padding:14px 16px;border:0;cursor:pointer;',
    '  text-align:start;font:inherit;color:inherit;',
    '  -webkit-tap-highlight-color:transparent}',
    '.pg-b + .pg-b{margin-block-start:-21px}',
    /* الحافّتان تتبادلان الميلَ فتتشابك اللوحات */
    '.pg-b:nth-child(odd){clip-path:polygon(0 0,100% 13%,100% 100%,0 87%)}',
    '.pg-b:nth-child(even){clip-path:polygon(0 13%,100% 0,100% 87%,0 100%)}',
    '.pg-b:first-child{clip-path:polygon(0 0,100% 0,100% 100%,0 87%)}',
    '.pg-b:last-child{clip-path:polygon(0 13%,100% 0,100% 100%,0 100%)}',
    /* كلُّ لوحةٍ بلون نوعِها، والإيقاعُ في جهةِ الميلِ لا في عتمةِ
       الأرض. وكان التناوبُ داكنةً وفاتحة، والفاتحةُ بكريميٍّ أصمَّ
       (‎#EFE3CA‎) ومِدادٍ أصمَّ فوقه — يُحتمَل في الليلِ الذي كُتب له،
       ثمّ أُعطيَ النهارُ لونَ النوعِ وبقي الليلُ على كريميِّه، فصارت
       لوحتان مُقحَمتان لا تَعرفان سِمةَ التطبيق ولا تتبدّلان بالهويّة.
       فالآنَ قاعدةٌ واحدةٌ للوضعَين: لونُ النوعِ على سطحِ السِّمة. */
    '.pg-b.pg-dark,',
    '.pg-b.pg-lite{background:linear-gradient(135deg,'
      + 'color-mix(in srgb,var(--kind) 20%,var(--surface)),var(--surface))}',
    '.pg-b:nth-child(even){background:linear-gradient(225deg,'
      + 'color-mix(in srgb,var(--kind) 20%,var(--surface)),var(--surface))}',
    '.pg-b .pg-t{color:var(--ink)}',
    '.pg-b .pg-s{color:var(--ink-mut)}',
    /* الخاتمُ صار لوحًا زجاجيًّا قائمًا بنفسه (‎App.icon3d‎): أرضيّتُه
       وحافّتُه وهالتُه كلُّها داخلَ الـSVG، فلا يُطلى هنا شيءٌ تحته —
       ولو بقيت الأرضيّةُ لرُئي مربّعٌ مصمتٌ خلفَ زجاجٍ شفّاف. ويَبقى
       ‎color‎ وحدَه: منه يأخذ الرمزُ لونَ نوعِه. */
    '.pg-ico{flex:0 0 auto;display:grid;place-items:center;width:62px;height:62px}',
    /* اللوحُ يَملأ خانتَه: المقاسُ يَتبدّل بالشاشةِ القصيرةِ في موضعٍ
       واحدٍ (الخانة) لا في موضعين يَفترقان */
    '.pg-ico .i3{width:100%;height:100%}',
    '.pg-b .pg-ico{color:var(--kind)}',
    '.pg-bd{flex:1 1 auto;min-width:0}',
    '.pg-t{display:block;font-size:21px;font-weight:800;line-height:1.3}',
    /* الشَّرطةُ تحت الاسم كما في التصميم، وهي لونُ النوع لا ذهبًا ثابتًا */
    '.pg-rule{display:block;width:40px;height:3px;border-radius:2px;margin:6px 0 0}',
    '.pg-b .pg-rule{background:var(--kind)}',
    '.pg-s{display:block;margin-top:7px;font-size:13px;line-height:1.55}',
    '.pg-n{flex:0 0 auto;font-size:13px;font-weight:700;opacity:.8}',
    '.pg-b .pg-n{color:var(--kind)}',
    /* ── على الورقِ وحدَه ────────────────────────────────────────
       الأرضيّةُ واحدةٌ في الوضعَين (لونُ النوعِ على سطحِ السِّمة)، ولم
       يبقَ للنهارِ إلّا ما يَقتضيه التباينُ عليه: الرقمُ الصغيرُ
       الثخينُ يُغمَّق ١٥٪ ليعبرَ حدَّ النصّ على أرضيّةٍ من لونه نفسِه. */
    'html[data-mode="light"] .pg-b .pg-n{',
    '  color:color-mix(in srgb,var(--kind) 85%,#0B1A16)}',
    '@media (prefers-reduced-motion:no-preference){',
    '  .pg-b{transition:filter var(--fast) var(--ease)}',
    '  .pg-b:hover{filter:brightness(1.07)}}',
    /* ── شاشةٌ قصيرة: البوّابةُ تُرى كلُّها أو ليست بوّابة ──────────
       على ٦٤٠ ارتفاعًا كانت اللوحاتُ الأربعُ وبابُ المسارِ الحرِّ
       يتجاوزون الشاشةَ بمئةٍ وثلاثين، فيَنزل الطالبُ يَبحث عن بابٍ لا
       يَعلم أنّه ثَمّ. فتُقتطَع هنا الفراغاتُ وحدَها: السطرُ المُعين
       يَسقط (العنوانُ سؤالٌ تامٌّ بنفسه)، واللوحُ يَضيق، والحرفُ
       يَبقى كما هو — وهدفُ اللمسِ لا يُمَسّ. */
    '@media (max-height:719px){',
    '  .bld .mnj-lead{display:none}',
    '  .pg-b{min-height:92px;padding:11px 14px;gap:11px}',
    '  .pg-b + .pg-b{margin-block-start:-19px}',
    '  .pg-ico{width:52px;height:52px}',
    '  .pg-t{font-size:19px}',
    '  .pg-rule{margin-top:5px}',
    '  .pg-s{margin-top:5px;font-size:12.5px;line-height:1.5}',
    /* ‎.bld‎ تُسبَق به عمدًا: قاعدةُ ‎.mnj-own‎ الأصليّةُ مكتوبةٌ بعد هذا
       الموضعِ في الملفّ، والمتساويانِ في الخصوصيّةِ يَغلب آخرُهما —
       فالاستعلامُ لا يُكسب قاعدتَه وزنًا، والسابقُ يَخسر بلا صوت. */
    '  .bld .mnj-own{min-height:58px;padding:9px 12px}',
    /* ‎.bld‎ هي ‎.screen‎ نفسُها، وفرجتُها ‎gap‎ لا هامشًا */
    '  .bld{gap:12px}',
    '  .bld .bar{padding-top:0}',
    '}',
    /* ── شاشةٌ طويلة ──────────────────────────────────────────────
       ما وُفِّر للشاشةِ القصيرةِ لا يُؤخَذ من الطويلة: على ٨٤٤ يَبقى
       بعد الضغطِ فراغٌ مئتا بكسل، وهو فراغُ بُخلٍ لا فراغُ وقار.
       فتَستردّ اللوحاتُ سَعتَها حيث لا ثمنَ لها. */
    '@media (min-height:780px){',
    '  .pg-b{min-height:118px;padding:18px 18px}',
    '  .pg-b + .pg-b{margin-block-start:-20px}',
    '  .pg-t{font-size:22px}',
    '}',
    '.mnj-card{display:flex;align-items:flex-start;gap:13px;width:100%;min-height:76px;',
    'padding:14px;text-align:start;background:var(--surface);color:var(--ink);',
    'border:1px solid var(--hair);border-radius:var(--r-lg);cursor:pointer;font:inherit;',
    'transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}',
    '.mnj-card:hover{border-color:var(--accent)}',
    '.mnj-card-ico{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;',
    'border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent)}',
    '.mnj-card-b{flex:1 1 auto;min-width:0}',
    '.mnj-card-t{display:block;font-size:17px;font-weight:700;line-height:1.35}',
    '.mnj-card-s{display:block;font-size:13.5px;color:var(--ink-mut);line-height:1.65;',
    'margin-top:3px}',
    /* المثالُ أهدأُ من العنوانِ وأبينُ من الشارات: سطرٌ مُزاحٌ بحافّةٍ
       بلونِ النوعِ الغالبِ على البطاقة، كأنّه اقتباسٌ من يومٍ قادم. */
    '.mnj-ex{margin-top:9px;padding-inline-start:10px;',
    '  border-inline-start:2.5px solid var(--kind,var(--gold));',
    '  font-size:12.5px;line-height:1.75;color:var(--ink-mut)}',
    '.mnj-ex-k{color:var(--kind,var(--gold-lit));font-weight:800}',
    '.mnj-ex-k::after{content:"";display:inline-block;width:0}',
    '.mnj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}',
    /* السهمُ يشير إلى جهة المُضيّ، وهي في العربيّة اليسار: يُقلب أفقيًّا
       كما تفعل بقيّةُ الوحدات، لا يُرسم له رمزٌ ثانٍ في المعجم. */
    '.mnj-card-ch{flex:0 0 auto;color:var(--ink-mut);margin-top:11px}',
    '.mnj-card-ch svg{transform:scaleX(-1)}',

    /* الطريقُ الحرُّ آخرَ المعرض: بابٌ مفتوحٌ لا خيارٌ أوّل */
    '.mnj-own{display:flex;align-items:center;gap:13px;width:100%;min-height:68px;',
    'padding:12px 14px;text-align:start;background:var(--surface-2);color:var(--ink);',
    'border:1px dashed var(--hair);border-radius:var(--r-lg);cursor:pointer;font:inherit}',
    '.mnj-own:hover{border-color:var(--accent)}',
    '.mnj-own-ico{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;',
    'border-radius:var(--r-sm);background:var(--surface);color:var(--ink-mut)}',

    /* ── خطواتُ اليوم ─────────────────────────────────────────────
       مرقّمةٌ ترقيمًا ظاهرًا: الترتيبُ نفسُه جزءٌ من الطريقة. */
    '.mnj-steps{display:flex;flex-direction:column;gap:13px;margin:0;padding:0;list-style:none}',
    '.mnj-step{display:flex;align-items:flex-start;gap:12px}',
    '.mnj-step-n{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;',
    'margin-top:1px;border-radius:var(--r-pill);background:var(--accent-soft);',
    'color:var(--accent);font-size:13px;font-weight:700}',
    '.mnj-step-b{flex:1 1 auto;min-width:0}',
    '.mnj-step-t{display:block;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45}',
    '.mnj-step-d{display:block;font-size:13.5px;color:var(--ink-mut);line-height:1.8;margin-top:3px}',

    /* ── ترويسةُ المنهجيّة وما سيُنشأ منها ───────────────────────── */
    '.mnj-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:10px}',
    /* الترويسةُ فوق الألسنةِ تُدفع عنها السطور: هي بطاقةُ تعريفٍ لا
       فصلٌ يُقرأ، ووصفُها نزل إلى «الطريقة». فتُضغط رأسيًّا ليَتّسع
       اللسانُ تحتها لشُغله كاملًا بلا تمرير. */
    /* شريطُ الختامِ مضغوطٌ لأنّه مقيمٌ لا عابر: يَقتطع من كلِّ لسانٍ
       ارتفاعَه، فكلُّ بكسلٍ فيه يُدفع ثمنُه ثلاثَ مرّات. فيَبقى منه ما
       يُقرَّر به — تاريخُ الختامِ والزرّ — ويَسقط تفصيلُ الأرقام، وهو
       معروضٌ كاملًا في «ما سيُنشأ» على بُعدِ لمسة. */
    '.bld-slab-fixed{margin-block-start:10px;padding:11px 14px 13px}',
    '.bld-slab-fixed .bld-nums,',
    '.bld-slab-fixed .bld-greg{display:none !important}',
    '.bld-slab-fixed .hij{font-size:17px;margin-block:2px 9px}',
    '.bld-slab-fixed .eyebrow{margin-bottom:0}',
    '.mnj-head-slim{padding-block:12px}',
    '.mnj-head-slim .mnj-head{margin-bottom:8px}',
    '.mnj-head-slim .mnj-head-ico{width:40px;height:40px}',
    '.mnj-head-slim .eyebrow{margin-bottom:1px}',
    '.mnj-head-slim .h2{font-size:19px}',
    /* الخطوةُ الواحدةُ تَرِثُ سطرًا فسيحًا كُتب للنثر، وهي سطرٌ وسطران */
    '.mnj-seg .mnj-step-d{line-height:1.65}',
    '.mnj-seg .mnj-step-t{line-height:1.35}',

  (function injectCSS() {
    var s = document.createElement('style');
    s.setAttribute('data-mod', 'builder');
    s.textContent = CSS;
    document.head.appendChild(s);
  })();

  /* ── مُعِينات بناءٍ صغيرة ────────────────────────────────────────── */
  function btn(cls, label, fn) {
    var b = el('button', cls, label);
    b.type = 'button';
    if (fn) b.onclick = fn;
    return b;
  }
  function section(num, title, body) {
    var s = el('section', 'sec');
    var h = el('div', 'bld-sec-h');
    if (num) h.appendChild(el('span', 'bld-sec-n', ar(num)));
    h.appendChild(el('h2', 'h3 sec-h', title));
    s.appendChild(h);
    s.appendChild(body);
    return s;
  }
  function labelled(text, control, id) {
    var w = el('div');
    var l = el('label', 'bld-lbl', text);
    l.setAttribute('for', id);
    var f = el('div', 'bld-field' + (control.tagName === 'SELECT' ? ' sel' : ''));
    control.id = id;
    f.appendChild(control);
    w.appendChild(l); w.appendChild(f);
    return w;
  }
  function selectOf(count, nameFn, value) {
    var s = document.createElement('select');
    for (var i = 1; i <= count; i++) {
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = nameFn(i);
      if (i === value) o.selected = true;
      s.appendChild(o);
    }
    return s;
  }
  /* شريطٌ أعلى: الرجوعُ أوّلًا، فالطالبُ يحتاج مخرجًا قبل أن يحتاج عنوانًا */
  function topBar(title, back) {
    var b = el('header', 'bar');
    var bk = btn('btn btn-ghost bld-back', App.icon('back', 22), back);
    bk.setAttribute('aria-label', 'رجوع');
    b.appendChild(bk);
    b.appendChild(el('h1', 'h2', title));
    return b;
  }
  /* شارةُ الغرض بلونِ نوعِها: كانت كلُّها بلونِ الهويّة فيَقرأ البصرُ
     «حفظٌ جديد» و«مراجعة» و«تثبيت» شيئًا واحدًا — وهو عينُ ما نفرّ
     منه. وغرضُ «ختمة» لا نوعَ له فيبقى على لون الهويّة. */
  var PUR_CLS = { hifz: 'k-hifz', review: 'k-review', tathbit: 'k-tathbit',
                  tilawa: 'k-tilawa' };
  function purPill(k) {
    /* تُقرأ المنهجيّاتُ من App مباشرةً: M متغيّرٌ محلّيٌّ داخل دالّتَي
       العرض، ولا يراه مَن كان خارجَهما. */
    var M = App.Manhaj || {};
    var cls = PUR_CLS[k];
    return pill(cls ? 'pill-kind ' + cls : 'pill-accent',
                (M.PURPOSE && M.PURPOSE[k]) || k);
  }

  function pill(cls, text) {
    var p = el('span', 'pill' + (cls ? ' ' + cls : ''));
    p.textContent = text;
    return p;
  }

  /* ── كتلةُ النطاق ────────────────────────────────────────────────
     تُستعمل في المسار الحرّ وفي تهيئة المنهجيّة سواءً: السؤالُ واحدٌ
     فلا يُبنى مرّتين بشيفرتين تَفترقان مع الزمن. */
  function scopeBlock(refresh) {
    var box = el('div');
    var seg = el('div', 'bld-seg');
    seg.setAttribute('role', 'radiogroup');
    seg.setAttribute('aria-label', 'طريقةُ تحديد النطاق');
    var SCOPES = [['juz', 'بالجزء'], ['surah', 'بالسورة'], ['page', 'بالصفحة']];
    var segBtns = {};
    SCOPES.forEach(function (sc) {
      var b = btn('chip', sc[1], function () {
        draft.scope = sc[0];
        SCOPES.forEach(function (o) {
          segBtns[o[0]].setAttribute('aria-checked', String(o[0] === sc[0]));
          segBtns[o[0]].tabIndex = o[0] === sc[0] ? 0 : -1;
        });
        drawScope();
        refresh();
      });
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(sc[0] === draft.scope));
      b.tabIndex = sc[0] === draft.scope ? 0 : -1;
      segBtns[sc[0]] = b;
      seg.appendChild(b);
    });
    box.appendChild(seg);
    var body = el('div');
    box.appendChild(body);
    var out = { node: box, note: null };

    function drawScope() {
      body.innerHTML = '';
      var a, b;
      if (draft.scope === 'juz') {
        a = selectOf(30, function (i) { return 'الجزء ' + ar(i); }, draft.juz[0]);
        b = selectOf(30, function (i) { return 'الجزء ' + ar(i); }, draft.juz[1]);
        a.onchange = function () {
          draft.juz[0] = +a.value;
          if (draft.juz[0] > draft.juz[1]) { draft.juz[1] = draft.juz[0]; b.value = a.value; }
          refresh();
        };
        b.onchange = function () {
          draft.juz[1] = +b.value;
          if (draft.juz[0] > draft.juz[1]) { draft.juz[0] = draft.juz[1]; a.value = b.value; }
          refresh();
        };
      } else if (draft.scope === 'surah') {
        a = selectOf(Q.surahCount, function (i) { return Q.surahName(i); }, draft.sur[0]);
        b = selectOf(Q.surahCount, function (i) { return Q.surahName(i); }, draft.sur[1]);
        a.onchange = function () {
          draft.sur[0] = +a.value;
          if (draft.sur[0] > draft.sur[1]) { draft.sur[1] = draft.sur[0]; b.value = a.value; }
          refresh();
        };
        b.onchange = function () {
          draft.sur[1] = +b.value;
          if (draft.sur[0] > draft.sur[1]) { draft.sur[0] = draft.sur[1]; a.value = b.value; }
          refresh();
        };
      } else {
        a = pageInput(0); b = pageInput(1);
      }
      var g = el('div', 'bld-range');
      g.appendChild(labelled(draft.scope === 'page' ? 'من صفحة' : 'من', a, 'bld-a'));
      g.appendChild(labelled(draft.scope === 'page' ? 'إلى صفحة' : 'إلى', b, 'bld-b'));
      body.appendChild(g);
      var note = el('p', 'bld-hint');
      note.id = 'bld-scope-note';
      body.appendChild(note);
      out.note = note;

      /* حقلُ الصفحة: نصٌّ لا رقم، لأنّ حقلَ الرقم يُجبر على أرقامٍ
         لاتينيّةٍ لا تجوز في هذه الواجهة. */
      function pageInput(idx) {
        var i = document.createElement('input');
        i.type = 'text';
        i.inputMode = 'numeric';
        i.autocomplete = 'off';
        i.maxLength = 3;
        i.value = ar(draft.pg[idx]);
        i.setAttribute('aria-label', idx === 0 ? 'صفحةُ البداية' : 'صفحةُ النهاية');
        i.oninput = function () {
          var raw = toLatin(i.value).slice(0, 3);
          i.value = ar(raw);
          var n = parseInt(raw, 10);
          if (!raw || isNaN(n) || n < 1) return;          /* يُنتظر إكمالُ الكتابة */
          if (n > Q.PAGES) { n = Q.PAGES; i.value = ar(n); }
          draft.pg[idx] = n;
          refresh();
        };
        i.onchange = i.onblur = function () {
          var n = parseInt(toLatin(i.value), 10);
          if (isNaN(n) || n < 1) n = 1;
          if (n > Q.PAGES) n = Q.PAGES;
          draft.pg[idx] = n;
          /* التصحيحُ عند الخروج من الحقل: الطرفُ الآخر يتبع لا يُلام */
          if (draft.pg[0] > draft.pg[1]) draft.pg[idx === 0 ? 1 : 0] = n;
          var other = body.querySelector('#bld-' + (idx === 0 ? 'b' : 'a'));
          i.value = ar(draft.pg[idx]);
          if (other) other.value = ar(draft.pg[idx === 0 ? 1 : 0]);
          refresh();
        };
        return i;
      }
    }
    drawScope();
    return out;
  }

  /* ── كتلةُ الأيّام ───────────────────────────────────────────────── */
  function daysBlock(refresh) {
    var box = el('div');
    var grid = el('div', 'bld-days');
    grid.setAttribute('role', 'group');
    grid.setAttribute('aria-label', 'أيّامُ المنهج');
    for (var di = 0; di < 7; di++) (function (d) {
      var b = btn('chip bld-day', App.DAY_SHORT[d], function () {
        var at = draft.days.indexOf(d);
        if (at >= 0) draft.days.splice(at, 1); else draft.days.push(d);
        draft.days.sort();
        b.setAttribute('aria-pressed', String(draft.days.indexOf(d) >= 0));
        refresh();
      });
      b.setAttribute('aria-pressed', String(draft.days.indexOf(d) >= 0));
      b.setAttribute('aria-label', App.DAY_NAME[d]);
      grid.appendChild(b);
    })(di);
    box.appendChild(grid);
    var note = el('p', 'bld-days-n');
    note.setAttribute('aria-live', 'polite');
    box.appendChild(note);
    return { node: box, note: note };
  }

  /* ── خطواتُ المنهجيّة ───────────────────────────────────────────── */
  function stepsList(m) {
    var ol = el('ol', 'mnj-steps');
    (m.steps || []).forEach(function (s, i) {
      var li = el('li', 'mnj-step');
      li.appendChild(el('span', 'mnj-step-n', ar(i + 1)));
      var b = el('div', 'mnj-step-b');
      b.appendChild(el('b', 'mnj-step-t', s.t));
      b.appendChild(el('span', 'mnj-step-d', s.d));
      li.appendChild(b);
      ol.appendChild(li);
    });
    return ol;
  }

  /* ── لوحةُ الحكم ─────────────────────────────────────────────────
     تُبنى مرّةً ويُحدَّث محتواها في مكانه: إعادةُ بنائها في كلّ لمسةٍ
     تُفقد التركيزَ وتُقفز الشاشة. */
  function slabBlock(okLabel, onOk) {
    var slab = el('div', 'card bld-slab');
    slab.setAttribute('aria-live', 'polite');
    var eye = el('p', 'eyebrow', vg('بإذنِ الله تُتمُّه في', 'بإذنِ الله تُتمّينه في'));
    var hij = el('div', 'hij', '');
    var greg = el('div', 'bld-greg', '');
    var bad = el('div', 'bld-bad', '');
    bad.style.display = 'none';
    var nums = el('div', 'bld-nums');
    var vals = [['المجموع'], ['المدّة'], ['الأسابيع']].map(function (t) {
      var w = el('div', 'stat');
      var v = el('b', 'bld-num-v', '');
      w.appendChild(v);
      w.appendChild(el('span', 'bld-num-l', t[0]));
      nums.appendChild(w);
      return v;
    });
    var ok = btn('btn btn-pri btn-gold', okLabel, onOk);
    slab.appendChild(eye); slab.appendChild(hij); slab.appendChild(greg);
    slab.appendChild(bad); slab.appendChild(nums); slab.appendChild(ok);

    /* يُعرض الحكمُ أو العلّةُ، ولا يُعرضان معًا: الحكمُ على خطّةٍ ناقصةٍ كذب */
    function set(pr) {
      if (pr.bad) {
        eye.style.display = 'none'; hij.style.display = 'none';
        greg.style.display = 'none'; nums.style.display = 'none';
        bad.style.display = '';
        bad.innerHTML = App.icon('target', 20) + '<span>' + pr.bad + '</span>';
        ok.disabled = true;
        ok.setAttribute('aria-disabled', 'true');
        return;
      }
      eye.style.display = ''; hij.style.display = '';
      greg.style.display = ''; nums.style.display = '';
      bad.style.display = 'none';
      ok.disabled = false;
      ok.removeAttribute('aria-disabled');
      hij.textContent = ar(pr.hij);
      greg.textContent = ar(pr.greg);
      vals[0].textContent = pagesPhrase(pr.total);
      vals[1].textContent = daysPhrase(pr.days);
      vals[2].textContent = weeksPhrase(pr.weeks);
    }
    return { node: slab, set: set, eyebrow: eye };
  }

  /* ═══════════════ الشاشة: ثلاثةُ أوجه ═══════════════ */
  App.screen('builder', function () {
    if (!draft) draft = freshDraft();
    var M = App.Manhaj;
    if (view.mode === 'manhaj') {
      var m = M && M.byId(view.id);
      if (m) return viewManhaj(m);
      view.mode = 'pick';                /* منهجيّةٌ مجهولةٌ: يُرَدُّ إلى المعرض */
    }
    if (view.mode === 'free') return viewFree();
    return M ? viewPick(M) : viewFree();
  }, { full: true });

  function homeBack() {
    return function () { App.go(App.state.profile ? 'home' : 'onboard'); };
  }

  /* ── وجهُ المعرض ─────────────────────────────────────────────── */
  /* ── الطريقُ القصير: جوابٌ لا أسئلة ──────────────────────────
     الطالبُ الذي لا يدري ماذا يُريد لا يُعينه أن يُسأل خمسَ مرّات:
     نوعُ العملِ، ثمّ الطريقة، ثمّ النطاق، ثمّ الأيّام، ثمّ المقدار.
     فتُقلَب الشاشة: يُعرَض عليه ما نُرشّحه له مضبوطًا كاملًا ومعه
     يومُ ختامه، وزرٌّ واحد. والخمسةُ كلُّها باقيةٌ خلف سطرَين لمن
     أرادها — لا تُحذَف خياراتٌ، بل تُزاح عن طريقِ من لا يُريدها. */
  function viewSuggest(M, purpose) {
    var list = M.byPurpose(purpose);
    if (!list.length) return null;
    /* المرشَّح: أوّلُ طريقةٍ غرضُها الأوّلُ هو ما طلبه الطالب. و«الجَمْع»
       يَصلح للثلاثةِ جميعًا فيَتصدّر كلَّ قائمة، فلو أُخذ الأوّلُ بلا
       تمييزٍ لَوجد من طلب «مراجعة» طريقةً عنوانُها وِردٌ جديد. */
    var m = null, i;
    for (i = 0; i < list.length; i++) {
      if (list[i]['for'] && list[i]['for'][0] === purpose) { m = list[i]; break; }
    }
    if (!m) m = list[0];
    if (typeof m.pre === 'function') m.pre(draft);
    norm(draft);

    var cur = GATE.filter(function (g) { return g.key === purpose; })[0];
    var wrap = el('div', 'screen bld');
    wrap.appendChild(topBar(cur ? cur.t : 'الطريقة', function () {
      view = { mode: 'pick', id: null, purpose: null };
      App.redraw();
    }));

    var head = el('section', 'sec');
    head.appendChild(el('p', 'eyebrow', vg('المقترَحُ لك', 'المقترَحُ لكِ')));
    head.appendChild(el('h2', 'h2', m.name));
    head.appendChild(el('p', 'mnj-lead', m.tagline));
    wrap.appendChild(head);

    var sec = el('section', 'sec');
    var setLine = el('p', 'ez-set');
    sec.appendChild(setLine);

    var slab = slabBlock(vg('ابدأ', 'ابدئي'), function () {
      startManhaj(M, m);
    });
    sec.appendChild(slab.node);

    var alt = el('div', 'ez-alt');
    alt.appendChild(btn('btn btn-ghost', 'غيِّر النطاقَ أو الأيّامَ أو المقدار',
      function () {
        view = { mode: 'manhaj', id: m.id, purpose: purpose, tab: 'set' };
        App.redraw();
      }));
    if (list.length > 1) {
      alt.appendChild(btn('btn btn-ghost',
        phrase(list.length - 1, 'طريقةٌ أخرى', 'طريقتان أخريان',
               'طرائقُ أخرى', 'طريقةً أخرى'), function () {
          view = { mode: 'pick', id: null, purpose: purpose, all: true };
          App.redraw();
        }));
    }
    sec.appendChild(alt);
    wrap.appendChild(sec);

    /* الضبطُ والحكمُ من المنهجيّةِ نفسِها لا من وصفٍ مكتوبٍ بيد */
    setLine.textContent = App.join(P.titleFor(draft),
      weekPhrase(draft.days.length), (M.LEVELS || {})[draft.level] || '');
    var pv = [];
    try {
      pv = m.build({ from: draft.from, to: draft.to, scope: draft.scope,
                     days: draft.days, level: draft.level }) || [];
    } catch (e) { pv = []; }
    if (!pv.length) slab.set({ bad: 'تعذّر بناءُ هذه الطريقة بهذا النطاق' });
    else slab.set(P.project(pv[0]));
    return wrap;
  }

  /* الإنشاءُ في موضعٍ واحد: يُنادى من الشاشةِ القصيرةِ ومن المطوّلة */
  function startManhaj(M, m) {
    norm(draft);
    if (!draft.days.length) { App.toast('اختر يومًا واحدًا على الأقلّ'); return; }
    var made = M.create(m, {
      from: draft.from, to: draft.to, scope: draft.scope,
      days: draft.days.slice(), level: draft.level
    });
    if (!made.length) { App.toast('تعذّر بناءُ هذه المنهجيّة'); return; }
    draft = null;
    view = { mode: 'pick', id: null, purpose: view.purpose };
    App.toast('بُنيت منهجيّةُ ' + m.name);
    App.go('plan', { id: made[0].id });
  }

  function viewPick(M) {
    /* الشاشةُ القصيرةُ قبل المعرض، ما لم يَطلب الطالبُ «طرائقَ أخرى» */
    if (App.EASY && view.purpose && view.purpose !== 'all' && !view.all) {
      var ez = viewSuggest(M, view.purpose);
      if (ez) return ez;
    }
    var wrap = el('div', 'screen bld');
    var inGate = !view.purpose || view.purpose === 'all';
    var cur = inGate ? null : GATE.filter(function (g) {
      return g.key === view.purpose; })[0];

    /* الرجوعُ من قائمةِ غرضٍ إلى البوّابة لا إلى الشاشة الرئيسة:
       الطالبُ دخل من لوحةٍ فليخرج إليها. */
    wrap.appendChild(topBar(inGate ? 'منهجٌ جديد' : (cur ? cur.t : 'الطرائق'),
      inGate ? homeBack() : function () {
        /* جاء من «طرائقُ أخرى»؟ فالرجوعُ إلى المقترَحِ لا إلى البوّابة */
        if (App.EASY && view.all) view = { mode: 'pick', id: null, purpose: view.purpose };
        else view = { mode: 'pick', id: null, purpose: null };
        App.redraw();
      }));

    var intro = el('section', 'sec');
    intro.appendChild(el('h2', 'h3', inGate ? 'ما الذي تريده اليوم؟'
                                            : 'طرائقُ ' + (cur ? cur.t : '')));
    /* السطرُ المُعين يُختصر: شطرُه الثاني («أو ابنِ خطّتك بنفسك») بابٌ
       قائمٌ أسفلَ الشاشةِ بنصّه، فذِكرُه هنا سطرٌ يُدفع ثمنُه تمريرًا */
    intro.appendChild(el('p', 'mnj-lead', inGate
      ? 'اختَر ما أنت فيه، تُعرَض عليك طرائقُه المجرّبة.'
      : (cur ? cur.s : '') + '. اختَر طريقةً تُضبط خطّتُك عليها وتَعرف خطواتَ يومك.'));
    wrap.appendChild(intro);

    /* البوّابةُ أو قائمةُ غرضٍ واحد: view.purpose يحسم أيُّهما يُعرض */
    var sec = el('section', 'sec');
    if (!view.purpose || view.purpose === 'all') {
      sec.appendChild(gate(M));
      sec.appendChild(ownCard());
    } else {
      sec.appendChild(gallery(M, view.purpose));
    }
    wrap.appendChild(sec);
    return wrap;
  }

  /* ما يقوله الطالبُ عن نفسه، لا اسمُ التصنيف عندنا: هو لا يفكّر
     «أحتاج منهجيّةَ تثبيت» بل «أنسى ما حفظت». */
  var GATE = [
    { key: 'hifz',    t: 'حفظ',    icon: 'hifz',
      s: 'أزيد صفحاتٍ جديدةً إلى صدري' },
    { key: 'review',  t: 'مراجعة', icon: 'review',
      s: 'أدور على ما حفظتُ لئلّا يَفلِت' },
    { key: 'tathbit', t: 'تثبيت',  icon: 'tathbit',
      s: 'أُحكم ما حفظتُ قبل أن أزيد' },
    { key: 'khatma',  t: 'ختمة',   icon: 'tilawa',
      s: 'أختم تلاوةً لا حفظًا' }
  ];

  function gate(M) {
    var box = el('div', 'pgate');
    GATE.forEach(function (g, i) {
      var K = P.KINDS[g.key === 'khatma' ? 'tilawa' : g.key] || P.KINDS.hifz;
      var n = M.byPurpose(g.key).length;
      var b = btn('pg-b ' + (i % 2 ? 'pg-lite' : 'pg-dark') + ' ' + K.cls, '',
        function () { view = { mode: 'pick', id: null, purpose: g.key }; App.redraw(); });
      /* هنا الأيقونةُ هي المشهدُ لا دليلٌ عليه، فلها لوحُ البطولة */
      b.appendChild(el('span', 'pg-ico', App.icon3d(g.icon, 62)));
      var bd = el('span', 'pg-bd');
      bd.appendChild(el('b', 'pg-t', g.t));
      bd.appendChild(el('i', 'pg-rule'));
      bd.appendChild(el('span', 'pg-s', g.s));
      b.appendChild(bd);
      b.appendChild(el('span', 'pg-n',
        phrase(n, 'طريقةٌ واحدة', 'طريقتان', 'طرائق', 'طريقة')));
      b.setAttribute('aria-label', g.t + '، ' + g.s + '، ' +
        phrase(n, 'طريقةٌ واحدة', 'طريقتان', 'طرائق', 'طريقة'));
      box.appendChild(b);
    });
    return box;
  }

  function gallery(M, purpose) {
    var box = el('div', 'mnj-gal');
    var list = M.byPurpose(purpose);
    if (!list.length) {
      box.appendChild(el('p', 'small', 'لا منهجيّةَ لهذا الغرض بعد.'));
    }
    list.forEach(function (m) {
      /* البطاقةُ تلبس لونَ غرضِها الأوّل، فحافّةُ المثالِ وعنوانُه
         يَصدُقان عن نوعِ العملِ الذي تُنشئه لا عن لونٍ عامّ. */
      var pk = (m['for'] && m['for'][0]) || 'hifz';
      if (pk === 'khatma') pk = 'tilawa';
      var kc = (P.KINDS[pk] && P.KINDS[pk].cls) || '';
      var b = btn('mnj-card ' + kc, '', function () {
        /* بعضُ المنهجيّات لها نطاقٌ أَولى بها: تُفتح عليه ثمّ يُغيّره الطالب */
        if (typeof m.pre === 'function') m.pre(draft);
        view = { mode: 'manhaj', id: m.id, purpose: view.purpose };
        App.redraw();
      });
      b.appendChild(el('span', 'mnj-card-ico', App.icon(m.icon || 'book', 23)));
      var bd = el('div', 'mnj-card-b');
      bd.appendChild(el('b', 'mnj-card-t', m.name));
      bd.appendChild(el('span', 'mnj-card-s', m.tagline));
      /* المثال: سطرٌ واحدٌ يُري الطالبَ يومَه قبل أن يلتزم */
      var ex = exLine(M, m);
      if (ex) bd.appendChild(ex);
      var tags = el('div', 'mnj-tags');
      m['for'].forEach(function (k) { tags.appendChild(purPill(k)); });
      /* شارةُ العدد محايدةٌ لا ذهبيّة: الذهبُ صار لونَ «حفظ»، فذهبيّتان
         متجاورتان تُقرآن صنفًا واحدًا — والعددُ ليس غرضًا. */
      tags.appendChild(pill('pill-quiet', phrase(m.nplans, 'منهجٌ واحد', 'منهجان',
                                                 'مناهج', 'منهجًا')));
      bd.appendChild(tags);
      b.appendChild(bd);
      b.appendChild(el('span', 'mnj-card-ch', App.icon('chevron', 20)));
      box.appendChild(b);
    });

    box.appendChild(ownCard());
    return box;
  }

  /* ── المثالُ على البطاقة ──────────────────────────────────────
     الطالبُ لا يَختار طريقةً من اسمِها، بل من يومٍ يتخيّله. فيُعرض
     له يومٌ واحدٌ بأرقامه: ما يُطلَب منه فيه، ومتى ينتهي. والأرقامُ
     من build لا من قلمي، فلا تَكذِب إن تغيّر الحساب. */
  var DEMO_WEEK = 5;                /* أيّامُ المثال — تُطابق DEMO_DAYS */

  var EX_VERB = {
    hifz:    'حفظًا',
    tathbit: 'تثبيتًا',
    review:  'مراجعةً',
    tilawa:  'تلاوةً'
  };

  function exQty(n, kind) {
    /* العددُ يُكتب مرّةً واحدةً مع الصفحة، ثمّ يُتبَع بدورِه */
    return phrase(n, 'صفحةٌ', 'صفحتان', 'صفحاتٍ', 'صفحةً')
      + ' ' + (EX_VERB[kind] || '');
  }

  function exLine(M, m) {
    if (!M || typeof M.sample !== 'function') return null;
    var s = M.sample(m, 'mid');
    if (!s || !s.plans.length) return null;

    var parts = s.plans.map(function (p) { return exQty(p.rate, p.kind); });
    /* الفراغُ يُقاس بالمنهجِ الأوّلِ وحدَه، وهو الذي يدور على النطاق
       المذكور. ولو قيس بأطولِها لقيل في «الجَمْع» إنّك تَفرُغ من جزء
       عمّ في ٧٣ يومًا — وتلك مراجعةُ ما قبلَه لا حفظُه. */
    var head = s.plans[0];

    /* «الجلسة» لا «اليوم»: المنهجُ يعمل في أيّامٍ مختارةٍ من الأسبوع،
       فمن قال «في اليوم» وعدَ الطالبَ بما لم يُجدوِل له. والمدّةُ
       تُقلَب أسابيعَ إن طالت، فـ«٢٣ جلسةً» لا تُجيب «متى أفرُغ؟». */
    var dpw = head.dpw || DEMO_WEEK;
    var when = (head.sessions <= 7 && dpw >= 5)
      ? daysPhrase(head.sessions)
      : 'نحوِ ' + weeksPhrase(Math.ceil(head.sessions / Math.max(1, dpw)));

    var box = el('p', 'mnj-ex');
    box.appendChild(el('b', 'mnj-ex-k', 'مثال'));
    box.appendChild(document.createTextNode(
      /* العطفُ في النثرِ بالواو لا بالفاصلةِ وحدَها: App.join فاصلُ
         إحصاءٍ لا حرفُ عطف، فيُخرج «صفحةٌ حفظًا,٣ صفحاتٍ تثبيتًا». */
      ' على ' + s.label + ': ' + parts.join('، و') + ' في الجلسة، '
      + (dpw === DEMO_WEEK ? '' : phrase(dpw, 'جلسةٌ واحدةٌ في الأسبوع',
          'جلستان في الأسبوع', 'جلساتٍ في الأسبوع', 'جلسةً في الأسبوع') + '، ')
      + 'وتَفرُغ ' + (s.pron || 'منه') + ' في ' + when + '.'));
    return box;
  }

  /* بابُ المسار الحرّ: يظهر في البوّابة وفي كلّ قائمةِ غرض، فمن لم
     تُعجبه الطرائقُ وجد مخرجَه حيثما وقف. */
  function ownCard() {
    var own = btn('mnj-own', '', function () {
      view = { mode: 'free', id: null, purpose: view.purpose };
      App.redraw();
    });
    own.appendChild(el('span', 'mnj-own-ico', App.icon('edit', 20)));
    var ob = el('div', 'mnj-card-b');
    ob.appendChild(el('b', 'mnj-card-t', 'أبني خطّتي بنفسي'));
    ob.appendChild(el('span', 'mnj-card-s', 'تختار النوعَ والنطاقَ والمقدارَ والأيّام'));
    own.appendChild(ob);
    own.appendChild(el('span', 'mnj-card-ch', App.icon('chevron', 20)));
    return own;
  }

  /* ── وجهُ المنهجيّة ──────────────────────────────────────────── */
  function viewManhaj(m) {
    var M = App.Manhaj;
    var wrap = el('div', 'screen bld');
    wrap.appendChild(topBar(m.name, function () {
      view = { mode: 'pick', id: null, purpose: view.purpose };
      App.redraw();
    }));

    /* تعريفُ المنهجيّة: لِمَن تصلح، وبماذا تعمل */
    var head = el('section', 'sec card');
    var hd = el('div', 'mnj-head');
    hd.appendChild(el('span', 'mnj-head-ico', App.icon(m.icon || 'book', 25)));
    var ht = el('div', 'mnj-card-b');
    ht.appendChild(el('p', 'eyebrow', 'منهجيّة'));
    ht.appendChild(el('h2', 'h2', m.name));
    ht.appendChild(el('p', 'mnj-card-s', m.tagline));
    hd.appendChild(ht);
    head.appendChild(hd);
    var tags = el('div', 'mnj-tags');
    (m.suits || []).forEach(function (k) {
      if (M.LEVELS[k]) tags.appendChild(pill('pill-gold', M.LEVELS[k]));
    });
    m['for'].forEach(function (k) { tags.appendChild(purPill(k)); });
    head.appendChild(tags);
    head.classList.add('mnj-head-slim');
    wrap.appendChild(head);

    /* ── ثلاثةُ ألسنة ─────────────────────────────────────────────
       كانت صفحةً واحدةً طولُها ٢٫٣٦ شاشة — أطولُ ما في التطبيق: يَضبط
       الطالبُ النطاقَ في وسطها ثمّ ينزل يَطلُب أثرَ ضبطِه، فلا يرى
       المِقودَ والنتيجةَ في نظرةٍ واحدة.

       وهويّةُ المنهجيّةِ تبقى فوق الألسنةِ لأنّها لا تخصّ واحدًا منها،
       ومعها اسمُها وغرضُها — ووصفُها نزل إلى «الطريقة» حيث يُقرأ. */
    var PANE = { how: el('div'), set: el('div'), out: el('div') };

    /* الخطوات: هي المنهجيّة في الحقيقة */
    var st = el('section', 'sec card');
    st.appendChild(el('p', 'mnj-desc', m.desc));
    st.appendChild(el('p', 'eyebrow', 'خطواتُ يومك'));
    st.appendChild(stepsList(m));
    PANE.how.appendChild(st);

    var sb = scopeBlock(function () { refresh(); });
    PANE.set.appendChild(section(1, 'النطاق', sb.node));

    var db = daysBlock(function () { refresh(); });
    PANE.set.appendChild(section(2, 'الأيّام', db.node));

    /* المستوى: لا يُغيّر الطريقةَ بل المقدارَ الذي تُطيقه */
    var lvlBox = el('div');
    var lvl = el('div', 'mnj-lvl');
    lvl.setAttribute('role', 'radiogroup');
    lvl.setAttribute('aria-label', 'مستواك');
    var lvlBtns = {};
    M.LEVEL_PICK.forEach(function (k) {
      var b = btn('chip', M.LEVELS[k], function () {
        draft.level = k;
        M.LEVEL_PICK.forEach(function (j) {
          lvlBtns[j].setAttribute('aria-checked', String(j === k));
          lvlBtns[j].tabIndex = j === k ? 0 : -1;
        });
        refresh();
      });
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(k === draft.level));
      b.tabIndex = k === draft.level ? 0 : -1;
      lvlBtns[k] = b;
      lvl.appendChild(b);
    });
    lvlBox.appendChild(lvl);
    var lvlNote = el('p', 'bld-days-n', 'يُقدَّر به مقدارُ يومك وحدَه، والخطواتُ لا تتغيّر.');
    lvlBox.appendChild(lvlNote);
    PANE.set.appendChild(section(3, 'مستواك', lvlBox));

    /* ما سيُنشأ: الطالبُ يرى المناهجَ قبل أن يلتزم بها لا بعد */
    var outSec = el('section', 'sec');
    var outH = el('div', 'bld-sec-h');
    outH.appendChild(el('h2', 'h3 sec-h', 'ما سيُنشأ'));
    outSec.appendChild(outH);
    var outBox = el('div', 'mnj-out');
    outSec.appendChild(outBox);
    PANE.out.appendChild(outSec);

    var slab = slabBlock(vg('ابدأ المنهجيّة', 'ابدئي المنهجيّة'), function () {
      startManhaj(M, m);               /* الإنشاءُ في موضعٍ واحدٍ لا اثنين */
    });
    /* ── الالتزامُ خارجَ الألسنة ──────────────────────────────────
       وُضع أوّلَ الأمرِ في لسان «ما سيُنشأ»، فأثبتت الرحلةُ ما كان
       ينبغي أن يُرى قبلها: طالبٌ يضبط نطاقَه وأيّامَه ثمّ لا يجد زرًّا
       يُنشئ به، لأنّ الزرَّ في لسانٍ ثالثٍ لم يَعلم أنّ عليه فتحَه.
       واللسانُ يُخفي ما بداخله — وهذا حقُّه — فلا يُوضع فيه ما لا
       يَحتمل الخفاء.

       فصار شريطَ ختامٍ ثابتًا تحت الألسنة: يُرى في كلِّ لسان، ويتبدّل
       نصُّه مع كلِّ ضبطةٍ فيُخبر عن أثرِها قبل الالتزام. */
    wrap.appendChild(App.seg([
      { key: 'how', label: 'الطريقة',  icon: 'book',
        render: function () { return PANE.how; } },
      { key: 'set', label: 'ضبطُها',   icon: 'settings',
        render: function () { return PANE.set; } },
      { key: 'out', label: 'ما سيُنشأ', icon: 'check',
        render: function () { return PANE.out; } }
    ], { cls: 'mnj-seg', start: view.tab || 'how' }));

    slab.node.classList.add('bld-slab-fixed');
    wrap.appendChild(slab.node);

    function refresh() {
      norm(draft);
      if (sb.note) {
        /* App.join يختار الفاصل: الطرفُ الأيسرُ ينتهي برقمٍ هنا،
           و«٢١ · الجزء» تُقرأ «٢١٠» لأنّ النقطةَ صورةُ الصفر. */
        sb.note.textContent = App.join(
          'الصفحات ' + ar(draft.from) + ' – ' + ar(draft.to), P.titleFor(draft));
      }
      db.note.textContent = draft.days.length ? weekPhrase(draft.days.length)
                                              : 'لم تُختر أيّامٌ بعد';

      /* المنهجيّةُ تُقوّم الأيّامَ الفارغةَ إلى أيّامٍ افتراضيّةٍ لئلّا تُخرج
         منهجًا معطوبًا؛ فلو تُركت لها الكلمةُ هنا لرأى الطالبُ ختامًا صحيحًا
         ولم يختر يومًا، ثمّ وجد منهجَه على أيّامٍ لم يَرْضَها. فيُسأل أوّلًا. */
      if (!draft.days.length) {
        outBox.innerHTML = '';
        slab.set({ bad: 'اختر يومًا واحدًا على الأقلّ' });
        return;
      }

      /* المعاينةُ تُبنى من المنهجيّة نفسِها لا من وصفٍ مكتوبٍ بيدٍ: ما يُعرض
         هو ما سيُحفظ حرفًا بحرف. */
      var pv = [];
      try {
        pv = m.build({
          from: draft.from, to: draft.to, scope: draft.scope,
          days: draft.days, level: draft.level
        }) || [];
      } catch (e) { pv = []; }

      outBox.innerHTML = '';
      pv.forEach(function (p) {
        var K = P.KINDS[p.kind] || P.KINDS.hifz;
        /* المنهجيّةُ تُخرج مناهجَ من أنواعٍ مختلفة، فيُفرَّق بينها في
           المعاينة بما يُفرَّق به في الشاشات: لونُ النوعِ وحافّتُه */
        var r = el('div', 'mnj-out-r kedge ' + P.kindCls(p));
        r.appendChild(el('span', 'mnj-out-i kemb', App.icon(K.icon, 18)));
        var b = el('div', 'mnj-out-b');
        b.appendChild(el('b', 'mnj-out-t', p.title));
        /* الفاصلُ يُحسم عند الوصل: ratePhrase تبدأ برقمٍ أحيانًا */
        b.appendChild(el('span', 'mnj-out-s',
          App.join(K.t, ratePhrase(p.rate), weekPhrase(p.days.length))));
        r.appendChild(b);
        outBox.appendChild(r);
      });

      /* الحكمُ على المنهج الأوّل: هو عمودُ المنهجيّة وما بعده يَدور معه */
      if (!pv.length) {
        slab.set({ bad: 'تعذّر بناءُ هذه المنهجيّة بهذا النطاق' });
        return;
      }
      slab.eyebrow.textContent = (pv.length > 1 ? 'ختامُ ' + pv[0].title + ' بإذنِ الله' : null)
        || vg('بإذنِ الله تُتمُّه في', 'بإذنِ الله تُتمّينه في');
      slab.set(P.project(pv[0]));
    }
    refresh();
    return wrap;
  }

  /* ── الوجهُ الحرّ: كما كان، أربعةُ أسئلةٍ وحكمٌ ───────────────── */
  function viewFree() {
    var wrap = el('div', 'screen bld');
    wrap.appendChild(topBar('خطّتي بنفسي', function () {
      if (App.Manhaj) {
        view = { mode: 'pick', id: null, purpose: view.purpose };
        App.redraw();
      } else { homeBack()(); }
    }));

    /* ① النوع — شريطُ خيارٍ لا أربعُ بطاقاتٍ بعرض الشاشة ──────────────
       أربعُ بطاقاتٍ كانت تَزحم أوّلَ البناء وتُؤخّر النطاقَ والمقدارَ عن
       أوّلِ نظرة، والنوعُ خيارٌ واحدٌ من أربعةٍ فشريطُه أوجزُ وأصدقُ.
       والوصفُ لا يُمحى بل يُنقل أسفلَ الشريط: وصفُ المختار وحدَه يُقرأ،
       وأربعةُ أوصافٍ معًا لا تُقرأ. */
    var kindBox = el('div');
    var kseg = el('div', 'bld-kseg');
    kseg.setAttribute('role', 'radiogroup');
    kseg.setAttribute('aria-label', 'نوعُ المنهج');
    var kDesc = el('p', 'bld-kdesc');
    kDesc.setAttribute('aria-live', 'polite');
    var kindBtns = {}, KORD = Object.keys(P.KINDS);

    function pickKind(k, focus) {
      draft.kind = k;
      KORD.forEach(function (j) {
        kindBtns[j].setAttribute('aria-checked', String(j === k));
        kindBtns[j].tabIndex = j === k ? 0 : -1;
      });
      kDesc.textContent = P.KINDS[k].d;
      if (focus) kindBtns[k].focus();
      refresh();
    }

    KORD.forEach(function (k, i) {
      var K = P.KINDS[k];
      /* صنفُ النوعِ على الزرّ نفسِه: أبناؤه يَرِثون --kind فيُظهر كلُّ
         خيارٍ لونَه ونقشَه قبل أن يُلمس */
      var b = btn('bld-kb ' + K.cls, '', function () { pickKind(k); });
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(k === draft.kind));
      b.tabIndex = k === draft.kind ? 0 : -1;
      b.appendChild(el('span', 'bld-ksw kemb', App.icon(K.icon, 13)));
      b.appendChild(el('span', 'bld-kname', K.t));
      /* الأسهمُ تنقّل داخلَ المجموعة كما يقضي معيارُ WAI-ARIA للراديو،
         واليمينُ تَسبِق لأنّ الصفحةَ عربيّة */
      b.onkeydown = function (e) {
        var n = (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? i + 1
              : (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? i - 1 : null;
        if (n === null) return;
        e.preventDefault();
        pickKind(KORD[(n + KORD.length) % KORD.length], true);
      };
      kindBtns[k] = b;
      kseg.appendChild(b);
    });
    kindBox.appendChild(kseg);
    kDesc.textContent = (P.KINDS[draft.kind] || P.KINDS.hifz).d;
    kindBox.appendChild(kDesc);
    wrap.appendChild(section(1, 'النوع', kindBox));

    /* ② النطاق: ثلاثُ طرقٍ لقولِ الشيء نفسِه، والمخرَجُ صفحاتٌ دائمًا */
    var sb = scopeBlock(function () { refresh(); });
    wrap.appendChild(section(2, 'النطاق', sb.node));

    /* ③ المقدار */
    var step = el('div', 'bld-step');
    step.setAttribute('role', 'group');
    step.setAttribute('aria-label', 'مقدارُ الجلسة');
    var minus = btn('', '−', function () { setRate(draft.rate - 1); });
    minus.setAttribute('aria-label', 'أنقص صفحة');
    var plus = btn('', '+', function () { setRate(draft.rate + 1); });
    plus.setAttribute('aria-label', 'أزد صفحة');
    var vBox = el('div', 'bld-step-v');
    var vNum = el('span', 'bld-step-n', ar(draft.rate));
    var vUnit = el('span', 'bld-step-u', 'صفحةً في الجلسة');
    vBox.appendChild(vNum); vBox.appendChild(vUnit);
    vBox.setAttribute('aria-live', 'polite');
    step.appendChild(minus); step.appendChild(vBox); step.appendChild(plus);
    function setRate(n) {
      draft.rate = Math.max(1, Math.min(20, n));
      vNum.textContent = ar(draft.rate);
      vUnit.textContent = rateUnit(draft.rate);
      minus.disabled = draft.rate <= 1;
      plus.disabled = draft.rate >= 20;
      refresh();
    }
    wrap.appendChild(section(3, 'المقدار', step));

    /* ④ الأيّام */
    var db = daysBlock(function () { refresh(); });
    wrap.appendChild(section(4, 'الأيّام', db.node));

    var slab = slabBlock('ابدأ المنهج', function () {
      norm(draft);
      var pr = P.project({ from: draft.from, to: draft.to, rate: draft.rate,
                           days: draft.days, done: 0 });
      if (pr.bad) { App.toast(pr.bad); return; }
      var p = P.create({
        kind: draft.kind, scope: draft.scope,
        from: draft.from, to: draft.to,
        rate: draft.rate, days: draft.days.slice()
      });
      draft = null;                      /* المنهجُ وُلد، فلا تُحفظ مسوّدتُه */
      view = { mode: 'pick', id: null, purpose: view.purpose };
      App.toast('بُني منهجُك');
      App.go('plan', { id: p.id });
    });
    wrap.appendChild(slab.node);

    /* الحكمُ يُعاد حسابُه عند كلّ لمسةٍ من أيّ قرارٍ من الأربعة */
    function refresh() {
      norm(draft);
      if (sb.note) {
        /* App.join يختار الفاصل: الطرفُ الأيسرُ ينتهي برقمٍ هنا،
           و«٢١ · الجزء» تُقرأ «٢١٠» لأنّ النقطةَ صورةُ الصفر. */
        sb.note.textContent = App.join(
          'الصفحات ' + ar(draft.from) + ' – ' + ar(draft.to), P.titleFor(draft));
      }
      db.note.textContent = draft.days.length ? weekPhrase(draft.days.length)
                                              : 'لم تُختر أيّامٌ بعد';
      slab.set(P.project({
        from: draft.from, to: draft.to,
        rate: draft.rate, days: draft.days, done: 0
      }));
    }
    setRate(draft.rate);                 /* يَضبط الأزرارَ ويستدعي refresh */
    return wrap;
  }

  /* ═══════════════ شاشةُ المنهج ═══════════════ */
  App.screen('plan', function (params) {
    var plan = P.byId(params && params.id);
    /* صنفُ النوعِ على الشاشة كلِّها: الخاتمُ والشريطُ والنسبةُ تَرِث
       --kind فلا يُلوَّن كلُّ واحدٍ منها على حدة */
    var wrap = el('div', 'screen pln ' + P.kindCls(plan));
    if (!plan) {
      wrap.appendChild(topBar('المنهج', function () { App.go('home'); }));
      var m0 = el('section', 'sec card');
      m0.appendChild(el('p', 'small', 'لم نجد هذا المنهج؛ لعلّه حُذف.'));
      wrap.appendChild(m0);
      return wrap;
    }

    var K = P.KINDS[plan.kind] || P.KINDS.hifz;
    var total = P.total(plan), done = plan.done || 0, pct = P.pct(plan);
    var finished = done >= total;
    var mnj = App.Manhaj ? App.Manhaj.ofPlan(plan) : null;

    wrap.appendChild(topBar(K.t, function () { App.go('home'); }));

    /* العنوان: النوعُ والنطاقُ في سطرٍ واحدٍ يُعرَف به المنهج */
    var head = el('section', 'sec card kedge');
    var hd = el('div', 'pln-head');
    hd.appendChild(el('span', 'pln-emb kemb', App.icon(K.icon, 24)));
    var ht = el('div');
    /* اسمُ النوعِ بلونه، واسمُ المنهجيّةِ بلون المداد: الأوّلُ هويّةٌ
       والثاني خبرٌ، فلا يُصبغان صبغةً واحدة */
    var eb = el('p', 'eyebrow');
    eb.appendChild(el('span', 'pln-kind', K.t));
    if (mnj) eb.appendChild(document.createTextNode(' · منهجيّةُ ' + mnj.name));
    ht.appendChild(eb);
    ht.appendChild(el('h2', 'h2', plan.title || P.titleFor(plan)));
    hd.appendChild(ht);
    head.appendChild(hd);
    /* App.join يختار الفاصل: نقطةٌ وسطى بين كلمتَين، وفاصلةٌ عربيّةٌ
       قبل رقم — فـ«· ٣ صفحات» تُقرأ «٠٣» والنقطةُ صورةُ الصفر. */
    head.appendChild(el('p', 'small', App.join(
      'الصفحات ' + ar(plan.from) + ' – ' + ar(plan.to),
      phrase(plan.rate, 'صفحةٌ واحدة', 'صفحتان', 'صفحات', 'صفحة') + ' في الجلسة'
    )));
    wrap.appendChild(head);

    /* ── وردُ اليوم أو الختام ─────────────────────────────────── */
    var card = el('section', 'sec card');
    if (finished) {
      /* لا بوقَ ولا كأس: الختامُ يُقال بوقارٍ ويُترك أثرُه */
      var dn = el('div', 'pln-done');
      dn.appendChild(el('span', 'pln-done-m', App.icon('check', 26)));
      dn.appendChild(el('p', 'pln-done-t', vg('أتممتَ هذا المنهج', 'أتممتِ هذا المنهج')));
      dn.appendChild(el('p', 'pln-done-d',
        pagesPhrase(total) + ' · بدأتَه في ' + ar(plan.startedAt.split('-').reverse().join('/'))));
      card.appendChild(dn);
    } else {
      var r = P.todayRange(plan);
      var w = el('div', 'pln-ward');
      w.appendChild(el('p', 'eyebrow', 'وردُ اليوم'));
      /* صفحةٌ واحدةٌ لا تُقال مدًى: «من صفحة ٥٦٦ إلى ٥٦٦» ركيكةٌ
         ومُلبِسة، ومقدارُ الصفحةِ الواحدةِ أكثرُ المقادير. */
      w.appendChild(el('p', 'pln-ward-n', r.from === r.to
        ? 'صفحة <b>' + ar(r.from) + '</b>'
        : 'من صفحة <b>' + ar(r.from) + '</b> إلى <b>' + ar(r.to) + '</b>'));
      /* اسمُ السورة للاستئناس: الرقمُ وحدَه لا يدلّ الطالبَ على موضعه */
      var sa = Q.surahOf(r.from), sbb = Q.surahOf(r.to);
      w.appendChild(el('p', 'pln-ward-s', sa === sbb
        ? 'في سورة ' + Q.surahName(sa)
        : 'من سورة ' + Q.surahName(sa) + ' إلى سورة ' + Q.surahName(sbb)));
      w.appendChild(el('p', 'pln-ward-c', pagesPhrase(r.count) +
        (P.isDueToday(plan) ? '' : ' · اليومُ ليس من أيّام منهجك، والأمرُ إليك')));
      card.appendChild(w);

      var acts = el('div', 'pln-acts');
      /* القراءةُ قبل التسجيل: المصحفُ في التطبيقِ نفسِه، فلا يُترَك
         الطالبُ يَخرج إلى غيرِه ثمّ يَعود ليَضغط «أتممتُ». */
      if (App.Quran && window.__screens && window.__screens.qpage) {
        acts.appendChild(btn('btn btn-gold',
          App.icon('book', 19) + '<span>اقرأ الورد</span>', function () {
            App.go('qpage', { p: r.from });
          }));
      }
      /* والتسميعُ معها: أن يَسرُد الطالبُ من حفظه ويَسمع نفسَه هو
         جوهرُ الحفظ، لا القراءةُ وحدَها. وكان مدفونًا في ذيلِ صفحةِ
         المصحفِ فلم يَعرف به أحد. */
      if (App.Quran && window.__screens && window.__screens.tasmee) {
        acts.appendChild(btn('btn btn-ghost',
          '<span>سمِّع الورد</span>', function () {
            App.go('tasmee', { p: r.from });
          }));
      }
      var doneBtn = btn('btn btn-pri', vg('أتممتُ ورد اليوم', 'أتممتُ ورد اليوم'), function () {
        var n = P.markDone(plan, r.count);
        if (n > 0) App.toast('سُجّل ' + pagesPhrase(n));
        App.redraw();
      });
      acts.appendChild(doneBtn);
      /* التراجعُ لليوم وحدَه: ما مضى من الأيّام لا يُنقض من هنا */
      if (P.doneToday(plan) > 0) {
        acts.appendChild(btn('btn btn-ghost', 'تراجعْ عن تسجيل اليوم', function () {
          var n = P.undoToday(plan);
          if (n > 0) App.toast('أُلغي تسجيلُ اليوم');
          App.redraw();
        }));
      }
      card.appendChild(acts);
    }
    wrap.appendChild(card);

    /* ── خطواتُ المنهجيّة ─────────────────────────────────────────
       الرقمان «من صفحةٍ إلى صفحة» يقولان القدرَ ولا يقولان العمل؛ فمن
       بنى منهجَه على منهجيّةٍ رأى خطواتِ يومه حيث يحتاجها لا في معرضٍ
       مضى عليه. ومن بناه بيده لا يُقحَم عليه شيء. */
    /* وتُطوى: سبعُ خطواتٍ مفتوحةً تَدفع التقدّمَ والختامَ إلى صفحةٍ
       ثانيةٍ لا تُرى. وهي تُقرأ مرّةً ثمّ تُعرَف، فلا تُفرَض كلَّ فتحة. */
    if (mnj && !finished) {
      var sc = el('section', 'sec card pln-steps');
      var stBtn = el('button', 'pln-stb');
      stBtn.type = 'button';
      stBtn.setAttribute('aria-expanded', 'false');
      stBtn.appendChild(el('span', 'pln-stb-t', 'خطواتُ يومك'));
      stBtn.appendChild(el('span', 'pln-stb-n', 'منهجيّةُ ' + mnj.name));
      stBtn.appendChild(el('span', 'pln-stb-c', App.icon('chevron', 18)));
      var stBox = el('div', 'pln-stbox');
      stBox.appendChild(stepsList(mnj));
      stBox.hidden = true;
      stBtn.onclick = function () {
        var o = stBtn.getAttribute('aria-expanded') !== 'true';
        stBtn.setAttribute('aria-expanded', String(o));
        stBox.hidden = !o;
        sc.classList.toggle('is-open', o);
      };
      sc.appendChild(stBtn);
      sc.appendChild(stBox);
      wrap.appendChild(sc);
    }

    /* ── التقدّم ──────────────────────────────────────────────── */
    var pg = el('section', 'sec card');
    var pl = el('div', 'pln-pct');
    pl.appendChild(el('span', 'pln-pct-n', ar(pct) + '٪'));
    pl.appendChild(el('span', 'pln-pct-s', ar(done) + ' من ' + pagesPhrase(total)));
    pg.appendChild(pl);
    var bar = el('div', 'pln-bar');
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', 'نسبةُ إتمام المنهج');
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', '100');
    bar.setAttribute('aria-valuenow', String(pct));
    bar.setAttribute('aria-valuetext', ar(pct) + '٪');
    var fill = el('i', 'kfill');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    pg.appendChild(bar);

    if (!finished) {
      var pr = P.project(plan);
      var fin = el('div', 'pln-fin');
      fin.appendChild(el('span', '', App.icon('calendar', 20)));
      fin.appendChild(el('span', '', pr.bad
        ? pr.bad
        /* التاريخُ ينتهي برقمٍ فلا نقطةَ وسطى بعده */
        : 'الختامُ <b>' + ar(pr.hij) + '</b><br>' +
          App.join(ar(pr.greg), 'بقي ' + pagesPhrase(pr.left))));
      fin.style.marginTop = '12px';
      pg.appendChild(fin);
    }
    /* المشاركةُ تُلحَق بقسم التقدّم لا تُوضع فوق زرّ الحذف: كانت
       جارتَه فتقع العينُ على «احذف» وهي تقصد «شارِك»، وبينهما فرقُ
       ما لا رجعةَ فيه. وهي ذهبيّةٌ ظاهرةٌ لأنّها فعلٌ مطلوبٌ لا
       أداةٌ جانبيّة — وهذا ما جعله لا يجدها. */
    if (window.IrtaqiShare && typeof window.IrtaqiShare.planCard === 'function') {
      var sh = btn('btn btn-gold btn-block pln-share',
                   App.icon('share', 19), function () {
        window.IrtaqiShare.planCard(plan);
      });
      sh.appendChild(document.createTextNode('أرسِل المنهجَ في واتساب'));
      pg.appendChild(sh);
    }
    wrap.appendChild(pg);

    var tools = el('section', 'sec');

    /* الحذفُ لا يُلمس مرّتين بالخطأ: يُسأل أوّلًا في موضعه */
    var delBox = el('div', 'pln-del');
    function drawDel(asking) {
      delBox.innerHTML = '';
      if (!asking) {
        var d = btn('btn btn-ghost pln-del-b',
          App.icon('trash', 20) + '<span>حذفُ المنهج</span>', function () { drawDel(true); });
        d.style.color = 'var(--danger)';
        delBox.appendChild(d);
        return;
      }
      delBox.appendChild(el('p', 'pln-del-q', 'يُحذف المنهجُ وسجلُّه كلُّه. أتُتابع؟'));
      var yes = btn('btn', 'نعم، احذفْه', function () {
        P.remove(plan.id);
        App.toast('حُذف المنهج');
        App.go('home');
      });
      yes.style.background = 'var(--danger)';
      yes.style.color = 'var(--on-accent)';
      delBox.appendChild(yes);
      delBox.appendChild(btn('btn btn-ghost', 'إلغاء', function () { drawDel(false); }));
    }
    drawDel(false);
    tools.appendChild(delBox);
    wrap.appendChild(tools);

    return wrap;
  });
})(window.App);

/* ══ 45-manhaj.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   المنهجيّات
   ───────────────────────────────────────────────────────────────────
   الجدولُ يقول للطالب «متى»، والمنهجيّةُ تقول له «كيف». وأكثرُ من
   انقطع عن الحفظ لم ينقطع لأنّ جدولَه ضاق، بل لأنّه جلس لا يدري
   بماذا يبدأ ولا بماذا يختم. فجُمعت هنا طرائقُ مجرّبةٌ معروفةٌ عند
   أهل الحلقات، لكلٍّ منها خطواتُ يومٍ مرتّبة، وكلُّ واحدةٍ تعرف
   بنفسها كيف تُترجَم إلى مناهجَ في الحالة.

   والمنهجيّةُ هنا وصفٌ لا حساب: الحسابُ كلُّه في 05-plans.js، وهذه
   الوحدةُ لا تَبني إلّا كائناتِ المناهج ثمّ تُسلّمها.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var P = App.Plans, Q = App.Quran;

  /* الأغراضُ الأربعة: تُعرض شاراتٍ على البطاقة، وبها يُصفّى المعرض */
  var PURPOSE = {
    hifz:    'حفظٌ جديد',
    review:  'مراجعة',
    tathbit: 'تثبيت',
    khatma:  'ختمة'
  };
  /* تسميةٌ أقصرُ لشريط التصفية وحدَه: خمسةُ ألسنةٍ بالتسمية الطويلة
     تبلغ ٣٧٢px في وعاءٍ ٣٥٢، فيبقى «ختمة» خارج النظر — ولسانٌ لا
     يُرى لا يُعرف أنّه موجود. والبطاقاتُ تُبقي التسميةَ التامّة. */
  var PURPOSE_SHORT = {
    hifz: 'حفظ', review: 'مراجعة', tathbit: 'تثبيت', khatma: 'ختمة'
  };

  /* المستوى: يُغيّر المقدارَ وحدَه ولا يُغيّر الخطوات — فالطريقةُ واحدةٌ
     للمبتدئ والمتقن، وإنّما يختلفان في القدر الذي يُطيقانه. */
  var LEVELS = {

    /* الضميرُ يتبع المعدود: «عشرةِ أجزاء» جمعٌ فيُقال «منها» */
    sard:    { label: 'عشرةِ أجزاء',   from: 402, to: 604, pron: 'منها' },
    tathbit: { label: 'جزء عمّ',       from: 582, to: 604 },
    nisf:    { label: 'جزء عمّ',       from: 582, to: 604 },
    khatma:  { label: 'المصحفِ كلِّه', from: 1,   to: Q.PAGES },
    kitaba:  { label: 'جزء عمّ',       from: 582, to: 604 }
  };
  var DEMO_DAYS = [0, 1, 2, 3, 4];           /* خمسةُ أيّامٍ: وسطٌ معتاد */

  /* يُبنى ولا يُحفظ: مثالٌ يُضيف مناهجَ إلى الحالةِ خيانةٌ صامتة. */
  function sample(m, level) {
    if (typeof m === 'string') m = byId(m);
    if (!m) return null;
    var d = DEMO[m.id] || DEMO.jam;
    var made;
    try {
      made = m.build({ from: d.from, to: d.to, scope: 'page',
                       days: DEMO_DAYS, level: level || 'mid' }) || [];
    } catch (e) { return null; }
    if (!made.length) return null;
    return {
      label: d.label,
      pron: d.pron || 'منه',
      plans: made.map(function (p) {
        var span = p.to - p.from + 1;
        /* عددُ أيّامِ الأسبوعِ جزءٌ من المثال: منهجٌ يُرقّق الأيّامَ
           (كـ«نصفِ صفحة») يَصدُق فيه «صفحةٌ في الجلسة» ويَكذِب فيه
           «صفحةٌ في اليوم». */
        return { kind: p.kind, rate: p.rate, span: span, dpw: p.days.length,
                 sessions: Math.ceil(span / p.rate), title: p.title };
      })
    };
  }

  function byId(id) {
    for (var i = 0; i < LIST.length; i++) if (LIST[i].id === id) return LIST[i];
    return null;
  }
  function byPurpose(k) {
    if (!k || k === 'all') return LIST.slice();
    return LIST.filter(function (m) { return m['for'].indexOf(k) >= 0; });
  }
  /* المنهجيّةُ التي وُلد منها هذا المنهج، إن كانت. والمنهجُ المبنيُّ يدًا
     لا منهجيّةَ له، وهذا جوابٌ صحيحٌ لا نقص. */
  function ofPlan(p) { return (p && p.manhaj) ? byId(p.manhaj) : null; }

  /* يُبنى ثمّ يُحفظ في خطوةٍ واحدة: منهجان من ثلاثةٍ محفوظان والثالثُ
     ضائعٌ أسوأُ من ألّا يُحفظ شيء. */
  function create(m, opts) {
    if (typeof m === 'string') m = byId(m);
    if (!m) return [];
    var made = m.build({
      from: opts.from, to: opts.to,
      scope: opts.scope, days: opts.days, level: opts.level
    }) || [];
    made.forEach(function (p) { App.state.plans.push(p); });
    App.save();
    return made;
  }

  App.Manhaj = {
    PURPOSE: PURPOSE, PURPOSE_SHORT: PURPOSE_SHORT, LEVELS: LEVELS, LEVEL_PICK: LEVEL_PICK,
    LIST: LIST, byId: byId, byPurpose: byPurpose, ofPlan: ofPlan, create: create,
    sample: sample
  };
})(window.App);
