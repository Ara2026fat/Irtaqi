    return ar(n) + ' سؤالًا';
  }
  function nAskAcc(n) {           /* منصوبًا: «لم تُصِبْ سؤالَين» */
    if (n === 1) return 'سؤالًا واحدًا';
    if (n === 2) return 'سؤالَين';
    if (n <= 10) return ar(n) + ' أسئلةٍ';
    return ar(n) + ' سؤالًا';
  }
  function nAskGen(n) {           /* مجرورًا: «أجبتَ عن سؤالَين» */
    if (n === 1) return 'سؤالٍ واحد';
    if (n === 2) return 'سؤالَين';
    if (n <= 10) return ar(n) + ' أسئلةٍ';
    return ar(n) + ' سؤالًا';
  }
  function nJuz(n) {
    if (n === 1) return 'جزءٌ واحد';
    if (n === 2) return 'جزءان';
    if (n <= 10) return ar(n) + ' أجزاء';
    return ar(n) + ' جزءًا';
  }
  function nPage(n) {
    if (n === 1) return 'صفحةٌ واحدة';
    if (n === 2) return 'صفحتان';
    if (n <= 10) return ar(n) + ' صفحات';
    return ar(n) + ' صفحة';
  }

  /* ═══ ٣ · المحفوظُ والنطاق ═════════════════════════════════════
     ‎App.Hifz‎ عقدٌ يُقدّمه وكيلُ الوِرد، وقد لا يكون موجودًا. فلا
     يُنتظَر ولا يُعرَّف هنا: يُسأل إن وُجد، وإلّا فبديلٌ من المناهج.
     والتلاوةُ تَخرج من البديل: قراءةٌ لا حفظ، ومن امتُحن فيما قرأ
     وما حفِظ خرج برقمٍ كاذب. */
  function hifzPages() {
    var map = {}, list = [], i, p;

    if (App.Hifz && typeof App.Hifz.inventory === 'function') {
      try {
        var inv = App.Hifz.inventory();
        var ps = inv && inv.pages;
        if (ps && ps.length) {
          for (i = 0; i < ps.length; i++) {
            p = +ps[i];
            if (p >= 1 && p <= Q.TOTAL_PAGES && !map[p]) { map[p] = 1; list.push(p); }
          }
        }
      } catch (e) {}
    }

    if (!list.length) {
      var plans = App.state.plans || [];
      for (i = 0; i < plans.length; i++) {
        var pl = plans[i];
        if (pl.kind !== 'hifz' && pl.kind !== 'tathbit') continue;
        var end = Math.min(+pl.to || 0, (+pl.from || 1) + (+pl.done || 0) - 1);
        for (p = +pl.from || 1; p <= end; p++) {
          if (p >= 1 && p <= Q.TOTAL_PAGES && !map[p]) { map[p] = 1; list.push(p); }
        }
      }
    }

    list.sort(function (a, b) { return a - b; });
    return { map: map, list: list, known: list.length > 0 };
  }

  /* الأجزاءُ التي في المحفوظِ منها شيء — لقائمةِ الاختيار */
  function juzOfPages(list) {
    var seen = {}, out = [], i, j;
    for (i = 0; i < list.length; i++) {
      j = Q.juzOf(list[i]);
      if (!seen[j]) { seen[j] = 1; out.push(j); }
    }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function surahsOfPages(list) {
    var seen = {}, out = [], i, k, vs;
    for (i = 0; i < list.length; i++) {
      vs = Q.page(list[i]);
      for (k = 0; k < vs.length; k++) {
        if (!seen[vs[k].s]) { seen[vs[k].s] = 1; out.push(vs[k].s); }
      }
    }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  /* ── حوضُ الآياتِ الذي يُسأل منه ──
     يُبنى مرّةً لكلِّ جلسةٍ لا لكلِّ سؤال. و«السورة» تُبنى من آياتِها
     لا من صفحاتِها: صفحةُ أوّلِ السورةِ تَحمل آخرَ ما قبلَها، فلو
     بُنيت بالصفحاتِ لسُئل عن سورةٍ لم تُطلَب. */
  function poolOf(scope) {
    var M = hifzPages(), pages = [], verses = [], i, p;

    if (scope.kind === 'surah') {
      verses = Q.surah(scope.s).slice();
    } else {
      if (scope.kind === 'juz') {
        for (p = Q.juzStart(scope.j); p <= Q.juzEnd(scope.j); p++) pages.push(p);
      } else {
        pages = M.known ? M.list.slice() : [];
        if (!pages.length) for (p = 1; p <= Q.TOTAL_PAGES; p++) pages.push(p);
      }
      for (i = 0; i < pages.length; i++) {
        var vs = Q.page(pages[i]);
        for (var k = 0; k < vs.length; k++) verses.push(vs[k]);
      }
    }

    var keys = {}, pmap = {}, plist = [], byJuz = {};
    for (i = 0; i < verses.length; i++) {
      var v = verses[i];
      keys[key(v)] = 1;
      if (!pmap[v.p]) { pmap[v.p] = 1; plist.push(v.p); }
      var j = Q.juzOf(v.p);
      (byJuz[j] || (byJuz[j] = [])).push(v);
    }
    plist.sort(function (a, b) { return a - b; });

    return {
      scope: scope, verses: verses, keys: keys,
      pages: pmap, pageList: plist, byJuz: byJuz,
      known: M.known, _g: null, weak: []
    };
  }

  /* ═══ ٤ · الضعفُ ومنه يُبنى الاقتراح ═══════════════════════════
     الاقتراحُ لا يكون عشوائيًّا: من امتَحن نفسَه عشوائيًّا امتَحن
     أقواها كأضعفِها. وثلاثةُ مصادرَ للضعفِ، يُؤخَذ منها ما وُجد:

       ١ — ‎App.Hifz.weakJuz()‎ إن قدّمه وكيلُ الوِرد.
       ٢ — سجلُّ الزللِ في التسميع (‎state.slips‎) — يُقرأ ولا يُكتَب.
       ٣ — حصيلةُ الاختباراتِ السابقةِ في هذه الوحدة.

     والأضعفُ أوّلًا، والدرجةُ ٠..١ حيث الأدنى أضعف. */
  function bag() {
    var St = App.state;
    if (!St.exam || typeof St.exam !== 'object') St.exam = {};
    if (!St.exam.juz || typeof St.exam.juz !== 'object') St.exam.juz = {};
    return St.exam;
  }

  function slipsByJuz() {
    var out = {}, sl = App.state.slips, k, v, full;
    if (!sl || typeof sl !== 'object') return out;
    for (k in sl) {
      if (!sl.hasOwnProperty(k) || k.charAt(0) === '_') continue;
      v = sl[k];
      if (!v) continue;
      var n = (+v.n > 0) ? +v.n : 0;
      /* والكلمةُ المتعثَّرُ فيها ضَعفٌ قائمٌ وإن كُفِّرت الآيةُ: تُحسَب
         نصفَ زلّة — دون الآيةِ لأنّها أضيقُ منها موضعًا، وفوقَ الصفرِ
         لأنّها لم تُتقَن بعد. وبهذا يَسأل الامتحانُ عمّا تعثّر فيه
         لسانُه بعينه، لا عن الآيةِ جملةً. */
      var w = 0, wi;
      if (v.w) for (wi in v.w) {
        if (v.w.hasOwnProperty(wi) && +v.w[wi] > 0) w += +v.w[wi];
      }
      var tot = n + w * 0.5;
      if (!tot) continue;
      var parts = k.split(':');
      full = Q.verse(+parts[0], +parts[1]);
      if (!full) continue;
      var j = Q.juzOf(full.p);
      out[j] = (out[j] || 0) + tot;
    }
    return out;
  }

  function weakJuz(limitTo) {
    var out = [], seen = {}, i;

    if (App.Hifz && typeof App.Hifz.weakJuz === 'function') {
      try {
        var w = App.Hifz.weakJuz();
        if (w && w.length) {
          for (i = 0; i < w.length; i++) {
            var j0 = +w[i].juz;
            if (!j0 || seen[j0]) continue;
            if (limitTo && !limitTo[j0]) continue;
            seen[j0] = 1;
            out.push({ juz: j0, score: Math.max(0, Math.min(1, +w[i].score)) });
          }
          return out;
        }
      } catch (e) {}
    }

    var tally = bag().juz, slips = slipsByJuz(), j;
    for (j = 1; j <= 30; j++) {
      if (limitTo && !limitTo[j]) continue;
      var r = tally[j], a = null, b = null;
      /* لابلاس: جزءٌ سُئل فيه سؤالٌ واحدٌ فأُخطئ ليس أضعفَ من جزءٍ
         سُئل فيه عشرةٌ فأُخطئت كلُّها. */
      if (r && +r.n > 0) a = (+r.ok + 1) / (+r.n + 2);
      if (slips[j]) b = 1 / (1 + slips[j] * 0.5);
      if (a === null && b === null) continue;
      out.push({ juz: j, score: Math.min(a === null ? 1 : a, b === null ? 1 : b) });
    }
    out.sort(function (x, y) { return x.score - y.score; });
    return out;
  }

  /* الأجزاءُ التي يُرجَّح أن تُسأل: أضعفُ ثلثٍ ممّا في الحوض. */
  function weakSetFor(pool) {
    var have = {}, k;
    for (k in pool.byJuz) if (pool.byJuz.hasOwnProperty(k)) have[+k] = 1;
    var w = weakJuz(have);
    var take = Math.max(1, Math.ceil(w.length / 3)), out = [], i;
    for (i = 0; i < w.length && i < take; i++) {
      if (w[i].score < 0.92) out.push(w[i].juz);
    }
    return out;
  }

  /* ── الاقتراح: نطاقٌ وعددٌ وسببٌ يُقال صراحةً ──
     ولا يُقترَح جزءٌ ضعيفٌ ما لم يكن الضعفُ مقيسًا: من لم يَمتحن ولم
     يَزِلّ لا يُقال له «جزؤك الثامنُ ضعيف» — ذاك كذبٌ مُهذّب. */
  function suggest() {
    var M = hifzPages();
    var pool = { byJuz: {} }, i;
    var list = M.known ? M.list : [];
    for (i = 0; i < list.length; i++) pool.byJuz[Q.juzOf(list[i])] = 1;

    var w = weakJuz(M.known ? pool.byJuz : null);
    if (w.length && w[0].score < 0.78) {
      return {
        scope: { kind: 'juz', j: w[0].juz },
        n: 10,
        why: 'الجزءُ ' + ar(w[0].juz) + ' أضعفُ ما عندك فيما قِيس.'
      };
    }
    if (M.known) {
      return {
        scope: { kind: 'all' }, n: 10,
        why: vg('لم يَظهر ضعفٌ بعد، فيُؤخَذ من محفوظِك كلِّه.',
                'لم يَظهر ضعفٌ بعد، فيُؤخَذ من محفوظِك كلِّه.')
      };
    }
    return {
      scope: { kind: 'all' }, n: 10,
      why: 'لم تُسجّل محفوظَك بعد، فالاختبارُ في المصحفِ كلِّه.'
    };
  }

  /* ═══ ٥ · المُلهِيات ═══════════════════════════════════════════
     ثلاثُ مراتبَ، تُستنفَد الأولى قبل الثانية:
       ١ — متشابهاتُ الجواب: هي ما يَزِلّ فيه الحافظُ حقًّا.
       ٢ — آياتٌ من سورةِ الجوابِ نفسِها: جوارٌ يُشبه.
       ٣ — آياتٌ من نطاقِ الاختبار.
     وقيدٌ على الثلاثِ: ألّا يُطابق لفظُ المُلهِي لفظَ الجواب (آيتان
     متطابقتان في المصحفِ ليس إحداهما خطأً)، وأن يُقارِبَه طولًا —
     فخيارٌ من ثلاثِ كلماتٍ بإزاءِ جوابٍ من عشرين يُستبعَد بالنظرِ
     لا بالحفظ. */
  function siblings(v) {
    var out = [], seen = {}, gs = [], i, j;
    try { gs = S.forVerse(v.s, v.a); } catch (e) { gs = []; }
    for (i = 0; i < gs.length; i++) {
      var vv = gs[i].verses;
      for (j = 0; j < vv.length; j++) {
        if (vv[j].s === v.s && vv[j].a === v.a) continue;
        var k = vv[j].s + ':' + vv[j].a;
        if (seen[k]) continue;
        seen[k] = 1;
        /* النصُّ من المصحفِ المدموجِ لا من بياناتِ المتشابهات:
           الأخيرةُ مجرّدةٌ من الشكل، ولو عُرضت لَبان الخيارُ الخاطئُ
           من رسمِه قبل أن يُقرأ. */
        var full = Q.verse(vv[j].s, vv[j].a);
        if (full) out.push(full);
      }
    }
    return out;
  }

  function distractors(ans, n, pool, avoid) {
    var out = [], seen = {}, i;
    seen[sOf(ans)] = 1;
    if (avoid) for (i = 0; i < avoid.length; i++) seen[sOf(avoid[i])] = 1;

    var w = wn(ans);
    var lo = Math.max(1, Math.floor(w * 0.55) - 1);
    var hi = Math.ceil(w * 1.8) + 2;

    function take(v) {
      if (!v) return;
      var t = sOf(v);
      if (seen[t]) return;
      var x = wn(v);
      if (x < lo || x > hi) return;
      seen[t] = 1;
      out.push(v);
    }

    var sib = siblings(ans);
    shuffle(sib);
    for (i = 0; i < sib.length && out.length < n; i++) take(sib[i]);

    if (out.length < n) {
      var sur = Q.surah(ans.s).slice();
      shuffle(sur);
      for (i = 0; i < sur.length && out.length < n; i++) take(sur[i]);
    }

    if (out.length < n) {
      var vs = pool.verses, guard = 0;
      while (out.length < n && guard++ < 500) {
        take(vs[Math.floor(Math.random() * vs.length)]);
      }
    }

    return out.length === n ? out : null;
  }

  /* ═══ ٦ · بناءُ السؤال ═════════════════════════════════════════ */

  function idxIn(list, a) {
    for (var i = 0; i < list.length; i++) if (list[i].a === a) return i;
    return -1;
  }

  /* مَن يُسأل: يُرجَّح الضعيفُ ولا يُحتكَر — فلو حُصر السؤالُ في
     الأضعفِ وحدَه لصار الاختبارُ على جزءٍ واحدٍ وسُمّي «كلَّ محفوظي». */
  function anchor(pool) {
    if (pool.weak.length && Math.random() < 0.6) {
      var list = pool.byJuz[one(pool.weak)];
      if (list && list.length) return one(list);
    }
    return one(pool.verses);
  }

  /* الجوابُ لا يُعرَض في السؤال: يُتحقَّق باللفظِ المجرَّدِ لا
     بالمرجع، فآيتان متطابقتان في المصحفِ يَحمل إحداهما جوابَ الأخرى. */
  function leaks(ans, lead) {
    var a = sOf(ans), i;
    for (i = 0; i < lead.length; i++) {
      var l = sOf(lead[i]);
      if (l === a || l.indexOf(a) >= 0 || a.indexOf(l) >= 0) return true;
    }
    return false;
  }

  function wrap(ans, wrongs) {
    var opts = [{ v: ans, ok: true }], i;
    for (i = 0; i < wrongs.length; i++) opts.push({ v: wrongs[i], ok: false });
    shuffle(opts);
    var at = 0;
    for (i = 0; i < opts.length; i++) if (opts[i].ok) at = i;
    return { opts: opts, ok: at };
  }

  function place(v) { return App.join(Q.name(v.s) + ' ' + ar(v.a), 'صفحة ' + ar(v.p)); }

  /* ── أكمِل المقطع ──
     المقطعُ آيةٌ أو آيتان كما طُلب، والجوابُ الآيةُ التي تَليهما في
     السورةِ نفسِها. */
  function mkNext(pool, segs) {
    var v = anchor(pool);
    var sur = Q.surah(v.s), i = idxIn(sur, v.a);
    if (i < 0 || i + 1 >= sur.length) return null;
    var ans = sur[i + 1];
    if (!pool.keys[key(ans)]) return null;
    var aw = wn(ans);
    if (aw < 3 || aw > 26) return null;

    var lead = [v];
    if (segs !== 1 && i > 0 && pool.keys[key(sur[i - 1])] &&
        wn(v) + wn(sur[i - 1]) <= 34) lead.unshift(sur[i - 1]);
    if (leaks(ans, lead)) return null;

    var wr = distractors(ans, 3, pool, lead);
    if (!wr) return null;
    var o = wrap(ans, wr);
    return {
      type: 'next', k: 'next:' + key(ans),
      ask: lead.length > 1 ? 'ما الآيةُ التي تَلي هذَين؟' : 'ما الآيةُ التي تَليها؟',
      lead: lead, from: Q.name(v.s),
      opts: o.opts, ok: o.ok, ans: ans,
      page: ans.p, juz: Q.juzOf(ans.p)
    };
  }

  /* ── ما قبلَها؟ ──
     أصعبُ من «أكمِل» وأكشفُ: الحفظُ المُسترسِلُ يَمضي إلى الأمامِ
     بالعادةِ ولا يَرجع إلّا بمعرفةٍ راسخة. */
  function mkPrev(pool, segs) {
    var v = anchor(pool);
    var sur = Q.surah(v.s), i = idxIn(sur, v.a);
    if (i <= 0) return null;
    var ans = sur[i - 1];
    if (!pool.keys[key(ans)]) return null;
    var aw = wn(ans);
    if (aw < 3 || aw > 26) return null;

    var lead = [v];
    if (segs === 2 && i + 1 < sur.length && pool.keys[key(sur[i + 1])] &&
        wn(v) + wn(sur[i + 1]) <= 34) lead.push(sur[i + 1]);
    if (leaks(ans, lead)) return null;

    var wr = distractors(ans, 3, pool, lead);
    if (!wr) return null;
    var o = wrap(ans, wr);
    return {
      type: 'prev', k: 'prev:' + key(ans),
      ask: lead.length > 1 ? 'ما الآيةُ التي قبلَ هذَين؟' : 'ما الآيةُ التي قبلَها؟',
      lead: lead, from: Q.name(v.s),
      opts: o.opts, ok: o.ok, ans: ans,
      page: ans.p, juz: Q.juzOf(ans.p)
    };
  }

  /* ── أين موضعُها؟ (سورةً أو جزءًا) ──
     شرطُها أن يكون اللفظُ متفرّدًا في المصحفِ كلِّه، وإلّا فللسؤالِ
     جوابان. ومُلهِياتُ السورِ من المتشابهاتِ أوّلًا: من خَلَط بين
     موضعَين خَلَط بين سورتَيهما. */
  function mkWhere(pool, mode) {
    var v = anchor(pool);
    if (!lone(v)) return null;
    var w = wn(v);
    if (w < 4 || w > 30) return null;

    var opts = [], i;

    if (mode === 'juz') {
      var j = Q.juzOf(v.p), pres = [], k;
      for (k in pool.byJuz) if (pool.byJuz.hasOwnProperty(k) && +k !== j) pres.push(+k);
      /* إن كان الحوضُ جزءًا واحدًا فلا سؤالَ عن الجزء */
      if (pres.length < 3) {
        for (k = 1; k <= 30 && pres.length < 8; k++) if (k !== j && pres.indexOf(k) < 0) pres.push(k);
      }
      if (pres.length < 3) return null;
      pres.sort(function (a, b) { return Math.abs(a - j) - Math.abs(b - j); });
      var near = shuffle(pres.slice(0, Math.min(6, pres.length))).slice(0, 3);
      opts.push({ label: 'الجزء ' + ar(j), ok: true });
      for (i = 0; i < 3; i++) opts.push({ label: 'الجزء ' + ar(near[i]), ok: false });
    } else {
      var s = v.s, cand = [], seen = {};
      seen[s] = 1;
      var sib = siblings(v);
      for (i = 0; i < sib.length; i++) {
        if (!seen[sib[i].s]) { seen[sib[i].s] = 1; cand.push(sib[i].s); }
      }
      shuffle(cand);
      var inPool = surahsOfPages(pool.pageList);
      inPool.sort(function (a, b) { return Math.abs(a - s) - Math.abs(b - s); });
      for (i = 0; i < inPool.length && cand.length < 8; i++) {
        if (!seen[inPool[i]]) { seen[inPool[i]] = 1; cand.push(inPool[i]); }
      }
      if (cand.length < 3) return null;
      opts.push({ label: 'سورة ' + Q.name(s), ok: true });
      for (i = 0; i < 3; i++) opts.push({ label: 'سورة ' + Q.name(cand[i]), ok: false });
    }

    shuffle(opts);
    var at = 0;
    for (i = 0; i < opts.length; i++) if (opts[i].ok) at = i;
    return {
      type: mode === 'juz' ? 'whereJuz' : 'whereSurah',
      k: (mode === 'juz' ? 'wj:' : 'ws:') + key(v),
      ask: mode === 'juz' ? 'من أيِّ جزءٍ هذه الآية؟' : 'من أيِّ سورةٍ هذه الآية؟',
      lead: [v], from: null,              /* لا يُسمّى الموضعُ وهو المسؤولُ عنه */
      opts: opts, ok: at, ans: v,
      page: v.p, juz: Q.juzOf(v.p)
    };
  }

  /* ── مجموعاتُ المتشابهاتِ التي تَمسّ الحوض ──
     تُحصى مرّةً لكلِّ جلسةٍ لا لكلِّ سؤال. */
  function poolGroups(pool) {
    if (pool._g) return pool._g;
    var seen = {}, out = [], i, j;
    for (i = 0; i < pool.verses.length; i++) {
      var gs;
      try { gs = S.forVerse(pool.verses[i].s, pool.verses[i].a); } catch (e) { gs = []; }
      for (j = 0; j < gs.length; j++) {
        if (seen[gs[j].id]) continue;
        seen[gs[j].id] = 1;
        out.push(gs[j]);
      }
    }
    pool._g = out;
    return out;
  }

  function fullMembers(g) {
    var out = [], i;
    for (i = 0; i < g.verses.length; i++) {
      var f = Q.verse(g.verses[i].s, g.verses[i].a);
      if (f) out.push(f);
    }
    return out;
  }

  /* ── أيُّ الوجهَين؟ — أنفعُ ما في الباب ──
     يُسمّى الموضعُ (سورةً) ويُطلَب اللفظُ الذي فيه، والخياراتُ هي
     ألفاظُ المجموعةِ نفسِها. فهذا هو المَزلقُ بعينِه: لفظان
     لا يَفترقان إلّا في حرفٍ، كلاهما قرآنٌ، وأحدُهما في غيرِ موضعِه.

     ثلاثةُ قيود:
       · لا وجهَين في سورةٍ واحدةٍ ضمنَ الخيارات — وإلّا لم يُميّزها
         اسمُ السورةِ وصار للسؤالِ جوابان.
       · ولا خيارٌ لفظُه موجودٌ أصلًا في سورةِ الجواب.
       · وقَدرُ شبهٍ لا يَقلّ عن النصف: مجموعاتُ «التشابه الترتيبيّ»
         تَجمع آياتٍ تَشترك في جملةٍ وتَفترق في سائرِها، فلو عُرضت
         خياراتٍ لَبان الجوابُ بالطولِ لا بالحفظ. */
  function mkWording(pool) {
    var gs = poolGroups(pool);
    if (!gs.length) return null;
    var tries = 0;
    while (tries++ < 14) {
      var g = one(gs);
      var mem = fullMembers(g);
      if (mem.length < 2) continue;
      var inPool = mem.filter(function (v) { return !!pool.keys[key(v)]; });
      shuffle(inPool);
      for (var a = 0; a < inPool.length; a++) {
        var m = inPool[a];
        if (wn(m) > 34) continue;
        var set = surahSet(m.s), sims = [], i;
        for (i = 0; i < mem.length; i++) {
          var o = mem[i];
          if (o.s === m.s) continue;
          if (sOf(o) === sOf(m)) continue;
          if (set[sOf(o)]) continue;
          if (ratio(o, m) < 0.5) continue;
          sims.push(o);
        }
        /* لا يُعرَض وجهان من سورةٍ واحدةٍ بين الخيارات، ولا لفظان
           متطابقان: المجموعةُ قد تَضمّ موضعَين متطابقَين في سورتَين
           مختلفتَين (٧:١٥ و١٥:٣٧ و٣٨:٨٠ منها)، فلو عُرضا معًا لَصار
           في الخياراتِ خطآن لا يُفرَّق بينهما. */
        shuffle(sims);
        var used = {}, seenT = {}, picked = [];
        for (i = 0; i < sims.length && picked.length < 3; i++) {
          var ts = sOf(sims[i]);
          if (used[sims[i].s] || seenT[ts]) continue;
          used[sims[i].s] = 1;
          seenT[ts] = 1;
          picked.push(sims[i]);
        }
        if (!picked.length) continue;
        var w = wrap(m, picked);
        return {
          type: 'wording', k: 'wd:' + key(m),
          ask: 'أيُّ هذه الألفاظِ هو الذي في سورةِ ' + Q.name(m.s) + '؟',
          lead: null, from: null,
          opts: w.opts, ok: w.ok, ans: m,
          page: m.p, juz: Q.juzOf(m.p),
          kind: g.kind
        };
      }
    }
    return null;
  }

  /* ── هذا اللفظُ: في أيِّ سورةٍ ورد؟ ──
     عكسُ الذي قبلَه: يُعرَض اللفظُ ويُطلَب موضعُه، والمُلهِياتُ سورُ
     إخوتِه في المجموعة. وشرطُه تفرُّدُ اللفظِ في المصحف. */
  function mkShabihWhere(pool) {
    var gs = poolGroups(pool);
    if (!gs.length) return null;
    var tries = 0;
    while (tries++ < 14) {
      var g = one(gs);
      var mem = fullMembers(g);
      if (mem.length < 3) continue;
      var inPool = mem.filter(function (v) { return !!pool.keys[key(v)]; });
      shuffle(inPool);
      for (var a = 0; a < inPool.length; a++) {
        var m = inPool[a];
        var w = wn(m);
        if (w < 4 || w > 30) continue;
        if (!lone(m)) continue;
        var seen = {}, cand = [], i;
        seen[m.s] = 1;
        for (i = 0; i < mem.length; i++) {
          if (seen[mem[i].s]) continue;
          seen[mem[i].s] = 1;
          cand.push(mem[i].s);
        }
        if (cand.length < 2) continue;
        shuffle(cand);
        cand = cand.slice(0, 3);
        var opts = [{ label: 'سورة ' + Q.name(m.s), ok: true }];
        for (i = 0; i < cand.length; i++) opts.push({ label: 'سورة ' + Q.name(cand[i]), ok: false });
        shuffle(opts);
        var at = 0;
        for (i = 0; i < opts.length; i++) if (opts[i].ok) at = i;
        return {
          type: 'shabihWhere', k: 'sw:' + key(m),
          ask: 'لهذا اللفظِ أشباهٌ في مواضعَ أُخَر — ففي أيِّ سورةٍ ورد هو؟',
          lead: [m], from: null,
          opts: opts, ok: at, ans: m,
          page: m.p, juz: Q.juzOf(m.p),
          kind: g.kind
        };
      }
    }
    return null;
  }

  /* ── أوّلُ الصفحةِ وآخرُها ──
     سؤالُ الحلقةِ القديم. والمُلهِياتُ من الصفحاتِ المجاورةِ لا من
     أقاصي المصحف: الخلطُ يقع بين الجارَين لا بين البعيدَين.

     وأوّلُ آيةٍ في الصفحةِ معلومٌ من بياناتِ الرسمِ نفسِها: قُوبل
     ‎Quran.page(p)[0]‎ بأوّلِ مدًى في ‎Layout.page(p).s‎ في الصفحاتِ
     الستِّمئةِ والأربعِ فلم يَختلفا في واحدة — فلا آيةَ تَنقسم بين
     صفحتَين في هذه البيانات، والسؤالُ تامٌّ لا يُحتاج فيه احتياط. */
  function mkPage(pool, tail) {
    if (pool.pageList.length < 4) return null;
    var p = one(pool.pageList);
    var vs = Q.page(p);
    if (!vs.length) return null;
    var ans = tail ? vs[vs.length - 1] : vs[0];
    var w = wn(ans);
    if (w < 3 || w > 26) return null;

    var seen = {}, wrong = [], i, d, q;
    seen[sOf(ans)] = 1;
    var near = [];
    for (d = 1; d <= 8; d++) {
      if (pool.pages[p - d]) near.push(p - d);
      if (pool.pages[p + d]) near.push(p + d);
    }
    shuffle(near);
    var more = shuffle(pool.pageList.slice());
    var all = near.concat(more);

    for (i = 0; i < all.length && wrong.length < 3; i++) {
      q = all[i];
      if (q === p) continue;
      var qs = Q.page(q);
      if (!qs.length) continue;
      var c = tail ? qs[qs.length - 1] : qs[0];
      var t = sOf(c);
      if (seen[t]) continue;
      var cw = wn(c);
      if (cw < Math.max(1, Math.floor(w * 0.45)) || cw > Math.ceil(w * 2.2) + 2) continue;
      seen[t] = 1;
      wrong.push(c);
    }
    if (wrong.length < 3) return null;

    var o = wrap(ans, wrong);
    return {
      type: tail ? 'pageTail' : 'pageHead',
      k: (tail ? 'pt:' : 'ph:') + p,
      ask: tail ? 'بأيِّ آيةٍ تَنتهي الصفحةُ ' + ar(p) + '؟'
                : 'بأيِّ آيةٍ تَبدأ الصفحةُ ' + ar(p) + '؟',
      lead: null, from: null,
      opts: o.opts, ok: o.ok, ans: ans,
      page: p, juz: Q.juzOf(p)
    };
  }

  /* ═══ ٧ · تأليفُ الجلسة ════════════════════════════════════════
     خلطةٌ لا عشوائيّة: ثلثُ الأسئلةِ متشابهاتٌ لأنّها أكثرُ ما
     يُخطَأ فيه ويُسأل عنه، والسردُ (أكمِل/ما قبلها) أربعةٌ من عشرة
     لأنّه صلبُ الحفظ، والموضعُ والصفحةُ أقلُّ لأنّهما مهارةٌ ثانيةٌ
     لا أصلٌ. ومن تعذّر صنفُه أُخذ من غيرِه ولم تُنقَص الأسئلة. */
  var MIX = [
    { t: 'wording',     w: 20 },
    { t: 'shabihWhere', w: 16 },
    { t: 'next',        w: 24 },
    { t: 'prev',        w: 14 },
    { t: 'whereSurah',  w: 9 },
    { t: 'whereJuz',    w: 7 },
    { t: 'pageHead',    w: 6 },
    { t: 'pageTail',    w: 4 }
  ];

  function planTypes(n) {
    var out = [], rest = [], i, k;
    for (i = 0; i < MIX.length; i++) {
      var exact = n * MIX[i].w / 100, take = Math.floor(exact);
      for (k = 0; k < take; k++) out.push(MIX[i].t);
      rest.push({ t: MIX[i].t, r: exact - take });
    }
    rest.sort(function (a, b) { return b.r - a.r; });
    i = 0;
    while (out.length < n) { out.push(rest[i % rest.length].t); i++; }
    return shuffle(out.slice(0, n));
  }

  function makeOne(type, pool, segs) {
    if (type === 'next') return mkNext(pool, segs);
    if (type === 'prev') return mkPrev(pool, segs);
    if (type === 'whereSurah') return mkWhere(pool, 'surah');
    if (type === 'whereJuz') return mkWhere(pool, 'juz');
    if (type === 'wording') return mkWording(pool);
    if (type === 'shabihWhere') return mkShabihWhere(pool);
    if (type === 'pageHead') return mkPage(pool, false);
    if (type === 'pageTail') return mkPage(pool, true);
    return null;
  }

  var ORDER = ['wording', 'shabihWhere', 'next', 'prev',
               'whereSurah', 'whereJuz', 'pageHead', 'pageTail'];

  function make(opts) {
    opts = opts || {};
    var scope = opts.scope || { kind: 'all' };
    var n = Math.max(1, Math.min(50, +opts.n || 10));
    var segs = +opts.segs || 0;
    var t0 = (window.performance && performance.now) ? performance.now() : +new Date();

    var pool = poolOf(scope);
    if (!pool.verses.length) return { list: [], pool: pool, ms: 0 };
    pool.weak = weakSetFor(pool);
    dup();                                  /* يُبنى مرّةً قبل السؤالِ الأوّل */

    var plan = planTypes(n), list = [], used = {}, i, j;

    for (i = 0; i < plan.length; i++) {
      var got = null;
      /* الصنفُ المطلوبُ أوّلًا، ثمّ سائرُ الأصنافِ بترتيبِ النفع */
      var seq = [plan[i]];
      for (j = 0; j < ORDER.length; j++) if (ORDER[j] !== plan[i]) seq.push(ORDER[j]);
      for (j = 0; j < seq.length && !got; j++) {
        var tries = 0;
        while (tries++ < 26) {
          var q = makeOne(seq[j], pool, segs);
          if (!q) continue;
          if (used[q.k] || used['a:' + key(q.ans)]) continue;
          got = q;
          break;
        }
      }
      if (!got) break;                      /* نَفِد ما في النطاق */
      used[got.k] = 1;
      used['a:' + key(got.ans)] = 1;
      list.push(got);
    }

    var t1 = (window.performance && performance.now) ? performance.now() : +new Date();
    return { list: list, pool: pool, ms: Math.round((t1 - t0) * 10) / 10 };
  }

  /* ═══ ٨ · تسجيلُ النتيجة ═══════════════════════════════════════
     يُغذّى عقدُ الوِردِ إن وُجد، وتُحفَظ حصيلةٌ لكلِّ جزءٍ عندنا
     ليُبنى عليها اقتراحُ المرّةِ القادمة. والعددُ يُنصَّف إن تجاوز
     الأربعين حتّى يَغلب الحديثُ القديمَ: من كان ضعيفًا قبل شهرٍ ثمّ
     قوِي لا يَبقى في قائمةِ الضعف. */
  function note(q, ok) {
    var e = bag(), j = String(q.juz);
    var r = e.juz[j];
    if (!r || typeof r !== 'object') r = e.juz[j] = { n: 0, ok: 0 };
    r.n = (+r.n || 0) + 1;
    r.ok = (+r.ok || 0) + (ok ? 1 : 0);
    if (r.n > 40) { r.n = Math.round(r.n / 2); r.ok = Math.round(r.ok / 2); }
    if (App.Hifz && typeof App.Hifz.noteResult === 'function') {
      try { App.Hifz.noteResult(q.page, !!ok); } catch (err) {}
    }
    App.save();
  }

  /* ═══ ٩ · الشاشة ═══════════════════════════════════════════════ */

  /* اختيارُ القارئِ يَبقى بين الفتحتَين: من امتَحن جزأه الثامنَ
     ثمّ أعاد لا يُسأل عن النطاقِ من جديد. */
  var PICK = { kind: 'all', j: 0, s: 0, n: 10, segs: 0 };

  /* أصنافٌ موضعُ الآيةِ فيها هو المسؤولُ عنه، فلا يُذكَر جزؤُها في
     الترويسةِ ولا يُلمَّح إليه. */
  var HIDE_JUZ = { whereJuz: 1, whereSurah: 1, shabihWhere: 1 };

  function ayahBox(v, cls) {
    var b = App.el('div', 'ex-ayah' + (cls ? ' ' + cls : ''));
    b.appendChild(document.createTextNode(String(v.t)));
    return b;
  }

  App.screen('exam', function (params) {
    var phase = 'set', ses = null, at = 0, chosen = -1;
    var hits = 0, miss = [], answered = [];
    var W = App.el('div', 'screen ex');
    var body = App.el('div', 'ex-body');
    W.appendChild(body);

    if (params && params.scope) {
      PICK.kind = params.scope.kind;
      if (params.scope.j) PICK.j = params.scope.j;
      if (params.scope.s) PICK.s = params.scope.s;
      if (params.n) PICK.n = params.n;
      if (params.go) start();
    }
    if (phase === 'set') paintSet();
    return W;

    function scopeNow() {
      if (PICK.kind === 'juz' && PICK.j) return { kind: 'juz', j: PICK.j };
      if (PICK.kind === 'surah' && PICK.s) return { kind: 'surah', s: PICK.s };
      return { kind: 'all' };
    }

    function scopeName(sc) {
      if (sc.kind === 'juz') return 'الجزء ' + ar(sc.j);
      if (sc.kind === 'surah') return 'سورة ' + Q.name(sc.s);
      return hifzPages().known ? 'كلُّ محفوظي' : 'المصحفُ كلُّه';
    }

    function start() {
      var r = make({ scope: scopeNow(), n: PICK.n, segs: PICK.segs });
      if (!r.list.length) {
        App.toast('لم يَتّسع هذا النطاقُ لسؤال. وسِّعه قليلًا.');
        return;
      }
      /* النطاقُ الضيّقُ لا يَتّسع لما طُلب (سورةُ الإخلاصِ ثلاثةُ
         أسئلةٍ لا عشرة): يُقال صراحةً ولا يُسكَت عنه، فمن طلب عشرةً
         ورأى ثلاثةً ظنَّ عطبًا. */
      if (r.list.length < PICK.n) {
        App.toast('لم يَتّسع هذا النطاقُ إلّا لـ' + nAskGen(r.list.length) + '.');
      }
      ses = r; at = 0; chosen = -1; hits = 0; miss = []; answered = [];
      phase = 'run';
      paintRun();
    }

    /* ── أ · الإعداد ── */
    function paintSet() {
      body.innerHTML = '';
      body.appendChild(head(vg('اختبِرْ نفسَك', 'اختبِري نفسَكِ'),
        'أسئلةٌ من محفوظك، وكلُّ خيارٍ آيةٌ من المصحف.'));

      /* الاقتراحُ أوّلًا: أكثرُ الناسِ لا يَختار، ومن اختار وجد
         الاختيارَ تحتَه كاملًا. */
      var sg = suggest();
      var card = App.el('article', 'ex-sug');
      var st = App.el('b', 'ex-sug-t');
      st.textContent = 'اقتراحُنا';
      card.appendChild(st);
      var sl = App.el('p', 'ex-sug-l');
      sl.textContent = App.join(scopeName(sg.scope), nAsk(sg.n));
      card.appendChild(sl);
      var sw = App.el('p', 'ex-sug-w');
      sw.textContent = sg.why;
      card.appendChild(sw);
      var sb = App.el('button', 'btn btn-pri btn-block');
      sb.type = 'button';
      sb.textContent = 'ابدأ بهذا';
      sb.onclick = function () {
        PICK.kind = sg.scope.kind;
        if (sg.scope.j) PICK.j = sg.scope.j;
        if (sg.scope.s) PICK.s = sg.scope.s;
        PICK.n = sg.n;
        start();
      };
      card.appendChild(sb);
      body.appendChild(card);

      var or = App.el('p', 'ex-or');
      or.textContent = vg('أو اختَرْ بنفسك', 'أو اختاري بنفسك');
      body.appendChild(or);

      var M = hifzPages();
      var juzList = M.known ? juzOfPages(M.list) : null;
      var surList = M.known ? surahsOfPages(M.list) : null;

      body.appendChild(group('النطاق', chips([
        { v: 'all',   t: M.known ? 'كلُّ محفوظي' : 'المصحفُ كلُّه' },
        { v: 'juz',   t: 'جزءٌ بعينه' },
        { v: 'surah', t: 'سورة' }
      ], PICK.kind, function (v) { PICK.kind = v; paintSet(); })));

      if (PICK.kind === 'juz') {
        var js = juzList && juzList.length ? juzList : allJuz();
        if (!PICK.j || js.indexOf(PICK.j) < 0) PICK.j = js[0];
        var row = App.el('div', 'ex-chips ex-nums');
        js.forEach(function (j) {
          var b = App.el('button', 'chip ex-chip' + (j === PICK.j ? ' on' : ''));
          b.type = 'button';
          b.setAttribute('aria-pressed', j === PICK.j ? 'true' : 'false');
          b.textContent = ar(j);
          b.onclick = function () { PICK.j = j; paintSet(); };
          row.appendChild(b);
        });
        body.appendChild(group('أيُّ جزء', row));
      }

      if (PICK.kind === 'surah') {
        var ss = surList && surList.length ? surList : allSurah();
        if (!PICK.s || ss.indexOf(PICK.s) < 0) PICK.s = ss[0];
        var sel = App.el('select', 'inp ex-sel');
        sel.setAttribute('aria-label', 'السورة');
        ss.forEach(function (s) {
          var op = App.el('option');
          op.value = String(s);
          op.textContent = Q.name(s);
          if (s === PICK.s) op.selected = true;
          sel.appendChild(op);
        });
        sel.onchange = function () { PICK.s = +sel.value; };
        body.appendChild(group('أيُّ سورة', sel));
      }

      body.appendChild(group('عددُ الأسئلة', chips([
        { v: 10, t: ar(10) }, { v: 20, t: ar(20) }, { v: 30, t: ar(30) }
      ], PICK.n, function (v) { PICK.n = v; paintSet(); })));

      /* طولُ المقطعِ ممّا طلبه صاحبُ التطبيقِ نصًّا: «كل سؤال يأتيه
         مقطع أو مقطعين، هو يحدد أو نحن نقترح». والاقتراحُ يُقاس
         بطولِ الآية: الآيتان القصيرتان مقطعٌ واحدٌ في الطول. */
      body.appendChild(group('المقطعُ في أسئلةِ السرد', chips([
        { v: 0, t: 'نقترح' }, { v: 1, t: 'آيةٌ واحدة' }, { v: 2, t: 'آيتان' }
      ], PICK.segs, function (v) { PICK.segs = v; paintSet(); })));

      var go = App.el('button', 'btn btn-ghost btn-block');
      go.type = 'button';
      go.textContent = 'ابدأ الاختبار';
      go.onclick = start;
      body.appendChild(go);

      var cl = App.el('button', 'btn btn-quiet btn-block');
      cl.type = 'button';
      cl.textContent = 'إغلاق';
      cl.onclick = function () { App.closeSheet(); };
      body.appendChild(cl);
    }

    function allJuz() {
      var o = [], i;
      for (i = 1; i <= 30; i++) o.push(i);
      return o;
    }
    function allSurah() {
      var o = [], i;
      for (i = 1; i <= 114; i++) o.push(i);
      return o;
    }

    function head(t, s) {
      var box = App.el('div', 'ex-head');
      var h = App.el('b', 'h2');
      h.textContent = t;
      box.appendChild(h);
      if (s) {
        var p = App.el('p', 'ex-lede');
        p.textContent = s;
        box.appendChild(p);
      }
      return box;
    }

    function group(label, node) {
      var g = App.el('div', 'ex-grp');
      var l = App.el('p', 'ex-lbl');
      l.textContent = label;
      g.appendChild(l);
      g.appendChild(node);
      return g;
    }

    function chips(items, cur, fn) {
      var row = App.el('div', 'ex-chips');
      row.setAttribute('role', 'radiogroup');
      items.forEach(function (it) {
        var on = it.v === cur;
        var b = App.el('button', 'chip ex-chip' + (on ? ' on' : ''));
        b.type = 'button';
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        b.textContent = it.t;
        b.onclick = function () { fn(it.v); };
        row.appendChild(b);
      });
      return row;
    }

    /* ── ب · السؤال ── */
    function paintRun() {
      body.innerHTML = '';
      var q = ses.list[at];

      var top = App.el('div', 'ex-top');
      var tt = App.el('div', 'ex-tt');
      var t1 = App.el('b', 'ex-pos');
      t1.textContent = 'السؤال ' + ar(at + 1) + ' من ' + ar(ses.list.length);
      tt.appendChild(t1);
      var t2 = App.el('div', 'ex-meta');
      /* الجزءُ يُذكَر في الترويسةِ خبرًا، ويُكتَم في أسئلةِ الموضع:
         كان يُعرَض «الجزء ١» فوقَ سؤالٍ نصُّه «من أيِّ جزءٍ هذه
         الآية؟» — فيُقرأ الجوابُ من الترويسةِ قبل أن يُقرأ السؤال.
         وهو عيبٌ لا يَظهر إلّا بالنظرِ إلى شاشةٍ بعينِها. */
      /* ولا يُعاد الجزءُ مرّتَين حين يكون هو النطاقَ نفسَه: كان
         يُقرأ «الجزء ٢٨، الجزء ٢٨». */
      t2.textContent = (HIDE_JUZ[q.type] || ses.pool.scope.kind === 'juz')
        ? scopeName(ses.pool.scope)
        : App.join(scopeName(ses.pool.scope), 'الجزء ' + ar(q.juz));
      tt.appendChild(t2);
      top.appendChild(tt);
      var quit = App.el('button', 'btn btn-quiet btn-sm');
      quit.type = 'button';
      quit.textContent = 'إنهاء';
      quit.onclick = finish;
      top.appendChild(quit);
      body.appendChild(top);

      var track = App.el('div', 'progress');
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', 'الموضعُ من الاختبار');
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', '100');
      var pct = Math.round((at / ses.list.length) * 100);
      track.setAttribute('aria-valuenow', String(pct));
      var fill = App.el('div', 'progress-fill');
      fill.style.width = pct + '%';
      track.appendChild(fill);
      body.appendChild(track);

      var card = App.el('div', 'ex-card');
      var ask = App.el('p', 'ex-ask');
      ask.textContent = q.ask;
      card.appendChild(ask);

      if (q.lead) {
        var lead = App.el('div', 'ex-lead');
        q.lead.forEach(function (v) { lead.appendChild(ayahBox(v)); });
        card.appendChild(lead);
        if (q.from) {
          var fr = App.el('p', 'ex-from');
          fr.textContent = 'سورة ' + q.from;
          card.appendChild(fr);
        }
      }
      body.appendChild(card);

      var list = App.el('div', 'ex-opts');
      list.setAttribute('role', 'group');
      list.setAttribute('aria-label', 'الخيارات');
      q.opts.forEach(function (o, i) {
        var b = App.el('button', 'ex-opt');
        b.type = 'button';
        if (o.v) b.appendChild(ayahBox(o.v, 'ex-opt-t'));
        else {
          var s = App.el('span', 'ex-opt-l');
          s.textContent = o.label;
          b.appendChild(s);
        }
        /* بعد الجواب: اللونُ وحدَه لا يَحمل المعنى — من لا يُفرّق
           الأخضرَ من الأحمرِ يَقرأ الكلمة. فتُلصَق سِمةٌ بالنصّ. */
        if (chosen >= 0) {
          b.disabled = true;
          if (i === q.ok) { b.classList.add('is-ok'); b.appendChild(tag('الصواب')); }
          else if (i === chosen) { b.classList.add('is-no'); b.appendChild(tag(vg('اخترتَ هذا', 'اخترتِ هذا'))); }
        } else {
          b.onclick = function () { answer(i); };
        }
        list.appendChild(b);
      });
      body.appendChild(list);

      if (chosen >= 0) body.appendChild(verdict(q));
    }

    function tag(t) {
      var s = App.el('span', 'ex-tag');
      s.textContent = t;
      return s;
    }

    function answer(i) {
      var q = ses.list[at];
      chosen = i;
      var ok = i === q.ok;
      if (ok) hits++; else miss.push(q);
      answered.push({ q: q, ok: ok });
      note(q, ok);
      paintRun();
    }

    /* الحكمُ هادئ: لا «خسرت» ولا صوت. ويُقال الصوابُ بموضعِه كاملًا
       ويُفتَح بابٌ إلى صفحتِه — فالخطأُ موضعُ تعلُّمٍ لا موضعُ عقاب. */
    function verdict(q) {
      var box = App.el('div', 'ex-verd' + (chosen === q.ok ? ' is-ok' : ''));
      var t = App.el('p', 'ex-verd-t');
      /* في سؤالِ المتشابهاتِ تكون الخياراتُ **كلُّها قرآنًا صحيحًا**،
         والمسؤولُ عنه موضعُ اللفظِ لا صحّتُه. و«ليس هذا» وحدَها تحتَ
         آيةٍ قد تُقرأ لحظةً على غيرِ وجهها. فيُنَصّ على الموضعِ
         نصًّا، فلا يَبقى للّبسِ بابٌ أصلًا. */
      var miss = (q.type === 'wording' || q.type === 'shabihWhere')
        ? 'هذا لفظٌ صحيح، لكنّه في موضعٍ آخر. والمطلوبُ المُعلَّمُ أعلاه.'
        : 'ليس هذا. والصوابُ المُعلَّمُ أعلاه.';
      t.textContent = chosen === q.ok ? vg('أصبتَ.', 'أصبتِ.') : miss;
      box.appendChild(t);

      var w = App.el('p', 'ex-verd-w');
      w.textContent = place(q.ans);
      box.appendChild(w);

      if (q.kind) {
        var k = App.el('p', 'ex-verd-k');
        k.textContent = 'من المتشابهات ' + '— ' + q.kind;
        box.appendChild(k);
      }

      var acts = App.el('div', 'ex-verd-a');
      var pg = App.el('button', 'btn btn-quiet btn-sm');
      pg.type = 'button';
      pg.textContent = 'إلى صفحة ' + ar(q.ans.p);
      pg.onclick = function () { App.go('qpage', { p: q.ans.p }); };
      acts.appendChild(pg);
      var nx = App.el('button', 'btn btn-pri ex-next');
      nx.type = 'button';
      nx.textContent = at + 1 >= ses.list.length ? 'النتيجة' : 'السؤال التالي';
      nx.onclick = next;
      acts.appendChild(nx);
      box.appendChild(acts);
      return box;
    }

    function next() {
      if (at + 1 >= ses.list.length) { finish(); return; }
      at++; chosen = -1;
      paintRun();
      var sh = document.getElementById('sheet');
      if (sh) sh.scrollTop = 0; else window.scrollTo(0, 0);
    }

    /* ── ج · النتيجة: ما ضَعُف وما يُفعَل ── */
    function finish() {
      phase = 'end';
      body.innerHTML = '';
      var seen = answered.length;

      if (!seen) {
        body.appendChild(head('لم يُجَب سؤالٌ بعد.', null));
        var back = App.el('button', 'btn btn-pri btn-block');
        back.type = 'button';
        back.textContent = 'إلى الإعداد';
        back.onclick = function () { phase = 'set'; paintSet(); };
        body.appendChild(back);
        return;
      }

      body.appendChild(head(vg('أجبتَ عن ', 'أجبتِ عن ') + nAskGen(seen) + '.',
        vg('أصبتَ في ', 'أصبتِ في ') + ar(hits) + ' من ' + ar(seen) + '.'));

      /* شريطُ الصوابِ خبرٌ لا درجة: لا لونَ ينتقل من الأحمرِ إلى
         الأخضرِ بحسبِ الرقم. */
      var track = App.el('div', 'progress progress-lg');
      track.setAttribute('role', 'img');
      track.setAttribute('aria-label', 'أصبتَ في ' + ar(hits) + ' من ' + ar(seen));
      var fill = App.el('div', 'progress-fill');
      fill.style.width = Math.round((hits / seen) * 100) + '%';
      track.appendChild(fill);
      body.appendChild(track);

      /* ١ — الأجزاءُ مرتّبةً بالأضعف: هذا هو المقصودُ من الاختبار */
      var byJ = {}, order = [], i;
      for (i = 0; i < answered.length; i++) {
        var j = answered[i].q.juz;
        if (!byJ[j]) { byJ[j] = { n: 0, ok: 0 }; order.push(j); }
        byJ[j].n++;
        if (answered[i].ok) byJ[j].ok++;
      }
      order.sort(function (a, b) {
        return (byJ[a].ok / byJ[a].n) - (byJ[b].ok / byJ[b].n) || a - b;
      });

      var gj = App.el('div', 'ex-grp');
      var gl = App.el('p', 'ex-lbl');
      gl.textContent = 'أجزاؤك في هذا الاختبار';
      gj.appendChild(gl);
      var ul = App.el('ul', 'ex-juz');
      order.forEach(function (j) {
        var r = byJ[j];
        var li = App.el('li', 'ex-jrow' + (r.ok === r.n ? ' is-full' : ''));
        var nm = App.el('b', 'ex-jn');
        nm.textContent = 'الجزء ' + ar(j);
        li.appendChild(nm);
        var sc = App.el('span', 'ex-js');
        sc.textContent = ar(r.ok) + ' من ' + ar(r.n);
        li.appendChild(sc);
        ul.appendChild(li);
      });
      gj.appendChild(ul);
      body.appendChild(gj);

      /* ٢ — ما يُقترَح أن يُراجَع: جملةٌ تُنفَّذ لا رقمٌ يُقرأ */
      var worst = order[0], adv = App.el('p', 'ex-advice');
      if (!miss.length) {
        adv.textContent = vg('مضى الاختبارُ بلا خطأ. وسِّع النطاقَ أو زِد العددَ في المرّةِ القادمة.',
                             'مضى الاختبارُ بلا خطأ. وسّعي النطاقَ أو زيدي العددَ في المرّةِ القادمة.');
      } else if (byJ[worst].ok < byJ[worst].n) {
        /* «٤ أسئلة لم يُصَب» تُخالف في التأنيث، فيُقدَّم الفعلُ على
           العددِ ويُخاطَب صاحبُه مباشرةً. */
        adv.textContent = 'أَولى ما يُراجَع الآن: الجزءُ ' + ar(worst) + ' — '
          + vg('لم تُصِبْ فيه ', 'لم تُصيبي فيه ')
          + nAskAcc(byJ[worst].n - byJ[worst].ok) + '.';
      } else {
        adv.textContent = 'الخطأُ متفرّقٌ لا يَجتمع في جزء.';
      }
      body.appendChild(adv);

      /* ٣ — المواضعُ بأعيانِها: «ثلاثةُ أخطاء» لا تَدلّ على موضع */
      if (miss.length) {
        var gm = App.el('div', 'ex-grp');
        var ml = App.el('p', 'ex-lbl');
        ml.textContent = 'ما لم يُصَب';
        gm.appendChild(ml);
        var list = App.el('ul', 'ex-miss');
        miss.forEach(function (q) {
          var li = App.el('li', 'ex-mrow');
          var k = App.el('b', 'ex-mk');
          k.textContent = place(q.ans);
          li.appendChild(k);
          li.appendChild(ayahBox(q.ans, 'ex-mt'));
          var b = App.el('button', 'btn btn-quiet btn-sm');
          b.type = 'button';
          b.textContent = 'إلى صفحتِها';
          b.onclick = function () { App.go('qpage', { p: q.ans.p }); };
          li.appendChild(b);
          list.appendChild(li);
        });
        gm.appendChild(list);
        body.appendChild(gm);
      }

      var acts = App.el('div', 'ex-acts');
      if (miss.length && byJ[worst].ok < byJ[worst].n) {
        acts.appendChild(act('اختبِرني في الجزء ' + ar(worst), 'btn-pri', function () {
          PICK.kind = 'juz'; PICK.j = worst;
          start();
        }));
      }
      acts.appendChild(act('اختبارٌ جديد', miss.length ? 'btn-ghost' : 'btn-pri', function () {
        phase = 'set'; paintSet();
        var sh = document.getElementById('sheet');
        if (sh) sh.scrollTop = 0;
      }));
      acts.appendChild(act('إغلاق', 'btn-quiet', function () { App.closeSheet(); }));
      body.appendChild(acts);
    }

    function act(label, kind, fn) {
      var b = App.el('button', 'btn ' + kind + ' btn-block');
      b.type = 'button';
      b.textContent = label;
      b.onclick = fn;
      return b;
    }
  }, { full: true });

  /* ═══ ١٠ · البابُ من «تقدُّمي» ═════════════════════════════════
     لا تُمَسّ وحدةُ «تقدُّمي» ولا يُفتَح لها ملفّ: البطاقةُ تُعلَّق
     بعد البناءِ من خارجِها. والموضعُ تحتَ العنوانِ مباشرةً — أعلى
     من الألسنةِ الثلاثة، لأنّ الامتحانَ فعلٌ لا قسمٌ يُقرأ. */
  /* ── وأُغلق هذا البابُ حين فُتح بابُ الإعدادات ────────────────
     كان هذا حين لم يكن للاختبارِ موضعٌ مُقَرّ. ولمّا صار له لسانُه
     في الإعدادات صار البابان بابًا واحدًا مُكرَّرًا، وكلّف «تقدُّمي»
     سبعةً وتسعين بكسلًا دفعت لوحَها إلى الخفاء. وبابٌ واحدٌ معلومٌ
     خيرٌ من بابَين إلى غرفةٍ واحدة. */

  function scopeLabel(sc) {
    if (sc.kind === 'juz') return 'الجزء ' + ar(sc.j);
    if (sc.kind === 'surah') return 'سورة ' + Q.name(sc.s);
    return hifzPages().known ? 'كلُّ محفوظي' : 'المصحفُ كلُّه';
  }

  /* يُكشَف للفحصِ الآليِّ قبل كلِّ شيء: صحّةُ ألفِ سؤالٍ لا تُرى
     بالعين، وتُقاس ببرنامجٍ يُنادي ‎make‎ ويُقابل كلَّ نصٍّ بالمصحف. */
  /* ══ لوحُ الاختبار في «تقدُّمي» ═══════════════════════════════
     موضعُه بين ألسنةِ «تقدُّمي» لا في الإعدادات: ثمرةُ الاختبارِ
     قياسٌ — درجةٌ لكلِّ جزءٍ وأضعفُ ما عندك — وذاك بابُ «تقدُّمي»
     بعينه. والإعداداتُ دُرجُ ما يُضبَط مرّةً ثمّ يُنسى، لا موضعُ
     فعلٍ يُعاد كلَّ أسبوع. */
  function pane() {
    var out = App.el('div', 'stack-lg');
    var miss = App.Packs ? App.Packs.missingFor('exam') : [];

    var c = App.el('article', 'card');
    c.appendChild(App.el('h2', 'h2', vg('اختبِرْ نفسَك', 'اختبِري نفسَكِ')));
    c.appendChild(App.el('p', 'small', miss.length
      ? 'يَلزمه نصُّ المصحفِ والمتشابهات — وهما في «المصحف ← المحتوى».'
      : 'اختر الجزءَ وعددَ الأسئلة، ويُعرَف ضعيفُ أجزائك.'));

    var go = App.el('button', 'btn btn-pri btn-block');
    go.type = 'button';
    go.textContent = miss.length ? 'حمِّل المحتوى' : 'ابدأ الاختبار';
    go.onclick = function () {
      if (miss.length) App.go('mushaf', { tab: 'pack' });
      else App.go('exam');
    };
    /* الاقتراحُ يَسبق الزرَّ لا يَتبعه: هو ما سيَحدث إن ضُغط، فقراءتُه
       بعدَه لا تُفيد. و‎ex-sug‎ صنفُ بطاقةٍ ذاتِ إطارٍ في الكسوةِ
       الأصليّة، فلو أُلبِسه سطرٌ لَبدا زرًّا معطَّلًا. */
    if (!miss.length) {
      var sg = suggest();
      c.appendChild(App.el('p', 'small ex-hint',
        App.join(scopeLabel(sg.scope), nAsk(sg.n))));
    }
    c.appendChild(go);
    out.appendChild(c);

    /* أضعفُ الأجزاءِ: ثمرةُ ما مضى، وهي أَولى ما يُعاد فيه الاختبار */
    if (!miss.length) {
      var weak = [];
      try { weak = weakJuz() || []; } catch (e) {}
      if (weak.length) {
        var wc = App.el('article', 'card');
        wc.appendChild(App.el('h2', 'h2', 'أضعفُ أجزائك'));
        var row = App.el('div', 'ex-weak');
        weak.slice(0, 6).forEach(function (w) {
          var j = w.j || w;
          var bt = App.el('button', 'chip');
          bt.type = 'button';
          bt.textContent = 'الجزء ' + ar(j);
          bt.onclick = function () {
            App.go('exam', { scope: { kind: 'juz', j: j }, go: 1 });
          };
          row.appendChild(bt);
        });
        wc.appendChild(row);
        wc.appendChild(App.el('p', 'small',
          'المسْ جزءًا لتَختبر نفسك فيه وحدَه.'));
        out.appendChild(wc);
      }
    }
    return out;
  }


  App.Exam = {
    pane: pane,
    make: make,
    suggest: suggest,
    weakJuz: weakJuz,
    poolOf: poolOf,
    hifzPages: hifzPages,
    nAsk: nAsk, nAskGen: nAskGen, nJuz: nJuz, nPage: nPage
  };

}(window.App));

/* حصيلةُ الاختباراتِ مفتاحٌ أعلى تَملكه هذه الوحدة: يُسجَّل لئلّا
   يَحذفه الاستيرادُ بقائمتِه البيضاء. */
if (window.App && window.App.ownState) window.App.ownState('exam');

/* ══ 80-circles.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   الحلقات — رفقةٌ يصنعها الطلّابُ أنفسُهم
   ───────────────────────────────────────────────────────────────────
   لا معلّمَ هنا ولا مؤسّسة: طالبٌ يُنشئ حلقةً فينضمُّ إليه رفاقُه. ولأنّ
   التطبيقَ بلا خادم، فالدعوةُ رابطٌ مُرمَّزٌ يحمله الطالبُ بيده، والتقدّمُ
   يُتبادل ببطاقةٍ يُرسلها كلُّ واحدٍ عن نفسه. لم نُزيّف مزامنةً لا نملكها،
   بل صرّحنا بها في الواجهة سطرًا واحدًا.

   وحلقاتُ الطلّاب وحلقاتُ الطالبات منفصلةٌ قطعًا. الفصلُ مُنفَّذٌ في
   مسار الانضمام نفسِه لا في العرض وحدَه، حتّى لا يُخترق برابطٍ مُلفَّق.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* ── حروفُ الرمز ──
     بلا O ولا I ولا أصفارٍ ولا أرقامٍ أصلًا: الرمزُ يُقرأ بالصوت ويُكتب
     باليد، فأيُّ لبسٍ بين حرفٍ ورقمٍ يُفقد الرفيقَ حلقتَه. وخلوُّه من
     الأرقام اللاتينيّة يحفظ قاعدةَ «لا رقمَ لاتينيٌّ في الواجهة». */
  var ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var CODE_RE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/;
  var CODE_LEN = 6;

  var MAX_PAYLOAD = 1400;   /* رابطٌ أطولُ من هذا ليس دعوةً بل عبثٌ أو هجوم */
  var MAX_JSON = 900;
  var NAME_MAX = 60;
  var PAGES = App.Quran.PAGES;

  var SELF = 'me';          /* صاحبُ الجهاز: حالةُ كلِّ جهازٍ مستقلّةٌ فلا يلتبس */
  var OWNER = 'owner';

  /* سببُ رفضِ دعوةٍ وصلت برابط: يَبقى معروضًا في «حلقتي» حتّى يُقرأ.
     الإشعارُ يَذهب في ثلاث ثوانٍ، ومن رُدَّت دعوتُه يَستحقّ سببًا يَثبُت. */
  var notice = null;

  /* ── أرقام ────────────────────────────────────────────────────── */
  var ARD = '٠١٢٣٤٥٦٧٨٩';
  function toLatin(s) {
    return String(s == null ? '' : s).replace(/[٠-٩]/g, function (d) {
      return String(d.charCodeAt(0) - 0x0660);
    });
  }

  /* ── نصٌّ لا يُثق به ──
     كلُّ اسمٍ يأتي من رابطٍ خارجيٍّ نصٌّ خامٌّ يوضع بـtextContent وحدَه،
     ولا يُركَّب في HTML أبدًا. والتهذيبُ هنا للطول والمحارف المخفيّة. */
  function clean(s, max) {
    s = String(s == null ? '' : s)
      .replace(/[\u0000-\u001F\u007F‎‏‪-‮]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    return s.slice(0, max || NAME_MAX);
  }
  function put(node, s) { node.textContent = s; return node; }

  /* ── الهويّة ──────────────────────────────────────────────────── */
  function me() { return App.state.profile || null; }
  function myGender() { var p = me(); return p && p.gender === 'f' ? 'f' : 'm'; }
  function fem() { return myGender() === 'f'; }
  /* «عضو» وصفُ موقعٍ في الحلقةِ لا لقبٌ لصاحبه، فيَصلُح بديلًا
     لمن لم يكتب اسمَه. و«طالب» لقبٌ يُنادى به فلا يُدَسّ. */
  function myName() { return clean((me() && me().name) || (fem() ? 'عضوة' : 'عضو'), 40); }

  /* كلمتان تتبدّلان بالهويّة: الواجهةُ تخاطب صاحبَها لا جنسًا مُفترضًا */
  function wMate() { return fem() ? 'رفيقة' : 'رفيق'; }
  /* المنصوبُ مُفرَدًا: «ادعُ رفيقًا» لا «ادعُ رفيق» — واللحنُ في زرٍّ
     يُقرأ كلَّ يومٍ أثقلُ منه في سطرٍ عابر. */
  function wMateAcc() { return fem() ? 'رفيقةً' : 'رفيقًا'; }
  function wMates() { return fem() ? 'رفيقات' : 'رفاق'; }
  function wForWhom(g) { return g === 'f' ? 'للنساء' : 'للرجال'; }

  /* ── الرمز ────────────────────────────────────────────────────── */
  function makeCode() {
    var out = '', i, buf = null;
    try {
      if (window.crypto && crypto.getRandomValues) {
        buf = new Uint8Array(CODE_LEN * 2);
        crypto.getRandomValues(buf);
      }
    } catch (e) { buf = null; }
    for (i = 0; i < CODE_LEN; i++) {
      var r = buf ? buf[i] / 256 : Math.random();
      out += ALPHA.charAt(Math.floor(r * ALPHA.length) % ALPHA.length);
    }
    /* الرمزُ معرّفٌ يُنطق، فلا يتكرّر على الجهاز نفسِه */
    if (byCode(out)) return makeCode();
    return out;
  }

  /* ── الترميز ──
     btoa يَختنق بالعربيّة، فيُمرّر النصُّ على UTF-8 أوّلًا. والخارجُ
     يُلفُّ بencodeURIComponent لأنّ +/= تُفسد الشّظيّة في الرابط. */
  function encode(obj) {
    var json = JSON.stringify(obj);
    return encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
  }
  function decode(raw) {
    var json = decodeURIComponent(escape(atob(decodeURIComponent(String(raw)))));
    if (json.length > MAX_JSON) throw new Error('long');
    return JSON.parse(json);
  }

  /* ── الحمولةُ المشتركة ───────────────────────────────────────── */
  function payloadOf(c) {
    return { id: c.id, name: c.name, gender: c.gender, code: c.code, owner: ownerName(c) };
  }

  /* يُعيد {ok:true,data} أو {ok:false,msg} ولا يرمي أبدًا: الرابطُ مدخلٌ
     من الخارج، وانكسارُ الشاشة بسببه عيبٌ لا عذرَ فيه. */
  function parsePayload(raw) {
    var bad = { ok: false, msg: 'هذا الرابط غير صالح. اطلب من ' + wMate() + 'ك رابطًا جديدًا.' };
    if (raw == null) return bad;
    raw = String(raw);
    if (!raw || raw.length > MAX_PAYLOAD) return bad;
    var d;
    try { d = decode(raw); } catch (e) { return bad; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) return bad;
    var name = clean(d.name, NAME_MAX);
    var code = String(d.code == null ? '' : d.code).toUpperCase().replace(/[^A-Z]/g, '');
    var id = clean(d.id, 64).replace(/\s/g, '');
    var owner = clean(d.owner, 40);
    var g = d.gender === 'f' ? 'f' : (d.gender === 'm' ? 'm' : null);
    if (!name || !id || !g || !CODE_RE.test(code)) return bad;
    return { ok: true, data: { id: id, name: name, gender: g, code: code, owner: owner || wMate() } };
  }

  /* ── قراءةُ الحالة ───────────────────────────────────────────── */
  function all() {
    var a = App.state.circles;
    return Array.isArray(a) ? a : (App.state.circles = []);
  }
  /* العرضُ مُرشَّحٌ بالجنس أيضًا: لو تسرّبت حلقةٌ من نسخةٍ قديمةٍ لم تظهر */
  function mine() {
    var g = myGender();
    return all().filter(function (c) { return c && c.gender === g; });
  }
  function byId(id) {
    var a = all(), i;
    for (i = 0; i < a.length; i++) if (a[i] && a[i].id === id) return a[i];
    return null;
  }
  function byCode(code) {
    var a = all(), i;
    for (i = 0; i < a.length; i++) if (a[i] && a[i].code === code) return a[i];
    return null;
  }
  function members(c) { return Array.isArray(c.members) ? c.members : (c.members = []); }
  function memberById(c, id) {
    var m = members(c), i;
    for (i = 0; i < m.length; i++) if (m[i] && m[i].id === id) return m[i];
    return null;
  }
  function ownerName(c) {
    if (c.role === 'owner') return myName();
    var o = memberById(c, OWNER);
    return (o && o.name) || wMate();
  }
  function pagesOf(m) {
    var n = Math.round(Number(m && m.pages) || 0);
    return Math.max(0, Math.min(PAGES, n));
  }
  function totalPages(c) {
    return members(c).reduce(function (s, m) { return s + pagesOf(m); }, 0);
  }
  function sharePct(c) {
    return Math.min(100, Math.round(totalPages(c) / PAGES * 100));
  }

  /* صفحاتُ صاحبِ الجهاز معلومةٌ محليًّا، فتُحدَّث وحدَها بلا تدخّل */
  function ownPages() {
    try {
      if (App.Plans && App.Plans.coveredPages) return App.Plans.coveredPages().size;
    } catch (e) {}
    return 0;
  }
  function syncSelf(c) {
    var s = memberById(c, SELF);
    if (!s) return false;
    var p = ownPages(), n = myName(), ch = false;
    if (s.pages !== p) { s.pages = p; ch = true; }
    if (s.name !== n) { s.name = n; ch = true; }
    if (ch) s.updatedAt = App.dateKey();
    return ch;
  }
  function syncAll() {
    var ch = false;
    all().forEach(function (c) { if (c && syncSelf(c)) ch = true; });
    if (ch) App.save();
  }

  /* ── الإنشاء والانضمام والمغادرة ─────────────────────────────── */
  function create(name) {
    /* الاسمُ نصٌّ أو لا شيء: String(كائن) تُخرج «[object Object]» اسمًا
       لحلقةٍ تُنشأ وتُحفظ — وخطأُ نوعٍ أولى به الردُّ من القبول. */
    if (typeof name !== 'string' && typeof name !== 'number') return null;
    name = clean(name, NAME_MAX);
    if (!name) return null;
    var c = {
      id: App.uid(),
      name: name,
      gender: myGender(),            /* لا يُختار: حلقةُ الطالب على جنسِه */
      code: makeCode(),
      role: 'owner',
      members: [{ id: SELF, name: myName(), pages: ownPages(), updatedAt: App.dateKey() }],
      createdAt: App.dateKey()
    };
    all().push(c);
    App.save();
    return c;
  }

  /* البوّابةُ الوحيدة للانضمام: الهاشُ والرابطُ الملصوق يمرّان بها، ومنعُ
     اختلاط الجنسين هنا لا في الزينة. */
  function join(raw) {
    var p = parsePayload(raw);
    if (!p.ok) return p;
    var d = p.data;
    if (!me()) return { ok: false, msg: 'أنشئ ملفَّك أوّلًا ثمّ انضمّ للحلقة.' };
    if (d.gender !== myGender()) {
      return { ok: false, msg: 'هذه الحلقةُ ' + wForWhom(d.gender) +
        '، وحلقاتُ الرجالِ وحلقاتُ النساءِ منفصلة.' };
    }
    var exists = byId(d.id) || byCode(d.code);
    if (exists) return { ok: true, circle: exists, already: true };
    var c = {
      id: d.id, name: d.name, gender: d.gender, code: d.code, role: 'member',
      members: [
        { id: OWNER, name: d.owner, pages: 0, updatedAt: null },
        { id: SELF, name: myName(), pages: ownPages(), updatedAt: App.dateKey() }
      ],
      createdAt: App.dateKey()
    };
    all().push(c);
    App.save();
    return { ok: true, circle: c };
  }

  function leave(id) {
    var a = all(), i;
    for (i = 0; i < a.length; i++) if (a[i] && a[i].id === id) { a.splice(i, 1); App.save(); return true; }
    return false;
  }

  function addMate(c, name) {
    name = clean(name, NAME_MAX);
    if (!name) return null;
    var m = { id: App.uid(), name: name, pages: 0, updatedAt: null };
    members(c).push(m);
    App.save();
    return m;
  }
  function setPages(c, id, n) {
    var m = memberById(c, id);
    if (!m) return false;
    n = Math.max(0, Math.min(PAGES, Math.round(Number(n) || 0)));
    m.pages = n;
    m.updatedAt = App.dateKey();
    App.save();
    return true;
  }

  /* ── الرابط والنسخ ──────────────────────────────────────────── */
  function linkOf(c) {
    var base = String(location.href).split('#')[0];
    return base + '#join=' + encode(payloadOf(c));
  }

  /* النسخُ قد يُمنع (سياقٌ غير آمن، أو رفضُ المستخدم) فيُعرض النصُّ
     ليُنسخ بالإصبع: الوعدُ بالنسخ دون حدوثه أسوأُ من عدمه. */
  function copy(text, okMsg, fallbackNode) {
    function fail() {
      if (fallbackNode) {
        fallbackNode.hidden = false;
        put(fallbackNode, text);
        try { window.getSelection().selectAllChildren(fallbackNode); } catch (e) {}
        App.toast('تعذّر النسخُ تلقائيًّا — النصُّ أمامك فانسخه.');
      } else {
        App.toast('تعذّر النسخ.');
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { App.toast(okMsg); }, fail);
        return;
      }
    } catch (e) {}
    try {
      var t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('aria-hidden', 'true');
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(t);
      if (ok) { App.toast(okMsg); return; }
    } catch (e) {}
    fail();
  }

  /* ── الدعوةُ في واتساب ──
     كان زرُّ «واتساب» يُنادي circleCard ثمّ يَشترط أن تكون عائدتُه نصًّا،
     وهي لوحُ رسمٍ — فلم يَفعل الزرُّ شيئًا قطّ. والدعوةُ ليست بطاقةَ
     تقدّمٍ أصلًا بل رابطٌ يَفتحه الرفيقُ فينضمّ، فصارت لها رسالتُها. */

  /* الرابطُ هو الدعوة: بلا خادمٍ لا يَصل الرمزُ وحدَه إلى حلقة. ويُذكر
     الرمزُ بعده لمن يُثبّته أو يَقرؤه بصوته لا ليَنضمّ به. */
  function inviteText(c) {
    return [
      'دعوةٌ إلى حلقة «' + c.name + '» في تطبيق «رتِّل وارتقِ»',
      'نبني مناهجَ حفظنا بأنفسنا، ونرى مجموعَ ما حفظناه معًا.',
      'افتح هذا الرابطَ من جهازك لتنضمّ إلينا:',
      linkOf(c),
      'رمزُ الحلقة: ' + c.code,
      'والحلقةُ ' + wForWhom(c.gender) + '.'
    ].join('\n');
  }

  function waHref(txt) {
    /* encodeURIComponent وحدَه يَحفظ العربيَّ وأسطرَه في مَعلَمِ الرابط */
    return 'https://wa.me/?text=' + encodeURIComponent(String(txt == null ? '' : txt));
  }

  /* وسمُ <a> لا window.open: ما تَفتحه الشيفرةُ يأكله مانعُ النوافذ،
     والرابطُ الحقيقيُّ يَفتح دائمًا ويُنسَخ ويُشارَك بأدوات الجهاز. */
  function waBtn(label, txt, cls) {
    var a = App.el('a', 'btn circ-wa ' + (cls || 'btn-wa'));
    a.href = waHref(txt);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    var i = App.el('span', null, App.icon('whatsapp', 19));
    i.setAttribute('aria-hidden', 'true');
    a.appendChild(i);
    a.appendChild(put(App.el('span'), label));
    return a;
  }

  /* الإنشاءُ والدعوةُ خطوةٌ واحدة: من لا حلقةَ له يُريد رفيقًا لا حلقةً
     فارغة. والفتحُ يَجري داخلَ لمسةِ الطالب نفسِها فلا يُمنع. */
  function openInvite(c) {
    var a = waBtn('', inviteText(c));
    a.style.position = 'fixed';
    a.style.opacity = '0';
    a.setAttribute('aria-hidden', 'true');
    a.tabIndex = -1;
    document.body.appendChild(a);
    try { a.click(); } catch (e) {} finally { a.remove(); }
  }

  /* بطاقةُ التقدّم من وحدتها: تُعرض إن حُزمت وتُغفل إن غابت */
  function hasShare() {
    return !!(window.IrtaqiShare && typeof window.IrtaqiShare.circleCard === 'function');
  }

  /* ══ زينةٌ خاصّةٌ بالحلقات ══
     الألوانُ كلُّها رموزُ الهويّة، والأسماءُ مُسبَّقةٌ بـcirc- فلا تزاحم
     أصنافَ الهيكل العامّ. */
  var CSS = [

    '.circ-mini{margin:10px 4px 0;display:flex;flex-direction:column;gap:7px}',

      + 'background:var(--hair-2);overflow:hidden}',

      + 'background:var(--accent-2)}',

    '.circ-mini-v{flex:0 0 auto;min-width:30px;text-align:end;font-size:12px;'

    '.circ-me .circ-mini-v{color:var(--accent)}',

    /* ‎--ink-faint‎ قيسَ ٣٫١٤ فهو للشعيرات لا للكلام: كلُّ نصٍّ هنا مِدادُه

       كأنّهما لِما بعدَها. فصار الإطارُ على الوحدةِ كلِّها، والصفُّ

      + 'padding-inline:0;margin-inline:0}',

    'font-weight:700;font-size:15px}',

    'overflow-wrap:anywhere}',
    '.circ-mem-s{display:block;color:var(--ink-mut);font-size:12.5px;margin-block-start:2px}',
    '.circ-mem-p{color:var(--gold);font-weight:700;font-size:15px;white-space:nowrap}',
    '.circ-pen{min-inline-size:var(--tap);min-block-size:var(--tap);border-radius:var(--r-sm);',
    'border:1px solid var(--hair);background:transparent;color:var(--ink-mut);cursor:pointer;',
    'display:grid;place-items:center;flex:0 0 auto}',
    '.circ-pen:hover{color:var(--ink);border-color:var(--accent)}',
    '.circ-edit{display:flex;gap:8px;align-items:center;padding:0 0 12px}',
    '.circ-num{flex:0 1 7rem;text-align:center;font-size:17px}',
    '.circ-you{color:var(--accent);font-size:11.5px;border:1px solid var(--accent-soft);',
    'background:var(--accent-soft);border-radius:var(--r-pill);padding:2px 8px;margin-inline-start:6px;',
    'white-space:nowrap}',
    '.circ-sum{display:flex;align-items:baseline;gap:8px;justify-content:center;flex-wrap:wrap}',
    '.circ-big{font-size:34px;font-weight:700;color:var(--ink);line-height:1.1}',
    '.circ-of{color:var(--ink-mut);font-size:14px}',
    '.circ-fall{display:block;margin-block-start:10px;padding:10px;border-radius:var(--r-sm);',
    'background:var(--surface-2);color:var(--ink);font-size:12.5px;word-break:break-all;',
    'user-select:all;direction:ltr;unicode-bidi:isolate}',
    /* ‎display‎ في صنفٍ يَغلب ‎[hidden]‎ في ورقة المتصفّح، فكان النصُّ
       الاحتياطيُّ شريطًا فارغًا ظاهرًا أبدًا وحقلُ التدوين مفتوحًا
       بلا طلب. الإخفاءُ يُعلَن هنا صراحةً ليَصدُق ‎hidden‎. */
    '.circ-fall[hidden],.circ-edit[hidden]{display:none}',
    '.circ-warn{color:var(--danger);font-size:13.5px;line-height:1.7}',
    '.circ-del{color:var(--danger)!important;border-color:var(--danger)!important}',
    '.circ-sep{display:flex;align-items:center;gap:10px;color:var(--ink-mut);font-size:12px;',
    'margin:4px 0}',
    '.circ-sep::before,.circ-sep::after{content:"";height:1px;flex:1;background:var(--hair)}',
    '.circ-panel{overflow:hidden;animation:circ-in var(--mid) var(--ease) both}',
    '@keyframes circ-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}',
    /* خاتمُ الفراغ صار لوحَ بطولةٍ قائمًا بنفسه: أرضيّتُه وحافّتُه
       داخلَ الـSVG، فلا تُطلى تحتَه أرضٌ ثانيةٌ تُرى من خلفِ زجاجه. */
    '.circ-emb{display:grid;place-items:center;inline-size:76px;block-size:76px;',
    'margin:0 auto 14px;color:var(--accent)}',
    '.circ-emb .i3{inline-size:100%;block-size:100%}',
    '.circ-pen:focus-visible,.circ-num:focus-visible,.circ-rowb:focus-visible{',
    'outline:2px solid var(--accent);outline-offset:2px}',
    '.circ-rowb{inline-size:100%;text-align:start;cursor:pointer}',
    '@media (prefers-reduced-motion:reduce){.circ-panel{animation:none}}'
  ].join('');

  (function injectCSS() {
    try {
      var s = document.createElement('style');
      s.id = 'circ-css';
      s.textContent = CSS;
      document.head.appendChild(s);
    } catch (e) {}
  })();

  /* ── مُعِينات بناء ───────────────────────────────────────────── */
  function btn(label, cls, iconKey, fn) {
    var b = App.el('button', 'btn ' + (cls || ''));
    b.type = 'button';
    if (iconKey) {
      var i = App.el('span', null, App.icon(iconKey, 19));
      i.setAttribute('aria-hidden', 'true');
      b.appendChild(i);
    }
    b.appendChild(put(App.el('span'), label));
    if (fn) b.onclick = fn;
    return b;
  }
  function sec(title) {
    var s = App.el('section', 'sec');
    if (title) s.appendChild(put(App.el('h2', 'sec-h'), title));
    return s;
  }
  function bar(title, back) {
    var h = App.el('header', 'bar');
    if (back) {
      var b = App.el('button', 'btn btn-ghost');
      b.type = 'button';
      b.appendChild(App.el('span', null, App.icon('chevron', 18)));
      b.appendChild(put(App.el('span'), 'رجوع'));
      b.onclick = back;
      h.appendChild(b);
    }
    h.appendChild(put(App.el('h1', 'h2'), title));
    return h;
  }
  /* حصيلةُ الرفاق في سطورٍ قصيرة: الحلقةُ اسمٌ في قائمةٍ ما لم يُرَ
     فيها أثرُ الرفاق. وتُعرض ثلاثةٌ لا أكثر، والباقي في شاشتها —
     فقائمةُ عشرين رفيقًا في الشاشة الأولى تَطمِس ما سواها. */
  function miniBoard(c) {
    var ms = members(c).slice().sort(function (a, b) {
      return pagesOf(b) - pagesOf(a);
    });
    var box = App.el('div', 'circ-mini');
    if (!ms.length) return box;
    var max = Math.max.apply(null, ms.map(pagesOf).concat([1]));
    /* صاحبُ الجهاز يرى سطرَه دائمًا ولو كان آخرَ القوم: لوحةٌ لا يجد
       فيها نفسَه لا تَعنيه. وإن لم يكن في الثلاثة الأُوَل أُلحق بهم. */
    var top = ms.slice(0, 3);
    var mine = ms.filter(function (m) { return m.id === SELF; })[0];
    if (mine && top.indexOf(mine) < 0) top.push(mine);
    var hidden = ms.length - top.length;
    top.forEach(function (m) {
      var r = App.el('div', 'circ-mini-r' + (m.id === SELF ? ' circ-me' : ''));
      var nm = App.el('span', 'circ-mini-n');
      put(nm, (m.name || 'رفيق') + (m.id === SELF ? ' (أنت)' : ''));
      var bar = App.el('span', 'circ-mini-bar');
      var f = App.el('i');
      f.style.width = Math.max(Math.round(pagesOf(m) / max * 100),
                               pagesOf(m) > 0 ? 4 : 0) + '%';
      bar.appendChild(f);
      var vn = App.el('span', 'circ-mini-v');
      put(vn, App.ar(pagesOf(m)));
      r.appendChild(nm); r.appendChild(bar); r.appendChild(vn);
      box.appendChild(r);
    });
    if (hidden > 0) {
      var more = App.el('div', 'circ-mini-more');
      put(more, 'و' + mateWord(hidden) + ' غيرهم');
      box.appendChild(more);
    }
    return box;
  }

  function pagesWord(n) {
    return n === 1 ? 'صفحة واحدة' : (n === 2 ? 'صفحتان' : App.ar(n) + ' صفحة');
  }
  function mateWord(n) {
    return n === 1 ? wMate() + ' واحد' + (fem() ? 'ة' : '') :
           (n === 2 ? (fem() ? 'رفيقتان' : 'رفيقان') : App.ar(n) + ' ' + wMates());
  }
  function initial(name) {
    var s = clean(name, 4);
    return s ? s.charAt(0) : '؟';
  }
  /* حقلُ عددٍ يَعرض عربيًّا ويَقبل الكتابتين: فلا يظهر رقمٌ لاتينيٌّ قطّ */
  function numField(value, label) {
    var f = App.el('input', 'field circ-num');
    f.type = 'text';
    f.inputMode = 'numeric';
    f.autocomplete = 'off';
    f.setAttribute('aria-label', label);
    f.value = App.ar(value);
    f.oninput = function () {
      var v = toLatin(f.value).replace(/[^0-9]/g, '').slice(0, 3);
      f.value = App.ar(v);
    };
    return f;
  }
  function numValue(f) {
    var v = parseInt(toLatin(f.value).replace(/[^0-9]/g, ''), 10);
    if (!isFinite(v)) v = 0;
    return Math.max(0, Math.min(PAGES, v));
  }
  /* تأكيدٌ داخل الصفحة لا نافذةَ متصفّح: لغةُ الحوار هنا عربيّةٌ ومُهذّبة */
  function confirmRow(question, yes, cls, fn) {
    var box = App.el('div', 'circ-panel');
    box.appendChild(put(App.el('p', 'circ-warn'), question));
    var row = App.el('div', 'circ-acts');
    row.appendChild(btn(yes, 'btn-ghost ' + (cls || ''), 'check', fn));
    row.appendChild(btn('إلغاء', 'btn-ghost', 'close', function () { App.redraw(); }));
    box.appendChild(row);
    return box;
  }

  /* ══════════════ شاشةُ الحلقات ══════════════ */
  App.screen('circles', function () {
    syncAll();
    var root = App.el('div', 'screen');
    root.appendChild(bar('حلقتي'));

    var list = mine();
    var panel = App.el('div');

    if (notice) {
      var nb = App.el('div', 'card circ-panel');
      nb.setAttribute('role', 'alert');
      nb.appendChild(put(App.el('p', 'circ-warn'), notice));
      nb.appendChild(btn('حسنًا، فهمت', 'btn-ghost', 'check', function () {
        notice = null;
        App.redraw();
      }));
      panel.appendChild(nb);
    }

    /* الإنشاء */
    var fCreate = App.el('div', 'card circ-panel');
    fCreate.hidden = true;
    (function () {
      fCreate.appendChild(put(App.el('h2', 'h3'), 'أنشئ حلقة'));
      fCreate.appendChild(put(App.el('p', 'circ-note'),
        'سمِّها باسمٍ تعرفونه.'));
      var lab = App.el('label', 'small');
      lab.htmlFor = 'circ-newname';
      put(lab, 'اسمُ الحلقة');
      var inp = App.el('input', 'field');
      inp.id = 'circ-newname';
      inp.type = 'text';
      inp.maxLength = NAME_MAX;
      inp.autocomplete = 'off';
      inp.placeholder = 'رفقةُ الفجر';
      fCreate.appendChild(lab);
      fCreate.appendChild(inp);
      /* فعلُ النموذج الأوّلُ يَصنع الحلقةَ ويَفتح الدعوةَ في لمسةٍ واحدة:
         حلقةٌ بلا رفيقٍ ليست حلقةً، ومن أنشأها إنّما أنشأها ليَدعو. */
      function make(invite) {
        var c = create(inp.value);
        if (!c) { App.toast('اكتب اسمًا للحلقة.'); inp.focus(); return; }
        if (invite) openInvite(c);
        App.toast(invite ? 'أُنشئت الحلقة، ودعوتُها في واتساب.'
                         : 'أُنشئت الحلقة — ادعُ أوّلَ ' + wMate() + ' لها.');
        App.go('circle', { id: c.id });
      }
      /* زرٌّ لا رابط: عنوانُ الدعوة لا يُعرَف قبل وجودِ الحلقة، فيُنشَأُ
         ثمّ يُفتح واتساب — وكلُّه داخلَ لمسةٍ واحدةٍ فلا يُمنع. */
      fCreate.appendChild(btn('أنشئ وادعُ في واتساب', 'btn-wa circ-wa', 'whatsapp',
        function () { make(true); }));
      var row = App.el('div', 'circ-acts');
      row.appendChild(btn('أنشئ بلا دعوةٍ الآن', 'btn-ghost', 'check', function () { make(false); }));
      row.appendChild(btn('إلغاء', 'btn-ghost', 'close', function () {
        fCreate.hidden = true; fJoin.hidden = true;
      }));
      inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); make(true); } };
      fCreate.appendChild(row);
    })();

    /* الانضمام */
    var fJoin = App.el('div', 'card circ-panel');
    fJoin.hidden = true;
    (function () {
      fJoin.appendChild(put(App.el('h2', 'h3'), 'انضمّ بحلقة'));
      fJoin.appendChild(put(App.el('p', 'circ-note'),
        'الصِق رابطَ الدعوة الذي وصلك، أو اكتب رمزَ الحلقة.'));
      var lab = App.el('label', 'small');
      lab.htmlFor = 'circ-joinin';
      put(lab, 'رابطُ الدعوة أو الرمز');
      var inp = App.el('input', 'field');
      inp.id = 'circ-joinin';
      inp.type = 'text';
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.placeholder = 'الصِق الرابطَ هنا';
      var err = App.el('p', 'circ-warn');
      err.hidden = true;
      err.setAttribute('role', 'alert');
      fJoin.appendChild(lab);
      fJoin.appendChild(inp);
      fJoin.appendChild(err);
      var row = App.el('div', 'circ-acts');
      row.appendChild(btn('انضمّ', 'btn-pri', 'plus-user', function () {
        var r = submitJoinText(inp.value);
        if (r && r.msg) { err.hidden = false; put(err, r.msg); }
      }));
      row.appendChild(btn('إلغاء', 'btn-ghost', 'close', function () {
        fCreate.hidden = true; fJoin.hidden = true;
      }));
      inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); row.firstChild.click(); } };
      fJoin.appendChild(row);
    })();

    function openCreate() {
      fJoin.hidden = true; fCreate.hidden = false;
      var i = App.$('#circ-newname', fCreate); if (i) i.focus();
    }
    function openJoin() {
      fCreate.hidden = true; fJoin.hidden = false;
      var i = App.$('#circ-joinin', fJoin); if (i) i.focus();
    }

    if (!list.length) {
      var emp = App.el('div', 'empty');
      /* هنا الأيقونةُ هي المشهدُ كلُّه — لا حلقةَ بعدُ ولا صفوف */
      var e1 = App.el('div', 'circ-emb', App.icon3d('circles', 76));
      e1.setAttribute('aria-hidden', 'true');
      emp.appendChild(e1);
      emp.appendChild(put(App.el('p', 'h3'), 'لا حلقةَ لك بعد'));
      emp.appendChild(put(App.el('p', 'circ-note'),
        'اجمع من تأنس بهم على الحفظ، فتَرَون معًا ما بلغ كلُّ واحدٍ منكم.'));
      panel.appendChild(emp);
    } else {
      /* لا عنوانَ ثانيًا: رأسُ الشاشة «حلقتي» فوقه بثلاثين بكسلًا،
         وعنوانان متواليان بمعنًى واحدٍ حشوٌ لا ترتيب. */
      var s = sec('');
      list.forEach(function (c) {
        /* الدعوةُ على بُعد لمسةٍ من اللسان نفسِه: من دخل «حلقتي» إنّما
           جاء ليَدعو أو ليَرى، فلا يُدفن فعلُه في شاشةٍ أخرى. */
        var item = App.el('div', 'circ-litem');
        var b = App.el('button', 'listrow circ-rowb');
        b.type = 'button';
        var ic = App.el('span', 'emblem', App.icon('circles', 20));
        ic.setAttribute('aria-hidden', 'true');
        b.appendChild(ic);
        var box = App.el('span', 'circ-mem-b');
        box.appendChild(put(App.el('span', 'circ-mem-n'), c.name));
        var n = members(c).length, t = totalPages(c);
        /* كانت «رفيقان · ٥٣ صفحة» تُقرأ «٥٣٠» — النقطةُ الوسطى بجانب
           رقمٍ عربيٍّ هنديٍّ صفرٌ في العين. وApp.join يَحكم بالفاصل:
           فاصلةٌ عربيّةٌ قبل الرقم، ونقطةٌ بين كلمتَين. */
        box.appendChild(put(App.el('span', 'circ-mem-s'),
          App.join(mateWord(n), pagesWord(t) + ' مجموعًا')));
        b.appendChild(box);
        var ch = App.el('span', null, App.icon('chevron', 18));
        ch.setAttribute('aria-hidden', 'true');
        b.appendChild(ch);
        b.setAttribute('aria-label', c.name + ' — ' + mateWord(n));
        b.onclick = function () { App.go('circle', { id: c.id }); };
        item.appendChild(b);
        item.appendChild(miniBoard(c));
        /* الاسمُ بين قوسَين: لا نَجُرُّ اسمًا كتبه الطالبُ بحرفِ جرٍّ
           فيَلحن («إلى رفقةُ الفجر»)، والقوسانِ يُغنيان عن الإعراب. */
        var iv = waBtn('ادعُ ' + wMateAcc() + ' إلى «' + c.name + '»',
          inviteText(c), 'btn-wa btn-sm');
        iv.setAttribute('aria-label',
          'ادعُ ' + wMateAcc() + ' إلى «' + c.name + '» في واتساب');
        item.appendChild(iv);
        s.appendChild(item);
      });
      panel.appendChild(s);
    }

    var acts = App.el('div', 'circ-acts');
    /* الوعدُ في اسم الزرّ: من لا حلقةَ له يُنشئ ويَدعو في خطوةٍ واحدة */
    acts.appendChild(btn(list.length ? 'أنشئ حلقة' : 'أنشئ حلقةً وادعُ ' + wMateAcc(),
      'btn-pri', 'add', openCreate));
    acts.appendChild(btn('انضمّ بحلقة', 'btn-ghost', 'plus-user', openJoin));
    panel.appendChild(acts);
    panel.appendChild(fCreate);
    panel.appendChild(fJoin);

    /* حاشيةٌ لا سطرٌ تابعٌ للزرّ: كانت تبدأ عند البكسل الذي ينتهي
       عنده الزرّان فتُقرأ كأنّها منهما. */
    /* «لا خادمَ للتطبيق» خبرٌ عن البناءِ لا عن الاستعمال، فسَقط.
       ويَبقى ما يُعلّمه كيف يَصنع: رابطٌ يُرسَل وبطاقةٌ تَعود. */
    panel.appendChild(put(App.el('p', 'circ-note circ-foot'),
      'تُشارَك الحلقةُ برابطٍ أو رمز، وكلُّ ' + wMate()
      + ' يُرسل بطاقةَ تقدّمه.'));

    root.appendChild(panel);
    return root;
  });

  /* نصٌّ ملصوقٌ قد يكون رابطًا كاملًا أو حمولةً أو رمزًا مكتوبًا */
  function submitJoinText(text) {
    var s = String(text == null ? '' : text).trim();
    if (!s) return { msg: 'الصِق الرابطَ أو اكتب الرمز.' };
    var i = s.indexOf('join=');
    if (i >= 0) {
      var raw = s.slice(i + 5).split('&')[0].split(/\s/)[0];
      var r = join(raw);
      if (!r.ok) return { msg: r.msg };
      App.toast(r.already ? 'أنت في هذه الحلقة بالفعل.' : 'انضممتَ إلى الحلقة.');
      App.go('circle', { id: r.circle.id });
      return null;
    }
    var code = s.toUpperCase().replace(/[^A-Z]/g, '');
    if (CODE_RE.test(code)) {
      var c = byCode(code);
      if (c && c.gender === myGender()) {
        App.toast('أنت في هذه الحلقة بالفعل.');
        App.go('circle', { id: c.id });
        return null;
      }
      /* صدقٌ لا بدَّ منه: بلا خادمٍ لا يُترجم الرمزُ وحدَه إلى حلقة */
      return { msg: 'الرمزُ وحدَه لا يكفي، فالتطبيقُ يعمل بلا خادم. اطلب رابطَ الدعوة.' };
    }
    return { msg: 'هذا ليس رابطَ دعوةٍ ولا رمزًا من ' + App.ar(CODE_LEN) + ' حروف.' };
  }

  /* ══════════════ شاشةُ حلقةٍ واحدة ══════════════ */
  App.screen('circle', function (p) {
    var c = p && p.id ? byId(p.id) : null;
    if (!c || c.gender !== myGender()) {
      var g = App.el('div', 'screen');
      g.appendChild(bar('الحلقة', function () { App.go('circles'); }));
      var e = App.el('div', 'empty');
      e.appendChild(put(App.el('p', 'h3'), 'لم نجد هذه الحلقة'));
      e.appendChild(put(App.el('p', 'circ-note'), 'عُد إلى حلقاتك واختر منها.'));
      g.appendChild(e);
      return g;
    }
    if (syncSelf(c)) App.save();

    var root = App.el('div', 'screen');
    root.appendChild(bar(c.name, function () { App.go('circles'); }));

    var isOwner = c.role === 'owner';

    /* ── المجموع: صفحاتٌ ونسبةٌ من ٦٠٤، لا ترتيبَ ولا سباق ── */
    var tot = totalPages(c), pct = sharePct(c);
    var head = App.el('div', 'card');
    head.appendChild(put(App.el('p', 'eyebrow'), 'مجموعُ ما حفظتموه'));
    var sum = App.el('div', 'circ-sum');
    sum.appendChild(put(App.el('span', 'circ-big'), App.ar(tot)));
    sum.appendChild(put(App.el('span', 'circ-of'), 'صفحة من ' + App.ar(PAGES)));
    head.appendChild(sum);
    var pr = App.el('div', 'progress');
    pr.setAttribute('role', 'img');
    pr.setAttribute('aria-label', 'المجموع ' + pagesWord(tot) + ' من ' + App.ar(PAGES)
      + ' — ' + App.ar(pct) + '٪');
    var fill = App.el('div', 'progress-fill');
    fill.style.width = pct + '%';
    pr.appendChild(fill);
    head.appendChild(pr);
    head.appendChild(put(App.el('p', 'circ-note'),
      'أي ' + App.ar(pct) + '٪ من المصحف، تُقرأ معًا لا مُقارنةً بينكم.'));
    root.appendChild(head);

    /* ── الدعوةُ: أوّلُ فعلٍ بعد المجموع ──
       كانت مدفونةً أسفلَ الشاشة تحت قائمةِ الرفاق وتحت التدوين، وهي
       الفعلُ الذي جاء الطالبُ من أجله: حلقةٌ بلا رفيقٍ ليست حلقة. */
    var inv = sec('الدعوة');
    inv.appendChild(put(App.el('p', 'circ-note'),
      'الرابطُ يَحمل الحلقةَ كاملةً، فمن فتحَه على جهازه انضمّ. والحلقةُ '
      + wForWhom(c.gender) + ' فلا تُفتح لغيرهم.'));

    /* ‎.card‎ لا ‎.card-2‎: الثاني أرضُه ‎--surface-2‎ وهو عينُ خلفيّةِ
       ‎.btn-ghost‎، فيَذوب زرَّا النسخِ في اللوح فلا يُرَيان زرَّين. */
    var card = App.el('div', 'card');
    card.appendChild(waBtn('ادعُ ' + wMateAcc() + ' في واتساب',
      inviteText(c), 'btn-wa circ-wa-top'));

    var fall = App.el('code', 'circ-fall');
    fall.hidden = true;

    var ia = App.el('div', 'circ-acts circ-ia');
    ia.appendChild(btn('انسخ الرابط', 'btn-ghost', 'link', function () {

     لا ستّة، فلمّا صعدت «الإعدادات» إلى يسارِ الشعارِ في الصدر
     خلا لها موضعُها. وهذا أصوبُ من الأوّل: الحلقةُ تُقصَد كلَّ
     يومٍ والإعداداتُ مرّةً في الشهر. */
