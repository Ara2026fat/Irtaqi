/* ولا نقشَ تحتَ آية: الصحائفُ — ومنها صفحةُ المصحف — أرضُها
   مصمتةٌ بـvar(--surface) وطبقتُها فوقَ هذه أصلًا، فلا تحتاج
   قاعدةً ههنا. وكان ههنا سطرٌ يُثبّت position:relative على .sheet —
   وهو يُبطِل fixed الذي تقوم عليه الصحائفُ كلُّها، فحُذِف. */

/* ══ 24-murshid.css ══ */
/* ══ 24-murshid.css — كِسوةُ المُرشِد ═════════════════════════════

   لوحُ المرشدِ ليس إنذارًا ولا إعلانًا: هو كلمةُ من يَعرف سجلَّك.
   فلا لونَ صارخٌ ولا إطارٌ غليظ — أرضٌ هادئةٌ وشريطٌ رفيعٌ على
   الحافّةِ يُفرّق نوعَه دون أن يَصيح.

   والأنواعُ أربعةٌ ولكلٍّ لونُ شريطٍ يُميّزه لمن يُميّز الألوان —
   ومعه لفظُه في النصِّ نفسِه لمن لا يُميّزها، فاللونُ لا يَحمل
   معنًى وحدَه.                                                   */

.mu{
  position:relative;
  margin-block:10px 2px;
  padding:13px 15px 14px;
  border-radius:var(--r-lg);
  background:var(--surface);
  border:1px solid var(--hair);
  /* الشريطُ على الحافّةِ المنطقيّةِ لا اليمنى: التطبيقُ عربيٌّ
     ويُقلَب إن قُرئ بلغةٍ تُكتب يسارًا. */
  border-inline-start:3px solid var(--hair-2);
}

.mu-fix{ border-inline-start-color:var(--gold, #B4883B) }
.mu-mark{ border-inline-start-color:var(--accent) }
.mu-see{ border-inline-start-color:color-mix(in oklab,var(--accent) 55%,transparent) }
.mu-rest{ border-inline-start-color:var(--hair-2) }

.mu-h{ display:flex; align-items:flex-start; gap:10px }

.mu-t{
  flex:1;
  font-weight:700;
  font-size:14.5px;
  line-height:1.65;
  color:var(--ink);
}

/* بابُ الإخفاءِ شرطُ الثقة: من لا يَستطيع إسكاتَ ناصحٍ يَملّه.
   ٤٤×٤٤ هدفًا للمس، ومساحتُه المرئيّةُ أصغرُ لئلّا يُزاحم. */
.mu-x{
  flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px;
  margin:-13px -15px -8px 0;
  margin-inline-end:-15px;
  background:none; border:0; cursor:pointer;
  color:var(--ink-3);
}
.mu-x:hover{ color:var(--ink-2) }

.mu-b{
  margin-block-start:5px;
  font-size:12.5px;
  line-height:1.85;
  color:var(--ink-2);
}

.mu-a{ display:flex; flex-wrap:wrap; gap:8px; margin-block-start:11px }
.mu-go{ min-height:38px; padding-inline:15px; font-size:12.5px }

/* الشاشةُ القصيرة: يُضَمّ اللوحُ ولا يُحذَف — كلمةُ المرشدِ أهونُ
   ثمنًا من سطرٍ من الورد، لكنّها لا تَأخذ أكثرَ ممّا تَستحقّ. */
@media (max-height:800px){
  .mu{ padding:10px 13px 11px; margin-block:8px 0 }
  .mu-b{ margin-block-start:3px; line-height:1.7; font-size:12px }
  .mu-a{ margin-block-start:8px }
}

/* الظهورُ هادئٌ لا قافز، ويُحترَم من طلب سكونَ الحركة. */
@media (prefers-reduced-motion: no-preference){
  .mu{ animation:mu-in 420ms var(--ease, ease) both }
  @keyframes mu-in{
    from{ opacity:0; transform:translateY(-4px) }
    to{ opacity:1; transform:none }
  }
}

/* ══ 27-joy.css ══ */
/* ═══════════════════════════════════════════════════════════════════
   لحظةُ الإتمام — زينتُها
   ───────────────────────────────────────────────────────────────────
   ثلاثُ صُوَرٍ لا واحدة، لأنّ الفرحَ الواحدَ المكرَّرَ يَبلى:

     ١ · الخَتْم   — عند كلِّ ✓. ضوءٌ ينتشر من موضع الإصبع بلون نوعِ
                    الورد، ثمّ يَخبو. لا يَحجب شيئًا ولا يُنتظَر.
     ٢ · الشريط   — حين يتمّ وردُ اليومِ كلُّه. لوحٌ صغيرٌ يمرّ أعلى
                    الشاشة ثمّ يذهب. يومِيٌّ، فلا يملك الشاشة.
     ٣ · المقام   — المحطّاتُ الكبرى: جزءٌ يُختَم، سورةٌ تتمّ، منهجٌ
                    يكتمل، أربعون يومًا متّصلة. هذه تَستحقّ الشاشةَ
                    كلَّها لثوانٍ، ولا تتكرّر لأنّها لا تتكرّر.

   ولا لونَ حرفيٌّ: الخَتْمُ بلونِ نوعِه (‎--kind‎ يُورَث من صنف ‎.k-*‎)،
   والمقامُ بالذهب لأنّه لا يخصّ منهجًا بعينه بل الطريقَ كلَّه.

   والحركةُ كلُّها داخلَ ‎(prefers-reduced-motion:no-preference)‎، ومَن
   طلب السكونَ فله اللحظةُ نفسُها ساكنةً: يَظهر الضوءُ ويَثبُت ويذهب،
   فلا يُحرَم الفرحَ مَن كَرِه الحركة.
   ═══════════════════════════════════════════════════════════════════ */

#j-layer{
  position:fixed; inset:0; z-index:120;
  pointer-events:none;
  /* الطبقةُ لا تَلتقط لمسًا إلّا حيث يُطلَب ذلك صراحةً (المقام) */
}

/* ═════════ ١ · الخَتْم ═════════
   مِرساةٌ بلا مساحةٍ تُوضع على مركزِ الزرِّ الذي لُمس، وأبناؤها
   يتوسّطونها بـ‎translate‎ — فلا يُحسب عرضٌ ولا ارتفاعٌ في جافاسكربت. */
/* ‎left‎ لا ‎inset-inline-start‎: هذا إحداثيٌّ مقيسٌ من حافّةِ النافذةِ
   اليسرى بـ‎getBoundingClientRect‎، فلو انعكس مع الاتّجاه لَوقع الضوءُ
   في الجهة المقابلةِ من الشاشة. */
.j-seal{ position:absolute; width:0; height:0 }
.j-seal > *{ position:absolute; left:0; top:0; translate:-50% -50% }

.j-ring{
  border-radius:var(--r-pill);
  border:2.5px solid var(--kind);
  opacity:0;
}
/* الحلقةُ الثانيةُ أوسعُ وأرقُّ وبالذهب: الذهبُ هو لونُ «تمّ» في
   التطبيق كلِّه، فيَلحق لونَ النوعِ ولا يَسبقه. */
.j-ring.j-r2{ border-width:1.5px; border-color:var(--gold) }
.j-ring.j-r3{ border-width:1px; border-color:var(--kind) }

/* الوهجُ يُمزَج من لون النوع لا من ‎--kind-dim‎: ذاك مُعَدٌّ خلفيّةَ
   شارةٍ صغيرةٍ (‎.15‎) فيَذوب في مساحةٍ عرضُها مئةٌ وخمسون. والمزجُ
   يَصلح للأرضَين: لونُ النوعِ غامقٌ على الورق فاتحٌ في الليل. */
.j-glow{
  border-radius:var(--r-pill);
  background:radial-gradient(circle,
    color-mix(in srgb, var(--kind) 42%, transparent) 0%, transparent 66%);
  opacity:0;
}
/* الشَّرارة: ذهبٌ لأنّ الذهبَ وحدَه يُرى على الأرضَين — فاتحٌ في
   الليل غامقٌ على الورق — فلا يَضيع الوميضُ في إحداهما. */
.j-spark{
  border-radius:var(--r-pill);
  background:radial-gradient(circle,
    color-mix(in srgb, var(--gold) 62%, transparent) 0%, transparent 70%);
  opacity:0;
}
/* ‎max-width:none‎ لازمة: الهيكلُ يَقضي ‎img,svg{max-width:100%}‎،
   ومِرساةُ الخَتْمِ عرضُها صفرٌ — فكانت الشُّعاعاتُ تُرسَم في صفرِ
   بكسلٍ ولا تُرى، والحجمُ مكتوبٌ في الوَسْم ولا يُسأل عنه أحد. */
.j-rays{ width:184px; height:184px; max-width:none; color:var(--gold); opacity:0 }
.j-rays line{ stroke:currentColor; stroke-width:1.15; stroke-linecap:round }

/* ═════════ ٢ · الشريط ═════════
   أعلى الشاشةِ لا أسفلَها: الإشعارُ العابرُ ‎#toast‎ يسكن القاعَ، ولو
   التقيا لتزاحما على سطرٍ واحد. ولا يَلتقط لمسًا: خبرٌ يمرّ لا بابٌ. */
.j-band{
  position:absolute;
  inset-inline:var(--pad);
  top:calc(env(safe-area-inset-top) + 14px);
  margin-inline:auto;
  width:fit-content;
  max-width:min(430px, calc(100% - var(--pad) * 2));
  display:flex; align-items:center; gap:12px;
  padding:11px 16px;
  border-radius:var(--r-pill);
  background:var(--surface);
  border:1px solid var(--gold-soft);
  box-shadow:0 14px 34px -16px var(--shade-3), var(--lift);
  opacity:0;
}
/* خَتْمُ الشريطِ ثلاثون بكسلًا في مربّعِ مئة، فخَطٌّ سُمكُه ‎.9‎ يخرج
   رُبعَ بكسلٍ على الشاشة — أي لا شيء. يُغلَّظ هنا وحدَه. */
.j-band .j-bs{ flex:none; width:32px; height:32px; color:var(--gold) }
.j-band .j-arc{ stroke-width:2.6 }
.j-band .j-arc.j-lit{ stroke-width:3 }
.j-band .j-core{ stroke-width:2 }
.j-band .j-bt{ min-width:0 }
.j-band b{ display:block; font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.4 }
.j-band i{ display:block; margin-top:1px; font-size:12.5px; font-style:normal; color:var(--ink-mut) }

/* ═════════ ٣ · المقام ═════════ */
.j-plate{
  position:absolute; inset:0;
  pointer-events:auto;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:30px var(--pad);
  text-align:center;
}
/* الأرضُ تُحجب حجبًا تامًّا: المقامُ لحظةٌ واحدةٌ لا يُقرأ معها شيءٌ
   آخر، ولو بقيت الشاشةُ خلفه لانقسم النظرُ بين اثنين. ولا شفافيّةَ
   جزئيّةٌ هنا: جُرِّبت ‎.95‎ فنفَذ منها نصفُ الشاشةِ إلى العين. */
.j-scrim{ position:absolute; inset:0; background:var(--ground) }
.j-aura{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 36%, var(--gold-soft), transparent 64%);
}
.j-body{
  position:relative;
  display:flex; flex-direction:column; align-items:center;
  max-width:23em;
}
.j-big{ display:block; width:174px; height:174px; color:var(--gold) }
.j-arc{ fill:none; stroke:currentColor; stroke-width:.9; stroke-linejoin:round }
.j-arc.j-lit{ stroke:var(--gold-lit); stroke-width:1.1 }
.j-core{ fill:var(--gold-soft); stroke:var(--gold); stroke-width:.7 }
.j-num{
  fill:var(--gold-lit); font-family:inherit; font-weight:800;
  font-size:25px; font-variant-numeric:tabular-nums;
}

.j-t{
  margin:22px 0 0;
  font-size:27px; line-height:1.4; font-weight:800; color:var(--ink);
  overflow-wrap:anywhere;
}
.j-l{ margin:11px 0 0; font-size:15.5px; line-height:1.85; color:var(--ink-mut) }
.j-also{ margin:14px 0 0; font-size:13px; line-height:1.7; color:var(--ink-faint) }
.j-go{
  margin-top:26px;
  display:inline-flex; align-items:center; justify-content:center;
  min-height:var(--tap); min-width:132px; padding:12px 26px;
  border:1px solid var(--gold); border-radius:var(--r-pill);
  background:transparent; color:var(--ink);
  font:inherit; font-size:15px; font-weight:700; cursor:pointer;
}
.j-go:hover{ background:var(--gold-soft) }
.j-plate :focus-visible{ outline:2.5px solid var(--gold-lit); outline-offset:3px }

/* ═════════ الحركة ═════════ */
@media (prefers-reduced-motion:no-preference){
  /* الخَتْم: حلقةٌ تَنفَرج ووهجٌ يَتّسع وشُعاعاتٌ تَمتدّ. والبدءُ من
     قُرب الإصبعِ لا من بعيد، فيُقرأ أنّه أثرُ اللمسةِ نفسِها. */
  /* الهبوطُ مكسورٌ بمفتاحٍ في المنتصف لا متروكٌ لمنحنى ‎--ease‎ وحدَه:
     ذاك منحنًى مُقدَّمُ الوثبة (y₁=٫٩) فيذهب الضوءُ قبل أن تَبلغه
     العين — قِيس فإذا هو عند الخُمس الأوّل قد فَقَدَ أربعةَ أخماسه. */
  @keyframes j-ring{ 0%{ scale:.22; opacity:0 } 10%{ opacity:1 } 55%{ opacity:.6 }
                     100%{ scale:1; opacity:0 } }
  @keyframes j-glow{ 0%{ scale:.32; opacity:0 } 12%{ opacity:1 } 55%{ opacity:.62 }
                     100%{ scale:1; opacity:0 } }
  @keyframes j-spark{ 0%{ scale:.24; opacity:0 } 16%{ opacity:1 } 100%{ scale:1; opacity:0 } }
  @keyframes j-rays{ 0%{ scale:.5; opacity:0 } 22%{ opacity:1 } 60%{ opacity:.55 }
                     100%{ scale:1.18; opacity:0 } }
  .j-ring{ animation:j-ring .95s cubic-bezier(.2,.6,.35,1) both }
  .j-ring.j-r2{ animation-duration:1.15s; animation-delay:.08s }
  .j-ring.j-r3{ animation-duration:1.35s; animation-delay:.16s }
  .j-glow{ animation:j-glow 1s cubic-bezier(.2,.6,.35,1) both }
  .j-spark{ animation:j-spark .52s cubic-bezier(.2,.6,.35,1) both }
  .j-rays{ animation:j-rays 1s cubic-bezier(.2,.6,.35,1) both }

  /* الشريط: ينزل من فوقُ ويَثبُت ثمّ يَصعَد — نزولٌ لأنّه خبرٌ وارد */
  @keyframes j-band{
    from{ opacity:0; translate:0 -22px }
    14%{ opacity:1; translate:0 0 }
    84%{ opacity:1; translate:0 0 }
    to{ opacity:0; translate:0 -10px }
  }
  .j-band{ animation:j-band var(--j-hold,2.3s) var(--ease) both }

  /* المقام: الأرضُ تَغشى أوّلًا، ثمّ يُرسَم الخَتْمُ خطًّا خطًّا، ثمّ
     يَطلع الكلام. الترتيبُ هو المعنى: يُفتَح البابُ ثمّ يُقال. */
  @keyframes j-fade{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes j-up{ from{ opacity:0; translate:0 14px } to{ opacity:1; translate:0 0 } }
  @keyframes j-draw{ from{ stroke-dashoffset:1 } to{ stroke-dashoffset:0 } }
  @keyframes j-bloom{ from{ opacity:0; scale:.72 } to{ opacity:1; scale:1 } }
  .j-scrim{ animation:j-fade .3s linear both }
  .j-aura{ animation:j-fade .9s var(--ease) both }
  .j-big{ animation:j-bloom .62s var(--ease) both }
  .j-big .j-arc{ stroke-dasharray:1; animation:j-draw .9s var(--ease) both }
  .j-big .j-core,.j-big .j-num{ animation:j-fade .5s var(--ease) .5s both }
  .j-t{ animation:j-up .5s var(--ease) .34s both }
  .j-l{ animation:j-up .5s var(--ease) .44s both }
  .j-also{ animation:j-up .5s var(--ease) .54s both }
  .j-go{ animation:j-up .5s var(--ease) .66s both }
  .j-go{ transition:background var(--fast) var(--ease) }
}

/* ── مَن طلب السكون ──
   لا تُحذَف اللحظةُ بل تُجرَّد من الحركة: يَظهر الضوءُ تامًّا في
   موضعه، ويُقرأ الكلامُ، ثمّ يذهب الكلُّ. والمُدّةُ تُدار من
   جافاسكربت لا من انتقالٍ، لأنّ الانتقالاتِ مُلغاةٌ هنا أصلًا. */
@media (prefers-reduced-motion:reduce){
  .j-ring{ opacity:.6 }
  .j-ring.j-r2,.j-ring.j-r3{ opacity:.34 }
  .j-glow{ opacity:.78 }
  .j-spark{ opacity:.5 }
  .j-rays{ opacity:.8 }
  .j-band{ opacity:1 }
}

/* الشاشةُ القصيرة: الخَتْمُ الكبيرُ يَنكمش لئلّا يُزاحم الكلام */
@media (max-height:680px){
  .j-big{ width:132px; height:132px }
  .j-t{ margin-top:16px; font-size:23px }
  .j-go{ margin-top:18px }
}

/* ══ خَتْمُ المحطّةِ الكبرى ══
   زرٌّ ثانٍ بجوارِ «واصِل»، أخفتُ منه: «واصِل» هو الطريقُ والخَتْمُ
   أثرٌ على جانبه. ولو تساويا لَتردّد مَن لا يُريد إلّا أن يُكمل.
   ومارجنُه العلويُّ أصغرُ لأنّه تابعٌ لا سطرٌ جديد. */
.j-keep{
  margin-top:10px;
  min-width:0; padding:11px 20px;
  border-color:var(--hair-2); color:var(--ink-mut);
  font-size:13.5px;
}
@media (prefers-reduced-motion:no-preference){
  .j-keep{ animation:j-up .5s var(--ease) .78s both }
}

/* ══ 63-calm.css ══ */
/* ══ 63-calm.css — هيئةُ موضعِ القراءة ════════════════════════════
   شاشةٌ واحدةٌ في التطبيقِ لا تُشبه سائرَه: لا بطاقاتٍ ولا أزرارَ
   مُلوّنةٍ ولا شيءَ يَعلو النصّ. ولذلك هيئتُها هنا على حِدَة. */

/* الصحيفةُ التي فيها الصفحةُ تَبدأ من حافّةِ الشاشة: الحاشيةُ العليا
   تُزاح لتَبلغَها الحافّةُ اللاصقةُ فتَثبُت فوق النصِّ حيثما نزل. */
#sheet:has(.qp) #sheet-body{ padding-block-start:0 }

.qp{
  --qp-size:22px;                     /* يُكتب من الشيفرةِ عند الرسم */
  --qp-lead:2.5;
  /* ورقٌ لا أرض: رفعةٌ يسيرةٌ عن أرضِ التطبيق تُعرّف حقلَ القراءة،
     وتَلطُف في الليلِ حِدّةَ مِدادٍ أبيضَ على سوادٍ خالص. */
  --qp-paper:color-mix(in srgb, var(--surface) 55%, var(--ground));
  padding-block-end:10px;
}

/* ── الحافّةُ العليا ──
   تَسكن حين تَبدأ القراءةُ ولا تُمحى: مَن ضغط Tab وجدها، وقارئُ
   الشاشةِ يَقرؤها، واليدُ وحدَها لا تَصطدم بها. */
.qp-top{
  position:sticky; top:0; z-index:5;
  margin-inline:calc(var(--pad) * -1);
  background:var(--ground);
  border-block-end:1px solid var(--hair-2);
}
.qp-bare .qp-top{ opacity:0; transform:translateY(-6px); pointer-events:none }
.qp-bare .qp-top:focus-within{ opacity:1; transform:none; pointer-events:auto }

.qp-rail{ display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 5px) 8px 5px }
.qp-ic{
  flex:0 0 auto; width:46px; height:46px;
  display:flex; align-items:center; justify-content:center; gap:2px;
  background:none; border:0; border-radius:var(--r-pill);
  color:var(--ink-mut); font:inherit; cursor:pointer;
}
/* ضابطُ الحرفِ يُسمّي نفسَه بنفسِه: ألِفٌ صغيرةٌ وأخرى كبيرةٌ تَقولان
   ما يَفعل الزرُّ بلا أيقونةٍ تُحفَظ ولا كلمةٍ تُزاحم. */
.qp-az{ align-items:baseline; gap:5px; letter-spacing:0 }
.qp-a1{ font-size:13.5px; font-weight:800; line-height:1 }
.qp-a2{ font-size:21px; font-weight:800; line-height:1 }
.qp-where{ flex:1 1 auto; min-width:0; text-align:center }
.qp-sur{ font-size:15px; font-weight:800; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.qp-meta{ font-size:12.5px; color:var(--ink-mut) }

/* ── ضابطُ الحرف: في الصفحةِ نفسِها ──
   يُجرَّب الحجمُ على النصِّ الذي يُقرأ لا على وصفِه في شاشةِ إعدادات. */
.qp-sizebox{ padding:8px var(--pad) 13px; border-block-start:1px solid var(--hair-2) }
.qp-size-row{ display:flex; align-items:center; gap:10px }
.qp-step{
  flex:0 0 auto; min-width:58px; height:48px;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--hair); border-radius:var(--r-md);
  font:inherit; font-weight:800; cursor:pointer;
}
.qp-step-s{ font-size:15px }
.qp-step-l{ font-size:25px }
.qp-step[disabled]{ opacity:.4; cursor:default }
.qp-size-val{ flex:1 1 auto; text-align:center;
  font-size:13.5px; font-weight:700; color:var(--ink) }
.qp-size-note{ margin:9px 2px 0; font-size:12px; color:var(--ink-faint) }

/* ── الورقة ──
   تَمتدّ إلى حافّتَي الشاشة: الحرفُ الكبيرُ يَحتاج كلَّ ما يَجده من
   عَرْض، وهامشٌ مزدوجٌ (حاشيةُ الصحيفةِ ثمّ حاشيةُ البطاقة) يَخنقه. */
.qp-paper{
  margin-inline:calc(var(--pad) * -1);
  padding:20px 14px 24px;
  background:var(--qp-paper);
  border-block-end:1px solid var(--hair-2);
}
.qp-text{
  font-size:var(--qp-size);
  line-height:var(--qp-lead);
  text-align:justify;
  color:var(--ink);
}

/* رقمُ الآيةِ وما جاوره يُقاسُ بالحرفِ لا بالبكسل: تكبيرُ النصِّ لا
   يَترك رقمًا صغيرًا وحيدًا في وسطِ سطرٍ كبير. */
.qp-num{
  display:inline-block; min-width:1.6em; margin-inline:.2em;
  padding:0 .3em; border-radius:var(--r-pill);
  background:var(--gold-soft); color:var(--gold-lit);
  font-size:.55em; font-weight:800; line-height:1.85;
  vertical-align:.1em;
}
.qp-sajda{
  margin-inline-start:.25em; padding:.05em .45em; border-radius:var(--r-pill);
  background:var(--accent-soft); color:var(--accent);
  font-size:.52em; font-weight:800; vertical-align:.12em;
}

/* اسمُ السورةِ حيث تَبدأ: في آخرِ المصحفِ ثلاثُ سورٍ في صفحةٍ واحدةٍ
   تَتوالى بلا فاصل، فيُقرأ آخِرُ هذه موصولًا بأوّلِ تلك. */
.qp-sura{
  display:flex; align-items:center; gap:.7em;
  margin-block:1.1em .7em;
  color:var(--gold-lit);
  font-size:.72em; font-weight:800; line-height:1.7;
}
.qp-sura::before, .qp-sura::after{
  content:''; flex:1 1 0; height:1px; background:var(--gold-soft);
}
.qp-sura > span{ flex:0 0 auto }
.qp-text > .qp-sura:first-child{ margin-block-start:.1em }

/* رسمُ المدينة: السطرُ يُمدّ بين الحافّتَين كما في المصحف. ولا يَتبع
   الحرفَ في كبرِه إلّا إلى حدّ — السطرُ فيه ثابتُ الكلماتِ لا
   يَنكسر، فإن جاوز عَرْضَ الشاشةِ خرج عنها. */
.qp-madani{
  font-size:min(calc(var(--qp-size) * 1.22), 28px);
  line-height:2.05; color:var(--ink); direction:rtl;
}
.qp-line{ display:flex; justify-content:space-between; white-space:nowrap }
.qp-line.qp-head{ justify-content:center; color:var(--gold-lit) }

/* ── الذيل: ما يُحتاج بعد الفراغِ من الصفحة ── */
.qp-foot{ margin-block-start:16px }
.qp-slot{ margin-block-end:14px }
.qp-slot:empty{ display:none }

.qp-shabih{
  display:flex; align-items:center; gap:9px; width:100%;
  min-height:48px; padding:12px 4px;
  background:none; color:var(--ink-mut);
  border:0; border-block-end:1px solid var(--hair-2);
  font:inherit; font-size:13.5px; font-weight:700; text-align:start; cursor:pointer;
}
.qp-shabih .ico{ color:var(--warn); flex:0 0 auto }

.qp-turn{ display:flex; gap:10px; margin-block-start:14px }
.qp-nb{
  flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:7px;
  min-height:50px; background:none; color:var(--ink);
  border:1px solid var(--hair); border-radius:var(--r-lg);
  font:inherit; font-size:14px; font-weight:700; cursor:pointer;
}
.qp-nb[disabled]{ opacity:.38; cursor:default }
.qp-nb.qp-next .ico{ transform:scaleX(-1) }

.qp-mark{ margin:12px 0 0; text-align:center; font-size:12px; color:var(--ink-faint) }
.qp-wait{ margin:10px 2px 0; text-align:center; font-size:12px; color:var(--ink-faint) }

/* الحركةُ كلُّها مشروطةٌ بألّا يُطلَب تقليلُها: سكونُ الحافّةِ يَقع
   بلا انزلاقٍ عند من طَلب، ويقع. */
@media (prefers-reduced-motion:no-preference){
  .qp-top{ transition:opacity var(--mid) var(--ease), transform var(--mid) var(--ease) }
  .qp-paper{ animation:qp-settle var(--mid) var(--ease) }
  @keyframes qp-settle{ from{ opacity:.4 } to{ opacity:1 } }
}

/* آخِرُ كلمةٍ ورقمُها وحدةٌ واحدة: لا يُكسَر بينهما سطر */
.qp-end{ white-space:nowrap }

/* الحرفُ الكبيرُ على شاشةِ هاتفٍ لا يَسع السطرُ معه إلّا ثلاثَ كلماتٍ
   أو أربعًا، فمدُّ السطرِ بينهنّ يَفتح فُرَجًا تَشقّ الكتلة. */
.qp-loose .qp-text{ text-align:start }

/* ══ 76-exam.css ══ */
/* ══ 41-exam.css — كِسوةُ مُولِّدِ الاختبار ═══════════════════════
   ورقةٌ من التطبيق (كانت كسوةً تُجرَّب، فأُقِرّت). (انظر skin/10-system.css).

   ثلاثةُ أصولٍ تَحكُم ما هنا:

   ١ — **النصُّ القرآنيُّ أرضُه وحدَه.** ما حولَه يَخفُت: السؤالُ
       صغيرٌ مكتومٌ، والآيةُ فسيحةُ السطرِ بلونِ المِداد. والسطرُ
       فسيحٌ ٢٫٣ لأنّ الحركاتِ تَعلو وتَسفُل، ويُبدأ من الحافّةِ ولا
       يُمَدّ: المَدُّ يُباعد الكلماتِ فتُقرأ الآيةُ شَتاتًا.

   ٢ — **لا لونَ يَحمل معنًى وحدَه.** الصوابُ والخطأُ يُعلَّمان
       بحافّةٍ وبكلمةٍ معًا، فمن لم يُفرّق اللونَين قرأ الكلمة.
       والألوانُ المستعملةُ ‎--ok‎ و‎--danger‎ وهما مقيستان في
       الهويّتَين وفي النهارِ والليلِ في ‎15-theme.css‎.

   ٣ — **لا حركةَ تَحتفل.** الجوابُ يَظهر ولا يَقفز، ولا شيءَ
       يَنبض. وما بقي من انتقالٍ يَسقط تحت ‎prefers-reduced-motion‎. */

/* ── الهيكلُ العامّ ─────────────────────────────────────────────── */
.ex{ gap:0 }
.ex-body{ display:flex; flex-direction:column; gap:16px }

.ex-head{ padding-block:2px 2px }
.ex-lede{
  margin-block-start:7px;
  font-size:13px; line-height:1.85; color:var(--ink-mut);
}

/* ── الاقتراح: البطاقةُ الوحيدةُ التي تَحمل ذهبًا، لأنّها المَدخلُ
   الذي يُقصَد أوّلًا ─────────────────────────────────────────── */
.ex-sug{
  display:flex; flex-direction:column; gap:7px;
  padding:14px 15px;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--hair), var(--lift);
}
.ex-sug-t{
  font-size:11.5px; font-weight:800; letter-spacing:.02em;
  color:var(--gold-lit);
}
.ex-sug-l{ font-size:17px; font-weight:800; color:var(--ink) }
.ex-sug-w{ font-size:12.5px; line-height:1.8; color:var(--ink-mut) }
.ex-sug .btn{ margin-block-start:5px }

.ex-or{
  margin-block-start:2px;
  font-size:12px; font-weight:700; color:var(--ink-faint);
}

/* ── مجموعاتُ الاختيار ──────────────────────────────────────── */
.ex-grp{ display:flex; flex-direction:column; gap:9px }
.ex-lbl{ font-size:12px; font-weight:700; color:var(--ink-mut) }
.ex-chips{ display:flex; flex-wrap:wrap; gap:8px }
.ex-chip{ flex:1 1 auto; font-size:13.5px; padding-inline:14px }
/* شبكةُ الأجزاء: ثلاثون رقمًا لا تُصَفّ صفًّا، ولا تَصلح لها
   ‎flex:1‎ وإلّا مُطّ الصفُّ الأخيرُ على عرضِ الشاشة. */
.ex-nums{ display:grid; grid-template-columns:repeat(6, 1fr); gap:7px }
.ex-nums .ex-chip{
  flex:none; min-width:0; padding-inline:0;
  font-size:14px; font-variant-numeric:tabular-nums;
}
.ex-sel{ width:100%; min-height:var(--tap); font-size:15px }

/* ── ترويسةُ الجلسة ────────────────────────────────────────────── */
.ex-top{
  display:flex; align-items:flex-start; gap:10px;
  padding-block-end:10px;
  border-bottom:1px solid var(--hair);
}
.ex-tt{ flex:1 1 auto; min-width:0 }
.ex-pos{ display:block; font-size:16px; font-weight:800; color:var(--ink) }
.ex-meta{ margin-block-start:3px; font-size:12.5px; color:var(--ink-mut) }

/* ── بطاقةُ السؤال ─────────────────────────────────────────────── */
.ex-card{
  padding:var(--pad);
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:0 1px 2px -1px var(--shade-1),
             0 14px 30px -20px var(--shade-3), var(--lift);
}
.ex-ask{
  font-size:14px; font-weight:700; line-height:1.75; color:var(--ink-mut);
}
.ex-lead{ display:flex; flex-direction:column; gap:10px; margin-block-start:13px }
.ex-from{ margin-block-start:10px; font-size:12px; color:var(--ink-faint) }

.ex-ayah{
  font-size:20px; line-height:2.3; text-align:start; color:var(--ink);
}

/* ── الخيارات ──────────────────────────────────────────────────
   الخيارُ بطاقةٌ كاملةٌ لا سطرٌ بجوارِ دائرة: الآيةُ تَحتاج عرضَ
   السطرِ كلِّه، والبطاقةُ هدفُ لمسٍ فسيحٌ لا يُطلَب فيه تصويبُ
   إصبع. */
.ex-opts{ display:flex; flex-direction:column; gap:10px }
.ex-opt{
  display:block; width:100%; text-align:start;
  padding:13px 14px;
  min-height:var(--tap);
  border:0; border-radius:var(--r-md);
  background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--hair), var(--lift);
  font:inherit; color:var(--ink); cursor:pointer;
  transition:box-shadow var(--fast) var(--ease);
}
.ex-opt:hover{ box-shadow:inset 0 0 0 1px var(--ink-faint), var(--lift) }
.ex-opt:active{ scale:.99 }
.ex-opt[disabled]{ cursor:default; opacity:1 }
.ex-opt[disabled]:active{ scale:1 }
.ex-opt-l{ font-size:16px; font-weight:700; color:var(--ink) }
.ex-opt .ex-ayah{ font-size:19px }

/* الحافّةُ علامةٌ، والسِّمةُ كلمة. ولا أرضيّةَ مصبوغةٌ تحتَ آية:
   النصُّ القرآنيُّ لا يُطلى بأخضرَ ولا أحمر. */
.ex-opt.is-ok{ box-shadow:inset 0 0 0 2px var(--ok), var(--lift) }
.ex-opt.is-no{ box-shadow:inset 0 0 0 2px var(--danger), var(--lift) }
.ex-tag{
  display:inline-block; margin-block-start:9px;
  padding:2px 10px; border-radius:var(--r-pill);
  font-size:11.5px; font-weight:800;
  background:var(--sunk, var(--surface-2)); color:var(--ink-mut);
}
.ex-opt.is-ok .ex-tag{ color:var(--ok) }
.ex-opt.is-no .ex-tag{ color:var(--danger) }

/* ── الحكمُ بعد الجواب ─────────────────────────────────────────── */
.ex-verd{
  display:flex; flex-direction:column; gap:6px;
  padding:13px 14px;
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--lift);
  border-inline-start:3px solid var(--danger);
}
.ex-verd.is-ok{ border-inline-start-color:var(--ok) }
.ex-verd-t{ font-size:15px; font-weight:800; color:var(--ink) }
.ex-verd-w{ font-size:12.5px; color:var(--ink-mut) }
.ex-verd-k{ font-size:11.5px; color:var(--ink-faint) }
.ex-verd-a{
  display:flex; align-items:center; gap:10px; margin-block-start:8px;
}
.ex-next{ margin-inline-start:auto; min-height:var(--tap) }

/* ── النتيجة ───────────────────────────────────────────────────── */
.ex-juz{ display:flex; flex-direction:column; gap:1px }
.ex-jrow{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:11px 13px;
  background:var(--surface);
  box-shadow:var(--lift);
}
.ex-juz > .ex-jrow:first-child{
  border-start-start-radius:var(--r-md); border-start-end-radius:var(--r-md);
}
.ex-juz > .ex-jrow:last-child{
  border-end-start-radius:var(--r-md); border-end-end-radius:var(--r-md);
}
.ex-jn{ font-size:14px; font-weight:700; color:var(--ink) }
.ex-js{
  font-size:13px; font-weight:800; color:var(--ink-mut);
  font-variant-numeric:tabular-nums;
}
/* الجزءُ التامُّ يُعلَّم بالمميِّزِ لا بالأخضرِ الصريح: هذا خبرٌ
   هادئٌ لا احتفال. */
.ex-jrow.is-full .ex-js{ color:var(--accent) }

.ex-advice{
  padding:12px 13px; border-radius:var(--r-md);
  background:var(--sunk, var(--surface-2));
  font-size:13.5px; line-height:1.85; color:var(--ink);
}

.ex-miss{ display:flex; flex-direction:column; gap:10px }
.ex-mrow{
  display:flex; flex-direction:column; align-items:flex-start; gap:7px;
  padding:12px 13px; border-radius:var(--r-md);
  background:var(--surface); box-shadow:var(--lift);
}
.ex-mk{ font-size:12px; font-weight:800; color:var(--ink-mut) }
.ex-mt{ font-size:17px; line-height:2.15 }

.ex-acts{ display:flex; flex-direction:column; gap:10px; margin-block-start:4px }

/* ── البابُ في «تقدُّمي» ──────────────────────────────────────── */
.ex-entry{ display:flex; flex-direction:column; gap:8px; margin-block-end:4px }
.ex-entry-n{ font-size:12.5px; line-height:1.7; color:var(--ink-mut) }

/* ── الهدوء ──────────────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  .ex-opt{ transition:none }
  .ex-opt:active{ scale:1 }
}

/* سطرُ الاقتراحِ في لوحِ «اختباري»: نصٌّ لا بطاقة. */
.ex-hint{ margin-block:6px 12px; color:var(--ink-mut) }

    root.appendChild(shell);
  }

  /* الاسمُ مكتوبٌ في الشعارِ نفسِه، وقارئُ الشاشةِ يَقرأ عنوانَ
     الصفحةِ بعدَه — فلو نُطق الشعارُ لَسُمع اسمُ التطبيقِ في صدر
     كلِّ صفحةٍ قبل ما جاء له صاحبُه. فهو زينةٌ للعينِ لا للأذن. */
  function brandBar() {
    /* ‎App.mark‎ تُكتَب بعد هذا العالَمِ في الملفِّ نفسِه، وتُنادى
       ههنا وقتَ الرسمِ لا وقتَ التعريف — فهي قائمةٌ حينئذٍ. */
    var A = window.App;
    var m = (A && A.mark) ? A.mark(72, 'brand-mk') : '';
    if (!m) return null;
    var d = el('div', 'brandbar');
    var logo = el('span', 'brand-logo');
    logo.setAttribute('aria-hidden', 'true');   /* الاسمُ في الصورةِ لا يُنطَق */
    logo.innerHTML = m;
    d.appendChild(logo);

    /* الإعداداتُ عن يسارِ الشعار: خرجت من الشريطِ السفليِّ ليَرجع
       إليه «حلقتي» — والشريطُ خمسةٌ لا يَزيد. وهي فعلٌ طرفيٌّ
       يُقصَد مرّةً في الشهر، فموضعُها الزاويةُ لا وسطُ الطريق.
       وأيقونتُها خطّان في كلٍّ منهما حلقة. */
    if (screens.settings) {
      var g = el('button', 'brand-set');
      g.type = 'button';
      g.innerHTML = icon('settings', 21);
      g.setAttribute('aria-label', 'الإعدادات');
      g.title = 'الإعدادات';
      g.onclick = function () { go('settings'); };
      if (current === 'settings') g.setAttribute('aria-current', 'page');
      d.appendChild(g);
    }
    return d;
  }

  function drawPane() {
    var s = screens[current];
    if (!s) { current = 'home'; s = screens[current]; }
    pane.innerHTML = '';
    /* الشعارُ في صدر كلِّ صفحةٍ رئيسة: سُئل «كيف نَعرف أنّ هذا
       التطبيقَ هو رتِّل وارتقِ؟» — ولم يكن له جوابٌ إلّا في شاشتَين.
       وموضعُه ههنا لا في كلِّ وحدةٍ على حِدَة: شيءٌ واحدٌ يَظهر في
       الخمسِ كلِّها بقَدْرٍ واحد، ولا يَسهو عنه من يُضيف شاشةً غدًا.
       ولا يَنزل على الصحائفِ لأنّها تُرسَم في غير هذا الموضع — فصفحةُ
       المصحفِ تَبقى للمصحفِ وحدَه. */
    var node = s.render(params);
    /* داخلَ الشاشةِ لا بجوارها: وحداتٌ أخرى تَعتمد أنّ أوّلَ ولدٍ
       في ‎#pane‎ هو الشاشة — فمُرشدي يَدسّ بطاقتَه فيه. فلمّا وُضع
       الشريطُ بجوارها صار هو «الشاشةَ» عندها، فنزلت البطاقةُ داخلَه
       وصارا صفًّا واحدًا والشعارُ في طرفه. */
    if (node && current !== 'onboard') {
      var bm = brandBar();
      if (bm) node.insertBefore(bm, node.firstChild);
    }
    if (node) pane.appendChild(node);
    window.scrollTo(0, 0);
    emit('drawn', { name: current });
  }

  function drawTabs() {
    if (!nav) return;
    nav.innerHTML = '';
    nav.style.display = S.profile ? '' : 'none';
    if (!S.profile) return;
    nav.style.gridTemplateColumns = 'repeat(' + tabs.length + ',1fr)';
    nav.setAttribute('role', 'tablist');
    tabs.forEach(function (t) {
      var on = t.name === current;
      var b = el('button', on ? 'on' : null,
        icon(t.icon, 23) + '<span>' + t.label + '</span>');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      /* غيرُ المختارِ يخرج من مسار Tab: الأسهمُ تنقّل بين الألسنة */
      b.tabIndex = on ? 0 : -1;
      b.onclick = function () { go(t.name); };
      b.onkeydown = function (e) {
        var i = tabs.indexOf(t);
        var n = e.key === 'ArrowLeft' ? i + 1 : e.key === 'ArrowRight' ? i - 1
              : e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : null;
        if (n === null) return;
        e.preventDefault();
        go(tabs[(n + tabs.length) % tabs.length].name);
        var nb = nav.children[(n + tabs.length) % tabs.length];
        if (nb) nb.focus();
      };
      nav.appendChild(b);
    });
  }

  /* ── الصحيفة ──────────────────────────────────────────────────── */
  var sheetEl, sheetBody;
  function ensureSheet() {
    if (sheetEl) return;
    sheetEl = el('div'); sheetEl.id = 'sheet';
    sheetEl.setAttribute('role', 'dialog');
    sheetEl.setAttribute('aria-modal', 'true');
    sheetBody = el('div'); sheetBody.id = 'sheet-body';
    sheetEl.appendChild(sheetBody);
    document.body.appendChild(sheetEl);
    /* المفتاحُ Escape يُغلق: لوحةُ المفاتيحُ طريقٌ قائمٌ لا تابعٌ للمس */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sheetName) { e.preventDefault(); closeSheet(); }
    });
  }

  function openSheet(name, p, quiet) {
    ensureSheet();
    var first = !sheetName;
    if (first) lastFocus = document.activeElement;
    sheetName = name; sheetParams = p || null;
    /* إعادةُ الرسم ليست تنقّلًا فلا تُبَثّ حدثَ route: كان البثُّ
       يُنبّه المستمعين كأنّ الطالبَ دخل من جديد، فتُصفّر الوحداتُ
       حالتَها الداخليّةَ وتُلقي ما اختاره قبل نبضةٍ واحدة. */
    if (!quiet) emit('route', { name: name, params: sheetParams, sheet: true });
    sheetBody.innerHTML = '';
    var node = screens[name].render(sheetParams);
    if (node) sheetBody.appendChild(node);
    sheetEl.classList.add('on');
    /* الصفحةُ تحتَها لا تُمرَّر: تمريرُ الخلفيّةِ تحت صحيفةٍ مفتوحةٍ
       يُفقد الطالبَ موضعَه حين تُغلق. */
    document.body.classList.add('sheet-open');
    if (shell) shell.setAttribute('aria-hidden', 'true');
    if (nav) nav.setAttribute('aria-hidden', 'true');
    sheetEl.scrollTop = 0;
    /* تحطّ البؤرةُ على الصحيفة لا على أوّل زرٍّ فيها: إحطاطُها على
       الزرِّ يرسم حولَه حلقةً لمن فتحها بإصبعه ولم يطلبها، ومع ذلك
       يدخلها قارئُ الشاشة ويبدأ الجدولُ من أوّلها. */
    sheetEl.tabIndex = -1;
    try { sheetEl.focus({ preventScroll: true }); } catch (e) { sheetEl.focus(); }
    emit('drawn', { name: name, sheet: true });
  }

  function closeSheet(silent) {
    if (!sheetName) return;
    sheetName = null; sheetParams = null;
    if (sheetEl) sheetEl.classList.remove('on');
    document.body.classList.remove('sheet-open');
    if (shell) shell.removeAttribute('aria-hidden');
    if (nav) nav.removeAttribute('aria-hidden');
    if (lastFocus && lastFocus.isConnected) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
    if (!silent) { emit('route', { name: current, params: params }); draw(); }
  }

  function draw() {
    if (!root) return;
    if (!S.profile) {                 /* الدخولُ الأوّل: لا هيكلَ ولا لسان */
      if (sheetName) closeSheet(true);
      root.innerHTML = ''; shell = pane = null;
      var o = screens.onboard.render(null);
      if (o) root.appendChild(o);
      if (nav) nav.style.display = 'none';
      emit('drawn', { name: 'onboard' });
      return;
    }
    if (!shell || !shell.isConnected) { root.innerHTML = ''; buildShell(); }
    if (!current || isSheet(current) || SOLO[current]) current = 'home';
    drawPane();
    drawTabs();
  }

  /* إعادةُ الرسم تُصيب ما هو أمام العين: الصحيفةَ إن كانت مفتوحة */
  function redraw() {
    if (sheetName) { openSheet(sheetName, sheetParams, true); return; }
    draw();
  }

  /* ── الأيقونات: تُسجَّل من وحدةٍ مستقلّة ───────────────────────── */
  var ICONS = {};
  function defIcons(map) { for (var k in map) ICONS[k] = map[k]; }
  function icon(k, size, cls) {
    var d = ICONS[k];
    if (!d) return '';
    return '<svg class="' + (cls || 'ico') + '" viewBox="0 0 24 24" width="' + (size || 22) +
      '" height="' + (size || 22) + '" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }

  /* ── إشعارٌ عابر ──────────────────────────────────────────────── */
  var toastEl;
  function toast(msg) {
    if (!toastEl) {
      toastEl = el('div'); toastEl.id = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('on'); }, 2600);
  }

  /* ── الهويّة البصريّة ─────────────────────────────────────────── */
  function applyIdentity() {
    var g = (S.profile && S.profile.gender) || 'm';
    document.documentElement.setAttribute('data-id', g);
    /* السِّمةُ محورٌ ثانٍ: الفاتحُ هو الأصل، والداكنُ يُطلَب.
       ولو تُركت لتفضيل الجهاز لرأى أكثرُ الناس الداكنَ وهم لم
       يختاروه — وهذا ما كان يُقرأ كآبةً. */
    var mode = (S.settings && S.settings.mode) === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-mode', mode);
    var meta = document.querySelector('meta[name="theme-color"]');
    /* لونُ شريطِ المتصفّح يُقرأ من اللوح نفسِه لا يُنسَخ يدويًّا:
       نسخةٌ يدويّةٌ تبقى على اللون القديم كلّما بُدّلت الهويّة. */
    if (meta) {
      var g2 = getComputedStyle(document.documentElement)
                 .getPropertyValue('--ground').trim();
      meta.setAttribute('content', g2 || (g === 'f' ? '#17121A' : '#08181A'));
    }
  }

  /* ── الإقلاع ──────────────────────────────────────────────────── */
  function boot(rootEl, navEl) {
    root = rootEl; nav = navEl;
    applyIdentity();
    go(S.profile ? 'home' : 'onboard');
  }

  return {
    /* الحالة */
    get state() { return S; }, save: save, reset: reset, uid: uid,
    /* مفاتيحُ عليا تَملكها وحداتٌ خارجَ النواة. الاستيرادُ يَحذف كلَّ
       مفتاحٍ لا يَعرفه — وهو صوابٌ يَمنع تلويثَ الحالةِ من ملفٍّ
       مستورَد — فكان سجلُّ الزللِ يَسقط صامتًا عند كلِّ استيراد.
       فتُسجَّل الوحدةُ مفتاحَها هنا بدل أن تُفتَح القائمةُ لكلِّ شيء. */
    ownState: function (k) { if (k && OWNED.indexOf(k) < 0) OWNED.push(k); },
    ownedKeys: function () { return OWNED.slice(); },
    /* إعارةُ الحالة: الحالةُ للقراءةِ من خارجِ النواةِ عمدًا، فلا
       تُكتب بالإسناد. وهذا البابُ الوحيدُ لتبديلها مؤقّتًا، ويُردُّ
       الأصلُ في finally مهما وقع — ولا يُحفَظ شيءٌ في أثنائه. */
    withState: function (tmp, fn) {
      var real = S;
      S = tmp;
      LENT++;
      try { return fn(); } finally { S = real; LENT--; }
    },
    /* أدوات */
    ar: ar, el: el, $: $, $$: $$, on: on,
    /* المصحف والتاريخ */
    Quran: Quran, hijri: hijri, greg: greg, dateKey: key,
    DAY_NAME: DAY_NAME, DAY_SHORT: DAY_SHORT, DAY_LETTER: DAY_LETTER,
    /* التنقّل */
    screen: screen, tab: tab, go: go, route: route, redraw: redraw,
    sheet: openSheet, closeSheet: closeSheet, isSheet: isSheet,
    /* الأيقونات والإشعار */
    defIcons: defIcons, icon: icon, toast: toast,
    /* الأحداث والهويّة */
    on_: sub, emit: emit, applyIdentity: applyIdentity,
    boot: boot
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   التبويبُ المنزلق
   ───────────────────────────────────────────────────────────────────
   الشاشةُ الطويلةُ تُمَطُّ فيضيع الطالبُ بين نزولٍ وصعود. التبويبُ
   يُبقي كلَّ قسمٍ على بُعد لمسةٍ واحدةٍ ولا يُحرّك الصفحة.

   ولا يُبنى المحتوى إلّا حين يُطلب: ثلاثةُ أقسامٍ تُبنى معًا تعني
   ثلاثةَ أضعافِ العمل في كلّ رسم، وشبكةُ اثني عشر أسبوعًا وحدَها
   ثمانيةٌ وأربعون ومئتا خليّة.

   والأسهمُ تُنقّل بين الألسنة كما يقضي معيارُ WAI-ARIA للتبويب،
   واليمينُ تَسبِق لأنّ الصفحةَ عربيّة.
   ═══════════════════════════════════════════════════════════════════ */
App.seg = function (items, opts) {
  opts = opts || {};
  var wrap = App.el('div', 'segwrap' + (opts.cls ? ' ' + opts.cls : ''));
  var list = App.el('div', 'seg');
  list.setAttribute('role', 'tablist');
  var pane = App.el('div', 'segpane');
  var btns = [], built = [], uid = 'sg' + Math.random().toString(36).slice(2, 7);
  var cur = -1;

  function show(i, focus) {
    if (i === cur) return;
    cur = i;
    btns.forEach(function (b, j) {
      var on = j === i;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      /* غيرُ المختارِ يخرج من مسار Tab: السهمُ ينقّل بينها لا الجدول */
      b.tabIndex = on ? 0 : -1;
      b.classList.toggle('on', on);
    });
    pane.innerHTML = '';
    if (!built[i]) {
      try { built[i] = items[i].render(); }
      catch (e) { built[i] = App.el('p', 'small', 'تعذّر عرضُ هذا القسم.'); }
    }
    if (built[i]) pane.appendChild(built[i]);
    pane.setAttribute('aria-labelledby', uid + '-' + i);
    if (focus) btns[i].focus();
    cap();
    if (opts.onchange) opts.onchange(items[i].key, i);
  }

  /* ── سقفُ اللوحِ على الشاشاتِ القصيرة ────────────────────────────
     القاعدةُ في ‎20-shell.css‎ تَقصُر اللوحَ على ما بقي من الشاشةِ بعدَ
     ما فوقَه وما تحته — وما فوقَه يختلف من شاشةٍ إلى شاشة: ترويسةٌ
     وحدَها هنا، وترويسةٌ وبطاقةُ هويّةٍ هناك. فيُقاس بعدَ التركيبِ ولا
     يُخمَّن بثابتٍ واحدٍ يَزيد على قومٍ ويَنقص عن آخرين.
     واللوحُ الداخليُّ يُترَك: انزلاقٌ في انزلاقٍ تشويشٌ. */
  function cap() {
    if (pane.parentNode && pane.parentNode.closest
        && pane.parentNode.closest('.segpane')) return;
    var measure = function () {
      if (!pane.isConnected) return;
      var app = document.getElementById('app');
      var pb = app ? parseFloat(getComputedStyle(app).paddingBottom) || 0 : 0;

      /* نسبةً إلى النافذةِ لا إلى الوثيقة. والسقفُ يُطرَح من ‎100dvh‎
         وهي ارتفاعُ النافذة، فلا يَصحّ أن يُقاس من أعلى الوثيقة.
         وكانت تُزاد ‎scrollY‎: فإذا فُتحت الشاشةُ من قائمةٍ مُمرَّرةٍ
         ولم يكن التمريرُ قد صَفَر بعدُ — وهو ما يَقع على آيفون لأنّ
         سفاري يُصفّره متأخّرًا — صار السقفُ أكبرَ من الشاشةِ كلِّها
         فانسحق اللوحُ إلى سطرٍ واحدٍ مقطوع. */
      var c = Math.ceil(pane.getBoundingClientRect().top + pb + 6);

      /* أرضيّةٌ لا يَنزل تحتها: أيُّ قياسٍ خاطئٍ يُفيض الصفحةَ ولا
         يُخفي شيئًا. والفيضُ يُمرَّر، والسحقُ لا حيلةَ فيه. */
      var vh = window.innerHeight || 0;
      if (vh && c > vh - 200) c = vh - 200;
      if (c < 0) c = 0;
      pane.style.setProperty('--pane-cap', c + 'px');
      more();
    };
    requestAnimationFrame(measure);
    /* قياسةٌ ثانيةٌ بعد أن يَستقرّ شريطُ المتصفّحِ وينتهي الانتقال */
    setTimeout(measure, 340);
  }

  /* هل تحت آخرِ سطرٍ سطر؟ شريطُ الانزلاقِ لا يَظهر على آيفون وهو
     ساكن، فيَظنّ القارئُ أنّ المقطوعَ هو المنتهى. فتُوضَع علامةٌ
     في حافّةِ اللوحِ السفلى ما دام فيه بقيّة. */
  function more() {
    if (!pane.isConnected) return;
    var rest = pane.scrollHeight - pane.clientHeight - pane.scrollTop;
    pane.classList.toggle('is-more', rest > 2);
  }

  items.forEach(function (it, i) {
    var b = App.el('button', 'seg-b');
    b.type = 'button';
    b.id = uid + '-' + i;
    b.setAttribute('role', 'tab');
    if (it.icon) b.innerHTML = App.icon(it.icon, 17);
    b.appendChild(document.createElement('span')).textContent = it.label;
    b.onclick = function () { show(i); };
    b.onkeydown = function (e) {
      var n = e.key === 'ArrowLeft' ? i + 1
            : e.key === 'ArrowRight' ? i - 1
            : e.key === 'Home' ? 0
            : e.key === 'End' ? items.length - 1 : null;
      if (n === null) return;
      e.preventDefault();
      show((n + items.length) % items.length, true);
    };
    btns.push(b);
    list.appendChild(b);
  });

  pane.setAttribute('role', 'tabpanel');
  pane.tabIndex = 0;
  wrap.appendChild(list);
  wrap.appendChild(pane);

  var start = 0;
  if (opts.start) {
    var k = items.map(function (x) { return x.key; }).indexOf(opts.start);
    if (k >= 0) start = k;
  }
  show(start);
  pane.addEventListener('scroll', more, { passive: true });
  wrap.recap = cap;                    /* لتُعاد القياسةُ عند تبدّلِ القياس */
  return wrap;
};

/* تبدُّلُ القياسِ يُبدِّل ما فوقَ اللوح: دورانُ الهاتفِ أو ظهورُ لوحةِ
   المفاتيحِ يُغيّر الشاشةَ، فتُعاد القياسةُ لكلِّ لوحٍ ظاهرٍ مرّةً. */
(function () {
  var t = 0;
  function recap() {
    clearTimeout(t);
    t = setTimeout(function () {
      [].slice.call(document.querySelectorAll('.segwrap')).forEach(function (w) {
        if (w.recap && w.isConnected) w.recap();
      });
    }, 120);
  }
  window.addEventListener('resize', recap);
  window.addEventListener('orientationchange', recap);
}());

/* ═══════════════════════════════════════════════════════════════════
   وصلُ الأجزاء بفاصلٍ لا يُلبِس
   ───────────────────────────────────────────────────────────────────
   «·» و«٠» صورتان لنقطةٍ واحدةٍ في العين عند حجم النصّ، فـ
   «في الجلسة · ٥ أيّام» تُقرأ «٥٠ أيّام». والمواضعُ التي يبدأ فيها
   الجزءُ التالي برقمٍ لا تُعرف وقتَ الكتابة — ratePhrase تُرجع
   «صفحتان» مرّةً و«٣ صفحات» أخرى — فيُحسم الفاصلُ عند الوصل لا عند
   التأليف: نقطةٌ وسطى بين كلمتَين، وفاصلةٌ عربيّةٌ قبل رقم.
   ═══════════════════════════════════════════════════════════════════ */
App.join = function () {
  var parts = [].slice.call(arguments).filter(function (x) {
    return x != null && String(x).trim() !== '';
  });
  return parts.reduce(function (acc, cur) {
    cur = String(cur).trim();
    /* المحارفُ غيرُ المرئيّةِ للاتّجاه تُتخطّى قبل الحكم على أوّل حرف */

    var tail = acc.replace(/[\s‎‏؜]+$/, '').slice(-1);
    function digit(c) { return c >= '٠' && c <= '٩'; }

    return acc + (digit(head) || digit(tail) ? '، ' : ' · ') + cur;
  });

/* ‎size‎ ضلعُ المربّعِ الذي يَسَعُ الشعار، لا عرضُه: يَدخل فيه
   بنسبتِه كاملةً، فيَستوي الموضعُ سواءٌ أكان الشعارُ كلمةً عريضةً
   أم خاتمًا مربّعًا. */
App.mark = function (size, cls) {
  var m = App.MARK;
  if (!m) return '';
  var px = size || 72;
  var r = (m.w && m.h) ? m.w / m.h : 1;
  var w = r >= 1 ? px : Math.round(px * r);
  var h = r >= 1 ? Math.round(px / r) : px;
  var c = 'appmark ' + (cls || 'mark');
  if (m.svg) {
    return '<span class="' + c + '" aria-hidden="true" style="width:'
      + w + 'px;height:' + h + 'px">' + m.svg + '</span>';
  }
  /* الصورةُ بلا نصٍّ بديل: الشعارُ زينةٌ، واسمُ التطبيق مكتوبٌ بجانبه */
  return '<span class="' + c + '" aria-hidden="true">'
    + '<img src="' + m.src + '" alt="" width="' + w + '" height="' + h
    + '" decoding="async"></span>';
};

/* ══ 05-plans.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   منطقُ المناهج
   ───────────────────────────────────────────────────────────────────
   الحسابُ هنا وحدَه. الوحداتُ تعرض ولا تحسب، فإن تغيّرت القاعدةُ يومًا
   تغيّرت في موضعٍ واحد.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* cls صنفُ لونِ النوع، معرَّفٌ في 15-theme.css: مَن لبسه وَرِثَ
     أبناؤه --kind فلا يُكتب لونٌ حرفيٌّ في وحدةٍ قطّ. */
  var KINDS = {
    hifz:    { t: 'حفظ',    d: 'صفحاتٌ جديدةٌ تُضاف إلى صدرك', icon: 'hifz',    cls: 'k-hifz'    },
    review:  { t: 'مراجعة', d: 'دورةٌ تعود على ما حفظتَ',      icon: 'review',  cls: 'k-review'  },
    tilawa:  { t: 'تلاوة',  d: 'قراءةٌ متّصلةٌ بلا حفظ',        icon: 'tilawa',  cls: 'k-tilawa'  },
    tathbit: { t: 'تثبيت',  d: 'إحكامُ ما تحفظه حتّى يرسخ',     icon: 'tathbit', cls: 'k-tathbit' }
  };
  /* صنفُ النوعِ لمنهجٍ ما، مُعتصمًا من نوعٍ مجهولٍ جاء من ملفٍّ مستورَد */
  function kindCls(p) {
    var k = KINDS[p && p.kind];
    return k ? k.cls : 'k-hifz';
  }

  /* يُحرَس من الفساد: منهجٌ مستورَدٌ ناقصُ from أو to كان يُخرج NaN
     فيُطبع «من NaN صفحة» على الشاشة. الصفرُ خبرٌ صادقٌ، وNaN عطب. */
  function total(p) {
    var f = +p.from, t = +p.to;
    if (!isFinite(f) || !isFinite(t)) return 0;
    return Math.max(0, t - f + 1);
  }
  function pct(p) {
    var t = total(p);
    return t ? Math.min(100, Math.round((p.done || 0) / t * 100)) : 0;
  }

  /* الخِتامُ يُمشى يومًا بيوم لا بقسمةٍ على سبعة: الأسبوعُ لا يبدأ من
     يومِ اليوم، فالقسمةُ تُخطئ بأيّامٍ كلّما ضاقت أيّامُ الأسبوع. */
  function project(p) {
    var t = total(p), left = Math.max(0, t - (p.done || 0));
    if (!p.days || !p.days.length) return { total: t, left: left, bad: 'اختر يومًا واحدًا على الأقلّ' };
    if (!p.rate || p.rate < 1)     return { total: t, left: left, bad: 'حدِّد مقدارَ اليوم' };
    if (!left) {
      return { total: t, left: 0, days: 0, weeks: 0, months: 0, rem: 0,
               endDate: new Date(), hij: App.hijri(new Date()), greg: App.greg(new Date()), done: true };
    }
    var d = new Date(); d.setHours(12, 0, 0, 0);
    var rem = left, guard = 0;
    while (rem > 0 && guard++ < 6000) {
      d.setDate(d.getDate() + 1);
      if (p.days.indexOf(d.getDay()) >= 0) rem -= p.rate;
    }
    var days = Math.max(1, Math.round((d - Date.now()) / 86400000));
    return {
      total: t, left: left, days: days,
      weeks: Math.ceil(days / 7),
      months: Math.floor(days / 30), rem: days % 30,
      endDate: d, hij: App.hijri(d), greg: App.greg(d)
    };
  }

  function todayRange(p) {
    var t = total(p), done = p.done || 0;
    if (done >= t) return null;
    var from = p.from + done;
    var to = Math.min(p.to, from + p.rate - 1);
    return { from: from, to: to, count: to - from + 1 };
  }

  function isDueToday(p) {
    if (!p.days) return false;
    if ((p.done || 0) >= total(p)) return false;
    return p.days.indexOf(new Date().getDay()) >= 0;
  }

  function doneToday(p) {
    return (p.log && p.log[App.dateKey()]) || 0;
  }

  function markDone(p, pages) {
    var t = total(p);
    var n = Math.min(pages || p.rate, t - (p.done || 0));
    if (n <= 0) return 0;
    p.done = (p.done || 0) + n;
    p.log = p.log || {};
    var k = App.dateKey();
    p.log[k] = (p.log[k] || 0) + n;
    App.save();
    return n;
  }

  function undoToday(p) {
    var k = App.dateKey(), n = (p.log && p.log[k]) || 0;
    if (!n) return 0;
    p.done = Math.max(0, (p.done || 0) - n);
    delete p.log[k];
    App.save();
    return n;
  }

  /* المواظبة: يومٌ يُحتسب إن أُنجز فيه شيءٌ في أيّ منهج. ويُتسامح عن
     اليوم الحاضر إن لم يُنجَز بعد — فالسلسلةُ لا تنكسر قبل أن ينتهي. */
  function streak() {
    var days = {};
    App.state.plans.forEach(function (p) {
      for (var k in (p.log || {})) if (p.log[k] > 0) days[k] = 1;
    });
    var d = new Date(); d.setHours(12, 0, 0, 0);
    if (!days[App.dateKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0, guard = 0;
    while (days[App.dateKey(d)] && guard++ < 4000) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function coveredPages() {
    var s = new Set();
    App.state.plans.forEach(function (p) {
      var end = p.from + (p.done || 0) - 1;
      for (var i = p.from; i <= Math.min(end, p.to); i++) s.add(i);
    });
    return s;
  }

  function titleFor(d) {
    var Q = App.Quran;
    if (d.scope === 'surah') {
      var a = Q.surahOf(d.from), b = Q.surahOf(d.to);
      return a === b ? 'سورة ' + Q.surahName(a)
                     : 'من ' + Q.surahName(a) + ' إلى ' + Q.surahName(b);
    }
    if (d.scope === 'page') {
      return 'الصفحات ' + App.ar(d.from) + '–' + App.ar(d.to);
    }
    var j = Q.juzOf(d.from), k = Q.juzOf(d.to);
    return j === k ? 'الجزء ' + App.ar(j) : 'الأجزاء ' + App.ar(j) + '–' + App.ar(k);
  }

  function create(draft) {
    var p = {
      id: App.uid(),
      kind: draft.kind || 'hifz',
      scope: draft.scope || 'juz',
      from: draft.from, to: draft.to,
      rate: draft.rate || 1,
      days: (draft.days || [0, 1, 2, 3, 4]).slice().sort(),
      startedAt: App.dateKey(),
      done: 0, log: {},
      title: draft.title || titleFor(draft)
    };
    App.state.plans.push(p);
    App.save();
    return p;
  }

  function remove(id) {
    var i = App.state.plans.findIndex(function (p) { return p.id === id; });
    if (i >= 0) { App.state.plans.splice(i, 1); App.save(); }
  }
  function byId(id) {
    return App.state.plans.filter(function (p) { return p.id === id; })[0] || null;
  }

  App.Plans = {
    KINDS: KINDS, kindCls: kindCls, total: total, pct: pct, project: project,
    todayRange: todayRange, isDueToday: isDueToday, doneToday: doneToday,
    markDone: markDone, undoToday: undoToday,
    streak: streak, coveredPages: coveredPages,
    titleFor: titleFor, create: create, remove: remove, byId: byId
  };
})(window.App);

/* ═══════════════════════════════════════════════════════════════════
   الأميريُّ — خطُّ التطبيق
   ───────────────────────────────────────────────────────────────────
   نسخيٌّ معاصرٌ مبنيٌّ على نسخِ بولاق، ورخصتُه OFL ونسختُها في
   ‎fonts/AMIRI-OFL.txt‎ بجوارِ الملفّ.

   ولا يُكتَب ‎@font-face‎ في ورقةِ الأنماطِ كما يُفعَل عادةً، لسببٍ
   مقيس: الملفُّ يُفتَح أحيانًا من القرصِ (‎file://‎)، والمتصفّحُ يَمنع

  var done = false;

  function load() {
    if (done) return;

    if (location.protocol === 'file:') return;

/* ═══════════════════════════════════════════════════════════════════
   الهالة — مَوتيفُ ارتقِ الواحد
   ───────────────────────────────────────────────────────────────────
   كان التطبيقُ حسنًا وعامًّا: بطاقاتٌ مستديرةٌ وظلالٌ ناعمةٌ وأزرارٌ
   حبّيّة. ولو مُحيت الكلماتُ العربيّةُ من شاشتِه لَما عُرف أنّه
   تطبيقُ قرآن. والهويّةُ البصريّةُ ليست لونًا وخطًّا — هي **شكلٌ
   واحدٌ يُعرَف من بعيد**، ولم يكن له شكل.

   واخترتُ هالةَ نهايةِ الآية، وهي في المصحفِ ستّةُ آلافٍ ومئتان
   وستٌّ وثلاثون مرّة. ولم أخترها لأنّها جميلة، بل لأنّها **صادقة**:
   عينُ الحافظِ تَقرؤها أصلًا «آيةٌ تَمَّت». فحين تَصير حلقةَ التقدُّمِ
   وخَتمَ الإنجازِ وعلامةَ الصفحةِ المُنجَزة، لا نُلبس التطبيقَ زينةً
   مستعارة — نُسمّي الشيءَ باسمِه الذي يَعرفه.

   ولم تُؤخَذ من رمزِ الخطّ: خطُّ المصحفِ يُنزَّل صفحةً صفحةً ورموزُه
   في منطقةِ الاستعمالِ الخاصّ، فلو بُني عليه هيكلُ الواجهةِ لَتعلّقت
   هويّةُ التطبيقِ بملفٍّ قد لا يَصل. فهي هنا **هندسةٌ محضة**: فصوصٌ
   تُرسَم بأقواسٍ حول دائرة، تَكبر وتَصغر وتَمتلئ بالحساب.

   الهندسة: الفصُّ قوسٌ نصفُ قطرِه مشتقٌّ من وترِه، فلا يَنكسر الشكلُ
   عند تغييرِ العدد. وفصٌّ إلى الأعلى دائمًا (دورانُ نصفِ خطوة).
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* ثمانيةٌ لا اثنا عشر: جرّبتُ الاثنَي عشرَ أوّلًا فخرجت **سحابةً**
     لا هالة — فصوصٌ صغارٌ متقاربةٌ تَذوب عند ٤٤ بكسلًا فتُقرأ حافّةً
     مموَّجةً لا مَوتيفًا. والثمانيةُ كلُّ فصٍّ منها يُرى فصًّا.
     والنتوءُ رُفع معها: الفصُّ الضعيفُ نتوءُه نَتوٌّ لا بَتلة. */
  var N = 8;
  var BULGE = 0.80;    /* نتوءُ الفصّ نسبةً إلى وترِه */

  /* مسارُ الهالةِ مُغلَقًا. العدُّ من الأعلى (−٩٠°) وبنصفِ خطوةٍ
     فيَعلو فصٌّ لا فجوة. */
  function path(cx, cy, r, petals) {
    var n = petals || N;
    if (n < 3) n = 3;
    var step = (Math.PI * 2) / n;
    var start = -Math.PI / 2 - step / 2;

    /* نصفُ قطرِ القوسِ من وترِه: يَكبر الشكلُ ويَصغر فتَبقى نِسبتُه */
    var chord = 2 * r * Math.sin(step / 2);
    var rho = chord * BULGE;
    if (rho < chord / 2) rho = chord / 2;   /* دون هذا لا قوسَ يَصل */

    var d = '', i, a, x, y;
    for (i = 0; i <= n; i++) {
      a = start + i * step;
      x = cx + r * Math.cos(a);
      y = cy + r * Math.sin(a);
      d += (i === 0 ? 'M' : 'A' + f(rho) + ' ' + f(rho) + ' 0 0 1 ')

  function f(v) { return (Math.round(v * 100) / 100).toString(); }

     نفسِها، فخرج عيبان. أحدُهما بصريّ: الحدُّ الغليظُ يَبتلع الفصوصَ
     إذ عمقُ الفصِّ دون سُمكِ الحدّ، فتُقرأ دائرةً مهزوزةً لا هالة.
     والآخرُ أثقل: **ليس في المصحفِ هالةٌ نصفُها**. الهالةُ تقول
     «تَمَّت الآية» — فجعلُها شريطَ تقدُّمٍ يَنقض معناها ويُفرغها من
     الصدقِ الذي اختيرت له.

     فالقسمةُ الآن صادقة: التقدُّمُ قوسٌ نظيفٌ يُقرأ بلا عناء، فإذا

    /* التمامُ خَتمٌ لا قوسٌ مُغلَق */

    }

    var w = o.width || (size / 9);
    var c = size / 2;
    var r = c - (w / 2) - (o.pad || 0);

    return '<svg class="ros ' + (o.cls || '') + '" viewBox="0 0 ' + size + ' ' + size +
      '" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' +
      '<circle class="ros-track" cx="' + f(c) + '" cy="' + f(c) + '" r="' + f(r) +
        '" fill="none" stroke-width="' + f(w) + '"/>' +
      /* عند الصِّفرِ لا يُرسَم القوسُ أصلًا: الطرفُ المستديرُ يَترك
         نقطةً صغيرةً تُقرأ «بدأتَ» لمن لم يَبدأ. */
      (p > 0.004
        ? '<circle class="ros-arc" cx="' + f(c) + '" cy="' + f(c) + '" r="' + f(r) +
          '" fill="none" stroke-width="' + f(w) + '" stroke-linecap="round" ' +
          'pathLength="1" stroke-dasharray="' + f(p) + ' 1" ' +
          'transform="rotate(-90 ' + f(c) + ' ' + f(c) + ')"/>'

      (o.inner ? '<g class="ros-in">' + o.inner + '</g>' : '') +
      '</svg>';

     لها لُبٌّ ومِحورٌ كهالةِ المصحف، فتُقرأ تمامًا لا تقدُّمًا. */
  /* الهالةُ في المصحفِ ليست قرصًا مُفصَّصًا: لها **لُبٌّ** تَحوطه
     الفصوص. وبغيرِ اللُّبِّ يَخرج الشكلُ ورقةَ زهرةٍ لا علامةَ آية.
     فالخَتمُ ثلاثُ طبقات: فصوصٌ تُشعّ، وحلقةٌ تَفصل، ولُبٌّ يَحمل. */
  function seal(o) {

    var size = o.size || 64, c = size / 2;
    var r = c * 0.94;
    var core = o.core === false;
    return '<svg class="ros ros-seal ' + (o.cls || '') + '" viewBox="0 0 ' + size + ' ' + size +
      '" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' +
      '<path class="ros-fill" d="' + path(c, c, r, o.petals) + '"/>' +
      (core ? '' :
        '<circle class="ros-sep" cx="' + f(c) + '" cy="' + f(c) + '" r="' + f(r * 0.70) + '"/>' +
        '<circle class="ros-core" cx="' + f(c) + '" cy="' + f(c) + '" r="' + f(r * 0.62) + '"/>') +
      (o.inner ? '<g class="ros-in">' + o.inner + '</g>' : '') +
      '</svg>';
  }

  /* ── الفاصل: شعرتان وهالةٌ بينهما ──
     بديلُ الخطِّ الأصمّ. وهو موضعُ المَوتيفِ الذي يَتكرّر بلا ضجيج. */

    '.ros-track{stroke:var(--hair-2)}',
    '.ros-arc{stroke:var(--kind,var(--accent))}',
    '.ros-fill{fill:var(--kind,var(--accent))}',
    '.ros-sep{fill:var(--surface)}',
    '.ros-core{fill:var(--kind,var(--accent));opacity:.16}',
    '.ros-in{fill:var(--ink)}',

    '.ros-rule i{flex:1 1 auto;height:1px;background:var(--hair-2)}',
    '.ros-rule .ros{flex:0 0 auto}',

    '.ros-dot .ros-edge{display:none}',

    '  .ros-arc{transition:stroke-dasharray var(--mid,.34s) var(--ease,ease)}',
    '}'

  function mount() {
    var st = document.createElement('style');
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else { mount(); }

}(window.App));

  /* ── التجريد ──
     البحثُ لا يُطابق الحركات: من يَبحث يَكتب «يايها الذين امنوا» بلا
     شكلٍ ولا همزاتٍ مضبوطة. فتُجرَّد الحركاتُ وتُوحَّد صورُ الألفِ

      .replace(MARKS, '')

  function load(d) {

    if (d.n) { NAMES = d.n; }

/* ══ 13-shabih.js ══ */
/* ══ 13-shabih.js — المتشابهات ══════════════════════════════════
   مولَّدٌ، لا يُحرَّر بيد: tools/make-quran.py يُنشئه من بياناتِ زاحِم.

   ولا شيءَ يُوقع الحافظَ كالمتشابهات: آيتان تَتّفقان إلّا في كلمة،
   فيُؤخَذ من هذه إلى تلك ولا يَدري. وهذه البياناتُ لا تَكتفي بأن
   تقول «هاتان متشابهتان» — بل تُسمّي الكلماتِ التي افترقتا فيها،
   وذاك موضعُ الفائدة: أن يُقابِل بعينِه قبل أن يُخطئ بلسانه. */
(function (App) {
  'use strict';

  var G = JSON.parse('[]');

  /* فهرسٌ عكسيّ: من مفتاحِ الآيةِ إلى المجموعاتِ التي تَضمّها.
     يُبنى عند أوّلِ طلبٍ لا عند التحميل. */
  var byKey = null;

  function index() {
    if (byKey) return byKey;
    byKey = {};
    for (var i = 0; i < G.length; i++) {
      var vs = G[i].v;
      for (var j = 0; j < vs.length; j++) {
        (byKey[vs[j].k] || (byKey[vs[j].k] = [])).push(i);
      }
    }
    return byKey;
  }

  /* مجموعاتُ آيةٍ بعينها، ومعها موضعُها من المجموعةِ ليُبرَز */
  function forVerse(s, a) {
    var ix = index()['' + s + ':' + a] || [];
    return ix.map(function (i) {
      return { id: G[i].i, kind: G[i].w, verses: G[i].v,
               self: '' + s + ':' + a };
    });
  }

  /* هل في الصفحةِ متشابهاتٌ أصلًا — ليُعلَّم عليها دون فتحها */
  function onPage(verses) {
    var ix = index(), n = 0, i;
    for (i = 0; i < verses.length; i++) {
      if (ix['' + verses[i].s + ':' + verses[i].a]) n++;
    }
    return n;
  }

  /* حزمةٌ تُحمَّل بعد الإقلاع كأختَيها. و‎groups‎ و‎count‎ كانا قيمتَين
     ثابتتَين تُقرآن مرّةً عند البناء، فلو بَقيا كذلك لَقرأ مَن حمّل
     الحزمةَ صفرًا بعدَ تحميلها. فصارا دالّتَين تَقرآن الحاضر. */
  function load(g) {
    if (!g || !g.length) return false;
    G = g; byKey = null;
    return true;
  }

  App.Shabih = {
    groups: function () { return G; },
    forVerse: forVerse,
    onPage: onPage,
    count: function () { return G.length; },
    ready: function () { return G.length > 0; },
    load: load
  };

}(window.App));

   هنا بنيةُ الصفحةِ كما في مصحف المدينة: أيُّ رمزٍ في أيِّ موضعٍ من
   أيِّ سطر، وبأيِّ خطٍّ يُرسَم. ١٠٤٨ ك.ب خامًا، ٢٠١ مضغوطةً — تُدمَج
   في الملفِّ فتَبقى بنيةُ الصفحةِ معلومةً دون اتّصال.

   والخطوطُ وحدَها خارجَه: ثمانيةٌ وأربعون ملفًّا وسيطُها ٧٦٧ ك.ب،
   جملتُها ٣٦ ميغابايت — لا تُدمَج. و٥٠٦ من ٦٠٤ صفحاتٍ تستعمل خطًّا
   واحدًا، والخطُّ يَخدم نحوَ ثلاثَ عشرةَ صفحة، فمن يحفظ جزءَ عمَّ
   يُنزّل خطَّين مرّةً ثمّ لا يُنزّل شيئًا. وحتّى يَنزل الخطُّ يُعرض
   النصُّ المدموجُ مكانَه: لا شاشةَ فارغةٌ تَنتظر الشبكة.

   المصدر: quran-qcf4 — رخصةُ MIT — © 2026 Mohamad Hajj Rabee */
(function (App) {

  var D = JSON.parse('{"f": ["QCF4_QBSML", "QCF4_Hafs_01", "QCF4_Hafs_02", "QCF4_Hafs_03", "QCF4_Hafs_04", "QCF4_Hafs_05", "QCF4_Hafs_06", "QCF4_Hafs_07", "QCF4_Hafs_08", "QCF4_Hafs_09", "QCF4_Hafs_10", "QCF4_Hafs_11", "QCF4_Hafs_12", "QCF4_Hafs_13", "QCF4_Hafs_14", "QCF4_Hafs_15", "QCF4_Hafs_16", "QCF4_Hafs_17", "QCF4_Hafs_18", "QCF4_Hafs_19", "QCF4_Hafs_20", "QCF4_Hafs_21", "QCF4_Hafs_22", "QCF4_Hafs_23", "QCF4_Hafs_24", "QCF4_Hafs_25", "QCF4_Hafs_26", "QCF4_Hafs_27", "QCF4_Hafs_28", "QCF4_Hafs_29", "QCF4_Hafs_30", "QCF4_Hafs_31", "QCF4_Hafs_32", "QCF4_Hafs_33", "QCF4_Hafs_34", "QCF4_Hafs_35", "QCF4_Hafs_36", "QCF4_Hafs_37", "QCF4_Hafs_38", "QCF4_Hafs_39", "QCF4_Hafs_40", "QCF4_Hafs_41", "QCF4_Hafs_42", "QCF4_Hafs_43", "QCF4_Hafs_44", "QCF4_Hafs_45", "QCF4_Hafs_46", "QCF4_Hafs_47"], "p": {}}');

    fonts: D.f,                 /* أسماءُ الخطوطِ بترتيبِ الفهرسة */
    ready: ready,
    load: load,

    /* صفحةٌ: { l:[{t,w:[[رمز,فهرسُ خطّ],…]},…], s:[[سورة,من,إلى],…] } */
    page: function (p) { return D.p[p] || null; },

/* ══ 16-qfont.js ══ */
/* ══ 16-qfont.js — خطوطُ المدينة، تُنزَّل وتُخزَّن ══════════════════
   ثمانيةٌ وأربعون خطًّا وسيطُها ٧٦٧ ك.ب وجملتُها ٣٦ ميغابايت. لا
   تُدمَج في الملفّ — ولا تُنزَّل جملةً أيضًا: ٥٠٦ من ٦٠٤ صفحاتٍ
   تستعمل خطًّا واحدًا، فيُنزَّل خطُّ الصفحةِ المفتوحةِ وحدَه. والخطُّ
   يَخدم نحوَ ثلاثَ عشرةَ صفحة، فمن يحفظ جزءًا يُنزّل خطَّين مرّةً.

   ويُخزَّن في Cache Storage لا في ذاكرةِ الصفحة: ذاكرةُ الصفحةِ
   تَذهب بإغلاقها، وخزنُ المتصفّحِ المعتادُ يُطرَد دون إذن. وبه تُقرأ
   الصفحةُ المزارةُ مرّةً وهو دون اتّصالٍ بعدُ.

   وحتّى يَنزل: يُعرض النصُّ المدموجُ مكانَه. لا شاشةَ تَنتظر شبكة. */
(function (App) {
  'use strict';

  var CACHE = 'irtaqi-qcf4-v1';

  /* المصدرُ الأوّلُ مجلَّدُ التطبيقِ نفسِه إن رُفعت الخطوطُ معه، ثمّ
     jsDelivr مَخرجًا. وترتيبُهما مقصود: ما كان من دارِك أولى. */
  var SRC = [
    'fonts/%s.woff2',
    'https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2/%s.woff2'
  ];

  /* ملفُّ الخطِّ ليس اسمَه دائمًا: خطوطُ الصفحاتِ السبعةُ والأربعون
     تَلحقها لاحقةُ _W، وخطُّ أسماءِ السورِ والبسملةِ (QBSML) لا يَلحقه
     شيء. وغفلةُ هذا الفرقِ كانت تُسقط رسمَ المدينةِ في كلِّ صفحةٍ فيها
     عنوانُ سورة — مئةٌ وأربعَ عشْرةَ صفحةً — بلا شكوى. */
  function fileOf(name) {
    return /^QCF4_Hafs_/.test(name) ? name + '_W' : name;
  }

  var loaded = {};        /* اسمُ الخطّ → وعدٌ أو true */
  var failed = {};

  /* رسمُ المدينةِ هو الأصل، لا خِيارٌ يُبحَث عنه: مَن حَفِظ من المصحفِ
     يَحفظ بموضعِ الكلمةِ في الصفحة، فحَجْبُ الرسمِ افتراضًا يَسلبه
     ذلك. ومَن أراد النصَّ المجرَّدَ أطفأه، فيُخزَّن false صريحًا. */
  /* المتصفّحُ يَمنع fetch من file:// منعًا باتًّا. فلو ادّعينا القدرةَ
     هناك لَخرج خطأٌ في الطرفيّةِ ثمّ ذهب الطلبُ إلى موقعٍ خارجيٍّ لم
     يَطلبه أحد. فمَن فتح الملفَّ من قرصِه قرأ النصَّ، ومَن فتحه من
     رابطِه رأى رسمَ المدينة. */
  var FROM_FILE = (location.protocol === 'file:');

  function enabled() {
    if (FROM_FILE) return false;
    var s = App.state.settings || {};
    return s.madani !== false;
  }

  function fromFile() { return FROM_FILE; }

  function cacheOpen() {
    /* Cache Storage لا يعمل على file:// ولا في سياقٍ غيرِ آمن؛ وغيابُه
       ليس عطبًا — يُنزَّل الخطُّ ويبقى في ذاكرةِ الصفحةِ هذه الجلسة. */
    try {
      if (typeof caches === 'undefined') return Promise.resolve(null);
      return caches.open(CACHE).catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }

  function fetchFont(name) {
    return cacheOpen().then(function (c) {
      /* الرسمُ مُشغَّلٌ افتراضًا، فلو ذهبنا إلى jsDelivr من تلقائنا متى
         غاب مجلَّدُ الخطوطِ لَخرج من جهازِ القارئِ طلبٌ إلى طرفٍ ثالثٍ
         لم يَأذن به ولم يَعلم. فدارُنا وحدَها هي الأصل، ولا يُقصَد
         الخارجُ إلّا بإذنٍ صريحٍ من الإعدادات (madani === true). */
      var st = App.state.settings || {};
      var urls = SRC.slice(0, st.madani === true ? SRC.length : 1)
        .map(function (t) { return t.replace('%s', fileOf(name)); });

      function tryAt(i) {
        if (i >= urls.length) return Promise.reject(new Error('لا مصدر'));
        var url = urls[i];
        var step = c
          ? c.match(url).then(function (hit) { return hit || null; })
          : Promise.resolve(null);
        return step.then(function (hit) {
          if (hit) return hit.arrayBuffer();
          return fetch(url, { mode: 'cors' }).then(function (r) {
            if (!r.ok) throw new Error('حالة ' + r.status);
            if (c) { try { c.put(url, r.clone()); } catch (e) {} }
            return r.arrayBuffer();
          });
        }).catch(function () { return tryAt(i + 1); });
      }
      return tryAt(0);
    });
  }

  /* يُحمّل خطًّا ويُسجّله في الوثيقة. الوعدُ يُحفَظ فلا يُنزَّل مرّتَين
     ولو طُلب من موضعَين في النَّفَس نفسِه. */
  function load(name) {
    if (loaded[name] === true) return Promise.resolve(true);
    if (failed[name]) return Promise.resolve(false);
    if (loaded[name]) return loaded[name];

    var pr = fetchFont(name).then(function (buf) {
      var ff = new FontFace(name, buf);
      return ff.load().then(function (f) {
        document.fonts.add(f);
        loaded[name] = true;
        return true;
      });
    }).catch(function () {
      failed[name] = 1;
      delete loaded[name];
      return false;
    });

    loaded[name] = pr;
    return pr;
  }

  /* خطوطُ صفحةٍ جميعًا. يُعيد true إن صلحت كلُّها للرسم. */
  function forPage(p) {
    var names = (App.Layout && App.Layout.fontsOf(p)) || [];
    if (!names.length) return Promise.resolve(false);
    return Promise.all(names.map(load)).then(function (res) {
      for (var i = 0; i < res.length; i++) if (!res[i]) return false;
      return true;
    });
  }

  function ready(p) {
    var names = (App.Layout && App.Layout.fontsOf(p)) || [];
    if (!names.length) return false;
    for (var i = 0; i < names.length; i++) if (loaded[names[i]] !== true) return false;
    return true;
  }

  /* ما حُمّل فعلًا — ليُرى في الإعدادات */
  function stats() {
    var n = 0, k;
    for (k in loaded) if (loaded[k] === true) n++;
    return { loaded: n, total: (App.Layout ? App.Layout.fonts.length : 0) };
  }

  function clear() {
    loaded = {}; failed = {};
    return cacheOpen().then(function (c) {
      if (!c) return false;
      return caches.delete(CACHE);
    }).catch(function () { return false; });
  }

  App.QFont = {
    enabled: enabled, load: load, forPage: forPage,
    ready: ready, stats: stats, clear: clear, fromFile: fromFile
  };

}(window.App));

/* ══ 17-seal.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   الخَتْم — تعميةٌ من طرفٍ إلى طرف
   ───────────────────────────────────────────────────────────────────
   هذه الوحدةُ أساسُ وعدٍ قطعناه في «عن التطبيق»: «لا يُرسَل من هذا
   شيءٌ إلى أيّ مكان». وسيأتي يومٌ تُزامَن فيه النسخةُ بين جهازَين،
   فإمّا أن يَسقط الوعدُ وإمّا أن يُرفَع إلى ما هو أمتن: **خادمٌ
   يَحمل صندوقًا لا يَقدر على فتحه**. وهذا ما تَصنعه هذه الوحدة.

   وهي اليومَ ليست تجهيزًا لغدٍ فحسب: نسخةُ القارئِ الاحتياطيّةُ فيها
   سجلُّ حفظِه كلِّه، وقد تُرسَل في محادثةٍ أو تَبقى في مجلَّدِ
   التنزيلات. فخَتْمُها بكلمةٍ يَملكها وحدَه عملٌ نافعٌ من يومِه.

   المِظروف:  IRTQ1.<ملح>.<متّجه>.<المُعمّى>   كلُّه Base64 بلا حشو
   المفتاح:   PBKDF2-SHA256 ثمّ AES-GCM ٢٥٦

   ولرقمِ الإصدارِ في الصدرِ (‎1‎) معنًى: نسخةٌ خُتمت اليومَ يجب أن
   تُفتَح بعد سنتين ولو تبدّلت المعايير. فالصدرُ يُقرأ أوّلًا، وكلُّ
   تبديلٍ في الطريقةِ يَأخذ رقمًا جديدًا ويَبقى القديمُ مفهومًا.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var MAGIC = 'IRTQ1';

  /* دوراتُ الاشتقاق. المرادُ أن يَغلوَ تخمينُ الكلمةِ على مَن ظفر
     بالملفّ، لا أن يَثقل الفتحُ على صاحبه: مئاتُ الألوفِ تُكلّف
     صاحبَ الملفِّ جزءًا من الثانيةِ مرّةً واحدة، وتُكلّف المُخمِّنَ
     ذلك في كلِّ تخمينةٍ من ملايينِه. (توصيةُ OWASP لـSHA-256.) */
  var ITER = 310000;

  function able() {
    try { return !!(window.crypto && crypto.subtle && window.TextEncoder); }
    catch (e) { return false; }
  }

  function bytes(s) { return new TextEncoder().encode(s); }
  function text(b) { return new TextDecoder().decode(b); }

  /* Base64 بلا حشوٍ ولا أحرفَ تُفسدها الروابط */
  function b64(buf) {
    var a = new Uint8Array(buf), s = '', i;
    for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  }
  function unb64(s) {
    var t = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var raw = atob(t), a = new Uint8Array(raw.length), i;
    for (i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  function derive(pass, salt) {
    return crypto.subtle
      .importKey('raw', bytes(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      });
  }

  /* يَختم نصًّا بكلمة. ملحٌ جديدٌ ومتّجهٌ جديدٌ في كلِّ ختمةٍ: ختمُ
     النصِّ نفسِه مرّتَين يَخرج مختلفًا، فلا يُستدَلّ بالتشابه. */
  function seal(plain, pass) {
    if (!able()) return Promise.reject(new Error('لا تعميةَ في هذا المتصفّح'));
    if (!pass) return Promise.reject(new Error('لا كلمة'));
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return derive(pass, salt).then(function (k) {
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, bytes(plain));
    }).then(function (ct) {
      return MAGIC + '.' + b64(salt) + '.' + b64(iv) + '.' + b64(ct);
    });
  }

  /* يَفكّ مِظروفًا. وفشلُ الفكِّ لا يُفرَّق فيه بين كلمةٍ خاطئةٍ
     وملفٍّ مبتور: AES-GCM يَكشف العبثَ كما يَكشف الخطأ، وكلاهما
     عند القارئِ شيءٌ واحد — «لم يُفتَح». */
  function open(packed, pass) {
    if (!able()) return Promise.reject(new Error('لا تعميةَ في هذا المتصفّح'));
    var p = String(packed || '').trim().split('.');
    if (p.length !== 4 || p[0] !== MAGIC) {
      return Promise.reject(new Error('ليس مِظروفَ «رتِّل وارتقِ»'));
    }
    var salt, iv, ct;
    try { salt = unb64(p[1]); iv = unb64(p[2]); ct = unb64(p[3]); }
    catch (e) { return Promise.reject(new Error('مِظروفٌ تالف')); }
    return derive(pass, salt).then(function (k) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, ct);
    }).then(function (buf) { return text(buf); });
  }

  /* أهذا النصُّ مِظروفٌ مختوم؟ يُسأل قبل محاولةِ القراءةِ العاديّة */
  function sealed(s) {
    return typeof s === 'string' && s.trim().slice(0, MAGIC.length + 1) === MAGIC + '.';
  }

  /* ── هُويّةُ المزامنةِ من الكلمةِ نفسِها ────────────────────────
     مَن ضاع جهازُه يُريد سجلَّه على جهازٍ جديد. فلو كان عنوانُ نسختِه
     على الخادمِ معرّفًا عشوائيًّا مولودًا في الجهازِ الضائعِ لَضاع
     معه. فالعنوانُ والقفلُ يُشتقّان من **كلمةِ المزامنة** وحدَها:
     كلمةٌ واحدةٌ يَحفظها صاحبُها تَبلغه نسختَه من أيِّ جهاز.

     والملحُ هنا ثابتٌ — وهو خلافُ ملحِ الختمِ المتجدِّد — لأنّ
     الاشتقاقَ يجب أن يُعيد النتيجةَ نفسَها على كلِّ جهاز. ولا يَضرّ:
     العنوانُ والقفلُ ليسا أخطرَ من الكلمةِ التي اشتُقّا منها، ومَن
     خمّنها فكّ المحتوى أصلًا. وحدُّ الأمانِ كلِّه قوّةُ الكلمة —
     ولهذا تُطلَب طويلةً ويُقال لصاحبها إنّها لا تُستعاد. */
  var ID_SALT = bytes('irtaqi.sync.v1');

  function ident(pass) {
    if (!able()) return Promise.reject(new Error('لا تعميةَ في هذا المتصفّح'));
    if (!pass) return Promise.reject(new Error('لا كلمة'));
    return crypto.subtle
      .importKey('raw', bytes(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: ID_SALT, iterations: ITER, hash: 'SHA-256' },
          base, 512);
      })
      .then(function (bits) {
        var a = new Uint8Array(bits);
        return {
          id: b64(a.subarray(0, 24)),      /* العنوانُ — ٣٢ محرفًا */
          key: b64(a.subarray(24, 56))     /* القفلُ — ٤٣ محرفًا */
        };
      });
  }

  App.Seal = {
    able: able, seal: seal, open: open, sealed: sealed,
    ident: ident, MAGIC: MAGIC
  };

}(window.App));

/* ══ 18-audio.js ══ */
/* ══ 18-audio.js — التلاوةُ المسموعة ═════════════════════════════
   الحفظُ شفهيٌّ قبل أن يكون بصريًّا: يُسمَع فيُردَّد فيَثبُت. وكان
   التطبيقُ صامتًا، فيه نصُّ المصحفِ كلُّه ولا صوتَ فيه — فمن أراد أن
   يَسمع خرج منه إلى غيره، ومن خرج لم يَعُد.

   والترديدُ هنا ليس زينةً بل هو الآلة: الآيةُ تُعاد ثلاثًا أو خمسًا
   أو سبعًا قبل أن تُغادَر، لأنّ هذا هو ما يَفعله الحافظُ بنفسه.

   ومنهجُ الجلبِ هو منهجُ الخطوط في ‎16-qfont.js‎ نفسُه، وقد جُرّب
   هناك فصلح: لا يُنزَّل شيءٌ حتّى يُطلَب بلمسةٍ صريحة، ويُخزَّن

    { id: 'sudais',     ed: 'ar.sudais',     name: 'عبد الرحمن السُّديس',

  var cum = null;
  function globalNo(s, a) {

    }

  }

     رفعَ تلاوةً بجوارِ الملفِّ سمّاها بسورتِها وآيتِها — وهي تسميةُ

  function urls(id, s, a) {
    var k = qari(id), g = globalNo(s, a), six = pad3(s) + pad3(a), out = [];
    /* ‎fetch‎ لا يَفتح ‎file://‎ البتّة، فإقحامُ مجلَّدِ الدارِ على من
       فتح الملفَّ من قرصِه خطأٌ مضمونٌ في وحدةِ التحكّمِ لا طائلَ منه. */
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      out.push('recite/' + k.ed + '/' + six + '.mp3');
    }
    /* جودتان: الأعلى أوّلًا، ثمّ أخفُّها لمن شبكتُه ضعيفةٌ أو لمن
       تعذّر عليه الأولى. والاثنتان من مصدرٍ واحدٍ موثَّقِ الصيغة. */
    out.push('https://cdn.islamic.network/quran/audio/128/' + k.ed + '/' + g + '.mp3');
    out.push('https://cdn.islamic.network/quran/audio/64/' + k.ed + '/' + g + '.mp3');
    /* ‎everyayah‎ مَخرجًا: تسميتُه بالسورةِ والآيةِ لا بالرقمِ المتّصل.

    if (k.every) out.push('https://everyayah.com/data/' + k.every + '/' + six + '.mp3');
    return out;
  }

  function cacheOpen() {
    /* Cache Storage لا يعمل على ‎file://‎ ولا في سياقٍ غيرِ آمن، وغيابُه

     فلو منعَ المصدرُ الجلبَ سَمِع المستخدمُ ولم يَخزّن، وهذا أهون
     من ألّا يَسمع. */
  var mem = {};        /* مفتاح → رابطُ blob في هذه الجلسة */

        var u = list[i];

                     : Promise.resolve(null);

          if (noFetch || offline()) throw new Error('الجلبُ متعذّر');
          return fetch(u, { mode: 'cors' }).then(function (r) {

  function styleOnce() {
    if (document.getElementById('ra-css')) return;
    var e = App.el('style');
    e.id = 'ra-css';
    e.textContent = CSS.join('\n');
    document.head.appendChild(e);
  }

  function note(t) {
    if (!ui || !ui.note) return;
    ui.note.textContent = t || '';

  }

  /* يُحدّث ما تبدّل وحدَه: إعادةُ رسمِ الشاشةِ تَهدم المَشجبَ فتُنادى

    ui.go.innerHTML = App.icon(on ? 'ra-stop' : 'ra-play', 20);
    var lbl = App.el('span');
    lbl.textContent = on ? 'إيقافُ التلاوة' : 'استمع إلى الصفحة';
    ui.go.appendChild(lbl);

      ui.status.textContent = App.join(
        'الآية ' + App.ar(v.a) + ' من ' + v.name,
        'المرّة ' + App.ar(run.rep + 1) + ' من ' + App.ar(run.reps),
        st);
      ui.hold.innerHTML = App.icon(au && au.paused ? 'ra-play' : 'ra-hold', 19);
      var hl = App.el('span');
      hl.textContent = au && au.paused ? 'متابعة' : 'تمهيل';

    var s = App.el('span');
    s.textContent = label;
    b.appendChild(s);
    b.onclick = fn;
    return b;
  }

  /* مختارُ الترديد: هو جوهرُ الأداة فيُعرَض ضابطُه لا يُخفى في قائمة */
  function repsRow() {
    var box = App.el('div', 'ra-opts');
    var lab = App.el('span', 'ra-lab');
    lab.textContent = 'الترديد';
    box.appendChild(lab);
    var grp = App.el('div', 'ra-grp');
    grp.setAttribute('role', 'radiogroup');
    grp.setAttribute('aria-label', 'عددُ مرّاتِ ترديدِ الآية');

      b.setAttribute('role', 'radio');
      b.textContent = n === 1 ? 'مرّة' : App.ar(n);
      b.setAttribute('aria-label', n === 1 ? 'مرّةً واحدة'
        : App.ar(n) + ' مرّات');

           ولا يُقطعها: من رأى ثلاثًا قليلةً وهو يَسمع أراد خمسًا الآن. */
        if (run) { run.reps = n; paint(); }

      b.onclick = set;
      b.setAttribute('aria-checked', cfg().reps === n ? 'true' : 'false');

    roving(grp, '.ra-chip', function (n) { n.click(); });
    box.appendChild(grp);
    return box;
  }

  function qariRow(onPick) {
    var box = App.el('div', 'ra-opts');
    var lab = App.el('span', 'ra-lab');
    lab.textContent = 'القارئ';
    box.appendChild(lab);
    var b = App.el('button', 'ra-wide');
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    var nm = App.el('span', 'ra-nm');
    nm.textContent = qari(cfg().q).name;
    b.appendChild(nm);
    /* الأيقونةُ في غلافٍ تُحقن فيه: ‎innerHTML +=‎ على الزرِّ يُعيد
       تحليلَ ما فيه فيَفقد ‎nm‎ عقدتَه، فلا يَتبدّل الاسمُ بعد ذلك. */
    var ic = App.el('span', 'ra-ic', App.icon('chevron', 18));
    b.appendChild(ic);
    var list = App.el('div', 'ra-list');
    list.hidden = true;
    list.setAttribute('role', 'radiogroup');
    list.setAttribute('aria-label', 'القرّاء');
    QARI.forEach(function (k) {
      var r = App.el('button', 'ra-one');
      r.type = 'button';
      r.setAttribute('role', 'radio');
      r.setAttribute('aria-checked', cfg().q === k.id ? 'true' : 'false');
      var t = App.el('span', 'ra-one-n');
      t.textContent = k.name;
      r.appendChild(t);
      var d = App.el('span', 'ra-one-d');
      d.textContent = k.note;
      r.appendChild(d);
      r.onclick = function () {
        setCfg({ q: k.id });

          o.setAttribute('aria-checked', o === r ? 'true' : 'false');

        if (run) stop();
        if (onPick) onPick();

      list.appendChild(r);
    });

       حتّى يَسمع من يَتصفّحها أسماءَ القرّاءِ قبل أن يُثبِت واحدًا. */
    roving(list, '.ra-one');

      list.hidden = !list.hidden;

    box.appendChild(list);
    return box;

  /* الحفظُ للسماعِ دون اتّصال: لمسةٌ واحدةٌ تَسحب آياتِ الصفحةِ كلَّها
     إلى الخزن. والطلبُ واحدًا بعد واحدٍ لا جملةً: الصفحةُ قد تكون
     عشرين آيةً، وعشرون طلبًا متوازيًا على شبكةٍ ضعيفةٍ تَسقط كلُّها. */
  function saveRow(verses) {
    var box = App.el('div', 'ra-opts');
    var b = btn('ra-wide ra-save', 'ra-down', 'حفظُ تلاوةِ الصفحة', function () {
      if (b.disabled) return;
      b.disabled = true;
      var id = cfg().q, i = 0, bad = 0;
      var txt = App.$('span', b);
      function step() {
        if (i >= verses.length) {
          b.disabled = false;
          txt.textContent = 'حفظُ تلاوةِ الصفحة';
          note(bad ? 'لم تُحفَظ التلاوةُ كاملة. تحقّق من الاتّصال ثمّ أعِد المحاولة.'
                   : 'حُفظت تلاوةُ الصفحة، وتُسمَع بعدها دون اتّصال.');
          return;
        }
        txt.textContent = 'يُحفَظ ' + App.ar(i + 1) + ' من ' + App.ar(verses.length);
        var v = verses[i++];
        fetchOne(id, v.s, v.a).catch(function () { bad++; }).then(step);
      }
      note('');
      step();
    });
    box.appendChild(b);
    return box;
  }

     الذاكرةِ لكلِّ صفحةٍ يُقلَّبها القارئُ تَصير ميغابايتاتٍ لا تُردّ.

  function release() {

    }
    mem = {};
  }

  App.on_('qpage', mount);

  /* الخروجُ من الصفحةِ يُسكِت الصوت: إغلاقُ الصحيفةِ يَبثّ ‎route‎
     باسمِ الشاشةِ التي تحتها، فيُمسَك الخروجُ من هنا بلا حاجةٍ إلى
     لمسِ ملفِّ الصفحة. */
  App.on_('route', function (r) {
    if (!r || r.name !== 'qpage') {
      if (run) stop();
      ui = null;
      release();
    }
  });

  /* ما يُطفئ الصوتَ أيضًا: إخفاءُ الصفحةِ أو إغلاقُها. صوتٌ يَستمرّ
     بعد أن يُغلَق التطبيقُ يُفزع صاحبَه. */
  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && run && au && !au.paused) { au.pause(); paint(); }
    });
    window.addEventListener('pagehide', function () { if (run) stop(); });

  App.defIcons({
    'ra-play': '<path d="M8 5.5v13l10-6.5-10-6.5z"/>',
    'ra-hold': '<path d="M9.5 5v14M14.5 5v14"/>',

    'ra-back': '<path d="M18 6v12M15 12 7 6.5v11L15 12z"/>',

    'ra-down': '<path d="M12 4v10m0 0 4-4m-4 4-4-4"/><path d="M5 18h14"/>'
  });

  /* بابٌ لغيرِنا إن أراد تلاوةَ آيةٍ أو صفحةٍ بلمسةٍ من عنده */
  App.Recite = {
    QARI: QARI,
    page: function (p) { start(Q.page(p), 0); },
    verses: start,
    stop: stop,
    playing: function () { return !!run; },
    clear: function () {
      stop(); release();
      return cacheOpen().then(function (c) {
        if (!c) return false;
        return caches.delete(CACHE);
      }).catch(function () { return false; });
    }
  };

  var CSS = [
