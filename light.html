    '.t-pl .t-chev svg{width:19px;height:19px;transform:scaleX(-1)}',
    '.t-pl .t-pc{flex:none;font-size:14px;font-weight:700;color:var(--kind);'
      + 'font-variant-numeric:tabular-nums}',
    /* ارتفاعُ الشريطِ سبعةٌ لا خمسةٌ: النقشُ لا يُدرَك في خمسة */
    '.t-bar{margin-top:8px;height:7px;border-radius:var(--r-pill);background:var(--hair);overflow:hidden}',
    '.t-bar i{display:block;height:100%;border-radius:var(--r-pill)}',

    /* لا ورد اليوم: خبرٌ هادئٌ لا فراغ */
    '.t-rest{padding:18px 16px;border-radius:var(--r-md);background:var(--surface);'
      + 'border:1px dashed var(--hair);text-align:center}',
    '.t-rest p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-mut)}',
    '.t-rest b{color:var(--ink)}',

    /* البداية: صفحةٌ مُذهَّبةٌ فارغةٌ تنتظر أن تُكتب */
    '.t-empty{min-height:72vh;display:flex;flex-direction:column;align-items:center;'
      + 'justify-content:center;text-align:center;gap:18px;padding:22px 6px}',
    /* الفُرَجُ ١٨ لا ٢٢: شاشةُ أوّلِ مرّةٍ كانت تَفيض عن حدِّها
       فتُمرَّر، وهي أَولى الشاشاتِ بأن تَسَع نفسَها. */
    '.t-empty h1{margin:0;font-size:24px;font-weight:700;color:var(--ink)}',
    '.t-empty p{margin:0;max-width:19em;font-size:16px;line-height:1.9;color:var(--ink-mut)}',
    '.t-empty .t-cta{min-height:52px}',
    /* الشاشةُ الفارغةُ كانت تَملأ ٧٢ من مئةِ الطول بالفراغِ وحدَه
       لتُوسّط ما فيها؛ فلمّا نزل المثالُ تحتها صار التوسيطُ دفعًا
       له خارجَ النظر. فالارتفاعُ يُرفع والتوسيطُ يبقى في الأعلى. */
    '.t-empty:has(.t-demo){min-height:0;padding-block-end:26px}',
    '.t-demo{width:100%;margin-top:30px;text-align:start}',
    '.t-demo-cap{display:flex;align-items:center;gap:8px;margin-bottom:10px}',
    '.t-demo-tag{padding:2px 9px;border-radius:var(--r-pill);',
    '  background:var(--gold-soft);color:var(--gold-lit);',
    '  font-size:11px;font-weight:800;letter-spacing:.02em}',
    '.t-demo-t{font-size:13.5px;font-weight:700;color:var(--ink-mut)}',
    /* الصفوفُ حيّةٌ في اللون، ميّتةٌ في اللمس: لا مؤشّرَ ولا استجابة */
    '.t-demo .t-row{cursor:default}',
    '.t-demo .t-ghost{opacity:.42}',
    /* ‎.t-empty p‎ يحدّ العرضَ بـ ١٩em ليَقصُر سطرُ الدعوة، وهذا السطرُ
       ليس دعوةً فيُطلَق إلى عرضِ البطاقات. */
    '.t-demo-n{margin:10px 2px 0;max-width:none;font-size:12px;',
    '  line-height:1.8;color:var(--ink-faint)}',

    /* زرُّ البداية والإتمام: حدٌّ أدنى للمس ولمسةُ وقار */
    '.t-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;'
      + 'min-height:var(--tap);padding:13px 22px;border:1px solid transparent;'
      + 'border-radius:var(--r-pill);font:inherit;font-size:16px;font-weight:700;cursor:pointer}',
    '.t-btn svg{width:20px;height:20px}',
    '.t-btn.t-f{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}',
    '.t-btn.t-g{background:transparent;border-color:var(--hair);color:var(--ink)}',
    '.t-btn.t-s{font-size:14px;padding:11px 16px}',

    /* الألسنة: ثلاثةٌ على سطرٍ واحدٍ في شاشة الهاتف. تُضيَّق الحشوةُ
       قليلًا عن حشوة الهيكل العامّ لأنّ «ورد اليوم» لسانٌ طويلُ النصّ
       فلو بقيت الحشوةُ لانزلق اللسانُ الثالثُ خارجَ الشاشة واختفى —
       وإخفاءُ لسانٍ يُعيد الطالبَ إلى ما شكا منه. وارتفاعُه ٤٤
       كسائرِ أهدافِ اللمس في التطبيق. */
    '.t-seg .seg-b{min-height:44px;padding-inline:12px;gap:6px}',

    /* البؤرةُ ظاهرةٌ دائمًا: التسجيلُ يتمّ بلوحة المفاتيح كما باللمس */
    '.t-day :focus-visible,.t-row :focus-visible,.t-ib:focus-visible,.t-pl:focus-visible,'
      + '.t-btn:focus-visible,.t-row:focus-visible{outline:2.5px solid var(--gold-lit);'
      + 'outline-offset:2px;border-radius:var(--r-sm)}',

    /* الحركةُ تُسمح حين لا يطلب المستخدمُ تهدئتَها، فتكون مُلغاةً أصلًا */
    '@media (prefers-reduced-motion:no-preference){'
      + '.t-ib,.t-btn,.t-pl{transition:transform var(--fast) var(--ease),background var(--fast) var(--ease)}'
      + '.t-ib:active,.t-btn:active,.t-pl:active{transform:scale(.97)}'
      + '.t-bar i,.t-ring .t-arc{transition:stroke-dashoffset var(--mid) var(--ease),width var(--mid) var(--ease)}}'
  ].join('\n');

  function styleOnce() {
    if (document.getElementById('t-css')) return;
    var s = App.el('style');
    s.id = 't-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ── مُعِينات ─────────────────────────────────────────────────── */

  /* عنوانُ المنهج: اسمُ الطالبِ له إن سمّاه، وإلّا فنطاقُه — لا اسمُ
     نوعِه، فإنّ «تلاوة / تلاوة» سطرٌ يكرّر نفسَه ولا يُفيد شيئًا. */
  function nameOf(p) {
    var t = (p.title || '').trim();
    if (t) return t;
    try { return P.titleFor(p); } catch (e) { return (P.KINDS[p.kind] || {}).t || 'منهج'; }
  }

  function btn(cls, html, label, fn) {
    var b = App.el('button', cls, html);
    b.type = 'button';
    if (label) b.setAttribute('aria-label', label);
    b.onclick = fn;
    return b;
  }

  /* بعد إعادة الرسم يذهب التركيزُ إلى أوّل الصفحة، وهذا يُفقد
     المُستعملَ موضعَه. فنُعلّم الزرَّ البديلَ ونعيد إليه البؤرة. */
  var FK = null;
  function redrawTo(k) {
    FK = k || null;
    App.redraw();
  }
  App.on_('drawn', function (e) {
    if (!FK || !e || e.name !== 'home') { FK = null; return; }
    var n = App.$('[data-fk="' + FK + '"]');
    FK = null;
    if (n) { try { n.focus({ preventScroll: true }); } catch (_) { n.focus(); } }
  });

  function kindOf(p) { return P.KINDS[p.kind] || P.KINDS.hifz; }

  /* التحيّةُ من بنك العبارات في 35-words.js: كانت خمسَ جملٍ ثابتةٍ
     تعرف الساعةَ ولا تعرف صاحبَها — فلا تُفرّق بين أوّل يومٍ وعودةٍ
     بعد انقطاعٍ ويومٍ موصول، ولا تُبدّل كلمتَها فتُملّ. */
  function greeting(nm) { return App.Words.greet(nm); }

  /* مجموعُ الأيّام التي سُجّل فيها شيءٌ في أيّ منهج — تُستعمل للعلامات */
  function loggedDays() {
    var m = {};
    (App.state.plans || []).forEach(function (p) {
      var g = p.log || {};
      for (var k in g) if (g[k] > 0) m[k] = true;
    });
    return m;
  }

  /* ── ١ · الترويسة ─────────────────────────────────────────────── */
  function header() {
    var nm = (App.state.profile && App.state.profile.name) || '';
    var h = App.el('header', 't-head');
    var g = App.el('h1', 't-greet');
    g.textContent = greeting(nm);
    var d = new Date();
    var dt = App.el('p', 't-date');
    /* الفاصلةُ العربيّةُ لا النقطةُ الوسطى: «·» قبل رقمٍ هنديٍّ تُقرأ
       صفرًا، فتصير «· ٢٩» في العين «٢٩٠». */
    dt.textContent = App.DAY_NAME[d.getDay()] + '، ' + App.ar(App.hijri(d));

    var txt = App.el('div', 't-htxt');
    txt.appendChild(g);
    txt.appendChild(dt);
    h.appendChild(txt);

    /* لا زرَّ في الترويسة بعدَ اليوم: صار لكلِّ قسمٍ لسانُه في الشريط،
       ومدخلان لموضعٍ واحدٍ حَيرةٌ لا سَعة. */
    return h;
  }

  /* ── الحلقة ───────────────────────────────────────────────────── */
  var C = 2 * Math.PI * 19;   /* محيطُ دائرةٍ نصفُ قطرها ١٩ في مربّعِ ٤٤ */
  function ring(pc) {
    var off = C * (1 - Math.max(0, Math.min(100, pc)) / 100);
    var s = '<svg class="t-ring" viewBox="0 0 44 44" role="img" aria-label="' +
      'أُنجز ' + App.ar(pc) + '٪ من المنهج">' +
      '<circle class="t-trk" cx="22" cy="22" r="19" fill="none"/>' +
      '<circle class="t-arc" cx="22" cy="22" r="19" fill="none" stroke-dasharray="' +
      C.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"/>' +
      /* النقشُ يُنقَر فوق القوس بلون السطح، والنصُّ بعده ليبقى فوقَهما */
      '<circle class="t-pat kring-pat" cx="22" cy="22" r="19"/>' +
      '<text x="22" y="22" text-anchor="middle" dominant-baseline="central">' +
      App.ar(pc) + '٪</text></svg>';
    var w = App.el('div', null, s);
    return w.firstChild;
  }

  function bar(pc) {
    var b = App.el('div', 't-bar');
    b.setAttribute('role', 'progressbar');
    b.setAttribute('aria-valuemin', '0');
    b.setAttribute('aria-valuemax', '100');
    b.setAttribute('aria-valuenow', String(pc));
    b.setAttribute('aria-label', 'نسبةُ الإنجاز');
    /* kfill يحمل لونَ النوعِ ونسيجَه، فالشريطُ يقول النوعَ كما يقول القدر */
    var i = App.el('i', 'kfill');
    i.style.width = pc + '%';
    b.appendChild(i);
    return b;
  }

  /* هل يُمكن فتحُ الصفحة؟ المصحفُ وحدةٌ مستقلّةٌ قد تَغيب في بناءٍ
     مخفَّف، والمحتوى قد لا يكون حُمِّل بعد — فلا يُعرض بابٌ لا يُفتَح. */
  function pill(txt, cls, fn, label) {
    var b = App.el('button', cls, '');
    b.type = 'button';
    b.textContent = txt;
    if (label) b.setAttribute('aria-label', label);
    b.onclick = fn;
    return b;
  }

  function canTasmee() {
    return !!(App.Quran && window.__screens && window.__screens.tasmee);
  }

  function canRead() {
    return !!(App.Quran && window.__screens && window.__screens.qpage);
  }

  /* نصُّ المقدار: «من صفحة … إلى …» كما يُفهم في المصحف */
  function portionText(r) {
    if (!r) return null;
    if (r.from === r.to) return 'صفحة ' + App.ar(r.from);
    return 'من صفحة ' + App.ar(r.from) + ' إلى ' + App.ar(r.to);
  }

  /* ── ٢ · ورد اليوم ────────────────────────────────────────────── */

  /* يُعرض ما وجب اليومَ، ويبقى المنهجُ معروضًا إن سُجّل اليومَ وتمّ،
     لأنّ إخفاءَه بعد ضغطةِ «أتممتُ» يُربك ويمنع التراجع. */
  function todayPlans(plans) {
    var a = plans.filter(function (p) { return P.isDueToday(p) || P.doneToday(p) > 0; });
    a.sort(function (x, y) { return (P.doneToday(x) > 0 ? 1 : 0) - (P.doneToday(y) > 0 ? 1 : 0); });
    return a;
  }

  function complete(p) {
    var n = P.markDone(p);
    if (n > 0) {
      /* كلمةُ الإنجاز تُسمّي المنهجَ بعينه، وتعرف أهو آخرُ وردِ اليوم
         أم واحدٌ منه، وتُقدّم المحطّةَ إن بلغها — أوّلَ صفحةٍ أو آخرَ
         جزءٍ أو أسبوعًا موصولًا. */
      App.toast(App.Words.done(p, n));
      /* لحظةُ الإتمام قبل إعادةِ الرسم: وحدةُ 26-joy تلتقط موضعَ الزرّ
         من الشجرة قبل أن يُمحى، ثمّ ترسم فوق الصفحة لا فيها. */
      if (App.Joy) App.Joy.mark(p, n);
      redrawTo('undo-' + p.id);
    }
  }
  function revert(p) {
    var n = P.undoToday(p);
    if (n > 0) {
      App.toast(App.Words.undone());
      redrawTo('do-' + p.id);
    }
  }

  /* البطاقةُ الكبرى */
  function dayCard(p) {
    var k = kindOf(p), pc = P.pct(p), r = P.todayRange(p), did = P.doneToday(p);

    /* صنفُ النوعِ على البطاقة: ما بداخلها يَرِث --kind، والحافّةُ تقول
       النوعَ بشكلٍ لا بلونٍ وحدَه */
    var card = App.el('article', 'card t-day kedge ' + P.kindCls(p));
    var inn = App.el('div', 't-in');

    var top = App.el('div', 't-top');
    var txt = App.el('div', 't-txt');
    /* الشارةُ كانت أيقونةً وكلمةً: «حفظ» مكتوبةً وبجانبها رمزُ الحفظ.
       والرمزُ لا يَزيد على الكلمةِ شيئًا، وإنّما يُزاحمها. فالكلمةُ
       وحدَها، ولونُ الشارةِ يَحمل النوعَ كما كان يَحمله. */
    var kd = App.el('div', 't-kind kchip');
    kd.appendChild(document.createTextNode(k.t));
    txt.appendChild(kd);
    var ttl = App.el('h2', 't-title');
    ttl.textContent = nameOf(p);
    txt.appendChild(ttl);
    top.appendChild(txt);
    top.appendChild(ring(pc));
    inn.appendChild(top);

    /* فِعلانِ لا فعل: القراءةُ والتسميع. وكان الموضعُ كلُّه زرًّا
       واحدًا يَفتح المصحفَ، والتسميعُ مدفونٌ في ذيلِ الصفحةِ تحتَ
       لوحِ التلاوة — حتّى ظنَّ صاحبُ التطبيقِ أنّه ليس فيه. وهو
       عنده جوهرُ الأمر: أن يُسمّع الطالبُ لنفسِه ويَسمع نفسَه.

       فصار الموضعُ لوحًا يَحمل زرَّين مُسمَّيَين، ولم يَبقَ فعلٌ
       مُضمَرٌ في لمسةٍ على سطر. وزرٌّ باسمِه خيرٌ من موضعٍ يُلمَس
       فيَقع منه ما لا يُتوقَّع. */
    var open = r && canRead();
    var por = App.el('div', 't-port' + (open ? ' t-open' : ''));
    if (r) {
      var t = App.el('span', 't-ptxt');
      t.innerHTML = '<span class="t-pg">' + portionText(r) + '</span>' +
        '<span class="t-cnt">' + App.ar(r.count) +
        (r.count === 1 ? ' صفحة' : ' صفحات') + ' · بقي ' +
        App.ar(P.total(p) - (p.done || 0)) + ' من ' + App.ar(P.total(p)) + '</span>';
      por.appendChild(t);
    } else {
      por.innerHTML = '<span class="t-pg">اكتمل المنهجُ كلُّه</span>';
    }
    inn.appendChild(por);

    /* ══ العملُ أوّلًا، والتسجيلُ بعده ══════════════════════════════
       كان «أتممتُ» أكبرَ ما في البطاقةِ وأخضرَه، و«اقرأ» و«سمِّع»
       حبّتَين صغيرتَين في لوحٍ داخليّ. فأوّلُ ما تَقع عليه العينُ
       زرُّ تسجيلٍ، والعملُ نفسُه — أن يَقرأ ويُسمّع — في الحاشية.
       وقال صاحبُ التطبيقِ مرّتين: لِمَ أتعب حتّى أجد المصحفَ
       والتسميع؟ والحقُّ معه: هذا تطبيقُ حفظٍ لا دفترُ حسابات.

       فصار الفعلانِ صفًّا أوّلَ بعرضِ البطاقة، و«أتممتُ» تحتَهما
       مُفرَّغًا — يُرى ولا يُزاحم. ومَن فرغ من وِردِه يَجده حيث
       تركه، ومَن لم يَبدأ يَرى أوّلًا ما يَبدأ به. */
    if (r && (canRead() || canTasmee())) {
      var go2 = App.el('div', 't-go2');
      if (canRead()) {
        go2.appendChild(pill('اقرأ', 't-go t-go-read', function () {
          App.go('qpage', { p: r.from });
        }, 'اقرأ ' + portionText(r)));
      }
      if (canTasmee()) {
        go2.appendChild(pill('سمِّع', 't-go t-go-tas', function () {
          App.go('tasmee', { p: r.from });
        }, 'سمِّع ' + portionText(r) + ' من حفظك'));
      }
      inn.appendChild(go2);
    }

    var act = App.el('div', 't-act');
    if (did > 0) {
      var ok = App.el('div', 't-ok t-grow',
        App.icon('check', 20) + '<b>' + App.Words.doneBadge(p) + '</b> <span>' +
        App.ar(did) + (did === 1 ? ' صفحة' : ' صفحات') + '</span>');
      ok.setAttribute('role', 'status');
      act.appendChild(ok);
      var u = btn('t-ib t-ok-b', App.icon('undo', 21), App.Words.undoAria('اليوم'), function () { revert(p); });
      u.setAttribute('data-fk', 'undo-' + p.id);
      act.appendChild(u);
    } else {
      /* الزرُّ الأوّلُ لا يَحتاج علامةَ صحٍّ تَشرحه: هو أكبرُ ما في
         البطاقةِ وأوضحُه، والكلمةُ عليه تامّة. */
      var b = btn('t-btn t-f t-grow t-rec', '<span>أتممتُ</span>',
        'أتممتُ وردَ اليوم من ' + nameOf(p), function () { complete(p); });
      b.setAttribute('data-fk', 'do-' + p.id);
      act.appendChild(b);
    }
    /* المشاركةُ ليست من عملنا: تُعرض إن وُجدت وحدتُها وتُسقط إن غابت */
    if (window.IrtaqiShare && typeof window.IrtaqiShare.dayCard === 'function') {
      act.appendChild(btn('t-ib', App.icon('share', 21), 'مشاركةُ بطاقةِ اليوم', function () {
        try { window.IrtaqiShare.dayCard(); } catch (_) {}
      }));
    }
    /* بعضُ الوِردِ وزلَلُه ليسا من عملنا: 52-partial.js تُعلّق زرَّها
       في صفِّ الأفعالِ وشريطَ زللِها في البطاقة، وتُسقط إن غابت */
    if (App.Partial) App.Partial.card(inn, act, p);
    inn.appendChild(act);
    card.appendChild(inn);
    return card;
  }

  /* الصفوفُ المضغوطة لبقيّة ورد اليوم */
  function dayRow(p) {
    var k = kindOf(p), r = P.todayRange(p), did = P.doneToday(p);
    var row = App.el('div', 't-row kedge ' + P.kindCls(p) + (did > 0 ? ' is-ok' : ''));
    row.appendChild(App.el('div', 't-em kemb', App.icon(did > 0 ? 'check' : k.icon, 19)));
    var mid = App.el('div', 't-mid');
    var nm = App.el('div', 't-nm');
    nm.textContent = nameOf(p);
    mid.appendChild(nm);
    var sub = App.el('div', 't-sub');
    sub.textContent = did > 0
      ? k.t + ' · أُتمّ ' + App.ar(did) + (did === 1 ? ' صفحة' : ' صفحات')
      : k.t + ' · ' + (portionText(r) || 'اكتمل');
    mid.appendChild(sub);
    row.appendChild(mid);
    /* الأفعالُ في وعاءٍ واحد: به تَنزل مجتمعةً إلى سطرٍ ثانٍ إذا ضاق
       الأوّل، ولا يَتفرّق بعضُها فوقَ بعضِها. */
    var acts = App.el('div', 't-acts');
    if (r && canRead()) {
      acts.appendChild(btn('t-ib', App.icon('book', 19),
        'اقرأ ' + portionText(r), function () { App.go('qpage', { p: r.from }); }));
    }
    if (App.Partial) App.Partial.row(acts, p);  /* زرُّ «بعضُه» — 52-partial.js */
    var b;
    if (did > 0) {
      b = btn('t-ib t-ok-b', App.icon('undo', 21), App.Words.undoAria(nameOf(p)), function () { revert(p); });
      b.setAttribute('data-fk', 'undo-' + p.id);
    } else {
      b = btn('t-ib t-pri', App.icon('check', 21), 'أتممتُ ' + nameOf(p), function () { complete(p); });
      b.setAttribute('data-fk', 'do-' + p.id);
    }
    acts.appendChild(b);
    row.appendChild(acts);
    return row;
  }

  /* إن لم يكن اليومُ يومَ وردٍ فالخبرُ أنفعُ من الفراغ: متى الوردُ القادم */
  function nextDueText(plans) {
    var live = plans.filter(function (p) { return (p.done || 0) < P.total(p) && p.days && p.days.length; });
    if (!live.length) return null;
    var d = new Date(); d.setHours(12, 0, 0, 0);
    for (var i = 1; i <= 14; i++) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      var hit = live.filter(function (p) { return p.days.indexOf(dow) >= 0; });
      if (hit.length) return App.DAY_NAME[dow] + ' · ' + (hit[0].title || kindOf(hit[0]).t);
    }
    return null;
  }

  /* القسمُ لا يحمل عنوانًا في داخله: لسانُه عنوانُه، وتكرارُ الاسمِ
     سطرٌ يأكل من الشاشة ما جئنا نوفّره. */
  function pane() { return App.el('section', 'sec'); }

  function wardPane(plans) {
    var s = pane();
    var due = todayPlans(plans);
    if (!due.length) {
      var allDone = plans.every(function (p) { return (p.done || 0) >= P.total(p); });
      var nx = nextDueText(plans);
      var r = App.el('div', 't-rest');
      r.innerHTML = allDone
        ? '<p>' + App.Words.allDoneLine() + '</p>'
        : '<p>' + App.Words.restLine() +
          (nx ? '<br>الوردُ القادم: <b>' + nx + '</b>' : '') + '</p>';
      s.appendChild(r);
      return s;
    }
    s.appendChild(dayCard(due[0]));
    if (due.length > 1) {
      /* الصفوفُ في وعاءٍ واحد: تباعُدُها من t-row+t-row وحدَه، فلو
         صارت أبناءَ القسمِ مباشرةً لأُضيف إليه فراغُ gap مرّةً ثانية. */
      var rest = App.el('div');
      due.slice(1).forEach(function (p) { rest.appendChild(dayRow(p)); });
      s.appendChild(rest);
    }
    return s;
  }

  /* ── ٣ · المواظبة ─────────────────────────────────────────────────
     رقمٌ موقَّرٌ وسبعُ علامات. لا لهبَ ولا أوسمةَ ولا لغةَ لعبٍ: الباعثُ
     هو الوِردُ نفسُه، والعدُّ خبرٌ لا مكافأة. */
  function keepPane() {
    var s = pane();
    var card = App.el('article', 'card');
    var n = P.streak(), logs = loggedDays();

    var row = App.el('div', 't-keep');
    var num = App.el('div', 't-num');
    var big = App.el('span', 't-n');
    big.textContent = App.ar(n);
    num.appendChild(big);
    var u = App.el('span', 't-u');
    /* تمييزُ العدد: من ثلاثةٍ إلى عشرةٍ جمعٌ مجرور («أيّامٍ متّصلة»)،
       ومن أحدَ عشرَ فصاعدًا مفردٌ منصوب («يومًا متّصلًا»). وكانت
       الصيغةُ الأخيرةُ تُستعمل للثلاثة فيُقرأ «٣ يومًا» ويَلحن. */
    u.textContent = n === 1 ? 'يومٌ متّصل'
      : n === 2 ? 'يومان متّصلان'
      : (n <= 10 ? 'أيّامٍ متّصلة' : 'يومًا متّصلًا');
    num.appendChild(u);
    row.appendChild(num);
    var note = App.el('p', 't-note');
    /* هنا تقع كلمةُ التعثّر: الغيابُ يُسمّى بمدّته وتُعرَض الخطوةُ
       الصغيرةُ التي يَقدر عليها اليوم — بلا توبيخٍ ولا شفقة. وهنا
       أيضًا محطّتا الأسبوع والأربعين، لأنّهما وجهان لسؤالٍ واحد. */
    note.textContent = App.Words.keepNote(n);
    row.appendChild(note);
    card.appendChild(row);

    var ul = App.el('ul', 't-marks');
    ul.setAttribute('aria-label', 'أيّامُ آخرِ أسبوع');
    var d = new Date(); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - 6);          /* الأقدمُ أوّلًا ليجري الزمنُ مع القراءة */
    for (var i = 0; i < 7; i++) {
      var key = App.dateKey(d), on = !!logs[key], today = i === 6;
      var li = App.el('li', today ? 'now' : null);
      var dot = App.el('span', 't-dot' + (on ? ' on' : ''));
      li.appendChild(dot);
      var lb = App.el('span', 't-dl');
      lb.textContent = App.DAY_SHORT[d.getDay()];
      lb.setAttribute('data-dow', d.getDay());
      li.appendChild(lb);
      li.setAttribute('aria-label', (today ? 'اليوم ' : '') + App.DAY_NAME[d.getDay()] +
        ' · ' + (on ? 'أُنجز' : 'لم يُنجَز'));
      ul.appendChild(li);
      d.setDate(d.getDate() + 1);
    }
    card.appendChild(ul);
    fitDays(ul);
    s.appendChild(card);
    return s;
  }

  /* ══ الأيّامُ بأسمائها: قياسٌ بعد الرسمِ لا رقمٌ مُوفَّق ══════════
     طُلبت الأسماءُ كاملةً، وأضيقُ عمودٍ في شاشةِ ٣٦٠ ثلاثةٌ وثلاثون
     بكسلًا، و«الخميس» باثنين وثلاثين — فالفاصلُ بكسلٌ ونصف. وهذا
     ليس تصميمًا بل حظٌّ: فإن رفع القارئُ حجمَ الخطِّ في متصفّحه، أو
     فرض كرومُ أندرويد حدَّه الأدنى، أو تأخّر خطُّ التطبيقِ فحلَّ
     غيرُه — فاض الاسمُ عن عمودِه وانكسر بين حروفه. وقد وقع عند
     مستخدمٍ بعينه، ورأيتُه في صورته.

     فالعلاجُ ثلاثُ طبقاتٍ لا طبقة: يُمنَع الكسرُ أصلًا، ثمّ يُقاس
     أعرضُ اسمٍ بعد الرسمِ فيُصغَّر الخطُّ حتّى يَسَعه عمودُه، فإن بلغ
     الصغرُ حدَّه ولم يَسَعْ — وذلك حين يَفرض المتصفّحُ حدًّا لا
     نَملك خفضَه — رُدَّت الأسماءُ إلى حروفها الأُوَل، وهي تَسَع كلَّ
     حال. فالأسوأُ الممكنُ حرفٌ مقروء، لا عمودٌ مُبهَم.

     ويُعاد القياسُ بعد أن يَحضر الخطّ: عرضُ الكلمةِ يَكبر حين يَحلّ
     خطُّ التطبيقِ محلَّ خطِّ النظام، فقياسٌ قبلَه قياسٌ لغيرِ ما يُرى. */
  function fitDays(ul) {
    var lab = ul.querySelectorAll('.t-dl');
    if (!lab.length) return;
    var tries = 0;

    function letters() {
      for (var i = 0; i < lab.length; i++) {
        var d = lab[i].getAttribute('data-dow');
        if (d != null) lab[i].textContent = App.DAY_LETTER[+d] || lab[i].textContent;
      }
      ul.style.removeProperty('--dl');
    }

    function step() {
      if (!ul.isConnected || !ul.children.length) return;
      var col = ul.children[0].getBoundingClientRect().width;
      if (col <= 0) return;
      var max = 0, i, w;
      for (i = 0; i < lab.length; i++) {
        w = lab[i].getBoundingClientRect().width;
        if (w > max) max = w;
      }
      if (max <= col - 0.5) return;              /* وَسِعها عمودُها */
      if (tries >= 3) { letters(); return; }
      tries++;
      var cur = parseFloat(getComputedStyle(lab[0]).fontSize) || 10;
      var next = cur * (col / max) - 0.3;
      if (next < 8) { letters(); return; }
      ul.style.setProperty('--dl', next.toFixed(1) + 'px');
      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
    try {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { tries = 0; step(); });
      }
    } catch (e) {}
    setTimeout(function () { tries = 0; step(); }, 600);
  }

  /* ── ٤ · مناهجي ───────────────────────────────────────────────── */
  function planRow(p) {
    var k = kindOf(p), pc = P.pct(p), pr = P.project(p);
    var b = App.el('button', 't-pl kedge ' + P.kindCls(p));
    b.type = 'button';
    /* السَّنةُ تُحذَف من الصفّ المختصر: «١٤٤٨ هـ» كانت تَيْتَم في سطرٍ
       وحدَها فتُطيل البطاقةَ بلا فائدة — والمنهجُ يَختم قبل حَوْلٍ في
       الغالب، والسَّنةُ كاملةٌ في صحيفة المنهج حيث يتّسع السطر.
       أمّا قارئُ الشاشة فيَسمع التاريخَ تامًّا: السَّمعُ لا يضيق. */
    var finFull = pr.bad ? pr.bad
      : (pr.left === 0 ? 'اكتمل' : 'يُتمّ في ' + App.ar(pr.hij));
    var fin = pr.bad || pr.left === 0 ? finFull
      : 'يُتمّ في ' + App.ar(String(pr.hij).replace(/\s*\d+\s*هـ\s*$/, '')
                            .replace(/\s*[٠-٩]+\s*هـ\s*$/, '').trim());
    b.setAttribute('aria-label', App.join(k.t, nameOf(p),
      'أُنجز ' + App.ar(pc) + '٪', finFull));
    b.onclick = function () { App.go('plan', { id: p.id }); };

    b.appendChild(App.el('div', 't-em kemb', App.icon(k.icon, 19)));
    var mid = App.el('div', 't-mid');
    var nm = App.el('div', 't-nm');
    nm.textContent = nameOf(p);
    mid.appendChild(nm);
    var sub = App.el('div', 't-sub');
    sub.textContent = k.t + ' · ' + fin;
    mid.appendChild(sub);
    mid.appendChild(bar(pc));
    b.appendChild(mid);
    var pcEl = App.el('div', 't-pc');
    pcEl.textContent = App.ar(pc) + '٪';
    b.appendChild(pcEl);
    b.appendChild(App.el('div', 't-chev', App.icon('chevron', 19)));
    return b;
  }

  function plansPane(plans) {
    var s = pane();
    var box = App.el('div');
    plans.forEach(function (p) { box.appendChild(planRow(p)); });
    s.appendChild(box);
    var add = btn('t-btn t-g t-s', App.icon('add', 20) + '<span>' + App.Words.addPlan() + '</span>',
      App.Words.addPlanAria(), function () { App.go('builder'); });
    s.appendChild(add);
    return s;
  }

  /* ── البداية ──
     كانت هنا «صفحةٌ مُذهَّبةٌ» مرسومةٌ بالشيفرة، وهي شعارٌ ثالثٌ لارتقِ
     بعد خاتمِ الطالب وإسليميِّ الطالبة. أُزيلت الثلاثةُ وبقي شعارٌ
     واحدٌ هو المصحف، يُرسم من App.mark إن رُفع. */

  /* ── مثالُ اليوم ──────────────────────────────────────────────
     الشاشةُ الفارغةُ كانت شعارًا وجملةً وزرًّا وبحرًا من فراغ، فلا
     يرى الداخلُ ما الذي يصير إليه إن ضغط. فيُعرض له يومٌ واحدٌ
     كاملٌ كما سيكون: صفوفُ وردٍ بألوان أنواعها، مبنيّةٌ من منهجيّة
     «الجَمْع» نفسِها لا مرسومةٌ تمثيلًا — فما يراه هو ما يُنشأ.

     ويُعلَّم أنّه مثالٌ تعليمًا لا يُخطئه أحد: شارةٌ فوقه، وأزرارُه
     معطَّلةٌ مخفيّةٌ عن قارئ الشاشة، فلا يُظنّ وردًا لم يُسجَّل. */
  function pagesPhrase(n) {
    if (n === 1) return 'صفحةٌ واحدة';
    if (n === 2) return 'صفحتان';
    if (n % 100 >= 3 && n % 100 <= 10) return App.ar(n) + ' صفحات';
    return App.ar(n) + ' صفحة';
  }

  /* مثالُ اليومِ يُبنى من الشاشةِ نفسِها على حالةٍ مُعارة، بعد أن
     كان صفوفًا تُركَّب يدويًّا من منهجيّةٍ واحدة: اليدويُّ يَشرد عن
     الحقيقيِّ كلّما تغيّر صفُّ الورد، والمُعارُ هو الحقيقيُّ بعينِه. */
  function sampleDay() {
    if (!App.Example) return null;
    /* بطاقةٌ واحدةٌ لا بطاقتان: المثالُ يَقول «هكذا يبدو يومُك»،
       وبطاقةٌ واحدةٌ تَقوله تامًّا. والثانيةُ تُكرّره وتُخرج شاشةَ
       أوّلِ مرّةٍ عن حدِّها فتَحتاج تمريرًا — وأوّلُ شاشةٍ تُرى
       أَولى الشاشاتِ بأن تَسَع نفسَها. */
    var rows = App.Example.borrow(function () {
      var all = App.state.plans || [], one = [], i;
      for (i = 0; i < all.length && !one.length; i++) {
        if (!App.Plans.isDueToday || App.Plans.isDueToday(all[i])) one.push(all[i]);
      }
      return wardPane(one.length ? one : all.slice(0, 1));
    });
    if (!rows) return null;
    return App.Example.frame('هكذا يبدو يومُك بعد أربعين يومًا', rows,
      App.Words.demoNote());
  }

  function emptyState() {
    var w = App.el('div', 'screen t-empty empty');
    /* كان ههنا شعارٌ بمئةٍ وأربعين. ولمّا صار الشعارُ في صدر كلِّ
       صفحةٍ صارا شعارَين في شاشةٍ واحدةٍ لا يَفصل بينهما إلّا فراغ.
       فبَقي الأوّلُ وحدَه. */
    var h = App.el('h1');
    h.textContent = App.Words.emptyTitle();
    w.appendChild(h);
    var p = App.el('p');
    p.textContent = App.Words.emptyLede();
    w.appendChild(p);
    w.appendChild(btn('t-btn t-f t-cta', App.icon('add', 20) + '<span>' + App.Words.emptyCta() + '</span>',
      App.Words.emptyCtaAria(), function () { App.go('builder'); }));
    var ex = sampleDay();
    if (ex) w.appendChild(ex);
    return w;
  }

  /* ── الشاشة ───────────────────────────────────────────────────
     كانت ثلاثةَ ألسنةٍ داخل لسان: شريطٌ أعلى الشاشة وشريطٌ أسفلها،
     وكلُّ لسانٍ فيه بطاقةٌ واحدةٌ ونصفُ شاشةٍ سواد. والتنقّلُ صار
     كلُّه في الشريط السفليّ، فلا معنى لشريطٍ ثانٍ فوقه.

     فصُفّيت في صفحةٍ واحدة، فطالت إلى شاشةٍ ونصف: يُسجَّل الوردُ في
     أعلاها ويُقرأ أثرُه في أسفلِها، فلا يُرى الأمران معًا.

     والقسمةُ الآن لسانان لا ثلاثة، ولكلٍّ منهما ملءُ شاشةٍ وشُغلٌ
     قائمٌ بنفسه: «وِردي» فِعلُ اليوم ومواظبتُه، و«مناهجي» جردُ ما
     التزمتَه. والتحيّةُ فوقهما لأنّها لا تخصّ أحدَهما.

     ولسانٌ يُلمَس لا يُسحَب: لا انتقالَ باليمينِ والشمالِ — العربيّةُ
     تَقلب معنى الجهتَين، ومن سحبَ فقد لا يعرف أين وقع. */
  var TAB = 'ward';

  App.screen('home', function () {
    styleOnce();
    var plans = App.state.plans || [];
    if (!plans.length) return emptyState();

    var w = App.el('div', 'screen');
    w.appendChild(header());
    w.appendChild(App.seg([
      { key: 'ward', label: 'وِردُ اليوم', icon: 'check', render: function () {
          var d = App.el('div');
          d.appendChild(wardPane(App.state.plans || []));
          d.appendChild(keepPane());
          return d;
        } },
      { key: 'plans', label: 'مناهجي', icon: 'bookmark', render: function () {
          return plansPane(App.state.plans || []);
        } }
    ], { cls: 't-seg', start: TAB, onchange: function (k) { TAB = k; } }));
    return w;
  });

  App.tab('home', 'اليوم', 'home');
})(window.App);

/* ══ 52-partial.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   52-partial.js — بعضُ الوِرد، وزلَلُ الصفحات
   ───────────────────────────────────────────────────────────────────
   كان التسجيلُ كلَّ الوِردِ أو لا شيء: من قرأ ثلاثًا من خمسٍ إمّا
   سجّل الخمسَ فكذَب على نفسه، أو لم يُسجّل شيئًا فخسِر يومَه
   ومواظبتَه. وكِلا الأمرَين يُفسد البياناتَ التي تُبنى عليها
   الحلقةُ والمحطّاتُ وخريطةُ المصحف.

   فهنا بابان:

   ١ · «بعضُه» — قوسٌ يُدار بالإبهام أسفلَ الشاشة، وفي وسطِه زرُّ
       التسجيل. ولا تَلزمه العينُ: القوسُ عريضٌ (٣٤ بكسلًا) يُزحَف
       عليه زحفًا ولا يُقصَد نقطةً، والرقمُ الكبيرُ في وسطِه يقول
       ما بلغ، والسطرُ الحيُّ فوقه يقول إلى أيِّ صفحةٍ وصل. ولأنّ
       الصفحةَ عربيّةٌ فأوّلُ القوسِ عن اليمين.

       والحالةُ الغالبةُ — من أتمّ وِردَه كلَّه — تبقى كما كانت:
       لمسةٌ واحدةٌ على «أتممتُ»، وهذا بابٌ ثانٍ لا يَعترضها.

   ٢ · «الزلل» — صفحةٌ زلَّ فيها اللسانُ تُعلَّم فتُقدَّم في
       المراجعة، وتُعرَض في صدرِ وِردِها. وتُمحى من تلقائها إذا
       مرّت الصفحةُ في تسجيلٍ تالٍ بلا زلّة — فالسجلُّ يتبع الحالَ
       ولا يُراكم ذنوبًا.

   ولا يُكتب في الحالة شيءٌ جديدٌ في المنهج: المقدارُ يُسجَّل
   بـ‎markDone‎ نفسِها (‎plan.done‎ و‎plan.log[يوم]‎)، والزلَلُ وحدَه
   في ‎state.slips‎ — وهو موضعُ شاشةِ التسميع، فتُقرأ صيغتُها كما
   وجدناها ويُكتَب فيها بصيغتها لا بصيغتنا.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var P = App.Plans;
  var PAGES = (App.Quran && App.Quran.PAGES) || 604;
  /* سعةٌ للسجلّ: لا يَنمو بلا حدٍّ في خزنٍ محدود */
  var CAP = 400;

  /* ── أنماطُ هذه الوحدة وحدَها، بسابقة bw- ───────────────────────
     ولا لونَ حرفيًّا: رموزُ الهويّة وحدَها، فتَتبدّل مع الهويّتَين
     والسِّمتَين بلا سطرٍ ثانٍ. */
  var CSS = [
    '.bw-ctx{display:flex;align-items:center;gap:11px;flex-wrap:wrap}',
    '.bw-ctx .bw-nm{font-size:16px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}',
    '.bw-ctx .bw-pg{flex:1 1 100%;margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-mut)}',

    /* السطرُ الحيُّ فوق القوس لا تحته: اليدُ تَحجب ما تحت الإبهام */
    '.bw-read{margin:0;text-align:center;font-size:15px;font-weight:700;'
      + 'line-height:1.6;color:var(--ink)}',

    '.bw-sec .bw-t{margin:0;font-size:14.5px;font-weight:700;color:var(--ink)}',
    '.bw-sec .bw-h{margin:5px 0 0;font-size:13px;line-height:1.75;color:var(--ink-mut)}',
    '.bw-chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 0;padding:0;list-style:none}',
    /* رقمُ الصفحةِ وحدَه في الرقاقة ليَضيق عرضُها فتُسَعَ خمسٌ في سطر،
       والمعنى في عنوانِ القسمِ وفي ‎aria-label‎ لمن لا يرى. */
    '.bw-chip{min-width:66px;padding-inline:14px;font-variant-numeric:tabular-nums}',
    /* زلّةٌ سابقةٌ تُعلَّم بحدٍّ لا بلونٍ وحدَه، وتبقى الرقاقةُ غيرَ
       مكبوسةٍ لأنّ الكبسَ خبرُ هذه الجلسةِ لا خبرُ ما مضى. */
    '.bw-chip.bw-was{box-shadow:inset 0 0 0 1.5px var(--warn)}',
    /* وكبسُ اليومِ يَغلب علامةَ الأمس: الصنفانِ متساويان في الرجحان،
       فيُكتَب المكبوسُ بعدَه ليَعلوَ عليه. */
    '.bw-chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}',
    '.bw-past{margin-top:11px}',
    '.bw-past .pill{margin-inline-start:6px;font-variant-numeric:tabular-nums}',

    /* الصحيفةُ تَملأ الشاشةَ ليُدفَع القوسُ إلى أسفلِها: هناك يقع
       الإبهامُ وهو قابضٌ على الهاتف، فلا تُرفَع اليدُ ولا تُرفَع
       العينُ عن المصحف. */
    '.bw{min-height:calc(100svh - 132px)}',
    /* القوس: صندوقُه بنسبةٍ ثابتةٍ ليَثبُت مركزُه مهما ضاق العرض،
       فيَقع زرُّ الوسطِ على المركزِ بالنسبة المئويّة لا بالبكسل. */
    '.bw-dial{position:relative;width:100%;max-width:300px;margin-top:auto;margin-inline:auto}',
    '.bw-arc{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}',
    '.bw-trk{fill:none;stroke:var(--hair);stroke-width:34;stroke-linecap:round}',
    '.bw-fill{fill:none;stroke:var(--accent);stroke-width:34;stroke-linecap:round}',
    /* المواقفُ تُنقَر بلون الأرضِ فوق القوس: حِسٌّ للعين ولا لونَ ثالث */
    '.bw-tick{fill:var(--ground)}',
    '.bw-knob{fill:var(--ground);stroke:var(--accent-2);stroke-width:4}',
    '.bw-arc:focus-visible{outline:2.5px solid var(--gold-lit);outline-offset:2px;'
      + 'border-radius:var(--r-md)}',

    /* زرُّ الوسط: مركزُ القوسِ أقربُ موضعٍ إلى الإبهام، فجُعل فيه
       الفعلُ لا في زرٍّ أسفلَ الشاشةِ يُقصَد بالنظر. */
    '.bw-hub{position:absolute;left:50%;top:71.7%;transform:translate(-50%,-50%);'
      + 'width:104px;height:104px;border-radius:var(--r-pill);display:flex;'
      + 'flex-direction:column;align-items:center;justify-content:center;gap:1px;'
      + 'border:0;font:inherit;cursor:pointer;'
      + 'background:linear-gradient(180deg,var(--accent),var(--accent-2));'
      + 'color:var(--on-accent);box-shadow:0 10px 24px -14px var(--shade-3),var(--lift)}',
    '.bw-hub .bw-v{font-size:34px;font-weight:800;line-height:1;'
      + 'font-variant-numeric:tabular-nums}',
    '.bw-hub .bw-of{font-size:12px;font-weight:700;line-height:1.3}',
    '.bw-hub .bw-go{font-size:12.5px;font-weight:700;line-height:1.3}',
    '.bw-hub:focus-visible{outline:2.5px solid var(--gold-lit);outline-offset:3px}',
    /* بلا قوسٍ (وِردُ صفحةٍ واحدةٍ لا يُقسَم): الزرُّ وحدَه في موضعه */
    '.bw-dial.bw-solo{max-width:none;display:flex;justify-content:center;padding:6px 0 2px}',
    '.bw-dial.bw-solo .bw-hub{position:static;transform:none}',

    /* شريطُ الزلل على بطاقةِ اليوم: خبرٌ وعملٌ، لا توبيخ */
    '.bw-slip{margin:12px 0 0;padding:11px 13px;border-radius:var(--r-md);'
      + 'background:var(--surface-2);border:1px solid var(--hair)}',
    '.bw-slip .bw-st{display:flex;align-items:center;gap:8px;margin:0;'
      + 'font-size:13.5px;font-weight:700;color:var(--ink)}',
    '.bw-slip .bw-st svg{flex:none;width:17px;height:17px;color:var(--gold-lit)}',
    '.bw-slip .bw-more{align-self:center;font-size:13px;color:var(--ink-mut)}',
    /* رقاقةُ الشريطِ تَلبس سطحَ البطاقةِ لا سطحَ الشريط: سطحُ الرقاقةِ
       هو سطحُ الشريطِ نفسُه، فكانت تَذوب فيه ولا تُعرَف أنّها تُلمَس. */
    '.bw-slip .bw-chip{background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair)}',
    '.bw-slip .bw-chips{margin-top:10px}',

    '@media (prefers-reduced-motion:no-preference){'
      + '.bw-hub{transition:transform var(--fast) var(--ease)}'
      + '.bw-hub:active{transform:translate(-50%,-50%) scale(.96)}'
      + '.bw-dial.bw-solo .bw-hub:active{transform:scale(.96)}'
      + '.bw-fill,.bw-knob{transition:all var(--fast) var(--ease)}}'
  ].join('\n');

  function styleOnce() {
    if (document.getElementById('bw-css')) return;
    var s = App.el('style');
    s.id = 'bw-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ── مُعِينات ─────────────────────────────────────────────────── */

  function kindOf(p) { return P.KINDS[p.kind] || P.KINDS.hifz; }
  function nameOf(p) {
    var t = (p.title || '').trim();
    if (t) return t;
    try { return P.titleFor(p); } catch (e) { return kindOf(p).t || 'منهج'; }
  }
  function vg(m, f) { return App.Words ? App.Words.vg(m, f) : m; }

  /* تمييزُ العددِ منصوبًا: «صفحةً واحدة» لا «١ صفحة» */
  function pagesAcc(n) {
    if (n === 1) return 'صفحةً واحدة';
    if (n === 2) return 'صفحتَين';
    if (n % 100 >= 3 && n % 100 <= 10) return App.ar(n) + ' صفحات';
    return App.ar(n) + ' صفحة';
  }
  function rangeText(from, to) {
    if (from === to) return 'صفحة ' + App.ar(from);
    return 'من صفحة ' + App.ar(from) + ' إلى ' + App.ar(to);
  }

  /* ── سجلُّ الزلل ───────────────────────────────────────────────
     الموضعُ ‎state.slips‎، وفيه تكتب شاشةُ التسميع أيضًا. ولأنّ
     صيغتَها ليست بأيدينا تُقرأ على وجوهها: قائمةً كانت أو جدولًا،
     أرقامًا كانت أو كائنات. ويُكتَب فيها بالصيغةِ التي وُجدت
     عليها، فلا نُحوّل قائمةَ غيرِنا جدولًا فيَعمى عليه سجلُّه. */

  function poison(k) {
    return k === '__proto__' || k === 'constructor' || k === 'prototype';
  }
  function okPage(v) {
    v = Math.round(+v);
    return (isFinite(v) && v >= 1 && v <= PAGES) ? v : 0;
  }
  function pageOf(o) {
    if (typeof o === 'number') return okPage(o);
    if (!o || typeof o !== 'object') return 0;
    return okPage(o.page != null ? o.page : (o.p != null ? o.p : o.pg));
  }
  function countOf(o) {
    if (!o || typeof o !== 'object') return 1;
    var v = Math.round(+(o.n != null ? o.n : (o.count != null ? o.count : o.times)));
    return (isFinite(v) && v > 0) ? Math.min(v, 999) : 1;
  }
  function dateOf(o) {
    var v = o && typeof o === 'object' && (o.at || o.date || o.on);
    return (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : App.dateKey();
  }

  /* يُعيد جدولًا مُوحَّدًا: رقمُ الصفحة ← {n, at} */
  function slipMap() {
    var raw = App.state && App.state.slips, out = {}, i, pg, v;
    if (!raw || typeof raw !== 'object') return out;
    if (Array.isArray(raw)) {
      for (i = 0; i < raw.length && i < CAP; i++) {
        pg = pageOf(raw[i]);
        if (!pg) continue;
        out[pg] = { n: countOf(raw[i]), at: dateOf(raw[i]) };
      }
      return out;
    }
    var ks = Object.keys(raw);
    for (i = 0; i < ks.length && i < CAP; i++) {
      if (poison(ks[i])) continue;
      v = raw[ks[i]];
      if (v === false || v === 0 || v == null) continue;
      /* المفتاحُ رقمُ الصفحةِ في صيغتنا، وقد يكون معرّفًا في صيغةِ
         غيرِنا فتُطلَب الصفحةُ من القيمة — إن كانت كائنًا. ورقمٌ في
         قيمةِ مفتاحٍ مجهولٍ عددُ مرّاتٍ لا رقمُ صفحة، فلا يُعَدّ صفحة. */
      pg = okPage(ks[i]) || (v && typeof v === 'object' ? pageOf(v) : 0);
      if (!pg) continue;
      out[pg] = (v && typeof v === 'object')
        ? { n: countOf(v), at: dateOf(v) }
        : { n: (typeof v === 'number' && v > 0 ? Math.min(Math.round(v), 999) : 1),
            at: App.dateKey() };
    }
    return out;
  }

  /* تُكتَب تغييراتٌ دفعةً: صفحةٌ ← ١ زلّةٌ تُعلَّم، ٠ زلّةٌ تُمحى */
  function writeSlips(ch) {
    var keys = Object.keys(ch);
    if (!keys.length) return;
    var S = App.state, raw = S.slips, today = App.dateKey();

    if (Array.isArray(raw)) {
      keys.forEach(function (key) {
        var pg = okPage(key), at = -1, i;
        if (!pg) return;
        for (i = 0; i < raw.length; i++) if (pageOf(raw[i]) === pg) { at = i; break; }
        if (ch[key]) {
          if (at < 0) { if (raw.length < CAP) raw.push({ page: pg, n: 1, at: today }); }
          else if (raw[at] && typeof raw[at] === 'object') {
            raw[at].n = Math.min(countOf(raw[at]) + 1, 999);
            raw[at].at = today;
          }
        } else if (at >= 0) raw.splice(at, 1);
      });
    } else {
      if (!raw || typeof raw !== 'object') { raw = {}; S.slips = raw; }
      keys.forEach(function (key) {
        var pg = okPage(key);
        if (!pg) return;
        var k = String(pg), old = raw[k];
        if (ch[key]) {
          var n = (old && typeof old === 'object') ? countOf(old)
                : (typeof old === 'number' && old > 0 ? Math.min(Math.round(old), 999) : 0);
          raw[k] = { n: Math.min(n + 1, 999), at: today };
        } else if (old != null) delete raw[k];
      });
      /* الأقدمُ يسقط إن بلغ السجلُّ سعتَه: سجلٌّ بلا حدٍّ يَبتلع الخزن */
      var ks = Object.keys(raw);
      if (ks.length > CAP) {
        ks.sort(function (a, b) {
          return String((raw[a] || {}).at || '').localeCompare(String((raw[b] || {}).at || ''));
        });
        ks.slice(0, ks.length - CAP).forEach(function (k2) { delete raw[k2]; });
      }
    }
    App.save();
  }

  /* صفحاتُ الزللِ في منهجٍ بعينه، الأحقُّ أوّلًا: الأكثرُ تعثّرًا
     ثمّ الأقدمُ صفحةً — فما زَلّ فيه مرّتَين يُقدَّم على ما زَلّ مرّة. */
  function slipPages(p) {
    if (!p) return [];
    var m = slipMap(), out = [];
    Object.keys(m).forEach(function (k) {
      var pg = +k;
      if (pg >= p.from && pg <= p.to) out.push({ page: pg, n: m[k].n, at: m[k].at });
    });
    out.sort(function (a, b) { return (b.n - a.n) || (a.page - b.page); });
    return out;
  }

  /* ── هندسةُ القوس ─────────────────────────────────────────────
     المركزُ منخفضٌ والقوسُ فوقه: نصفُ دائرةٍ يَبلغها الإبهامُ وهو
     قابضٌ على الهاتف، والوسطُ أقربُ موضعٍ إليه فجُعل فيه الفعل. */
  var G = { cx: 150, cy: 152, r: 118, w: 300, h: 212, a0: 10, a1: 170 };

  function pt(a) {
    var t = a * Math.PI / 180;
    return { x: G.cx + G.r * Math.cos(t), y: G.cy - G.r * Math.sin(t) };
  }
  function arcD(a, b) {
    var p1 = pt(a), p2 = pt(b);
    return 'M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
           ' A' + G.r + ' ' + G.r + ' 0 0 0 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  function angleOf(v, n) {
    if (n <= 1) return (G.a0 + G.a1) / 2;
    return G.a0 + (G.a1 - G.a0) * (v - 1) / (n - 1);
  }
  /* موضعُ الإبهام ← مقدار. وما نزل تحت محورِ المركز يُردُّ إلى أقربِ
     طرفٍ ولا يُلغى: الإصبعُ يَزِلّ أسفلَ القوسِ ولا يُراد به إلغاء. */
  function valueAt(x, y, n) {
    if (n <= 1) return 1;
    var a = Math.atan2(G.cy - y, x - G.cx) * 180 / Math.PI;
    if (a < 0) a = (x >= G.cx) ? G.a0 : G.a1;
    var f = (a - G.a0) / (G.a1 - G.a0);
    return Math.max(1, Math.min(n, Math.round(f * (n - 1)) + 1));
  }

  /* ── الصحيفة ──────────────────────────────────────────────────── */

  /* حالُ الصحيفةِ المفتوحة: المقدارُ المختارُ والزلَلُ المُعلَّمُ الآن.
     في متغيّرٍ لا في الحالة: ما لم يُسجَّل بعدُ لا يُحفظ. */
  var cur = { id: null, v: 1, flags: null };

  function dueFirst() {
    var a = App.state.plans || [];
    var due = a.filter(function (p) { return P.isDueToday(p) && P.todayRange(p); });
    return due[0] || a.filter(function (p) { return P.todayRange(p); })[0] || null;
  }

  function closeBar(title) {
    var bar = App.el('div', 'bar');
    var b = App.el('button', 'btn btn-ghost', App.icon('chevron', 20));
    b.type = 'button';
    b.appendChild(App.el('span')).textContent = 'رجوع';
    b.setAttribute('aria-label', 'رجوعٌ إلى وِردِ اليوم');
    b.onclick = function () { App.closeSheet(); };
    bar.appendChild(b);
    var t = App.el('div', 'bar-t');
    t.appendChild(App.el('b', 'h2', title));
    bar.appendChild(t);
    return bar;
  }

  function render(params) {
    styleOnce();
    var p = (params && params.id && P.byId(params.id)) || dueFirst();
    var w = App.el('div', 'screen bw');

    if (!p || !P.todayRange(p)) {
      w.appendChild(closeBar('بعضُ الوِرد'));
      var none = App.el('article', 'card');
      none.appendChild(App.el('p', 'small',
        'لا وِردَ مفتوحًا الآن تُسجَّل منه صفحات. افتح هذا البابَ من بطاقةِ '
        + 'وِردِ اليوم حين يكون لك وِردٌ قائم.'));
      w.appendChild(none);
      return w;
    }

    if (cur.id !== p.id || !cur.flags) { cur = { id: p.id, v: 1, flags: {} }; }

    var k = kindOf(p), r = P.todayRange(p), n = r.count;
    if (cur.v > n) cur.v = n;
    var have = slipMap();

    w.appendChild(closeBar(vg('سجّل ما أتممتَ', 'سجّلي ما أتممتِ')));

    /* ١ · عن أيِّ وِردٍ نتكلّم: نوعُه واسمُه ومقدارُ يومِه */
    var ctx = App.el('article', 'card kedge ' + P.kindCls(p));
    var inn = App.el('div', 'bw-ctx');
    var chip = App.el('span', 'pill pill-kind', App.icon(k.icon, 14));
    chip.appendChild(document.createTextNode(k.t));
    inn.appendChild(chip);
    var nm = App.el('span', 'bw-nm');
    nm.textContent = nameOf(p);
    inn.appendChild(nm);
    var pg = App.el('p', 'bw-pg');
    pg.textContent = App.join('وِردُ اليوم', rangeText(r.from, r.to), pagesAcc(n));
    inn.appendChild(pg);
    ctx.appendChild(inn);
    w.appendChild(ctx);

    /* ٢ · الزلل: رقائقُ صفحاتِ الوِردِ كلِّها، فلا تَقفز الصفحةُ
       كلّما تحرّك المقدارُ — والقوسُ تحتها فيَثبُت موضعُه للإبهام. */
    var sec = App.el('section', 'sec bw-sec');
    var card2 = App.el('article', 'card');
    card2.appendChild(App.el('p', 'bw-t', vg('أين تعثّرتَ؟', 'أين تعثّرتِ؟')));
    var hint = App.el('p', 'bw-h');
    hint.textContent = vg(
      'عَلِّم الصفحةَ التي زَلّ فيها لسانُك، تُقدَّم في مراجعتك. وما قرأتَه '
      + 'اليومَ بلا زلّةٍ يُمحى من السجلّ.',
      'عَلِّمي الصفحةَ التي زَلّ فيها لسانُكِ، تُقدَّم في مراجعتكِ. وما قرأتِه '
      + 'اليومَ بلا زلّةٍ يُمحى من السجلّ.');
    card2.appendChild(hint);

    var ul = App.el('ul', 'bw-chips');
    ul.setAttribute('aria-label', 'صفحاتُ وِردِ اليوم');
    /* وِردٌ طويلٌ (ملفٌّ مستورَدٌ قد يبلغ مقدارُه عشراتِ الصفحات) لا
       يَملأ الشاشةَ رقائقَ: تُعرَض أوائلُه ويُقال صراحةً ما لم يُعرَض. */
    var shown = Math.min(n, 24);
    for (var i = 0; i < shown; i++) {
      (function (page) {
        var li = App.el('li');
        var c = App.el('button', 'chip bw-chip' + (have[page] ? ' bw-was' : ''));
        c.type = 'button';
        c.textContent = App.ar(page);
        var on = !!cur.flags[page];
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        if (on) c.classList.add('on');
        c.setAttribute('aria-label', App.join('صفحة ' + App.ar(page),
          have[page] ? 'زلّةٌ مُعلَّمةٌ من قبل' : null,
          vg('عَلِّم زلّةً فيها', 'عَلِّمي زلّةً فيها')));
        c.onclick = function () {
          var v = !cur.flags[page];
          cur.flags[page] = v;
          c.setAttribute('aria-pressed', v ? 'true' : 'false');
          c.classList.toggle('on', v);
        };
        li.appendChild(c);
        ul.appendChild(li);
      })(r.from + i);
    }
    card2.appendChild(ul);
    if (n > shown) {
      var cut = App.el('p', 'bw-h');
      cut.textContent = 'ووِردُ اليوم أطولُ من هذا، فعُرضت أوائلُ صفحاته: '
        + App.ar(shown) + ' صفحة.';
      card2.appendChild(cut);
    }

    /* زلَلٌ سابقٌ في هذا المنهج خارجَ وِردِ اليوم: يُذكَر ولا يُلمَس —
       علاجُه في يومِ وِردِه، وذِكرُه هنا ليعرف أين هو من منهجه. */
    var past = slipPages(p).filter(function (s) { return s.page < r.from || s.page > r.to; });
    if (past.length) {
      var pl = App.el('p', 'bw-h bw-past');
      pl.appendChild(document.createTextNode('وزلَلٌ سابقٌ في هذا المنهج، صفحاتُه: '));
      past.slice(0, 8).forEach(function (s) {
        var sp = App.el('span', 'pill pill-quiet');
        sp.textContent = App.ar(s.page);
        pl.appendChild(sp);
      });
      card2.appendChild(pl);
    }
    sec.appendChild(card2);
    w.appendChild(sec);

    /* ٣ · القوسُ والزرّ */
    var read = App.el('p', 'bw-read');
    read.setAttribute('role', 'status');
    read.setAttribute('aria-live', 'polite');
    w.appendChild(read);

    var dial = App.el('div', 'bw-dial' + (n > 1 ? '' : ' bw-solo'));
    var svg = null, fill = null, knob = null;

    if (n > 1) {
      /* يُبنى بالنصّ مرّةً واحدةً ثمّ تُؤخَذ عُقَدُه: أخفُّ من إنشاء
         كلِّ عنصرٍ بـcreateElementNS، وأوضحُ قراءةً. */
      var ticks = '';
      if (n <= 14) {
        for (var t = 0; t < n; t++) {
          var q = pt(angleOf(t + 1, n));
          ticks += '<circle class="bw-tick" cx="' + q.x.toFixed(1) + '" cy="'
                 + q.y.toFixed(1) + '" r="2.6"/>';
        }
      }
      var box = App.el('div', null,
        '<svg class="bw-arc" viewBox="0 0 ' + G.w + ' ' + G.h + '">' +
        '<path class="bw-trk" d="' + arcD(G.a0, G.a1) + '"/>' +
        '<path class="bw-fill" d="' + arcD(G.a0, G.a0) + '"/>' +
        ticks +
        '<circle class="bw-knob" cx="0" cy="0" r="15"/></svg>');
      svg = box.firstChild;
      fill = App.$('.bw-fill', svg);
      knob = App.$('.bw-knob', svg);
      svg.setAttribute('role', 'slider');
      svg.setAttribute('tabindex', '0');
      svg.setAttribute('aria-valuemin', '1');
      svg.setAttribute('aria-valuemax', String(n));
      svg.setAttribute('aria-label', vg('مقدارُ ما أتممتَ من وِردِ اليوم',

      dial.appendChild(svg);
    }

    var hub = App.el('button', 'bw-hub');
    hub.type = 'button';
    var vEl = App.el('span', 'bw-v');
    var ofEl = App.el('span', 'bw-of');
    hub.appendChild(vEl);
    if (n > 1) hub.appendChild(ofEl);
    hub.appendChild(App.el('span', 'bw-go', vg('سجّل', 'سجّلي')));
    dial.appendChild(hub);
    w.appendChild(dial);

    /* ── الرسمُ الحيُّ: لا تُعاد الصحيفةُ عند كلِّ حركةِ إبهام، تُبدَّل
       عُقَدُها في موضعها — فلا تَقفز الصفحةُ ولا تَضيع البؤرة. */
    function paint() {
      var a = angleOf(cur.v, n), q = pt(a);
      if (fill) fill.setAttribute('d', arcD(G.a0, a));
      if (knob) { knob.setAttribute('cx', q.x.toFixed(1)); knob.setAttribute('cy', q.y.toFixed(1)); }
      vEl.textContent = App.ar(cur.v);
      ofEl.textContent = 'من ' + App.ar(n);
      /* سطرُ صفحةٍ واحدةٍ لا يُكرَّر مرّتَين: «صفحةً واحدة · صفحة ٥٨٢» خبرٌ
         واحدٌ قيل مرّتَين، والعينُ العَجْلى تَقرأ الأقصرَ أسرع. */
      var line = cur.v === 1 ? 'صفحةٌ واحدة، ' + rangeText(r.from, r.from)
                             : App.join(pagesAcc(cur.v), rangeText(r.from, r.from + cur.v - 1));
      read.textContent = line;
      if (svg) {
        svg.setAttribute('aria-valuenow', String(cur.v));
        svg.setAttribute('aria-valuetext', line);
      }
      hub.setAttribute('aria-label', App.join(vg('سجّل ', 'سجّلي ') + pagesAcc(cur.v),
        rangeText(r.from, r.from + cur.v - 1)));
    }
    function set(v) {
      v = Math.max(1, Math.min(n, v));
      if (v === cur.v) return;
      cur.v = v;
      paint();
    }
    paint();

    if (svg) {
      /* الإبهامُ يَزحف ولا يُقصَد: تُلتقط الحركةُ ما دام الإصبعُ
         نازلًا ولو خرج عن القوس، فالتقاطُ المؤشّرِ يُلزم الحدثَ بنا. */
      function from(e) {
        var b = svg.getBoundingClientRect();
        if (!b.width || !b.height) return cur.v;
        return valueAt((e.clientX - b.left) * G.w / b.width,
                       (e.clientY - b.top) * G.h / b.height, n);
      }
      svg.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        try { svg.setPointerCapture(e.pointerId); } catch (_) {}
        set(from(e));
        try { svg.focus({ preventScroll: true }); } catch (_) {}
      });
      svg.addEventListener('pointermove', function (e) {
        if (!svg.hasPointerCapture || !svg.hasPointerCapture(e.pointerId)) return;
        e.preventDefault();
        set(from(e));

         القوسَ يَمشي مع القراءةِ من اليمين إلى الشمال. */
      svg.addEventListener('keydown', function (e) {
        var d = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? 1
              : (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? -1 : 0;
        if (e.key === 'Home') { e.preventDefault(); set(1); return; }
        if (e.key === 'End') { e.preventDefault(); set(n); return; }
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); commit(p, r, n); return; }
        if (!d) return;
        e.preventDefault();
        set(cur.v + d);
      });
    }

    hub.onclick = function () { commit(p, r, n); };
    return w;
  }

  /* ── التسجيل ──────────────────────────────────────────────────
     المقدارُ بـmarkDone نفسِها: plan.done و plan.log[يوم] كما هما،
     فلا شكلَ جديدًا في الحالةِ ولا حقلَ في المنهج. */
  function commit(p, r, n) {
    /* حارسٌ من نقرةٍ ثانيةٍ تَسبق إغلاقَ الصحيفة: بعد التسجيل تُفرَّغ
       الحالُ، فلو جاءت ضغطةٌ متأخّرةٌ لم تجد ما تَقرؤه. */
    if (cur.id !== p.id || !cur.flags) return;
    var flags = cur.flags;
    var v = Math.max(1, Math.min(n, cur.v));
    var got = P.markDone(p, v);
    if (!got) { App.toast('اكتمل هذا المنهجُ فلا يُسجَّل فيه بعد.'); return; }

    /* الزلل: ما عُلِّم يُثبَت، وما قُرئ اليومَ ولم يُعلَّم يُمحى —
       فالصفحةُ التي مرّت سليمةً تخرج من سجلّ الزللِ من تلقائها. */
    var have = slipMap(), ch = {}, marked = 0, i, page;
    for (i = 0; i < n; i++) {
      page = r.from + i;
      if (flags[page]) { ch[page] = 1; marked++; }
      else if (have[page] && i < got) ch[page] = 0;
    }
    writeSlips(ch);

    var word = App.Words ? App.Words.done(p, got) : 'سُجّلت ' + pagesAcc(got) + '.';
    App.toast(marked
      ? App.join(word, marked === 1 ? 'وعُلِّمت زلّةٌ واحدة'
                                    : 'وعُلِّمت ' + App.ar(marked) + ' زلّات')
      : word);
    /* لحظةُ الإنجاز من وحدةِ 26-joy: تُنادى كما تُنادى عند «أتممتُ»،
       فالتسجيلُ الجزئيُّ إنجازٌ لا نصفُ إنجاز. */
    if (App.Joy) App.Joy.mark(p, got);
    cur = { id: null, v: 1, flags: null };
    App.closeSheet();
  }

  App.screen('partial', render, { full: true });

  function open(p) {
    cur = { id: p.id, v: 1, flags: {} };
    App.go('partial', { id: p.id });
  }

  /* ── ما يُعلَّق على صفِّ الوِرد في 50-today.js ──────────────────
     سطرٌ واحدٌ هناك ينادي ما هنا، وإن غابت هذه الوحدةُ لم يَنقص
     هناك شيءٌ: الزرُّ الأوّلُ «أتممتُ» باقٍ على حاله. */

  function someBtn(p, label) {
    /* الأنماطُ تُحقَن عند أوّلِ ظهورٍ لا عند أوّلِ صحيفة: الزرُّ يُرسَم
       في «اليوم» قبل أن تُفتح الصحيفةُ مرّةً واحدة. */
    styleOnce();
    /* «بعضُه» وحدَها لا تقول ماذا يَقع إن ضُغطت. و«أتممتُ بعضَه»
     تُقرأ بأختها «أتممتُ» فيُعرَف أنّها تسجيلٌ ناقصٌ لا بابٌ آخر. */
    var b = App.el('button', 'btn btn-ghost btn-sm', 'أتممتُ بعضَه');
    b.type = 'button';
    b.setAttribute('aria-label', App.join(
      vg('سجّل بعضَ وِردك من ', 'سجّلي بعضَ وِردكِ من ') + label,
      'أو عَلِّم صفحةً تعثّرتَ فيها'));
    b.onclick = function () { open(p); };
    return b;
  }

  /* شريطُ الزلل: يُعرَض على البطاقةِ الكبرى وحدَها، وفيه الصفحاتُ
     الأحقُّ بأن يُبدأ بها. والنقرُ يفتح الصفحةَ في المصحف إن كانت
     شاشتُها مُسجَّلةً، وإلّا فبابَ الزللِ ليُعالَج هنا. */
  function slipStrip(p) {
    var list = slipPages(p);
    if (!list.length) return null;
    styleOnce();
    var box = App.el('div', 'bw-slip');
    var t = App.el('p', 'bw-st', App.icon('info', 17));
    t.appendChild(document.createTextNode(
      vg('ابدأ بما زَلّ فيه لسانُك', 'ابدئي بما زَلّ فيه لسانُكِ')));
    box.appendChild(t);

    var ul = App.el('ul', 'bw-chips');
    var show = list.slice(0, 4);
    show.forEach(function (s) {
      var li = App.el('li');
      var c = App.el('button', 'chip bw-chip');
      c.type = 'button';
      c.textContent = App.ar(s.page);
      c.setAttribute('aria-label', App.join('صفحة ' + App.ar(s.page),
        s.n > 1 ? 'زَلَلٌ ' + App.ar(s.n) + ' مرّات' : 'زلّةٌ مُعلَّمة',
        vg('افتحها', 'افتحيها')));
      c.onclick = function () {
        if (window.__screens && window.__screens.qpage) App.go('qpage', { p: s.page });
        else open(p);
      };
      li.appendChild(c);
      ul.appendChild(li);
    });
    if (list.length > show.length) {
      var more = App.el('li', 'bw-more');
      var k = list.length - show.length;
      more.textContent = k === 1 ? 'وأخرى' : 'و' + App.ar(k) + ' غيرها';
      ul.appendChild(more);
    }
    box.appendChild(ul);
    return box;
  }

  App.Partial = {
    /* البطاقةُ الكبرى: الزرُّ في صفِّ الأفعال، والشريطُ تحته */
    card: function (body, act, p) {
      try {
        if (act && P.todayRange(p)) act.appendChild(someBtn(p, nameOf(p)));
        if (body) { var s = slipStrip(p); if (s) body.appendChild(s); }
      } catch (e) {}
    },
    /* الصفُّ المضغوط: الزرُّ وحدَه، فالصفُّ لا يَحمل شريطًا */
    row: function (row, p) {
      try { if (row && P.todayRange(p)) row.appendChild(someBtn(p, nameOf(p))); }
      catch (e) {}
    },
    /* للوحداتِ الأخرى: صفحاتُ الزللِ مرتّبةً بالأحقّيّة */
    slips: slipMap,
    slipPages: slipPages,
    open: open
  };
})(window.App);

/* سجلُّ الزلل مفتاحٌ أعلى تَملكه هذه الوحدة: يُسجَّل لئلّا يَحذفه
   الاستيرادُ بقائمتِه البيضاء — وكان يَسقط صامتًا في كلِّ استيراد. */
if (window.App && window.App.ownState) window.App.ownState('slips');

/* ══ 55-murshid.js ══ */
/* ══ 60-murshid.js — المُرشِد ═══════════════════════════════════
   وحدةٌ من التطبيق (جُرّبت في الكسوةِ فأُقِرّت).

   العلّةُ: التطبيقُ يُحصي ولا يَنصح. وسجلُّ الطالبِ فيه ما لا يَراه
   بعينه — أين يَزِلّ، ومتى يُنجز، وكم بقي له حتّى الخِتام — فيَبقى
   مكتوبًا لا يُقال له.

   ╔═ ستّةُ قراراتٍ تَحكُم هذا الملفَّ كلَّه ══════════════════════╗

   ١ — **الصمتُ هو الأصل.** المرشدُ الذي يَتكلّم كلَّ يومٍ يَصير
       ضجيجًا يُغلَق. فلا يَنطق إلّا إن كان عنده ما يُقال، ومرّةً
       واحدةً في اليومِ على الأكثر.

   ٢ — **لا حثَّ بالذنب.** لا «لا تَهجر القرآن» ولا «أتَنسى كتابَ
       ربّك؟». تَنفع أسبوعًا ثمّ تَجعل فتحَ التطبيقِ ثقيلًا وتَربط
       المصحفَ في النفسِ بالتأنيب — وذاك في تطبيقِ قرآنٍ أخطرُ منه
       في غيره. والماضي لا يُحاسَب عليه، إنّما تُصلَح الخطّةُ لما
       بقي.

   ٣ — **لا رسالةَ بلا رقمٍ من سجلّه.** «واصِل، أنت رائع» كلامٌ
       يَصلح لكلِّ أحدٍ فلا يَصلح لأحد. وكلُّ ما هنا مُولَّدٌ من
       بياناتِه هو: زللُه، ووردُه، ودرجاتُه، وما بقي من هدفه.

   ٤ — **كلُّ رسالةٍ تَحمل فعلًا أو لا تُقال.** الخبرُ وحدَه يُقلِق
       ولا يُعين. فإن قيل «تأخّرتَ ثلاثةَ أيّام» قيل معه «أُمدّد
       الخِتامَ أسبوعًا أم أزيد نصفَ صفحة؟» — واختيارٌ بلمسةٍ لا
       أمرٌ يُملى.

   ٥ — **الشهادةُ نادرةٌ لتَبقى صادقة.** «أتممتَ جزءًا» تُقال حين
       يُتَمّ جزءٌ لا كلَّ صباح.

   ٦ — **لا سلسلةَ تَنكسر.** يُعَدّ ما أُنجز لا ما انقطع: من مرِض
       أسبوعًا لا يُعاقَب بمحوِ أربعين يومًا مضت.

   ولا يَكتب المرشدُ في حالةِ الطالبِ شيئًا سوى مفتاحِه الخاصّ
   ‎state.murshid‎ — آخرُ يومٍ تكلّم فيه وما قاله — ليَفيَ بالقرارِ
   الأوّلِ ولا يُعيد نفسَه.                                        */

(function (App) {
  'use strict';

  var KEY = 'murshid';
  var ar = App.ar;

  function bag() {
    var S = App.state;
    if (!S[KEY] || typeof S[KEY] !== 'object') S[KEY] = {};
    return S[KEY];
  }
  if (App.ownState) App.ownState(KEY);

  /* ── صيغُ العدد ───────────────────────────────────────────────
     «٤ مرّةً» و«١ أيّام» عيبٌ يُرى من أوّلِ نظرة، والعربيّةُ تُفرِد
     وتُثنّي وتَجمع. وما بعدَ العشرةِ مفردٌ منصوب. */
  function nDay(n) {
    if (n === 1) return 'يومًا واحدًا';
    if (n === 2) return 'يومَين';
    if (n <= 10) return ar(n) + ' أيّامٍ';
    return ar(n) + ' يومًا';
  }
  function nTime(n) {
    if (n === 1) return 'مرّةً واحدة';
    if (n === 2) return 'مرّتَين';
    if (n <= 10) return ar(n) + ' مرّاتٍ';
    return ar(n) + ' مرّةً';
  }
  function nPage(n) {
    if (n === 1) return 'صفحةً واحدة';
    if (n === 2) return 'صفحتَين';
    if (n <= 10) return ar(n) + ' صفحاتٍ';
    return ar(n) + ' صفحةً';
  }

  /* ── أدواتُ التقويم ──────────────────────────────────────────── */
  function key(d) {
    return d.getFullYear() + '-'
      + ('0' + (d.getMonth() + 1)).slice(-2) + '-'
      + ('0' + d.getDate()).slice(-2);
  }
  function back(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }

  /* ── قراءةُ السجلّ ───────────────────────────────────────────── */
  function plans() { return App.state.plans || []; }

  function doneOn(k) {
    var n = 0;
    plans().forEach(function (p) { n += (p.log && p.log[k]) || 0; });
    return n;
  }

  /* أيَّامُ الوردِ المقرَّرةُ في آخرِ ‎n‎ يومًا، وما أُنجز منها */
  function recent(n) {
    var due = 0, met = 0, missRun = 0, run = 0, i, d, k, any;
    for (i = n; i >= 1; i--) {
      d = back(i); k = key(d);
      any = plans().some(function (p) {
        return !p.done && p.days && p.days.indexOf(d.getDay()) >= 0;
      });
      if (!any) continue;
      due++;
      if (doneOn(k) > 0) { met++; run = 0; }
      else { run++; if (run > missRun) missRun = run; }
    }
    return { due: due, met: met, missRun: run, worst: missRun };
  }

  /* أطولُ تتابعٍ من أيّامِ الوردِ المُنجَزة — يُعَدّ ما أُنجز لا ما
     انقطع، فلا «سلسلةٌ» تَنكسر بمرضٍ أو سفر. */
  function streak() {
    var i, d, k, n = 0;
    for (i = 0; i < 120; i++) {
      d = back(i); k = key(d);
      var due = plans().some(function (p) {
        return !p.done && p.days && p.days.indexOf(d.getDay()) >= 0;
      });
      if (!due) continue;
      if (doneOn(k) > 0) n++;
      else if (i > 0) break;
    }
    return n;
  }

  function totalPages() {
    var n = 0;
    plans().forEach(function (p) {
      for (var k in (p.log || {})) {
        if (p.log.hasOwnProperty(k)) n += p.log[k] || 0;
      }
    });
    return n;
  }

  /* أكثرُ الأجزاءِ زللًا في التسميع — من ‎state.slips‎ وحدَها */
  function worstJuz() {
    var sl = App.state.slips, by = {}, k, v, best = null;
    if (!sl || typeof sl !== 'object' || !App.Quran || !App.Quran.ready()) {
      return null;
    }
    for (k in sl) {
      if (!sl.hasOwnProperty(k) || k.charAt(0) === '_') continue;
      v = sl[k];
      var n = (v && v.n) || 0;
      if (n <= 0) continue;
      var parts = k.split(':');
      var ver = App.Quran.verse(+parts[0], +parts[1]);
      if (!ver) continue;
      var j = App.Quran.juzOf(ver.p);
      by[j] = (by[j] || 0) + n;
    }
    var second = 0;
    for (k in by) {
      if (!by.hasOwnProperty(k)) continue;
      if (!best || by[k] > best.n) { second = best ? best.n : 0;
                                     best = { j: +k, n: by[k] }; }
      else if (by[k] > second) second = by[k];
    }
    /* «ولم تَزِلّ في غيره مثلَها» دعوى تَكذب إن تساوى جزءان، فلا
       تُقال إلّا إذا كان الأوّلُ أكثرَ من الثاني حقًّا. */
    if (best) best.alone = best.n > second;
    return (best && best.n >= 3) ? best : null;
  }

  /* آخرُ يومٍ مرَّ فيه الوردُ على كلِّ جزء.

     يُعاد بناؤه من السجلِّ وحدَه: المقدارُ المسجَّلُ في كلِّ يومٍ
     يُراكَم على مدى المنهج، فيُعرَف أيَّ صفحاتٍ قطع الوردُ في ذلك
     اليوم، ومن الصفحةِ يُعرَف الجزء. وإذا جاوز المجموعُ مدى المنهج
     لَفَّ من أوّله، لأنّ المراجعةَ تُعيد الكَرّةَ على المدى نفسِه.

     ولا يُخزَّن شيءٌ جديدٌ لأجلِ هذا: ما في السجلِّ يَكفي. */
  function lastSeen() {
    if (!App.Quran || !App.Quran.ready()) return null;
    var seen = {};
    plans().forEach(function (p) {
      var log = p.log || {}, keys = [], k;
      for (k in log) {
        if (log.hasOwnProperty(k) && log[k] > 0) keys.push(k);
      }
      if (!keys.length) return;
      keys.sort();
      var from = Math.min(p.from, p.to), to = Math.max(p.from, p.to);
      var span = to - from + 1;
      if (!(span > 0)) return;
      var at = 0;
      keys.forEach(function (d) {
        var n = log[d], i, pg, j;
        for (i = 0; i < n; i++) {
          pg = from + ((at + i) % span);
          j = App.Quran.juzOf(pg);
          if (!seen[j] || seen[j] < d) seen[j] = d;
        }
        at += n;
      });
    });
    return seen;
  }

  /* الجزءُ الذي طال العهدُ به. العتبةُ ثلاثون يومًا: دونَها ليس
     «قديمًا» بعدُ، والتنبيهُ قبل أوانه إزعاجٌ لا إفادة. */
  function stalest() {
    var seen = lastSeen();
    if (!seen) return null;
    var now = Date.parse(App.dateKey(new Date()) || key(new Date()));
    var best = null, j, t, gap;
    for (j in seen) {
      if (!seen.hasOwnProperty(j)) continue;
      t = Date.parse(seen[j]);
      if (isNaN(t)) continue;
      gap = Math.round((now - t) / 86400000);
      if (gap >= 30 && (!best || gap > best.gap)) best = { j: +j, gap: gap };
    }
    return best;
  }

  /* ── المرشدُ يُولّد، ولا يَختار من قائمةٍ مكتوبة ──────────────
     لكلِّ قاعدةٍ شرطٌ يُقرأ من السجلّ، ونصٌّ يُبنى من أرقامِه، وفعلٌ
     يُعرَض معه. وترتيبُها ترتيبُ الأهمّيّة: التعديلُ قبل الشهادة،
     والشهادةُ قبل المرآة. */
  function rules() {
    var out = [];
    var ps = plans().filter(function (p) { return !p.done; });
    var r = recent(14);
    var today = doneOn(App.dateKey());

    /* ── ١ · التعديل: الواقعُ فارق الخطّة ───────────────────── */
    if (ps.length && r.missRun >= 3) {
      out.push({
        kind: 'fix',
        head: 'تأخّرتَ ' + nDay(r.missRun) + ' عن وردك',
        /* لا يُوعَد بما لا يُفعَل: الخِتامُ محسوبٌ من المقدارِ
           والأيّامِ لا مخزونٌ يُزاد عليه، فاللَّفظُ يُسمّي الرافعةَ
           الحقيقيّةَ ويَدلّ على موضعها. */
        body: 'والماضي لا يُستدرَك بالتأنيب. خفِّف مقدارَ اليوم أو '
            + 'زِد أيّامَ أسبوعك، يَعُد الخِتامُ في متناولك.',
        acts: [{ t: 'افتح مناهجي', go: function () { App.go('home'); } }]
      });
    }

    /* ── ٢ · الشهادة: نادرةٌ لتَبقى صادقة ───────────────────── */
    var st = streak();
    if (st && st % 20 === 0 && today > 0) {
      out.push({
        kind: 'mark',
        head: 'أتممتَ ' + nDay(st) + ' من أيّام وردك',
        body: 'بلا انقطاع. وهذا عددٌ لا يَبلغه إلّا من ثَبَت.'
      });
    }
    var tp = totalPages();
    if (tp >= 20 && tp % 20 === 0 && today > 0) {
      out.push({
        kind: 'mark',
        head: 'بلغتَ ' + nPage(tp) + ' مُسجَّلة',
        body: 'من أوّلِ يومٍ فتحتَ فيه التطبيقَ إلى اليوم.'
      });
    }

    /* ── ٣ · المرآة: ما لا يَراه بعينه ──────────────────────── */
    var wj = worstJuz();
    if (wj) {
      out.push({
        kind: 'see',
        head: wj.alone ? 'أكثرُ زللِك في الجزء ' + ar(wj.j)
                       : 'الجزء ' + ar(wj.j) + ' يَحتاج تثبيتًا',
        body: 'زَلَلتَ فيه ' + nTime(wj.n)
            + (wj.alone ? ' — أكثرَ من أيِّ جزءٍ سواه.' : '.')
            + ' وأسرعُ ما يُثبِّته أن تُسأل فيه.',
        acts: [{
          t: 'اختبِرني فيه',
          go: function () {
            App.go('exam', { scope: { kind: 'juz', j: wj.j }, go: 1 });
          }
        }]
      });
    }
    if (ps.length && r.due >= 7 && r.met === r.due) {
      out.push({
        kind: 'see',
        head: 'لم تُخلِف يومًا في أسبوعَين',
        body: ar(r.met) + ' من ' + ar(r.due) + ' يومِ ورد. '
            + 'وهذا موضعُ من يَزيد قليلًا لا من يَكتفي.'
      });
    }

    /* ── ٤ · الحفظُ القديم: ما لا تَذكره الشاشةُ من نفسِها ─────
       «اليومُ» يُري وردَ اليوم، و«تقدُّمي» يُري ما بلغتَه جملةً —
       وليس فيهما ما يَقول: هذا جزءٌ مرَّ عليه شهر. وهو أنفعُ ما
       يَعرفه المرشدُ من سجلِّه، فلذلك قيل. */
    var sj = stalest();
    if (sj && !(wj && wj.j === sj.j)) {
      out.push({
        kind: 'old',
        /* رقمان متجاوران يُربكان القراءة، فيُفصَل بينهما بالفعل */
        head: 'الجزءُ ' + ar(sj.j) + ' مضى عليه ' + nDay(sj.gap),
        body: 'والحفظُ القديمُ لا يَضيع، لكنّه يَبهَت. '
            + 'وأسرعُ ما يَكشف ما بَهَت منه أن تُسأل فيه.',
        acts: [{
          t: 'اختبِرني فيه',
          go: function () {
            App.go('exam', { scope: { kind: 'juz', j: sj.j }, go: 1 });
          }
        }]
      });
    }

    /* ── ٥ · إذنُ الراحة ─────────────────────────────────────── */
    if (ps.length && today > 0) {
      out.push({
        kind: 'rest',
        head: 'أنجزتَ وردَك اليوم',
        body: 'لا شيءَ عليك بعده. والزيادةُ نافلةٌ إن شئتها.'
      });
    }

    return out;
  }

  /* ── متى يَتكلّم: مرّةً في اليوم، ولا يُعيد ما قاله أمس ───── */
  function pick() {
    var b = bag(), k = App.dateKey();
    if (b.day === k) return null;              /* ‫تكلّم اليومَ فكفى */
    var list = rules();
    for (var i = 0; i < list.length; i++) {
      if (list[i].head === b.last) continue;   /* ‫لا يُعيد نفسَه */
      return list[i];
    }
    return null;
  }

  function spoke(m) {
    var b = bag();
    b.day = App.dateKey();
    b.last = m.head;
    App.save && App.save();
  }

  /* ── اللوح ───────────────────────────────────────────────────── */
  function card(m) {
    var c = App.el('div', 'mu mu-' + m.kind);
    var h = App.el('div', 'mu-h');
    h.appendChild(App.el('span', 'mu-t', m.head));
    var x = App.el('button', 'mu-x');
    x.type = 'button';
    x.setAttribute('aria-label', 'أخفِ');
    x.innerHTML = App.icon('close', 15);
    x.onclick = function () { c.remove(); };
    h.appendChild(x);
    c.appendChild(h);
    if (m.body) c.appendChild(App.el('p', 'mu-b', m.body));
    if (m.acts && m.acts.length) {
      var row = App.el('div', 'mu-a');
      m.acts.forEach(function (a) {
        var b = App.el('button', 'btn btn-ghost btn-sm mu-go');
        b.type = 'button';
        b.textContent = a.t;
        b.onclick = a.go;
        row.appendChild(b);
      });
      c.appendChild(row);
    }
    return c;
  }

  /* ── يُركَّب في «اليوم» أعلى الشاشة، ولا يُزاحم شيئًا ──────── */
  App.on_('drawn', function (d) {
    if (!d || d.sheet) return;
    if (d.name !== 'home' && d.name !== 'today') return;
    var pane = document.getElementById('pane');
    if (!pane) return;
    var w = pane.firstElementChild;
    if (!w || w.querySelector('.mu')) return;
    var m = pick();
    if (!m) return;
    var bar = w.firstElementChild;
    w.insertBefore(card(m), bar ? bar.nextSibling : w.firstChild);
    spoke(m);
  });

  /* يُكشَف للفحصِ الآليّ: الصمتُ قاعدةٌ تُقاس لا نيّةٌ تُدَّعى. */
  App.Murshid = { rules: rules, pick: pick, card: card, bag: bag };

}(window.App));

/* ═══════════════════════════════════════════════════════════════════
   خريطةُ المصحف — الرحلةُ كلُّها في نظرةٍ واحدة
   ───────────────────────────────────────────────────────────────────
   مَشهدان مرتبطان على الصفحات الستّمئة والأربع الحقيقيّة:
     ١ · حلقةُ الأجزاء — ثلاثون قوسًا، لكلّ جزءٍ قوسُه، يمتلئ بقدر ما
          غُطّي منه، فيرى الطالبُ بناءَه كلَّه دُفعةً واحدة.
     ٢ · خريطةُ المصحف — ٦٠٤ خليّة، خليّةٌ لكلّ صفحة.
   والربطُ بينهما مقصود: اختيارُ جزءٍ يُظلّل صفحاتَه في الخريطة،
   ولمسُ صفحةٍ يُنتقي جزأها في الحلقة. لا قائمةَ أجزاء — المشهدان
   هما الشاشة، ولو أضفنا قائمةً صارت الشاشةُ جدولًا لا خريطة.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var Q = App.Quran, NJUZ = 30;

  /* أسماءُ الأجزاء بالترتيب لا بأوّل كلماتها: نصُّ المصحف لا يُكتب في
     الشيفرة، فالتطبيق يدلُّ على الموضع ولا يعرض الوحي. */
  var ORD = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع',
    'الثامن', 'التاسع', 'العاشر', 'الحادي عشر', 'الثاني عشر', 'الثالث عشر',
    'الرابع عشر', 'الخامس عشر', 'السادس عشر', 'السابع عشر', 'الثامن عشر',
    'التاسع عشر', 'العشرون', 'الحادي والعشرون', 'الثاني والعشرون',
    'الثالث والعشرون', 'الرابع والعشرون', 'الخامس والعشرون', 'السادس والعشرون',
    'السابع والعشرون', 'الثامن والعشرون', 'التاسع والعشرون', 'الثلاثون'];

  /* ── هندسةُ الحلقة ──────────────────────────────────────────────
     الوحدةُ هنا تساوي البكسل تقريبًا: مربّعُ العرض ٣٢٠ والحاويةُ ٣٢٠
     تقريبًا على هاتفٍ بعرض ٣٩٠. ولهذا لا يُكبَّر مربّعُ العرض: لو
     كُبِّر لانضغط هدفُ اللمس المخفيّ تحت الـ٤٤ بكسلًا.
     ونصفُ القطر مقيّدٌ بـ(١٦٠ − نصفُ عرض مِمسكِ اللمس).            */
  var VB = 320, CC = VB / 2, R = 137;
  var SLOT = 360 / NJUZ;          /* ١٢° لكلّ جزء */
  var GAP = 1.3;                  /* فُرجةٌ شعريّة: تفصل الأقواس ولا تُفتّتها خرزًا */
  var SWEEP = SLOT - GAP;
  var ARCLEN = R * SWEEP * Math.PI / 180;

  function pt(deg, r) {
    var t = deg * Math.PI / 180;
    /* الصفرُ في الأعلى، والزيادةُ عكسَ عقارب الساعة: الترتيبُ العربيّ
       يمضي من اليمين إلى الشمال، فمِن القمّةِ يسارًا هو اتّجاهُ القراءة. */
    return (CC - r * Math.sin(t)).toFixed(2) + ' ' + (CC - r * Math.cos(t)).toFixed(2);
  }
