/* ══ 19-cloud.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   الوصلة — بابُ ارتقِ إلى خادمِه، وهو اليومَ مُغلَق
   ───────────────────────────────────────────────────────────────────
   التطبيقُ اليومَ لا خادمَ له، وفحصُ «طلباتُ الشبكة» في حارسِ الجودةِ
   يَسقط إن خرج طلبٌ واحد. وغدًا — حين يَصل النطاق — نُريد التنبيهَ
   والمزامنةَ والحلقةَ الحقيقيّة.

   فالخيارُ بين أمرَين: أن نَكتب ذلك كلَّه غدًا في عَجَلةٍ فنَشقّ
   الوحداتِ شقًّا، أو أن نَضع **المَوضِعَ** اليومَ ساكنًا. وهذا هو.

   القاعدةُ الحاكمة: ‎ENDPOINT‎ فارغٌ ⇐ الوحدةُ كلُّها ساكنة. كلُّ
   دالّةٍ تَرُدّ ‎{ok:false, off:true}‎ بلا طلبٍ البتّة. فإذا جاء
   النطاقُ مُلئ السطرُ الواحدُ أدناه وعملَ كلُّ شيء.

   وثلاثةُ أشياءَ قُيِّدت في هذه الوحدةِ قصدًا:

   ١) **بابٌ واحدٌ للخروج.** لا ‎fetch‎ في ارتقِ كلِّه إلّا في ‎req‎
      ههنا وفي خطِّ المصحف. فمَن أراد أن يَعرف ما يُرسَل من جهازه
      قرأ دالّةً واحدة.

   ٢) **المعرّفُ لا يُولَّد قبل حاجته.** معرّفٌ لا يُرسَل لا يُصنَع.
      ومَوضِعُه خارجَ ‎App.state‎ في مفتاحٍ مستقلّ: فهو **وصفُ جهازٍ
      لا وصفُ قارئ**، فلا يَنتقل في النسخةِ الاحتياطيّةِ إلى جهازٍ
      آخرَ فيَنتحل هُويّةَ الأوّل.

   ٣) **لا يُرفَع إلّا مختوم.** ‎push‎ لا تَقبل إلّا مِظروفَ ‎App.Seal‎.
      فلو سها كاتبٌ يومًا ورفع الحالةَ عاريةً رُدَّ قبل أن يَخرج شيء.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* ← السطرُ الواحد. يُملأ يومَ يَصل النطاق: 'https://irtaqi.app' */
  var ENDPOINT = '';

  var DEV_KEY = 'irtaqi.device';   /* مستقلٌّ عن الحالة: وصفُ جهازٍ لا قارئ */
  var SIG_KEY = 'irtaqi.sign';     /* قفلُ صفِّ هذا الجهازِ عند الخادم */

  /* حدُّ المِظروفِ: صفُّ D1 سقفُه مليونانِ من البايت بما فيه المعرّفُ
     والعدّادُ والبصمة، فالعمليُّ ١٬٥٠٠٬٠٠٠. **بالبايتِ لا بالمحرف**:
     الحرفُ العربيُّ بايتان، فقياسُ الطولِ يُجيز ضِعفَ ما يَقبله
     الخادمُ ثمّ يُرَدّ الرفعُ بعد أن قُطع الطريقُ كلُّه. */
  var MAX = 1500000;

  function base() {
    var s = (App.state && App.state.settings) || {};
    var v = (typeof s.cloud === 'string' && s.cloud) || ENDPOINT || '';
    return v.replace(/\/+$/, '');
  }

  /* أمفتوحٌ البابُ؟ كلُّ الواجهاتِ تَسأل هذه أوّلًا، وشاشةُ الإعداداتِ
     لا تُظهر بطاقةَ المزامنةِ إلّا إن صدقَت — فلا يَرى القارئُ اليومَ
     بابًا لا يُفتح، ويَراه يومَ يُفتح بلا تحديثِ تطبيق. */
  function on() { return !!base(); }

  function devId() {
    var v = null;
    try { v = localStorage.getItem(DEV_KEY); } catch (e) {}
    if (v && /^[A-Za-z0-9_-]{16,64}$/.test(v)) return v;
    v = mint();
    try { localStorage.setItem(DEV_KEY, v); } catch (e) {}
    return v;
  }

  function mint() {
    var raw = '';
    try {
      if (window.crypto && crypto.randomUUID) raw = crypto.randomUUID();
      else if (window.crypto && crypto.getRandomValues) {
        var a = crypto.getRandomValues(new Uint8Array(16)), i;
        for (i = 0; i < a.length; i++) raw += ('0' + a[i].toString(16)).slice(-2);
      }
    } catch (e) {}
    if (!raw) raw = String(Date.now()) + Math.random().toString(36).slice(2);
    return raw.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  }

  /* ── قفلُ الصفّ ────────────────────────────────────────────────
     ثغرةٌ كانت في أوّلِ تصميمي: المعرّفُ وحدَه كان مفتاحَ الصفّ، فمَن
     عرفه — من سجلٍّ أو من رابطٍ مُسرَّب — لم يَفكّ النسخةَ المُعمّاة،
     لكنّه **دفعَ فوقَها** فأتلف سجلَّ حفظٍ عمرُه سنون. فلكلِّ صفٍّ
     قفل: سرٌّ عشوائيٌّ يُولَد هنا، يُرسَل في ترويسةٍ فتُختَم بصمتُه
     عند الخادمِ في أوّلِ كتابةٍ ويُطالَب به بعدها.

     وقيمُ ترويساتِ HTTP لاتينيّةٌ لا تَقبل عربيًّا، فالسرُّ من
     Base64 وحدَه. */
  function sign() {
    var v = null;
    try { v = localStorage.getItem(SIG_KEY); } catch (e) {}
    if (v && v.length >= 16 && v.length <= 200) return v;
    v = '';
    try {
      var a = crypto.getRandomValues(new Uint8Array(32)), s = '', i;
      for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
      v = btoa(s).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
    } catch (e) {
      v = (String(Date.now()) + Math.random().toString(36).slice(2) +
           Math.random().toString(36).slice(2)).slice(0, 40);
    }
    try { localStorage.setItem(SIG_KEY, v); } catch (e) {}
    return v;
  }

     تُوضَع في الذاكرةِ لهذه الجلسةِ ولا تُكتب في القرص: الكلمةُ لا
     تُحفَظ، والمشتقُّ منها لا يُحفَظ. فمَن أخذ الجهازَ لم يَجد بها
     سبيلًا إلى نسخةِ الخادم. */
  var IDENT = null;
  function identity(o) {
    if (o === null) { IDENT = null; return null; }
    if (o && o.id && o.key) IDENT = { id: o.id, key: o.key };
    return IDENT;
  }

  function forget() {
    IDENT = null;
    try { localStorage.removeItem(DEV_KEY); } catch (e) {}
    try { localStorage.removeItem(SIG_KEY); } catch (e) {}
  }

  function size(s) {
    try { return new TextEncoder().encode(s).length; }
    catch (e) { return String(s).length * 2; }   /* تقديرٌ متحفّظ */
  }

  /* ── البابُ الوحيد ─────────────────────────────────────────────
     وله مُهلةٌ مقصودة: القارئُ في مسجدٍ شبكتُه ضعيفةٌ لا يَنتظر
     التطبيقَ، والمزامنةُ خدمةٌ لا شرطٌ لفتحِ المصحف. */
  function req(path, body, q) {
    var b = base();
    if (!b) return Promise.resolve({ ok: false, off: true });

    var url = b + path + (q || '');
    var opt = { method: body ? 'POST' : 'GET', mode: 'cors', cache: 'no-store' };
    var head = { 'x-irtaqi-key': (IDENT && IDENT.key) || sign() };
    if (body) {
      head['content-type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    opt.headers = head;

    var ac = null, timer = null;
    try {
      if (window.AbortController) {
        ac = new AbortController();
        opt.signal = ac.signal;
        timer = setTimeout(function () { try { ac.abort(); } catch (e) {} }, 12000);
      }
    } catch (e) {}

    return fetch(url, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        d = d || {};
        d.status = r.status;
        if (!('ok' in d)) d.ok = r.ok;
        return d;
      });
    }).catch(function () {
      return { ok: false, net: true };
    }).then(function (d) {
      if (timer) clearTimeout(timer);
      return d;
    });
  }

  /* ── عدٌّ مجهول: كم جهازًا يَفتح ارتقِ. لا اسمَ ولا محتوى ── */
  function ping() {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    return req('/api/ping', { id: devId(), v: App.VERSION || '1' });
  }

  /* ── التذكير: ساعةُ الوِردِ بتوقيتِ صاحبِه هو ── */
  function subscribe(sub, h, m) {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    return req('/api/push/sub', {
      id: devId(), sub: sub, wird: { h: h | 0, m: m | 0 }, tz: tz
    });
  }

  function unsubscribe() {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    return req('/api/push/unsub', { id: devId() });
  }

  /* ── المزامنة ──────────────────────────────────────────────────
     ‎rev‎ عدّادٌ عند الخادم. يُدفَع ما بُني على آخرِ ما رأيناه، فإن
     سبقَنا جهازٌ آخرُ رُدَّ الدفعُ بـ409 ومعه الأحدثُ ليَدمج صاحبُه
     بعينِه. ودمجُ سجلّاتِ حفظٍ أمرٌ لا يُترَك لخادمٍ لا يَقرأ. */
  /* مفتاحُ VAPID العامّ — لا يَعمل pushManager.subscribe بغيره */
  function pushKey() {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    return req('/api/push/key');
  }

  /* ── المزامنة ──────────────────────────────────────────────────
     عنوانُها هُويّةٌ مشتقّةٌ من كلمةِ صاحبها، فمَن حملَ كلمتَه بلغَ
     نسختَه من أيِّ جهاز. ولا مزامنةَ قبل أن تُفتَح الكلمةُ — وهذا
     مقصود: نسخةٌ على خادمٍ بلا كلمةٍ تَعني نسخةً لا تُفَكّ. */
  function pull(rev) {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    if (!IDENT) return Promise.resolve({ ok: false, locked: true });
    return req('/api/sync', null,
      '?id=' + encodeURIComponent(IDENT.id) + '&rev=' + (rev | 0));
  }

  function push(envelope, rev) {
    if (!on()) return Promise.resolve({ ok: false, off: true });
    if (!IDENT) return Promise.resolve({ ok: false, locked: true });
    if (!App.Seal || !App.Seal.sealed(envelope)) {
      /* حارسٌ لا يُرفَع: لو سها كاتبٌ ورفع الحالةَ عاريةً وُقف هنا */
      return Promise.resolve({ ok: false, bare: true });
    }
    if (size(envelope) > MAX) return Promise.resolve({ ok: false, big: true });
    return req('/api/sync', { id: IDENT.id, rev: rev | 0, blob: envelope });
  }

  App.Cloud = {
    on: on, endpoint: base, device: devId, sign: sign, forget: forget,
    identity: identity, size: size,
    ping: ping, subscribe: subscribe, unsubscribe: unsubscribe,
    pushKey: pushKey, pull: pull, push: push, MAX: MAX
  };

}(window.App));

/* ══ 19-pwa.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   التثبيتُ والتحديث — ما يَصِل القارئَ من خارجِ الشاشة
   ───────────────────────────────────────────────────────────────────
   طُلب «إشعارٌ يَأتي كلَّ من عنده التطبيقُ يَطلب منه التحديث». وههنا
   تمييزٌ لا بدَّ منه:

   **إشعارُ الجوّالِ الحقيقيُّ** (الذي يَصِل والتطبيقُ مُغلَق) لا يَقوم
   إلّا على خادمٍ يَحفظ اشتراكَ كلِّ جهازٍ على حِدَة — ومعنى ذلك سجلٌّ
   فيه أجهزةُ القرّاء. وقد قُطع في هذا التطبيقِ عهدٌ: لا بياناتِ أحد.
   فلو بَنيناه نَقَضنا العهدَ من أجل سطرٍ يُقرأ.

   **والبديلُ الصادق** هو هذا: التطبيقُ نفسُه يَعرف أنّ نسخةً أحدثَ
   نزلت على الجهازِ وتَنتظر، فيُخبر صاحبَه أوّلَ ما يَفتحه. لا خادمَ
   ولا سجلَّ ولا إذنَ إشعارات — والقارئُ يَبلغه الخبرُ في أوّلِ لحظةٍ
   يَكون فيها قادرًا على الفعل: وهو فاتحٌ للتطبيق.

   وكان في ‎sw.js‎ خللٌ أُصلح معه: كان العاملُ يُنادي ‎skipWaiting‎ في
   تنصيبِه بلا شرط، فتُبدَّل النسخةُ تحت قارئٍ يَقرأ — صفحتُه القديمةُ
   وملفّاتُها الجديدة. فصار الانتظارُ هو الأصل، ولا يُتخطّى إلّا
   بضغطةٍ من صاحبِ الجهاز.

   ولا شريطَ يَظهر إلّا بخبرٍ يُستحَقّ: تحديثٌ جاهزٌ بالفعل، أو دعوةٌ
   إلى التثبيتِ تُعرَض مرّةً واحدةً بعد أن يُتِمّ القارئُ وردًا — لا في
   وجهِ قادمٍ لم يَستقرَّ بعد.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var ASK_KEY = 'irtaqi.pwa.ask';   /* دعوةُ التثبيت: عُرضت أو رُدّت */
  var CHECK_MS = 6 * 3600 * 1000;   /* لا يُسأل عن نسخةٍ أحدثَ إلّا كلَّ ستِّ ساعات */

  var waiting = null;    /* عاملُ خدمةٍ نزل وانتظر الإذن */
  var deferred = null;   /* حدثُ التثبيتِ المؤجَّل من المتصفّح */
  var lastCheck = 0;
  var subs = [];
  var bar = null;

  /* ── حالُ التثبيت ──────────────────────────────────────────── */

  function installed() {
    try {
      if (navigator.standalone) return true;              /* iOS */
      return !!(window.matchMedia &&
        (window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: minimal-ui)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches));
    } catch (e) { return false; }
  }

  /* سفاري لا يُطلق ‎beforeinstallprompt‎ البتّة، فلا يُنتظَر منه زرٌّ
     يُضغَط — بل يُقال لصاحبِه أين يَجده بيدِه. */
  function apple() {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
  }

  function canInstall() { return !!deferred; }

  function install() {
    if (!deferred) return;
    var d = deferred;
    deferred = null;                       /* لا يُستعمَل الحدثُ مرّتين */
    try {
      d.prompt();
      if (d.userChoice && d.userChoice.then) {
        d.userChoice.then(function (r) {
          if (r && r.outcome === 'accepted') {
            mark();
            App.toast && App.toast('ثُبِّت التطبيق.');
          }
          tell();
        });
      }
    } catch (e) { /* متصفّحٌ رفض — لا شيءَ يُفعَل */ }
    tell();
  }

  function asked() {
    try { return localStorage.getItem(ASK_KEY) || ''; } catch (e) { return ''; }
  }
  function mark(v) {
    try { localStorage.setItem(ASK_KEY, v || 'done'); } catch (e) {}
  }

  /* ── التحديث ───────────────────────────────────────────────── */

  function ready(sw) {
    waiting = sw;
    tell();
    showBar();
  }

  function hasUpdate() { return !!waiting; }

  function apply() {
    if (!waiting) { location.reload(); return; }
    var done = false;
    var go = function () { if (done) return; done = true; location.reload(); };
    try {
      navigator.serviceWorker.addEventListener('controllerchange', go);
      waiting.postMessage({ type: 'SKIP_WAITING' });
    } catch (e) { go(); return; }
    /* ولو لم يَردّ العاملُ: لا يُترَك القارئُ أمام زرٍّ لا يَصنع شيئًا */
    setTimeout(go, 2600);
  }

  function watch() {
    if (!('serviceWorker' in navigator)) return;
    if (!navigator.serviceWorker.getRegistration) return;
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return;

      /* ‎controller‎ شرطٌ لازم: بدونه هذا أوّلُ تنصيبٍ لا تحديث،
         فلا يُقال لقارئٍ فتح التطبيقَ لتوّه «حدِّثْ». */
      if (reg.waiting && navigator.serviceWorker.controller) ready(reg.waiting);

      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) ready(nw);
        });
      });

      var ping = function () {
        if (document.hidden) return;
        var t = Date.now();
        if (t - lastCheck < CHECK_MS) return;
        lastCheck = t;
        try { reg.update(); } catch (e) {}
      };
      lastCheck = Date.now();
      document.addEventListener('visibilitychange', ping);
    })['catch'](function () {});
  }

  /* ── الشريط ────────────────────────────────────────────────── */

  function styleOnce() {
    if (document.getElementById('pwa-css')) return;
    var s = document.createElement('style');
    s.id = 'pwa-css';
    s.textContent = [
      /* فوقَ الملاحةِ وتحتَ الإشعارِ العابر: ‎z‎ أقلُّ من ‎#toast‎ فلا
         يَحجبه، وقاعدتُه أعلى منه بقَدرِه فلا يَركبان موضعًا واحدًا. */
      '.pwa-bar{position:fixed;z-index:80;inset-inline:var(--pad,16px);',
      'bottom:calc(var(--nav-h,68px) + env(safe-area-inset-bottom) + 16px);',
      'max-width:min(460px,calc(100% - var(--pad,16px) * 2));margin-inline:auto;',
      'display:flex;align-items:center;',
      'gap:10px;padding:11px 14px;border-radius:var(--r-lg,18px);',
      /* ‎surface-2‎ لا ‎surface‎: الأرضُ كريميّةٌ والسطحُ كريميٌّ مثلُها،
         فكان الشريطُ يَذوب فيها ويُقرأ نصُّه معلَّقًا في الهواء. وهذه
         هي أرضُ «الإشعارِ العابر» نفسُها — فالشريطانِ من جنسٍ واحد. */
      'background:var(--surface-2);border:1px solid var(--hair);',
      'box-shadow:0 14px 34px -14px var(--shade-3), var(--lift,none);',
      'animation:pwa-rise .3s ease both}',
      '@keyframes pwa-rise{from{opacity:0;transform:translateY(10px)}}',
      '.pwa-t{flex:1;min-width:0;font-size:13.5px;line-height:1.5;color:var(--ink)}',
      '.pwa-t small{display:block;font-size:11.5px;color:var(--ink-faint)}',
      '.pwa-go{flex:none;padding:8px 15px;border-radius:999px;border:0;',
      'background:var(--accent);color:var(--on-accent);font:inherit;',
      'font-size:13px;font-weight:700;cursor:pointer}',
      '.pwa-x{flex:none;display:grid;place-items:center;width:30px;height:30px;',
      'border-radius:999px;border:0;background:transparent;color:var(--ink-faint);',
      'cursor:pointer}',
      '@media (prefers-reduced-motion:reduce){.pwa-bar{animation:none}}'
    ].join('');
    document.head.appendChild(s);
  }

  function bannerShut() {
    if (!bar) return;
    if (bar.parentNode) bar.parentNode.removeChild(bar);
    bar = null;
  }

  function banner(text, note, label, go, onShut) {
    styleOnce();
    bannerShut();
    bar = App.el('div', 'pwa-bar');
    bar.setAttribute('role', 'status');
    var t = App.el('div', 'pwa-t');
    t.appendChild(App.el('span', '', text));
    if (note) t.appendChild(App.el('small', '', note));
    var b = App.el('button', 'pwa-go', label);
    b.type = 'button';
    b.onclick = function () { bannerShut(); go(); };
    var x = App.el('button', 'pwa-x', App.icon('close', 16));
    x.type = 'button';
    x.setAttribute('aria-label', 'إخفاء');
    x.onclick = function () { bannerShut(); if (onShut) onShut(); };
    bar.appendChild(t); bar.appendChild(b); bar.appendChild(x);
    document.body.appendChild(bar);
  }

  /* لا يُقاطَع قادمٌ لم يَدخل بعد: شاشةُ الاستقبالِ تَسأل القارئَ عن
     اسمِه وصيغةِ خطابِه، فلو نزل الشريطُ فوقها لَرأى أوّلَ ما يَرى
     كلامًا عن نسخٍ وتحديثات. فيُنتظَر حتّى يَصير في التطبيق. */
  function busy() {
    try {
      var r = App.route && App.route();
      if (!r) return true;
      /* شاشةُ الاستقبال، وصحيفةٌ مفتوحةٌ فوقَ الشاشة، وصفحةُ المصحفِ
         وهو يَقرأ: ثلاثةُ مواضعَ لا يُقحَم فيها خبرٌ عن نسخة. */
      return r.name === 'onboard' || r.name === 'qpage' || !!r.sheet;
    } catch (e) { return true; }
  }

  function showBar() {
    if (!waiting) return;
    if (busy()) { setTimeout(showBar, 1800); return; }
    banner('نسخةٌ أحدثُ جاهزة',
           'لا يَضيع من حفظك شيء.',
           'حدِّثْ الآن', apply);
  }

  /* الدعوةُ إلى التثبيت: بعد أن يُتِمّ القارئُ وردًا — لا قبلَ ذلك.
     من أتَمَّ وردًا فقد جرّب التطبيقَ وعَرَف أيَبقى معه أم لا، فالدعوةُ
     حينئذٍ جوابٌ لا مقاطعة. ومرّةً واحدةً لا تُعاد. */
  function maybeInvite() {
    if (installed() || asked()) return;
    if (!canInstall()) return;
    if (busy()) { setTimeout(maybeInvite, 2500); return; }
    var p = App.state && App.state.plans;
    var any = false, i;
    if (p) for (i = 0; i < p.length; i++) if (p[i].done > 0) { any = true; break; }
    if (!any) return;
    mark('seen');
    banner('ثبِّتْ «رتِّل وارتقِ» على جهازك',
           'يُفتَح من شاشتك كأيِّ تطبيق.',
           'ثبِّتْ', install, function () { mark('no'); });
  }

  /* ── من يُخبَر إذا تبدّلت الحال ─────────────────────────────── */

  function on(fn) { if (typeof fn === 'function') subs.push(fn); }
  function off(fn) {
    for (var i = subs.length - 1; i >= 0; i--) if (subs[i] === fn) subs.splice(i, 1);
  }
  function tell() {
    for (var i = 0; i < subs.length; i++) { try { subs[i](); } catch (e) {} }
  }

  /* ── الإقلاع ───────────────────────────────────────────────── */

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    tell();
  });
  window.addEventListener('appinstalled', function () {
    deferred = null;
    mark('done');
    bannerShut();
    tell();
  });

  function boot() {
    watch();
    /* لا تُزاحم الدعوةُ أوّلَ شاشةٍ يَراها: تُؤجَّل حتّى يَستقرّ. */
    setTimeout(maybeInvite, 2500);
  }
  if (document.readyState === 'complete') setTimeout(boot, 400);
  else window.addEventListener('load', function () { setTimeout(boot, 400); });

  App.PWA = {
    installed: installed,
    apple: apple,
    canInstall: canInstall,
    install: install,
    hasUpdate: hasUpdate,
    apply: apply,
    /* معروضةٌ ليَبلغها الحارس: مسارُ الدعوةِ لا يُمشى بيدٍ في متصفّحٍ
       مُختبَر، فلو لم يُنادَ من خارجِه لبَقي بلا فحصٍ إلى أن يَكسِره
       تغييرٌ لا يَنتبه له أحد. */
    invite: maybeInvite,
    on: on,
    off: off
  };
})(window.App);

/* ══ 22-breath.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   النَّفَس — أن يَعرف التطبيقُ متى هو
   ───────────────────────────────────────────────────────────────────
   اللوحُ في ‎15-theme.css‎ يَملك **ما** يَتبدّل: أوجهُ اليومِ الأربعةُ
   ومواسمُه. وهذه الوحدةُ تَملك **متى** يَتبدّل، وحدُّها عند ذلك:
   لا لونَ هنا ولا نصفَ قطرٍ ولا ظلّ — سِمةٌ على الجذرِ وشريطٌ واحدٌ
   كلُّ ما فيه رموزُ اللوح.

    set: set,

       تمامَ اليومِ في سطره الخافت أصلًا. */
    if (open) return null;
    var b = App.el('div', 'j-band');
    var hold = slim ? 1700 : 2400;
    b.style.setProperty('--j-hold', (hold / 1000) + 's');
    b.setAttribute('role', 'status');
    if (!slim) {
      var o = App.el('div', null, sealSvg(null, true));
      b.appendChild(o.firstChild);
    }
    var t = App.el('div', 'j-bt');
    var bb = App.el('b'); bb.textContent = title; t.appendChild(bb);
    if (sub) { var ii = App.el('i'); ii.textContent = sub; t.appendChild(ii); }
    b.appendChild(t);
    host().appendChild(b);
    vanish(b, hold + 60);
    return b;
  }

  /* ── ٢/٣ · المقام ──────────────────────────────────────────────
     يأخذ اللمسَ وحدَه دون الشاشةِ تحتَه، ويُغلَق بلمسةٍ أو بمفتاحِ
     الهروبِ أو بانقضاء مُدّته. ولا يَخطِف البؤرةَ من الزرِّ الذي
     أعادت إليه شاشةُ «اليوم» تركيزَها: خَطْفُها يُضيع موضعَ
     المُستعمِلِ بعد أن استُرِدّ له. */
  var open = null;
  function plate(m, also) {
    close();
    var p = App.el('div', 'j-plate');
    p.appendChild(App.el('div', 'j-scrim'));
    p.appendChild(App.el('div', 'j-aura'));

    var body = App.el('div', 'j-body');
    body.setAttribute('role', 'status');
    var o = App.el('div', null, sealSvg(m.num, false));
    body.appendChild(o.firstChild);
    var h = App.el('h2', 'j-t'); h.textContent = m.t; body.appendChild(h);
    var l = App.el('p', 'j-l'); l.textContent = m.l; body.appendChild(l);
    if (also) { var a = App.el('p', 'j-also'); a.textContent = also; body.appendChild(a); }

    /* الزرُّ الوحيدُ في هذه الوحدةِ الذي يُخاطِب، فيُجنَّس: كان
       يقول «واصِل» لمريمَ في أرفعِ لحظةٍ يَبلغها التطبيق. وبنكُ
       الكلماتِ يُحمَّل قبلَنا (35 قبل 26 في الدمج؟ لا — بل بعدَنا)،
       فيُسأل عند الرسمِ لا عند التحميل. */
    var go = App.el('button', 'j-go',
      (App.Words && App.Words.vg) ? App.Words.vg('واصِل', 'واصِلي') : 'واصِل');
    go.type = 'button';
    go.onclick = function (e) { e.stopPropagation(); close(); };
    body.appendChild(go);

    /* ── خَتْمُ المحطّةِ الكبرى ──
       المقامُ يُغلق نفسَه بعد ثلاثِ ثوانٍ ونصف. فلو وُضع ههنا زرٌّ
       بلا إيقافِ المؤقّتِ لَذهب من تحتِ اليدِ وهي تُمَدّ إليه — فمَن
       أراد خَتْمَه أوقفَ الانصرافَ بأوّلِ لمسة.

       ولا يُعرَض إلّا في الطبقةِ الثالثة: شيءٌ يُعطى في كلِّ لمسةٍ
       لا يُحتفَظ به، وخَتْمٌ يُنال كلَّ يومٍ ليس خَتْمًا. */
    var keep = null;
    if (m.tier >= 3 && window.IrtaqiShare && IrtaqiShare.sealCard) {
      /* يُجنَّس كأخيه: زرٌّ يُخاطِب في أرفعِ لحظةٍ يَبلغها التطبيق،
         فلا يُقال «خُذ» لمريمَ — وهو العيبُ عينُه الذي أصاب «واصِل». */
      keep = App.el('button', 'j-go j-keep',
        (App.Words && App.Words.vg)
          ? App.Words.vg('خُذ خَتْمَك', 'خُذي خَتْمَكِ')
          : 'خُذ خَتْمَك');
      keep.type = 'button';
      keep.onclick = function (e) {
        e.stopPropagation();
        close();
        IrtaqiShare.sealCard(m);
      };
      body.appendChild(keep);
    }

    p.appendChild(body);
    p.onclick = function () { close(); };

    function esc(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    document.addEventListener('keydown', esc, true);

    /* المهلةُ كما كانت. جرّبتُ إطالتَها إلى ٦٫٨ ثانيةٍ ليَبلغ الزرَّ
       مَن تمهّل، فإذا هي تَحجب الشاشةَ سبعَ ثوانٍ بعد كلِّ محطّةٍ
       كبرى — وذلك ثمنٌ أغلى من الزرّ. ومَن فاتَه خَتْمُه يَجده في
       «ختماتي» متى شاء، فلا شيءَ يَضيع بانصرافِ اللوح. */
    var tm = setTimeout(close, m.tier >= 3 ? 3600 : 2900);
    if (keep) {
      /* **قصدٌ لا مرور.** كتبتُها أوّلَ مرّةٍ إلغاءً للمؤقّت عند
         ‎pointerenter‎، فوقعَ عيبان تتابعا:

         الأوّلُ أنّ الإلغاءَ بلا بديلٍ خلّدَ اللوحَ — يَعلو الشاشةَ
         كلَّها فلا تُنقَر بعده لمسةٌ واحدة. فصارت مهلةً تُمَدّ.

         والثاني أنّ ‎pointerenter‎ ليس قصدًا: مؤشِّرٌ يَعبُر الشاشةَ
         في طريقِه لا يَنبغي أن يُثبّت لوحًا. فبقي المدُّ على ما هو
         فعلٌ مقصود — ضغطةٌ أو تركيزُ لوحةِ مفاتيح — وزِيدت المهلةُ
         الأولى حين يكون للوحِ زرُّ خَتمٍ يُمَدّ إليه. */
      p.addEventListener('pointerdown', hold, true);
      p.addEventListener('focusin', hold, true);
    }
    function hold() {
      if (!open) return;
      clearTimeout(open.tm);
      open.tm = setTimeout(close, 9000);
    }
    open = { node: p, esc: esc, tm: tm };
    host().appendChild(p);
  }
  function close() {
    if (!open) return;
    clearTimeout(open.tm);
    document.removeEventListener('keydown', open.esc, true);
    if (open.node.parentNode) open.node.parentNode.removeChild(open.node);
    open = null;
  }

  /* ── متى يَنزل المقامُ الأوسطُ إلى شريط ──
     مرّةً في اليوم ولا مزيد. وفي الذاكرة لا في المخزَن: الضابطُ
     لجلسةٍ لا لعُمر، والحالةُ المحفوظةُ عقدٌ لا يُزاد فيه من عندنا. */
  var midDay = null;
  function allowPlate(tier) {
    if (tier >= 3) return true;
    var k = App.dateKey();
    if (midDay === k) return false;
    midDay = k;
    return true;
  }

  /* ── وردُ اليوم: هل تمّ كلُّه؟ ─────────────────────────────────── */
  function dayState() {
    var plans = App.state.plans || [];
    var due = plans.filter(function (x) { return P.isDueToday(x) || P.doneToday(x) > 0; });
    var done = due.filter(function (x) { return P.doneToday(x) > 0; });
    var sum = 0;
    done.forEach(function (x) { sum += P.doneToday(x); });
    return { due: due.length, done: done.length, pages: sum,
             all: due.length > 0 && done.length === due.length };
  }

  var DAY_SAYS = ['تمّ وردُ اليوم', 'أُتمّ وردُ اليومِ كلُّه', 'وردُ اليومِ تامّ'];

  /* ── المدخل ────────────────────────────────────────────────────
     تُنادى من 50-today بعد التسجيل وقبل إعادةِ الرسم، فيُلتقط موضعُ
     الزرِّ قبل أن يُمحى من الشجرة. وكلُّ ما هنا داخلَ try: لحظةُ فرحٍ
     تُعطِب تسجيلَ الورد أسوأُ من لحظةٍ لا تقع. */
  function run(p, n) {
    var el = App.$('[data-fk="do-' + p.id + '"]');
    var x = window.innerWidth / 2, y = window.innerHeight * .42;
    if (el) {
      var r = el.getBoundingClientRect();
      if (r.width) { x = r.left + r.width / 2; y = r.top + r.height / 2; }
    }

    var after = App.state.plans || [];
    var aft = shot(after), bef = shot(rewind(after, p, n));
    var day = dayState();

    burst(x, y, P.kindCls(p), day.done <= 1);

    var ms = findAll(bef, aft, p, n);
    var top = ms[0] || null;
    /* السطرُ الخافت: الفاصلةُ العربيّةُ وحدَها لا النقطةُ الوسطى — هذا
       عطفُ كلامٍ لا جَدْوَلُ حقول، والنقطةُ تُقرأ صفرًا بجوار الأرقام. */
    var rest = ms.slice(1, 3).map(function (m) { return m.t; });

    setTimeout(function () {
      try {
        if (top) {
          if (day.all) rest.push('تمّ وردُ اليوم');
          var also = rest.length ? 'ومعها ' + rest.join('، ') : null;
          if (allowPlate(top.tier)) plate(top, also);
          else band(top.t, top.l);
          return;
        }
        if (day.all) {
          var st = aft.streak;
          var slim = st >= 8;
          var sub = App.join(pagesWord(day.pages),
            st >= 2 ? 'السلسلةُ ' + daysWord(st) : null);
          band(DAY_SAYS[new Date().getDate() % DAY_SAYS.length], sub, slim);
        }
      } catch (e) {}
    }, calm ? 60 : 190);
  }

  App.Joy = {
    /* تُنادى عند كلِّ ✓ */
    mark: function (p, n) { try { run(p, n); } catch (e) {} },
    /* تُفتح لحظةُ مقامٍ بعينها — للمعاينة والاختبار */
    show: function (m, also) { try { plate(m, also || null); } catch (e) {} },
    close: close
  };
})(window.App);

/* ══ 28-example.js ══ */
/* ══ 28-example.js — المثالُ الحيّ ══════════════════════════════
   كانت المحاكاةُ ملفًّا ثانيًا يُبنى بجانب التطبيق. وذلك خطأٌ من
   وجهَين: يَراه صاحبُ التطبيقِ ولا يَراه الطالبُ الذي فتح التطبيقَ
   أوّلَ مرّة، وهو الذي يحتاجه؛ ويُبنى بشيفرةٍ ثانيةٍ تَشرد عن الأولى
   كلّما تغيّرت. فالمثالُ يَسكن التطبيقَ نفسَه ويُحسَب من مناهجِه.

   والطريقةُ: لا تُرسَم صورةٌ لشاشةٍ ممتلئة — تُعرَض الشاشةُ الحقيقيّةُ
   نفسُها على حالةٍ مُعارة. فما يَراه الطالبُ في المثالِ هو ما سيَراه
   في حسابه بالضبط، ولا يَبقى رسمٌ ثانٍ يُنسى تحديثُه.

   والحالةُ المُعارةُ تُردّ في finally مهما وقع: مثالٌ يُسرّب نفسَه
   إلى حسابِ الطالبِ أسوأُ من ألّا يكون مثال. */
(function (App) {
  'use strict';

  var EX = null;

  /* طالبٌ مضى عليه أربعون يومًا: حفظٌ جديدٌ في جزء عمّ، وتثبيتُ ما
     قَرُب، ومراجعةٌ بعيدةٌ في البقرة، وختمةُ تلاوة. أرقامُه تَنمو ولا
     تَطّرد — المواظبةُ الحقيقيّةُ فيها يومٌ ناقصٌ ويومٌ تامّ. */
  function build() {
    var M = App.Manhaj, P = App.Plans;
    if (!M || !P) return null;

    var DAYS = [0, 1, 2, 3, 4, 5, 6];
    /* ‎cap‎ حصّةُ ما أُنجز: المثالُ يدلّ على التطوّرِ لا على الانتهاء.
       ومنهجٌ تامٌّ في مثالٍ يُري الطالبَ شريطًا ممتلئًا لا حركةَ فيه،
       فلا يَعرف منه ما الذي يَنتظره. فكلٌّ يقف في طريقه، وعلى قدرٍ
       مختلفٍ ليُرى التفاوتُ بين الأنواع. */
    var plans = [
      { kind: 'hifz',    from: 562, to: 604, rate: 1,  cap: .62, t: 'حفظُ جزأَي تبارك وعمّ' },
      { kind: 'tathbit', from: 582, to: 604, rate: 2,  cap: .78, t: 'تثبيتُ ما حُفظ' },
      { kind: 'review',  from: 2,   to: 106, rate: 5,  cap: .45, t: 'مراجعةُ البقرة وآل عمران' },
      { kind: 'tilawa',  from: 1,   to: 604, rate: 10, cap: .55, t: 'ختمةُ تلاوة' }
    ].map(function (o, i) {
      return { id: 'ex' + i, kind: o.kind, scope: 'page',
               from: o.from, to: o.to, rate: o.rate, days: DAYS.slice(),
               done: 0, log: {}, title: o.t, manhaj: null,
               cap: Math.round((o.to - o.from + 1) * o.cap),
               startedAt: dayKey(39) };
    });

    /* السجلُّ يُبنى بالرجوعِ من اليوم، فيَصدُق مهما كان تاريخُ القراءة */
    var i, d, p, n;
    for (d = 39; d >= 0; d--) {
      var key = dayKey(d);
      /* الفجواتُ في الماضي البعيدِ وحدَه: الخطُّ المستقيمُ يَكذِب،
         لكنّ فجوةً في الأيّامِ الأخيرةِ تُسقط عدّادَ المواظبةِ إلى
         ثلاثةٍ فيَبدو المثالُ متعثّرًا لا ناميًا. فالأسبوعان
         الأخيران متّصلان، وما قبلهما فيه تقصيرٌ وراحة. */
      var slack = d < 13 ? 1
        : ((d % 9 === 3) ? 0 : ((d % 9 === 7) ? 0.5 : 1));
      for (i = 0; i < plans.length; i++) {
        p = plans[i];
        n = Math.round(p.rate * slack);
        if (!n) continue;
        if (p.done >= p.cap) continue;
        n = Math.min(n, p.cap - p.done);
        p.log[key] = n;
        p.done += n;
      }
    }
    for (i = 0; i < plans.length; i++) { delete plans[i].cap; }

    return {
      v: 1,
      profile: { name: 'مثال', gender: gender() },
      plans: plans,
      circles: [],
      settings: {}
    };
  }

  function gender() {
    return (App.state && App.state.profile && App.state.profile.gender === 'f')
      ? 'f' : 'm';
  }

  function dayKey(back) {
    var t = new Date();
    /* بـ setDate لا بالمللي‌ثانية: التوقيتُ الصيفيُّ يَبتلع ساعةً
       فتَنزلق المفاتيحُ يومًا كاملًا مرّةً في السنة. */
    t.setDate(t.getDate() - back);
    return App.dateKey(t);
  }

  /* يُبنى مرّةً، ويُعاد بناؤه إن بُدّلت الهويّة ليتبدّل خطابُه */
  function state() {
    if (!EX || EX.profile.gender !== gender()) EX = build();
    return EX;
  }

  /* يُعيرُ الحالةَ المثاليّةَ لدالّةِ الرسم ثمّ يَردّها. والردُّ في
     finally: لو رمت الدالّةُ لبقي حسابُ الطالبِ حالةً مُختلَقة. */
  function borrow(fn) {
    var ex = state();
    if (!ex) return null;
    /* عبر ‎App.withState‎ لا بالإسناد: ‎App.state‎ للقراءةِ فقط، وذاك
       صوابٌ يُحفَظ — فلا يُكسَر الحاجزُ من خارجِه، بل يُفتح بابٌ
       مسمًّى فيه يَردّ الأصلَ في ‎finally‎. */
    try { return App.withState(ex, fn); }
    catch (e) { return null; }
  }

  /* الإطار: شارةٌ تقول «مثال» وسطرٌ يقول ما هو ولماذا هو هنا، ثمّ
     المحتوى معزولًا عن اللمسِ وعن قارئ الشاشةِ جميعًا — فلا يُظنّ
     إنجازًا، ولا يُقرأ على الأعمى بوصفه بياناتِه. */
  /* ‎opts.open‎: يُفتَح المثالُ من أوّله. يُمرَّر حين يكون المثالُ
     لسانًا اسمُه «مثال» — فالطالبُ طلبه بفتحِ اللسان، ولا يُطلَب
     منه طلبُه مرّتين. وفي غيرِ ذلك يُطوى. */
  function frame(title, node, note, opts) {
    styleOnce();
    var box = App.el('section', 'ex-frame');
    var start = !!(opts && opts.open);

    /* الطيُّ هو الأصل: شاشةُ أوّلِ مرّةٍ كانت تَفتح المثالَ من تلقاء
       نفسِها، فيَرى الداخلُ وردًا كاملًا ليس وردَه فيَحسبه حالَه —
       وذلك تشويشٌ لا بيان. فصار سطرًا يُفصح عن نفسِه ويُفتَح بضغطة. */
    var cap = App.el('button', 'ex-cap');
    cap.type = 'button';
    cap.appendChild(App.el('span', 'ex-tag', 'مثال'));
    cap.appendChild(App.el('span', 'ex-t', title));
    cap.appendChild(App.el('span', 'ex-chev', App.icon('chevron', 18)));
    box.appendChild(cap);

    var body = App.el('div', 'ex-body');
    body.setAttribute('aria-hidden', 'true');
    body.appendChild(node);
    box.appendChild(body);

    var n = null;
    if (note) {
      n = App.el('p', 'ex-note');
      n.textContent = note;
      box.appendChild(n);
    }

    function set(open) {
      box.classList.toggle('ex-open', open);
      cap.setAttribute('aria-expanded', String(open));
      cap.setAttribute('aria-label', (open ? 'إخفاءُ المثال: ' : 'عرضُ المثال: ') + title);
      body.hidden = !open;
      if (n) n.hidden = !open;
    }
    cap.addEventListener('click', function () {
      set(cap.getAttribute('aria-expanded') !== 'true');
    });
    set(start);
    return box;
  }

  /* ── هل في الشاشةِ متّسعٌ لمثالٍ كامل؟ ─────────────────────────
     المثالُ لسانٌ يُرى كلُّه أو لا يُرى: نصفُ مثالٍ مقطوعٍ من أسفلَ
     أسوأُ من لا مثال — يَظنّ القارئُ السطرَ الأخيرَ آخرَه وتحته سطر.
     فمَن شاشتُه أقصرُ من ثمانِ مئةٍ يُطوى عنه اللسانُ أصلًا، ويَراه
     حين يَفتح التطبيقَ على شاشةٍ أوسع. */
  function roomy() {
    return (window.innerHeight || 0) >= 800;
  }

  App.Example = { state: state, borrow: borrow, frame: frame, roomy: roomy };

  /* الأنماطُ تُحقَن مرّةً عند أوّلِ إطار، على نهجِ سائرِ الوحدات */
  function styleOnce() {
    if (document.getElementById('ex-css')) return;
    var el = App.el('style');
    el.id = 'ex-css';
    el.textContent = CSS.join('\n');
    document.head.appendChild(el);
  }

  var CSS = [
    '.ex-frame{margin-top:18px}',
    /* كان يُحذَف من الشاشاتِ القصيرةِ لأنّه مفتوحٌ يأخذ ثُلثَ الشاشة.
       وقد صار مطويًّا سطرًا واحدًا بأربعةٍ وأربعين بكسلًا، فلا يُزاحم
       أحدًا — فبقي لصاحبِ الشاشةِ القصيرةِ أيضًا، يَفتحه إن أراد. */
    /* السطرُ زرٌّ كاملُ العرض: يُلمَس بإصبعٍ ولا يُلتمَس */
    '.ex-cap{display:flex;align-items:center;gap:8px;width:100%;',
    '  min-height:var(--tap);padding:6px 2px;margin:0;border:0;background:none;',
    '  text-align:start;cursor:pointer;color:inherit;font:inherit}',
    /* ‎hidden‎ وحدَها لا تَكفي: قاعدةٌ أخرى تُعطي اللوحَ ‎display:flex‎
       فتَغلب ‎[hidden]‎ الافتراضيّة. فيُصرَّح بالإخفاءِ هنا. */
    '.ex-frame > [hidden]{display:none}',
    '.ex-frame.ex-open > .ex-cap{margin-bottom:11px}',
    '.ex-chev{margin-inline-start:auto;display:inline-flex;color:var(--ink-faint);',
    '  transition:transform var(--mid) var(--ease)}',
    '.ex-frame.ex-open > .ex-cap .ex-chev{transform:rotate(-90deg)}',
    '[dir="rtl"] .ex-chev{transform:rotate(180deg)}',
    '[dir="rtl"] .ex-frame.ex-open > .ex-cap .ex-chev{transform:rotate(-90deg)}',
    '.ex-tag{padding:2px 9px;border-radius:var(--r-pill);',
    '  background:var(--gold-soft);color:var(--gold-lit);',
    '  font-size:11px;font-weight:800}',
    '.ex-t{font-size:13.5px;font-weight:700;color:var(--ink-mut)}',
    /* معزولٌ عن اللمسِ كلِّه: الأزرارُ بداخله تبدو كما ستكون ولا تعمل،
       فلا يُسجَّل وردٌ لم يُقرأ. ويُخفَّت قليلًا ليُقرأ مثالًا لا حالًا. */
    '.ex-body{pointer-events:none;opacity:.92}',
    '.ex-body *{cursor:default !important}',
    /* المثالُ لسانًا: لا هامشَ علويٌّ يُزيحه عن أخيه، ويُصغَّر قليلًا
       ليَسَعه لوحٌ واحدٌ كاملًا. وهو مشهدٌ يُرى لا يُلمَس — فتصغيرُه
       لا يُنقص هدفَ لمسٍ ولا يُصعِّب قراءةَ شيءٍ يُعمَل به. */

    '.segpane > .ex-frame > .ex-body{zoom:.82}',
    '.ex-note{margin:12px 2px 0;font-size:12px;line-height:1.8;',
    '  color:var(--ink-faint)}'
  ];

}(window.App));

/* ══ 29-packs.js ══ */
/* ══ 29-packs.js — حِزَمُ المحتوى ══════════════════════════════════

   العلّةُ: ثلاثةُ أرباعِ التطبيقِ نصُّ المصحفِ ورسمُ صفحاتِه
   ومتشابهاتُه — ٢٫٧ ميغابايت — ومَن فتحه ليَبنيَ منهجًا أو ليُسجّل
   وردَه لا يَحتاج منها حرفًا. فخرجت إلى حِزَمٍ ثلاثٍ تُحمَّل مرّةً
   ثمّ تَبقى في الجهاز، والهيكلُ يَفتح في ٧٤٢ ك.ب.

   ╔═ قراراتٌ تَحكُم هذا الملفّ ════════════════════════════════════╗

   ١ — **الحزمةُ ملفٌّ، ومصدرُها ثلاثةٌ لا واحد**: تُجلَب من الموقع،
       أو تُستورَد من ملفٍّ وصل الطالبَ من دارِه أو من معلّمه، أو
       تُنزَّل إلى جهازه ليُعطيَها غيرَه. والثلاثةُ ملفٌّ واحدٌ بعينه،
       فمَن لا شبكةَ عنده يَأخذها من يدِ صاحبه.

   ٢ — **لا تُحمَّل من تلقاء نفسها**: التطبيقُ لا يَطلب من الشبكةِ
       شيئًا حتّى يَطلب القارئُ. والطلبُ من أصلِ الموقعِ نفسِه لا من
       غيره — لا طرفَ ثالثٌ ولا متتبّع.

   ٣ — **الخزنُ في IndexedDB لا في localStorage**: ٢٫٧ م.ب تَفوق
       حدَّ الأخيرِ وتُزاحم حالةَ الطالبِ نفسَها. وهذه بياناتٌ عامّةٌ
       لا شخصيّةٌ، فلا تَدخل النسخةَ الاحتياطيّةَ ولا ظرفَ المزامنة.

   ٤ — **البناءُ الكاملُ يَعمل كما هو**: إن كانت الحزمةُ مدمجةً فيه
       فهي «حاضرة» ولا شيءَ يُطلَب. فملفٌّ واحدٌ لمن أراده، وهيكلٌ
       وحِزَمٌ لمن أراد الخِفّة — بشيفرةٍ واحدةٍ لا شيفرتَين.         */

(function (App) {
  'use strict';

  var DB = 'irtaqi.packs', STORE = 'p', VER = 1;

  var SPEC = [
    { key: 'quran',  title: 'نصُّ المصحف',
      note: 'للقراءةِ والبحثِ والتسميعِ والاختبار.',
      ready: function () { return App.Quran && App.Quran.ready(); },
      load:  function (d) { return App.Quran.load(d); } },

    { key: 'layout', title: 'رسمُ المصحف المدني',
      note: 'لتُرى الصفحةُ كما في المصحفِ لا نصًّا مسطورًا.',
      ready: function () { return App.Layout && App.Layout.ready(); },
      load:  function (d) { return App.Layout.load(d); } },

    { key: 'shabih', title: 'المتشابهات',
      note: 'مواضعُ المتشابهاتِ وما افترقت فيه من كلمات.',
      ready: function () { return App.Shabih && App.Shabih.ready(); },
      load:  function (d) { return App.Shabih.load(d); } }
  ];

  var sizes = {};        /* ‫حجمُ ما حُمّل بالبايت، لعرضِه */
  var busy  = {};

  function spec(k) {
    for (var i = 0; i < SPEC.length; i++) if (SPEC[i].key === k) return SPEC[i];
    return null;
  }

  /* ── الخزن ────────────────────────────────────────────────────
     كلُّ خطوةٍ هنا قد تَسقط: متصفّحٌ في وضعِ التصفّحِ الخاصّ يَمنع
     IndexedDB، وجهازٌ ممتلئٌ يَرفض الكتابة. والسقوطُ لا يُعطّل شيئًا:
     يَبقى التطبيقُ يَعمل، ويُعاد الجلبُ في المرّة القادمة. */
  function open() {
    return new Promise(function (ok, no) {
      if (!window.indexedDB) { no(new Error('لا خزنَ في هذا المتصفّح')); return; }
      var rq = indexedDB.open(DB, VER);
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      rq.onsuccess = function () { ok(rq.result); };
      rq.onerror   = function () { no(rq.error || new Error('تعذّر الفتح')); };
    });
  }

  function tx(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (ok, no) {
        var t = db.transaction(STORE, mode), s = t.objectStore(STORE);
        var rq = fn(s);
        t.oncomplete = function () { db.close(); ok(rq && rq.result); };
        t.onerror    = function () { db.close(); no(t.error); };
      });
    });
  }

  function get(k) { return tx('readonly',  function (s) { return s.get(k); }); }
  function put(k, v) { return tx('readwrite', function (s) { return s.put(v, k); }); }
  function del(k) { return tx('readwrite', function (s) { return s['delete'](k); }); }

  /* ── الحالة ───────────────────────────────────────────────────
     «حاضرة» لا تَعني «مخزونة»: البناءُ الكاملُ يَحملها معه فهي
     حاضرةٌ بلا خزنٍ ولا جلب. ولهذا تُسأل الوحدةُ نفسُها لا الخزن. */
  function has(k) {
    var s = spec(k);
    return !!(s && s.ready());
  }

  function size(k) { return sizes[k] || 0; }
  function working(k) { return !!busy[k]; }

  function state(k) {
    if (busy[k]) return 'busy';
    return has(k) ? 'on' : 'off';
  }

  /* ── الجلب ───────────────────────────────────────────────────── */
  function url(k) { return 'data/' + k + '.json'; }

  function adopt(k, data, blob) {
    var s = spec(k);
    if (!s || !s.load(data)) return false;
    if (blob) sizes[k] = blob.length;
    App.emit('packs', { key: k });
    return true;
  }

  /* ── الكلُّ بضغطةٍ واحدة ──────────────────────────────────────
     ثلاثُ حِزَمٍ وثلاثةُ أزرارٍ كانت سؤالًا لا يَعني القارئَ: «أيَّها
     أُحمّل؟» — وجوابُه دائمًا «كلَّها». فصارت ضغطةً واحدةً تَجلب ما
     يَنقص بالتتابع، وتُخبر عمَّا بلغت. والتتابعُ لا التوازي: ثلاثةُ
     طلباتٍ معًا على شبكةٍ ضعيفةٍ تَتزاحم وتَسقط جميعًا. */
  function fetchAll(onStep) {
    var left = SPEC.filter(function (s) { return !s.ready(); });
    if (!left.length) return Promise.resolve(0);
    var done = 0;
    return left.reduce(function (chain, s) {
      return chain.then(function () {
        if (onStep) onStep(s.title, done, left.length);
        return fetchPack(s.key).then(function () { done++; });
      });
    }, Promise.resolve()).then(function () { return done; });
  }

  /* وملفٌّ واحدٌ يَنزل بالثلاثِ جميعًا: مَن أراد أن يُعطيَه غيرَه
     يُعطيه ملفًّا لا ثلاثة، ومَن استورده استورد المحتوى كلَّه. */
  function saveAll() {
    return Promise.all(SPEC.map(function (s) {
      return get(s.key).then(function (t) {
        return t ? t : fetch(url(s.key)).then(function (r) {
          if (!r.ok) throw new Error('تعذّر جلبُ ' + s.title);
          return r.text();
        });
      });
    })).then(function (parts) {
      var body = '{"irtaqi":1';
      for (var i = 0; i < SPEC.length; i++) {
        body += ',"' + SPEC[i].key + '":' + parts[i];
      }
      body += '}';
      var a = document.createElement('a');
      var bl = new Blob([body], { type: 'application/json' });
      a.href = URL.createObjectURL(bl);
      a.download = 'irtaqi-content.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    });
  }

  function fetchPack(k) {
    var s = spec(k);
    if (!s) return Promise.reject(new Error('حزمةٌ مجهولة'));
    if (busy[k]) return Promise.reject(new Error('جارٍ'));
    busy[k] = 1;
    App.emit('packs', { key: k });
    return fetch(url(k), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('تعذّر الجلب (' + r.status + ')');
        return r.text();
      })
      .then(function (txt) {
        var data = JSON.parse(txt);
        if (!adopt(k, data, txt)) throw new Error('الملفُّ لا يُطابق الحزمة');
        return put(k, txt)['catch'](function () { /* ‫الخزنُ تحسينٌ لا شرط */ });
      })
      .then(function () { busy[k] = 0; App.emit('packs', { key: k }); })
      ['catch'](function (e) {
        busy[k] = 0; App.emit('packs', { key: k });
        throw e;
      });
  }

  /* ── الاستيراد من ملفّ ────────────────────────────────────────
     لا يُسأل الطالبُ أيَّ حزمةٍ يَستورد: الملفُّ يُعرَّف بشكلِه. ومَن
     أعطى ملفًّا ليس منها سَمِع ذلك صراحةً ولم يُترَك في حَيرة. */
  function sniff(data) {
    if (data && data.v && data.v.length && data.v[0].length >= 4) return 'quran';
    if (data && data.p && data.f) return 'layout';
    if (data && data.length && data[0] && data[0].v) return 'shabih';
    return null;
  }

  function importText(txt) {
    var data = JSON.parse(txt);

    /* ملفُّ المحتوى الجامعُ أوّلًا: هو ما يُعطيه القارئُ قارئًا */
    if (data && data.irtaqi) {
      var got = 0;
      SPEC.forEach(function (s) {
        var d = data[s.key];
        if (!d) return;
        var one = JSON.stringify(d);
        if (adopt(s.key, d, one)) { put(s.key, one)['catch'](function () {}); got++; }
      });
      if (!got) throw new Error('الملفُّ لا يَحمل محتوًى صالحًا');
      return 'all';
    }

    var k = sniff(data);
    if (!k) throw new Error('هذا الملفُّ ليس محتوى «رتِّل وارتقِ»');
    if (!adopt(k, data, txt)) throw new Error('الحزمةُ معطوبة');
    put(k, txt)['catch'](function () {});
    return k;
  }

  /* ── التنزيل إلى الجهاز ──────────────────────────────────────── */
  function save(k) {
    return get(k).then(function (txt) {
      if (txt) return txt;
      /* ‫غيرُ مخزونةٍ — إمّا بناءٌ كاملٌ يَحملها، وإمّا لم تُجلَب بعد.
         وفي الحالَين الملفُّ منشورٌ إلى جانبِ التطبيق، فيُؤخَذ منه. */
      return fetch(url(k)).then(function (r) {
        if (!r.ok) throw new Error('تعذّر جلبُ الملفّ (' + r.status + ')');
        return r.text();
      });
    }).then(function (txt) {
      var a = document.createElement('a');
      var b = new Blob([txt], { type: 'application/json' });
      a.href = URL.createObjectURL(b);
      a.download = 'irtaqi-' + k + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href); a.remove();
      }, 400);
    });
  }

  /* ── الإقلاع: ما خُزن يُحمَّل قبل أن يُسأل ───────────────────── */
  function restore() {
    var left = SPEC.filter(function (s) { return !s.ready(); });
    if (!left.length) return Promise.resolve();
    return Promise.all(left.map(function (s) {
      return get(s.key).then(function (txt) {
        if (!txt) return;
        try { adopt(s.key, JSON.parse(txt), txt); } catch (e) {}
      })['catch'](function () {});
    })).then(function () { App.emit('packs', { key: null }); });
  }

  App.Packs = {
    spec: function () { return SPEC.slice(); },
    has: has, state: state, size: size, working: working,
    fetch: fetchPack, fetchAll: fetchAll,
    importText: importText, save: save, saveAll: saveAll,
    forget: function (k) {
      return del(k).then(function () { sizes[k] = 0; });
    },
    /* ‫هل يَنقص شيءٌ لقراءةِ المصحفِ أو الاختبار؟ */
    missingFor: function (what) {
      var need = what === 'read'  ? ['quran', 'layout']
               : what === 'exam'  ? ['quran', 'shabih']
               : ['quran'];
      return need.filter(function (k) { return !has(k); });
    },
    restore: restore,

    /* بوّابةٌ واحدةٌ لكلِّ شاشةٍ تَلزمها حزمة: تُعيد لوحًا يقول ما
       الذي يَنقص ويَفتح بابَه بلمسة، أو ‎null‎ إن لم يَنقص شيء.
       وواحدةٌ لا ثلاث: لو كُتبت في كلِّ شاشةٍ لَاختلف اللفظُ بينها. */
    gate: function (title, what) {
      if (!missing(what).length) return null;
      var w = App.el('div', 'screen stack-lg');
      var bar = App.el('div', 'bar');
      bar.appendChild(App.el('h1', 'h1', title));
      w.appendChild(bar);
      var c = App.el('article', 'card');
      c.appendChild(App.el('h2', 'h2', 'المحتوى لم يُحمَّل بعد'));
      c.appendChild(App.el('p', 'small',
        'يُحمَّل مرّةً واحدةً ثمّ يَبقى في جهازك بلا اتّصال.'));
      var g = App.el('button', 'btn btn-pri btn-block');
      g.type = 'button';
      g.textContent = 'افتح المحتوى';
      g.onclick = function () { App.go('settings', { tab: 'pack' }); };
      c.appendChild(g);
      w.appendChild(c);
      return w;
    }
  };

  function missing(what) { return App.Packs.missingFor(what); }

  /* ══ لوحُ المحتوى ═════════════════════════════════════════════
     موضعُه «المصحف» لا الإعدادات: هذه حزمُ مصحفِه، ومَن أرادها
     يَقصد المصحفَ لا دُرجَ الإعدادات. والوحدةُ تَملك لوحَها فلا
     تُكتَب واجهتُها في ملفٍّ آخرَ يَنساها. */
  function kb(n) {
    return n >= 1048576 ? App.ar((n / 1048576).toFixed(1)) + ' م.ب'
         : App.ar(Math.round(n / 1024)) + ' ك.ب';
  }

  function pane() {
    var out = App.el('div', 'stack-lg');
    var card = App.el('article', 'card pk1');
    var say = App.el('p', 'small pk-say');

    function draw() {
      card.textContent = '';
      var left = SPEC.filter(function (s) { return !s.ready(); });
      var work = SPEC.some(function (s) { return busy[s.key]; });
      var all = !left.length;

      var head = App.el('div', 'pk-h');
      head.appendChild(App.el('h2', 'h2', 'محتوى المصحف'));
      head.appendChild(App.el('span', 'pk-s' + (all ? ' on' : ''),
        work ? 'جارٍ…' : all ? 'حاضر' : 'غيرُ محمَّل'));
      card.appendChild(head);

      /* ما فيه، سطرًا واحدًا: لا ثلاثُ بطاقاتٍ تَسأل أيَّها يُحمَّل */
      card.appendChild(App.el('p', 'small',
        (all ? 'المصحفُ في جهازك، ويَعمل بلا اتّصال.'
             : 'يُحمَّل مرّةً ثمّ يَعمل بلا اتّصال.')));

      var b = App.el('button', 'btn btn-pri btn-block');
      b.type = 'button';
      b.disabled = work;
      b.innerHTML = App.icon('download', 19);
      b.appendChild(App.el('span', null,
        work ? 'جارٍ التحميل…' : all ? 'نزِّل الملفّ' : 'حمِّل المحتوى'));
      b.onclick = all ? function () {
        say.textContent = 'جارٍ تجهيزُ الملفّ…';
        saveAll().then(function () {
          say.textContent = 'نَزَل ملفُّ المحتوى إلى جهازك.';
        })['catch'](function (e) {
          say.textContent = 'تعذّر: ' + (e && e.message || 'خطأ');
        });
      } : function () {
        fetchAll(function (t, i, n) {
          say.textContent = 'جارٍ تحميلُ ' + t
            + ' (' + App.ar(i + 1) + ' من ' + App.ar(n) + ')…';
        }).then(function () {
          say.textContent = 'تَمَّ تحميلُ المحتوى كلِّه.';
        })['catch'](function (e) {
          say.textContent = 'تعذّر: ' + (e && e.message || 'خطأ');
        });
      };
      card.appendChild(b);
    }

    out.appendChild(card);

    /* الاستيرادُ بابُ مَن لا شبكةَ عنده: ملفٌّ واحدٌ يَحمل الكلَّ */
    var imp = App.el('div', 'pk-imp');
    var inp = App.el('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.id = 'pk-file';
    inp.className = 'pk-file';
    var lab = App.el('label', 'btn btn-ghost pk-b');
    lab.setAttribute('for', 'pk-file');
    lab.textContent = 'استورِد من ملفّ';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      say.textContent = 'جارٍ قراءةُ الملفّ…';
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var k = importText(String(fr.result));
          say.textContent = k === 'all' ? 'استُورِد المحتوى.'
            : 'استُورِدت: ' + ((spec(k) || {}).title || k);
        } catch (e) {
          say.textContent = 'تعذّر: ' + (e && e.message || 'ملفٌّ غيرُ صالح');
        }
        inp.value = '';
      };
      fr.onerror = function () { say.textContent = 'تعذّرت القراءة.'; };
      fr.readAsText(f);
    };
    imp.appendChild(inp);
    imp.appendChild(lab);
    out.appendChild(imp);
    out.appendChild(say);

    draw();
    App.on_('packs', function () { if (out.isConnected) draw(); });
    return out;
  }

  App.Packs.pane = pane;

  (function () {
    var s = document.createElement('style');
    s.textContent = [
      /* بطاقةٌ واحدةٌ لا ثلاث: الحالةُ لونٌ ولفظٌ معًا، فمَن لا
         يُفرّق بين الأخضرِ والرماديِّ يَقرأ «حاضر» و«غيرُ محمَّل». */
      '.pk1 .pk-h{display:flex;align-items:center;gap:10px}',
      '.pk1 .pk-h .h2{margin:0}',

/* ══ 30-onboard.js ══ */
/* ═══════════════════════════════════════════════════════════════════
   ارتقِ — الدخولُ الأوّل
   ───────────────────────────────────────────────────────────────────
   أوّلُ ما يراه الطالب. وهو أقصرُ ما في التطبيق: نقرتان واسم.
   جُمعت الخطواتُ الثلاثُ في شاشةٍ واحدةٍ تُمرَّر لأنّ تقطيعَها على
   ثلاثِ شاشاتٍ يجعل الدخولَ استمارةً، والاستمارةُ تُنفِّر.

   واللحظةُ الفاصلةُ هي اختيارُ الهويّة: تتبدّل الهويّةُ البصريّةُ كلُّها
   تحت إصبع الطالب في الحال. ولهذا لا نُعيد رسمَ الشاشة عند الاختيار —
   إعادةُ الرسم تمحو الاسمَ المكتوب وتُفقد المشهدَ أثرَه — بل نُغيّر
   `html[data-id]` وحدَه فتتبدّل الرموزُ كلُّها بالتهاوي.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* ── لا زخرفتَي هويّة ──
     كان لكلِّ هويّةٍ خاتمُها — ثمانيٌّ وإسليميّ — وهما شعاران أُزيلا مع
     بقيّة الشعارات. والاختيارُ يقع على الكلمة نفسِها، وهي أصرحُ من
     رمزٍ يحتاج شرحًا.

     وليست الكلمةُ لقبًا: لا يُنادى أحدٌ في «ارتقِ» بـ«طالب» ولا
     «حافظ» — إنّما يُسأل عن صيغةِ الخطابِ التي يَفرضها النحوُ على
     كلِّ فعلٍ وضميرٍ بعدها، فيُسمّى الاختيارُ بما يَفعل. */

  /* ── أنماطٌ محصورةٌ في #onboard ──
     تُحقن مرّةً من هذه الوحدة لأنّها خاصّةٌ بالدخول وحدَه، فلا تُثقل
     الهيكلَ العامّ ولا تُنازع أصنافَه. ولا لونَ حرفيًّا فيها: رموزُ الهويّة. */
  var CSS = [
    '#onboard{padding:max(22px,env(safe-area-inset-top)) var(--pad) ' +
      'calc(26px + env(safe-area-inset-bottom));max-width:var(--maxw);margin-inline:auto}',

    /* الزخرفةُ المولّدةُ خلف الصفحة تُذكّر بأنّ الهويّةَ تبدّلت كلُّها */
    '#onboard::before{content:"";position:fixed;inset:0;' +
      'background-size:180px 180px;opacity:.5;pointer-events:none;z-index:-1}',

    /* ١ · الترحيب */
    '#onboard .ob-hero{text-align:center;padding:10px 0 4px}',
    /* الشعارُ كلمةٌ عريضة، فمقاسُه عرضٌ لا ضلعُ مربّع: هيئتُه في
       ‎.appmark‎ بـ‎20-shell‎، ولا يُقيَّد هنا بارتفاعٍ يَسحقه. */
    '#onboard .ob-crest{display:flex;align-items:center;justify-content:center;' +
      'margin-inline:auto;color:var(--gold)}',
    '#onboard .ob-name-app{font-size:46px;line-height:1.18;font-weight:700;letter-spacing:.01em;' +
      'color:var(--ink);margin:10px 0 0}',
    '#onboard .ob-lede{font-size:16.5px;line-height:1.85;color:var(--ink-mut);' +
      'margin:10px auto 0;max-width:30ch}',

    /* فاصلٌ مزخرف: شعيرةٌ ومعقودةٌ ذهبيّة */
    '#onboard .ob-rule{display:flex;align-items:center;gap:10px;margin:22px 0 2px}',
    '#onboard .ob-rule i{flex:1;height:1px;background:var(--hair)}',
    '#onboard .ob-rule b{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.75}',

    /* عنوانُ الخطوة: رقمٌ عربيٌّ في حلقةٍ ذهبيّة */
    '#onboard .ob-step{display:flex;align-items:center;gap:10px;margin:0 0 14px}',
    '#onboard .ob-step span{flex:none;display:grid;place-items:center;width:28px;height:28px;' +
      'border-radius:var(--r-pill);border:1px solid var(--gold);color:var(--gold);' +
      'font-size:15px;font-weight:700;line-height:1}',
    '#onboard .ob-step h2{margin:0;font-size:19px;font-weight:700;color:var(--ink)}',

    /* ٢ · الهويّة */
    '#onboard .ob-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}',
    '#onboard .ob-id{position:relative;display:flex;flex-direction:column;align-items:center;' +
      /* ١١٨ لا ١٩٦: كانت الزخرفةُ تملأ الطولَ وقد أُزيلت،
         فبقي فراغٌ لا يقوله شيء. */
      'justify-content:center;gap:12px;min-height:118px;padding:18px 12px;' +
      'background:var(--surface);border:1.5px solid var(--hair);border-radius:var(--r-lg);' +
      'color:var(--ink);font-family:inherit;font-size:19px;font-weight:700;' +
      'cursor:pointer;-webkit-tap-highlight-color:transparent;' +
      'transition:border-color var(--mid) var(--ease),background var(--mid) var(--ease),' +
      'transform var(--fast) var(--ease)}',
    /* لا أيقونةَ في البطاقةِ إلّا علامةُ الاختيار، وكان لها لونان
       موروثان من أيقونةٍ أُزيلت: الأوّلُ يُبهتها، والثاني يُلوّنها
       بلونِ القرصِ الذي تقع عليه فتختفي. فرُفعا، وبقي مِدادُ القرص. */
    /* الكلمتان أطولُ من لقبٍ واحد، فتُلفّان في وسطِ البطاقة ولا تُقطعان */
    '#onboard .ob-id .ob-lab{display:flex;align-items:center;justify-content:center;' +
      'gap:7px;text-align:center;text-wrap:balance}',
    '#onboard .ob-id:active{transform:scale(.985)}',
    '#onboard .ob-id[aria-checked="true"]{background:var(--surface-2);border-color:var(--accent)}',
    /* علامةُ الاختيار: قرصٌ باللون المميّز ومِدادُه --on-accent */
    '#onboard .ob-tick{position:absolute;top:10px;inset-inline-start:10px;width:26px;height:26px;' +
      'display:grid;place-items:center;border-radius:var(--r-pill);background:var(--accent);' +
      'color:var(--on-accent);opacity:0;transform:scale(.7);' +
      'transition:opacity var(--fast) var(--ease),transform var(--mid) var(--ease)}',
    '#onboard .ob-id[aria-checked="true"] .ob-tick{opacity:1;transform:scale(1)}',
    '#onboard .ob-said{min-height:1.5em;margin:12px 0 0;text-align:center;font-size:14.5px;' +
      'color:var(--ink-mut)}',

    /* ٣ · الاسم */
    '#onboard .ob-field{display:block}',
    '#onboard .ob-field > span{display:block;font-size:14.5px;color:var(--ink-mut);margin:0 0 8px}',
    '#onboard input.ob-input{display:block;width:100%;box-sizing:border-box;min-height:54px;' +
      'padding:14px 16px;font-family:inherit;font-size:18px;font-weight:600;' +
      'color:var(--ink);background:var(--surface);border:1.5px solid var(--hair);' +
      'border-radius:var(--r-md);transition:border-color var(--mid) var(--ease)}',
    '#onboard input.ob-input::placeholder{color:var(--ink-faint);font-weight:400}',
    '#onboard input.ob-input:hover{border-color:var(--hair)}',
    '#onboard input.ob-input:focus{outline:none;border-color:var(--accent)}',

    /* الخاتمة */
    '#onboard .ob-end{margin-top:26px}',
    '#onboard .ob-go{width:100%;min-height:56px;display:flex;align-items:center;' +
      'justify-content:center;gap:10px;font-size:18px;font-weight:700;font-family:inherit;' +
      'border:0;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);' +
      'cursor:pointer;-webkit-tap-highlight-color:transparent;' +
      'transition:opacity var(--mid) var(--ease),background var(--mid) var(--ease)}',
    '#onboard .ob-go[disabled]{background:var(--surface-2);color:var(--ink-mut);cursor:default}',
    '#onboard .ob-hint{min-height:1.4em;margin:10px 0 0;text-align:center;font-size:14.5px;' +
      'color:var(--ink-mut)}',

    /* حلقةُ التركيز ظاهرةٌ على كلّ ما يُركَّز عليه. ولا نُغيّر نصفَ القطر
       هنا: الحلقةُ تتبع نصفَ قطرِ العنصر نفسِه فتبقى الهويّةُ سليمة. */
    '#onboard :focus-visible{outline:2.5px solid var(--gold-lit);outline-offset:3px}',
    '#onboard .ob-id:focus-visible{outline-offset:4px}',

    /* دخولٌ هادئ: الأقسامُ تطلع طلوعًا خفيفًا مرّةً واحدة */
    '#onboard .ob-in{animation:ob-rise var(--slow) var(--ease) both}',
    '#onboard .ob-in:nth-child(2){animation-delay:.07s}',
    '#onboard .ob-in:nth-child(3){animation-delay:.14s}',
    '#onboard .ob-in:nth-child(4){animation-delay:.2s}',
    '@keyframes ob-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}',

    /* الحركةُ كلُّها تُلغى لمن طلب تقليلَها */
    '@media (prefers-reduced-motion:reduce){' +
      '#onboard *,#onboard *::before,#onboard *::after{' +
      'animation:none!important;transition:none!important}' +
      '#onboard .ob-in{opacity:1;transform:none}' +
      '#onboard .ob-id:active{transform:none}' +
      '#onboard .ob-tick{transform:scale(1)}}',

    /* شاشةٌ ضيّقةٌ جدًّا: البطاقتان تحت بعضهما قبل أن تضيقا */
    '@media (max-width:330px){#onboard .ob-pair{grid-template-columns:1fr}' +
      '#onboard .ob-id{min-height:104px;flex-direction:row;gap:16px}}'
  ].join('\n');

  function inject() {
    if (document.getElementById('ob-css')) return;
    var s = document.createElement('style');
    s.id = 'ob-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ── بناءُ الشاشة ───────────────────────────────────────────────── */
  function render() {
    inject();

    /* عند العودة إلى هذه الشاشة بعد إتمام الدخول نُعبّئ من الملفّ
       المحفوظ: الطالبُ لا يُسأل عمّا أجاب عنه مرّةً. */
    var saved = App.state.profile;
    var gender = saved ? (saved.gender === 'f' ? 'f' : 'm') : null;

    var wrap = App.el('div', 'screen');
    wrap.id = 'onboard';

    /* ١ · الترحيب: سطرٌ واحدٌ يقول ما التطبيق، ولا أكثر */
    var hero = App.el('header', 'sec ob-hero ob-in');
    /* شعارٌ واحدٌ للتطبيق كلِّه: المصحف. وما لم يُرفَع بعدُ فلا تاجَ
       أصلًا — بياضٌ أنظفُ من رمزٍ مُقحَم. */
    var mk = App.mark(168, 'ob-mark');
    if (mk) {
      var crest = App.el('div', 'ob-crest', mk);
      hero.appendChild(crest);
    }
    /* الاسمُ مرّةً واحدة: الشعارُ يحمله، فكتابتُه تحته نصًّا تكرارٌ
       لكلمةٍ واحدةٍ على بُعدِ أربعين بكسلًا. وإن غاب الشعارُ عاد النصُّ
       لأنّ الصفحةَ لا تصحّ بلا اسم. */
    var h1 = App.el('h1', 'h1 ob-name-app', 'رتِّل وارتقِ');
    if (mk) {
      h1.className = 'sr-only';     /* يبقى لقارئ الشاشة ولعنوان الصفحة */
    }
    hero.appendChild(h1);
    /* ما يُكتب قبل اختيار الهويّة لا يُذكَّر ولا يُؤنَّث: «تبني… وترى…
       قبل أن تبدأ» كانت تُخاطب الطالبةَ بصيغةِ الطالبِ قبل أن تُسأل
       مَن هي. والصياغةُ الآن تَصدُق على الاثنَين. */
    hero.appendChild(App.el('p', 'ob-lede', App.Words.obLede()));
    var rule = App.el('div', 'ob-rule');
    rule.innerHTML = '<i></i><b></b><i></i>';
    hero.appendChild(rule);
    wrap.appendChild(hero);

    /* ٢ · الهويّة */
    var sec2 = App.el('section', 'sec ob-in');
    sec2.appendChild(step(1, App.Words.gAsk()));

    var pair = App.el('div', 'ob-pair');
    pair.setAttribute('role', 'radiogroup');
    pair.setAttribute('aria-label', App.Words.gGroup());

    var said = App.el('p', 'ob-said');
    said.setAttribute('aria-live', 'polite');

    var cards = {};
    [['m', App.Words.gForm('m')], ['f', App.Words.gForm('f')]].forEach(function (d) {
      var b = App.el('button', 'card ob-id');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.dataset.g = d[0];
      /* الكلمةُ وحدَها، كبيرةً: لا رمزَ يسبقها ولا زخرفةَ خلفها */
      b.innerHTML =
        '<span class="ob-tick">' + App.icon('check', 16) + '</span>' +
        '<span class="ob-lab"><span>' + d[1] + '</span></span>';
      b.onclick = function () { pick(d[0]); };
      /* السهمان ينقلان الاختيار كما في أيّ مجموعةِ اختيارٍ أصيلة */
      b.onkeydown = function (e) {
        var k = e.key;
        if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowUp' || k === 'ArrowDown') {
          e.preventDefault();
          pick(d[0] === 'm' ? 'f' : 'm');
          cards[d[0] === 'm' ? 'f' : 'm'].focus();
        }
      };
      cards[d[0]] = b;
      pair.appendChild(b);
    });

    sec2.appendChild(pair);
    sec2.appendChild(said);
    wrap.appendChild(sec2);

    /* ٣ · الاسم */
    var sec3 = App.el('section', 'sec ob-in');
    sec3.appendChild(step(2, 'ما اسمك؟'));

    var lab = App.el('label', 'field ob-field');
    lab.htmlFor = 'ob-name';
    lab.appendChild(App.el('span', null, App.Words.obNameLabel()));
    var input = document.createElement('input');
    input.className = 'ob-input';
    input.id = 'ob-name';
    input.type = 'text';
    input.name = 'name';
    input.autocomplete = 'name';
    input.placeholder = App.Words.obNamePlaceholder();
    input.maxLength = 32;
    input.spellcheck = false;
    input.setAttribute('autocapitalize', 'words');
    input.setAttribute('enterkeyhint', 'done');
    lab.appendChild(input);
    sec3.appendChild(lab);
    wrap.appendChild(sec3);

    /* الخاتمة */
    var end = App.el('div', 'sec ob-end ob-in');
    var go = App.el('button', 'btn btn-pri ob-go');
    go.type = 'button';
    var goLabel = App.el('span', null, App.Words.obCta());
    go.appendChild(goLabel);
    var hint = App.el('p', 'ob-hint');
    hint.setAttribute('aria-live', 'polite');
    end.appendChild(go);
    end.appendChild(hint);
    wrap.appendChild(end);

    /* ── الحالةُ الحيّة ─────────────────────────────────────────── */
    function pick(g) {
      if (gender === g) return;
      gender = g;
      /* ملفٌّ مؤقّتٌ في الذاكرة بلا حفظ: الهويّةُ تتبدّل الآن، ولا يُكتب
         في الخزن شيءٌ قبل أن يتمّ الاسم، فلا يبقى ملفٌّ ناقصٌ لو خرج. */
      App.state.profile = saved ? saved : {};
      App.state.profile.gender = g;
      App.applyIdentity();
      cards.m.setAttribute('aria-checked', String(g === 'm'));
      cards.f.setAttribute('aria-checked', String(g === 'f'));
      cards.m.tabIndex = g === 'm' ? 0 : -1;
      cards.f.tabIndex = g === 'f' ? 0 : -1;
      said.textContent = App.Words.obSaid(g);
      sync();
    }

    function ready() { return !!gender && input.value.trim().length > 0; }

    function sync() {
      var ok = ready();
      go.disabled = !ok;
      /* التلميحُ يُكتب بعد اللمس، فالهويّةُ معروفةٌ عنده ويُخاطَب بصيغتها */
      hint.textContent = ok ? '' :
        (!gender ? App.Words.obHintIdentity() : App.Words.obHintName());
      /* ويُعاد كتابةُ الزرِّ معه: هو يُرسَم مرّةً قبل الهويّة، فلولا
         هذا بقي مذكّرًا في وجهِ الطالبة. */
      goLabel.textContent = App.Words.obCta();
    }

    function finish() {
      if (!ready()) return;
      App.state.profile = {
        name: input.value.trim(),
        gender: gender,
        createdAt: (saved && saved.createdAt) || App.dateKey()
      };
      App.save();
      App.applyIdentity();
      /* يُنقل إلى بانِي المنهج لا إلى بيتٍ فارغ: أوّلُ ما يحتاجه منهجٌ.
         أمّا من له مناهجُ فقد مرّ بالبناء، فيعود إلى يومه. */
      App.go(App.state.plans && App.state.plans.length ? 'home' : 'builder');
    }

    input.oninput = sync;
    input.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(); }
    };
    go.onclick = finish;

    /* التعبئةُ عند العودة */
    cards.m.tabIndex = 0;
    cards.f.tabIndex = -1;
    if (saved) {
      if (saved.name) input.value = saved.name;
      var g0 = gender; gender = null; pick(g0);
    }
    sync();

    return wrap;
  }

  function step(n, title) {
    var d = App.el('div', 'ob-step');
    /* الأرقامُ كلُّها عربيّةٌ هنديّة بلا استثناء */
    d.innerHTML = '<span aria-hidden="true">' + App.ar(n) + '</span>' +
      '<h2 class="h2">' + title + '</h2>';
    return d;
  }

  App.screen('onboard', render, { full: true });
})(window.App);

/* ═══════════════════════════════════════════════════════════════════
   صوتُ ارتقِ — بنكُ العبارات
   ───────────────────────────────────────────────────────────────────
   كان التطبيقُ يُحسن العربيّةَ ويَضبط الإعرابَ، ثمّ يُخاطب الطالبَ كما
   يُخاطب التقريرُ قارئَه: صحيحٌ دقيقٌ باردٌ لا يَعرف مَن أمامه ولا
   يَفرح له. وهذه الوحدةُ لا تَرسم شيئًا ولا تُغيّر حسابًا؛ إنّما
   تُعطي كلَّ موضعِ خطابٍ كلمةً تَعرف الوقتَ والحالَ والهويّة.

   وأربعةُ أصولٍ تَحكُم كلَّ حرفٍ فيها:

   ١ — لا وعدَ بأجرٍ ولا حكمَ بقَبول. الفرحُ بما صنعَه الطالبُ بيده،
       لا بما عند الله فيه — فذاك غيبٌ لا يُتقوَّل فيه، ولا يُنسب
       إلى اللهِ ما لم يَرِد. ولا نصَّ قرآنيًّا في الشيفرة البتّة.

   ٢ — لا صُراخَ ولا مبالغة. «ما شاء الله! أنت بطل!» تُهين عقلَ
       الطالبِ وتَبتذل الأمر. الفرحُ الصادقُ هادئٌ، ويُسمّي الفعلَ
       بعينِه: اسمَ المنهجِ وعددَ صفحاتِه لا مديحًا مُرسَلًا.

   ٣ — لا مذكّرَ على مؤنّث. كلُّ خطابٍ يمرّ بـ vg، والهويّتان سواءٌ
       في حقِّ أن تُنادى كلٌّ منهما بصيغتِها.

   ٤ — لا تكرار. ما قيل اليومَ لا يُعاد غدًا حتّى يُستوفى الكيسُ،
       وما بقي معروضًا على الشاشة لا يتبدّل تحت العين عند كلِّ لمسة.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  var P = App.Plans, Q = App.Quran, ar = App.ar;

  /* ── الهويّة ──────────────────────────────────────────────────── */

  /* خطابُ الطالبة يختلف عن خطاب الطالب، والتطبيقُ يعرف صاحبَه.
     وهي نفسُ دالّةِ 40-builder.js لأنّها محصورةٌ في وحدتها هناك. */
  function vg(m, f) {
    return (App.state.profile && App.state.profile.gender === 'f') ? f : m;
  }
  /* ختمُ الهويّة: يدخل في كلِّ ختمٍ محفوظٍ ليتبدّل النصُّ إن بُدّلت */
  function sig() { return vg('m', 'f'); }

  /* ── الكيسُ الذي لا يُعيد ─────────────────────────────────────────
     الاختيارُ العشوائيُّ المحضُ يُكرّر العبارةَ مرّتَين متتاليتَين فتُملّ
     قبل أن تُستوفى أخواتُها. فيُشكَّل كيسٌ بترتيبٍ مخلوطٍ يُسحَب منه
     حتّى يَفرَغ، ثمّ يُملأ من جديدٍ بشرطِ ألّا يُفتتح بما خُتم به. */
  var BAG = {}, LAST = {}, HELD = {};

  function val(x) { return typeof x === 'function' ? x() : x; }

  function draw(key, list) {
    if (!list || !list.length) return '';
    if (list.length === 1) return val(list[0]);
    var bag = BAG[key];
    if (!bag || !bag.length) {
      bag = [];
      for (var i = 0; i < list.length; i++) bag.push(i);
      for (var j = bag.length - 1; j > 0; j--) {
        var r = Math.floor(Math.random() * (j + 1)), t = bag[j];
        bag[j] = bag[r]; bag[r] = t;
      }
      /* السحبُ من آخرِ الكيس، فالمقارنةُ على آخرِه لا على أوّله */
      if (bag[bag.length - 1] === LAST[key]) {
        var u = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = u;
      }
      BAG[key] = bag;
    }
    var k = bag.pop();
    LAST[key] = k;
    return val(list[k]);
  }

  /* الشاشةُ تُعاد رسمًا بعد كلِّ لمسة، فلو اختِيرت التحيّةُ في كلِّ
     رسمٍ لتبدّلت تحت عين الطالبِ وهو ينظر إليها. فما يبقى معروضًا
     يُثبَّت على ختم: ما دام الختمُ واحدًا فالكلمةُ واحدة، وإذا تبدّل
     اليومُ أو الوقتُ أو الحالُ أو الهويّةُ جاءت كلمةٌ أخرى. */
  function hold(key, stamp, list) {
    var h = HELD[key];
    if (h && h.s === stamp) return h.v;
    var v = draw(key, list);
    HELD[key] = { s: stamp, v: v };
    return v;
  }

  /* ── صِيَغُ العدد ─────────────────────────────────────────────────
     «٢ صفحة» ركيكةٌ و«صفحتان» صواب، والعددُ يُرفَع مرّةً ويُنصَب أخرى
     على موقعه من الجملة — فصيغتان لا واحدة. */
  function pages(n) {
    if (n === 1) return 'صفحةٌ واحدة';
    if (n === 2) return 'صفحتان';
    if (n % 100 >= 3 && n % 100 <= 10) return ar(n) + ' صفحات';
    return ar(n) + ' صفحة';
  }
  function pagesAcc(n) {
    if (n === 1) return 'صفحةً واحدة';
    if (n === 2) return 'صفحتَين';
    if (n % 100 >= 3 && n % 100 <= 10) return ar(n) + ' صفحات';
    return ar(n) + ' صفحة';
  }
  function daysAcc(n) {
    if (n === 1) return 'يومًا';
    if (n === 2) return 'يومَين';
    if (n % 100 >= 3 && n % 100 <= 10) return ar(n) + ' أيّام';
    return ar(n) + ' يومًا';
  }
  function sessionsAcc(n) {
    if (n === 1) return 'جلسةً واحدة';
    if (n === 2) return 'جلستَين';
    if (n % 100 >= 3 && n % 100 <= 10) return ar(n) + ' جلسات';
    return ar(n) + ' جلسة';
  }

  /* اسمُ المنهجِ كما سمّاه صاحبُه، وإلّا فنطاقُه — ليُسمّى الفعلُ بعينه */
  function titleOf(p) {
    var t = (p && p.title || '').trim();
    if (t) return t;
    try { return P.titleFor(p); } catch (e) { return (P.KINDS[p.kind] || {}).t || 'منهجك'; }
  }

  /* ── قراءةُ الحال ────────────────────────────────────────────────
     لا يُكتب في الخزن شيءٌ من هنا: الحالُ تُقرأ من سجلّ المناهج
     نفسِه، فالكلمةُ تَتبع الحقيقةَ ولا تحتاج ذاكرةً ثانية. */
  function logMap() {
    var m = {};
    (App.state.plans || []).forEach(function (p) {
      var g = p.log || {};
      for (var k in g) if (g[k] > 0) m[k] = (m[k] || 0) + g[k];
    });
    return m;
  }
  function totalPages() {
    var m = logMap(), t = 0, k;
    for (k in m) t += m[k];
    return t;
  }
  /* كم يومًا مضى منذ آخرِ تسجيل؟ ‎٠‎ إن كان اليومَ، و‎-١‎ إن لم يُسجَّل قطّ */
  function gap() {
    var m = logMap(), any = false, k;
    for (k in m) { any = true; break; }
    if (!any) return -1;
    var d = new Date(); d.setHours(12, 0, 0, 0);
    for (var i = 0; i <= 400; i++) {
      if (m[App.dateKey(d)]) return i;
      d.setDate(d.getDate() - 1);
    }
    return 400;
  }
  /* ثلاثةُ أحوالٍ لا رابعَ لها: أوّلُ يومٍ، وعودةٌ بعد انقطاع، ويومٌ موصول */
  function mood() {
    var g = gap();
    return g < 0 ? 'new' : (g >= 2 ? 'back' : 'on');
  }
  /* كم وردًا بقي اليومَ لم يُسجَّل؟ به يُعرَف آخرُ وردِ اليوم */
  function dueLeft() {
    var n = 0;
    (App.state.plans || []).forEach(function (p) {
      if (P.isDueToday(p) && P.doneToday(p) === 0) n++;
    });
    return n;
  }

  /* ═════════ ١ · التحيّة ═════════════════════════════════════════
     تحيّتان لا غير، وهما اللتان يَقولهما الناسُ فعلًا. وكانت خمسةَ
     أوقاتٍ بثلاثِ صِيَغٍ لكلٍّ منها — «سَحَرٌ مبارك»، «طابت ظهيرتُك»
     — فكان الطالبُ يُقابَل بعبارةٍ لا تُقال، وفي التكلّفِ بُعدٌ عن
     الأُنس. والمقصودُ أن يُحيّا كما يُحيّا في بيته. */
  function band(h) {
    return (h >= 5 && h < 12) ? 'morn' : 'eve';
  }

  var GREET = {
    morn: ['صباحُ الخير'],
    eve:  ['مساءُ الخير']
  };
  /* أوّلُ يومٍ: لا تحيّةَ وقتٍ، بل تحيّةُ قدوم */
  var WELCOME = [
    function () { return vg('أهلًا بك', 'أهلًا بكِ'); },
    function () { return vg('مرحبًا بك', 'مرحبًا بكِ'); },
    'على بركةِ الله'
  ];
  /* العودةُ بعد انقطاع: تُستقبَل ولا يُذكَّر صاحبُها بغيابه هنا —
     للغيابِ موضعُه في «المواظبة»، والتحيّةُ ليست موضعَ عتاب. */
  var BACK = [
    'أهلًا بعودتك',
    function () { return vg('عُدتَ على خير', 'عُدتِ على خير'); }
  ];

  /* ═════════ ٢ · كلمةُ الإنجاز ══════════════════════════════════ */

  /* آخرُ وردِ اليوم: خبرُ تمامٍ لا تهنئةُ بطولة */
  var ALL_DONE = [
    'تمّ وردُ اليوم كلُّه.',
    function () { return vg('أغلقتَ يومَك على تمام.', 'أغلقتِ يومَكِ على تمام.'); },
    'لم يبقَ من وردِ اليوم شيء.',
    'آخرُ وردِ اليوم، وقد تمّ.'
  ];

  /* ═════════ ٣ · كلمةُ المحطّة ═══════════════════════════════════

     وصياغتُها تَصدُق على ما جرى بعينِه: «بلغتَ آخرَ الجزء» حقٌّ ولو
     كان المنهجُ قد بدأ من وسطه، وأمّا «أتممتَ الجزء» فقد لا يصدُق. */
  function station(p, n) {
    /* «أوّلُ صفحة» تَكذِب إن كان أوّلُ وردٍ أربعَ صفحات، فتُصاغ
       صياغةً لا تَذكر عددًا — والعددُ على الشاشة أمامه. */
    if (totalPages() === n) return 'هذا أوّلُ ما سُجّل في سجلّك. هكذا يبدأ.';
    var s = P.streak();
    /* «أربعون يومًا متّصلًا»: التمييزُ مفردٌ منصوبٌ فصفتُه مثلُه */
    if (s === 40) return 'أربعون يومًا متّصلًا.';
    if (s === 7)  return 'سبعةُ أيّامٍ متّصلة. صار الوردُ عادة.';
    if (!p || !Q) return null;
    var last = p.from + (p.done || 0) - 1;
    if (last < p.from || last > p.to) return null;
    var j = Q.juzOf(last);
    if (Q.juzEnd(j) === last) return vg('بلغتَ', 'بلغتِ') + ' آخرَ الجزءِ ' + ar(j) + '.';
    /* السورةُ محطّةٌ إن كانت صفحاتٍ لا بعضَ صفحة: في جزء عمّ تَختم
       في الصفحة الواحدة سورٌ عدّة، فلو قيلت المحطّةُ لكلِّ خاتمةٍ
       لقيلت كلَّ يومٍ حتّى تَبطُل — وما يُقال كلَّ يومٍ ليس محطّة. */
    var su = Q.surahOf(last);
    if (Q.surahEnd(su) === last && Q.surahStart(su) < last) {
      return vg('بلغتَ', 'بلغتِ') + ' خاتمةَ سورةِ ' + Q.surahName(su) + '.';
    }
    return null;
  }

  /* ═════════ الواجهة ════════════════════════════════════════════ */
  var W = {};

  W.vg = vg;

  /* ١ · التحيّة — الاسمُ يَلحقها إن عُرف */
  W.greet = function (nm) {
    var d = new Date(), b = band(d.getHours()), m = mood();
    var g = m === 'on'
      ? hold('greet.' + b, App.dateKey(d) + b + sig(), GREET[b])
      : hold('greet.' + m, App.dateKey(d) + b + m + sig(), m === 'new' ? WELCOME : BACK);
    nm = String(nm || '').trim();
    return nm ? g + '، ' + nm : g;
  };

  /* ٢ · كلمةُ الإنجاز — والمحطّةُ تَسبقها إن حلّت */
  W.done = function (p, n) {
    var st = station(p, n);
    if (st) return st;
    if (!dueLeft()) return draw('done.all', ALL_DONE);
    return draw('done.one', [
      function () { return 'سُجّلت ' + pages(n) + ' من ' + titleOf(p) + '.'; },
      function () { return 'سُجّلت ' + pages(n) + '. تقبّل الله.'; },
      function () { return vg('أتممتَ ', 'أتممتِ ') + pagesAcc(n) + ' من ' + titleOf(p) + '.'; },
      function () { return 'مضى وردُ «' + titleOf(p) + '»: ' + pages(n) + '.'; }
    ]);
  };

  W.undone = function () {

      'أُلغي تسجيلُ اليوم.',
      'رجَع وردُ اليوم كما كان.',
      'حُذف ما سُجّل اليوم.'
    ]);
  };

  /* شارةُ التمامِ الباقيةُ على البطاقة — تُثبَّت ليومها فلا ترتجف */
  W.doneBadge = function (p) {
    return hold('badge.' + (p && p.id), App.dateKey() + sig(),
      ['أُتمّ وردُ اليوم', 'تمّ وردُ اليوم', 'وردُ اليوم تامّ']);
  };

  /* الأزرارُ وأسماؤها عند قارئ الشاشة خطابٌ كسائر الخطاب: «أضِف»

  W.addPlan = function () { return vg('أضِف منهجًا', 'أضيفي منهجًا'); };
  W.addPlanAria = function () { return vg('أضِف منهجًا جديدًا', 'أضيفي منهجًا جديدًا'); };
  W.undoAria = function (what) {
    return vg('تراجَع عن تسجيل ', 'تراجعي عن تسجيل ') + what;
  };
  W.emptyCtaAria = function () {
    return vg('ابدأ ببناء منهجٍ جديد', 'ابدئي ببناء منهجٍ جديد');
  };
  W.shareProgress = function () { return vg('شارِك تقدُّمي', 'شاركي تقدُّمي'); };
  W.shareFailed = function () {
    return vg('لم تُصنع البطاقة، جرّب مرّةً أخرى', 'لم تُصنع البطاقة، جرّبي مرّةً أخرى');
  };

  /* ٤ · كلمةُ التعثّر، و٣ · محطّتا الأسبوعِ والأربعين — في موضعٍ
     واحدٍ لأنّهما وجهان لسؤالٍ واحد: أين أنا من مواظبتي؟
     ولا تُوبّخ ولا تُشفِق ولا تُجامِل: تُسمّي ما جرى وتَدلّ على

  W.keepNote = function (s) {
    var g = gap(), key, list;
    if (s > 0) {
      if (s >= 40) {
        key = 'keep.forty';
        list = ['وفي الحديث: أحبُّ الأعمال إلى الله أدومُها وإن قلّ.'];
      } else if (s >= 7) {
        /* العددُ إلى جانبها مكتوبٌ كبيرًا، فلا تُعيد الكلمةُ ما تقوله
           الأرقام: «٨ أيّامٍ متّصلة» و«ثمانيةُ أيّامٍ بلا انقطاع»
           جملتان لخبرٍ واحدٍ في سطرٍ واحد. */
        key = 'keep.week';
        list = ['صار الوردُ عادةً لا قرارًا.', 'ما يُداوَم عليه يَثبُت.', 'آخرُ سبعة أيّام:'];
      } else {
        key = 'keep.on';
        list = ['آخرُ سبعة أيّام:', 'أثرُ أسبوعك:', 'هكذا مضى أسبوعُك:'];
      }
    } else if (g < 0) {
      key = 'keep.none';
      list = [function () {
        return vg('لم يُسجَّل وردٌ بعد. ابدأ بصفحة.', 'لم يُسجَّل وردٌ بعد. ابدئي بصفحة.');
      }];
    } else if (g <= 6) {
      key = 'keep.few';
      list = [function () {
        return vg('غِبتَ ', 'غِبتِ ') + daysAcc(g) + '. ' +

    } else {
      key = 'keep.long';
      list = [function () {

      }];
    }
    return hold('keep', App.dateKey() + '|' + s + '|' + g + '|' + key + sig(), list);
  };

  /* التعثّرُ في لوحة التقدّم: الدَّينُ مقيسٌ بجلساتِ عملِه لا بعدد

  W.behind = function (late, phrase) {
    phrase = phrase || sessionsAcc(late);
    if (late <= 3) {
      return vg('تأخّرتَ ', 'تأخّرتِ ') + phrase + '. جلسةٌ أو اثنتان تُدركانه.';
    }
    if (late <= 10) {
      return vg('تأخّرتَ ', 'تأخّرتِ ') + 'نحوَ ' + phrase + '. ' +
             vg('زِد يومًا في الأسبوع أو اخفِض المقدار.',
                'زيدي يومًا في الأسبوع أو اخفِضي المقدار.');
    }

           vg('اخفِض المقدارَ اليوميَّ ليَصدُق الختام.',
              'اخفِضي المقدارَ اليوميَّ ليَصدُق الختام.');
  };

  W.onPace = function () {
    return vg('كلُّ مناهجك على وتيرتها. أحسنتَ المواظبة.',
              'كلُّ مناهجكِ على وتيرتها. أحسنتِ المواظبة.');
  };

  /* ═════════ ٥ · الفراغ ══════════════════════════════════════════

     فتقول ما الذي يصير إن ضَغط، وتَدعو بفعلٍ واحدٍ لا بفعلَين. */

  /* ليس اليومُ يومَ ورد */
  W.restLine = function () {
    return hold('rest', App.dateKey() + sig(), [
      'ليس اليومُ من أيّام وردك.',
      'اليومُ راحةٌ في منهجك.',
      function () { return vg('لا وردَ عليك اليوم.', 'لا وردَ عليكِ اليوم.'); }
    ]);
  };

  /* اكتملت المناهجُ كلُّها — وفيها وَسمُ ‎<b>‎ كما كانت */
  W.allDoneLine = function () {
