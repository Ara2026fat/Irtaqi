    '  font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}',
    '.mk-pg{font-size:13px;color:var(--ink-mut);line-height:1.7;margin-top:12px;' +
      'min-height:1.7em}',
    '.mk-pg b{color:var(--ink)}',
    '.mk-empty{font-size:13px;color:var(--ink-mut);line-height:1.8;margin-top:14px}',
    /* الحركةُ تحت الرغبة وحدَها: لا انتقالَ يُعلن إلّا إن سُمح به، فتبقى
       الحلقةُ ساكنةً تمامًا عند طلب تقليل الحركة. */
    '@media (prefers-reduced-motion:no-preference){',
    '.mk-fil{transition:stroke-dashoffset var(--slow) var(--ease)}',
    '.mk-trk,.mk-fil{transition-property:stroke-dashoffset,stroke-width;' +
      'transition-duration:var(--slow),var(--fast)}',
    '.mk-c{transition:background var(--fast) linear}',
    '}'
  ].join('\n');

  if (!document.getElementById('mk-css')) {
    var st = App.el('style'); st.id = 'mk-css'; st.textContent = CSS;
    document.head.appendChild(st);
  }

  /* ── الحساب ──────────────────────────────────────────────────── */
  function juzInfo(j, cov) {
    var a = Q.juzStart(j), b = Q.juzEnd(j), n = b - a + 1, c = 0;
    for (var p = a; p <= b; p++) if (cov.has(p)) c++;
    return { j: j, from: a, to: b, pages: n, cov: c, pct: n ? Math.round(c / n * 100) : 0 };
  }

  /* الحدُّ الحاضر: الصفحةُ التي يقف عندها الطالبُ في كلّ منهجٍ لم يتمّ.
     ليست «آخرَ ما غُطّي + ١» لأنّ المناهجَ تتوزّع على أجزاءٍ متباعدة،
     فلكلّ منهجٍ موضعُه الحاضر. */
  function frontiers() {
    var s = new Set();
    App.state.plans.forEach(function (p) {
      var t = App.Plans.todayRange(p);
      if (t) s.add(t.from);
    });
    return s;
  }

  function range(from, to) {
    return 'الصفحات ' + App.ar(from) + ' – ' + App.ar(to);
  }

  /* ── الشاشة ──────────────────────────────────────────────────── */
  /* يُسمّى لتُستدعى على حالةٍ مُعارةٍ فيُولَّد المثالُ من الشاشةِ
     نفسِها لا من رسمٍ ثانٍ يَشرد عنها. */
  var LAST = null;

  function draw(params) {
    var t0 = performance.now();

    var cov = App.Plans.coveredPages();
    var front = frontiers();
    var done = cov.size, all = Q.PAGES;
    var pctAll = Math.round(done / all * 100);
    var empty = !App.state.plans.length;

    var info = [];                       /* معلوماتُ الأجزاء مرّةً واحدة */
    for (var j = 1; j <= NJUZ; j++) info.push(juzInfo(j, cov));

    var wrap = App.el('div', 'screen mk');

    var bar = App.el('div', 'bar');
    bar.appendChild(App.el('h1', 'h1 bar-t', 'المصحف'));
    wrap.appendChild(bar);

    /* ═══ ١ · حلقةُ الأجزاء ═══ */
    /* لا عنوانَ ثانيًا فوقَ اللسان: اللسانُ يقول «الأجزاء» فعنوانٌ يقول
       «حلقةُ الأجزاء» تكرارٌ يأكل سطرَين من شاشةٍ واحدة. يبقى السطرُ
       المُرشِد وحدَه. */
    var s1 = App.el('section', 'sec');
    var h1 = App.el('div', 'sec-h');
    h1.appendChild(App.el('p', 'small', 'المسْ قوسًا لتفصيله.'));
    s1.appendChild(h1);

    var card1 = App.el('div', 'card');
    var ring = App.el('div', 'mk-ring');

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + VB + ' ' + VB);
    svg.setAttribute('role', 'radiogroup');
    svg.setAttribute('aria-label', 'حلقةُ الأجزاء: اختر جزءًا');
    svg.style.setProperty('--L', ARCLEN.toFixed(2));

    var frag = document.createDocumentFragment();
    var segs = [];
    info.forEach(function (d, i) {
      var a0 = i * SLOT + GAP / 2, a1 = a0 + SWEEP;
      var g = document.createElementNS(svg.namespaceURI, 'g');
      g.setAttribute('class', 'mk-seg');
      g.setAttribute('role', 'radio');
      g.setAttribute('aria-checked', 'false');
      g.setAttribute('tabindex', i === 0 ? '0' : '-1');
      g.setAttribute('aria-label', 'الجزء ' + App.ar(d.j) + '، ' +
        range(d.from, d.to) + '، ' + App.ar(d.pct) + '٪');
      g.dataset.j = d.j;

      var mk = function (cls, path, r) {
        var p = document.createElementNS(svg.namespaceURI, 'path');
        p.setAttribute('class', cls);
        p.setAttribute('d', path);
        g.appendChild(p);
        return p;
      };
      mk('mk-trk', arc(a0, a1, R));
      var fil = mk('mk-fil', arc(a0, a1, R));
      mk('mk-foc', arc(a0, a1, R + 21));
      /* المِمسكُ يأخذ الشقَّ كاملًا بفُرجتِه فلا فراغَ بين قوسين */
      mk('mk-hit', arc(i * SLOT, i * SLOT + SLOT, R));

      segs.push({ g: g, fil: fil, d: d });
      frag.appendChild(g);
    });
    svg.appendChild(frag);
    ring.appendChild(svg);

    var core = App.el('div', 'mk-core');
    core.appendChild(App.el('div', 'mk-eb', 'المقروء'));
    core.appendChild(App.el('div', 'mk-pct', App.ar(pctAll) + '٪'));
    core.appendChild(App.el('div', 'mk-cnt',
      App.ar(done) + ' من ' + App.ar(all) + ' صفحة'));
    ring.appendChild(core);
    card1.appendChild(ring);

    /* لوحةُ تفصيل الجزء المختار، ومعها زرّان بعرض ٤٤ للتنقّل بلا تصويبٍ دقيق */
    var det = App.el('div', 'mk-det');
    var prev = App.el('button', 'mk-step', App.icon('chevron', 20));
    prev.type = 'button'; prev.setAttribute('aria-label', 'الجزء السابق');
    var body = App.el('div', 'mk-body');
    var nm = App.el('div', 'mk-nm'), sub = App.el('div', 'mk-sub');
    body.appendChild(nm); body.appendChild(sub);
    var next = App.el('button', 'mk-step', App.icon('chevron', 20, 'ico nx'));
    next.type = 'button'; next.setAttribute('aria-label', 'الجزء التالي');
    det.appendChild(next); det.appendChild(body); det.appendChild(prev);
    card1.appendChild(det);

    if (empty) {
      card1.appendChild(App.el('p', 'mk-empty',
        'ابنِ منهجَك ليبدأ المصحفُ بالامتلاء.'));
      var cta = App.el('button', 'btn-ghost', 'ابنِ منهجك');
      cta.type = 'button';
      cta.onclick = function () { App.go('builder'); };
      card1.appendChild(cta);
    }
    s1.appendChild(card1);
    /* لا يُضَمّ بعدُ: القسمان يُسلَّمان للتبويب في آخر الدالّة */

    /* ═══ ٢ · خريطةُ المصحف ═══ */
    var s2 = App.el('section', 'sec');
    var h2 = App.el('div', 'sec-h');
    h2.appendChild(App.el('p', 'small', 'المسْ خليّةً لتعرف موضعها.'));
    s2.appendChild(h2);

    var card2 = App.el('div', 'card');

    var lg = App.el('div', 'mk-lg');
    [['a', 'مقروء'], ['b', 'موضعك الحاضر'], ['c', 'لم يُبلَغ']].forEach(function (x) {
      var c = App.el('span', 'chip', '<i class="mk-sw ' + x[0] + '"></i> ' + x[1]);
      lg.appendChild(c);
    });
    card2.appendChild(lg);

    /* ٦٠٤ خليّةٍ في قُصاصةٍ واحدة ومستمعٍ واحدٍ مُفوَّض: الإنشاءُ دَفعةً
       والاستماعُ بالتفويض، فلا ٦٠٤ مستمعٍ ولا ٦٠٤ إدراجٍ في الصفحة. */
    var map = App.el('div', 'mk-map');
    map.setAttribute('role', 'img');
    map.setAttribute('aria-label',
      'خريطةُ المصحف: ' + App.ar(done) + ' صفحةً مقروءةً من ' + App.ar(all) +
      '، أي ' + App.ar(pctAll) + '٪' +
      (front.size ? '. وموضعُك الحاضر عند ' +
        Array.from(front).sort(function (a, b) { return a - b; })
          .map(function (p) { return 'الصفحة ' + App.ar(p); }).join(' و') : '') + '.');

    var cells = new Array(all + 1);
    var mfrag = document.createDocumentFragment();
    for (var p = 1; p <= all; p++) {
      var c = document.createElement('i');
      c.className = 'mk-c' + (cov.has(p) ? ' on' : '') + (front.has(p) ? ' now' : '');
      c.dataset.p = p;
      cells[p] = c;
      mfrag.appendChild(c);
    }
    map.appendChild(mfrag);
    card2.appendChild(map);

    /* بابُ البحثِ في المصحفِ نفسِه: الحافظُ يَعرف الآيةَ ولا يَعرف
       موضعَها، وهذه الشاشةُ هي التي تُسأل. */
    if (App.Quran) {
      var fb = App.el('button', 'mk-find bar-end');
      fb.type = 'button';
      fb.innerHTML = App.icon('search', 19);
      fb.setAttribute('aria-label', 'ابحث عن آية');
      fb.title = 'ابحث عن آية';
      fb.onclick = function () { App.sheet('find'); };
      bar.appendChild(fb);
    }

    var pg = App.el('div', 'mk-pg');
    pg.setAttribute('aria-live', 'polite');
    pg.innerHTML = 'المسْ خليّةً لتعرف موضعها من المصحف.';
    card2.appendChild(pg);

    s2.appendChild(card2);

    /* ── الربطُ والتفاعل ─────────────────────────────────────────── */
    var selJ = 0, selP = 0;

    function paintBand(j) {
      if (selJ) for (var p = Q.juzStart(selJ); p <= Q.juzEnd(selJ); p++)
        cells[p].classList.remove('band');
      if (j) for (var q = Q.juzStart(j); q <= Q.juzEnd(j); q++)
        cells[q].classList.add('band');
    }

    function pickJuz(j, focus) {
      if (j < 1 || j > NJUZ) return;
      paintBand(j);
      segs.forEach(function (s) {
        var on = +s.g.dataset.j === j;
        s.g.setAttribute('aria-checked', on ? 'true' : 'false');
        s.g.setAttribute('tabindex', on ? '0' : '-1');
        if (on && focus) s.g.focus();
      });
      var d = info[j - 1];
      nm.textContent = 'الجزء ' + ORD[j - 1];
      /* سطران لا سطر: بين زرَّي التنقّل لا يبقى للنصّ إلّا نحوُ مئتَي
         بكسل، فكان السطرُ الواحدُ يلتفّ ويتيمَ «٪» وحدَها في آخره.
         و«·» قبل رقمٍ هنديٍّ تُقرأ صفرًا فالفاصلةُ العربيّةُ مكانَها. */
      sub.textContent = '';
      sub.appendChild(App.el('span', 'mk-rng', range(d.from, d.to)));
      sub.appendChild(App.el('span', 'mk-prg',
        App.ar(d.cov) + ' من ' + App.ar(d.pages) + ' صفحة، ' + App.ar(d.pct) + '٪'));
      selJ = j;
    }

    function pickPage(p) {
      if (selP) cells[selP].classList.remove('pick');
      selP = p;
      cells[p].classList.add('pick');
      var s = Q.surahOf(p);
      pg.innerHTML = '<b>الصفحة ' + App.ar(p) + '</b> · الجزء ' + App.ar(Q.juzOf(p)) +
        ' · سورة ' + Q.surahName(s);
      /* ولمَ يُنتقى موضعٌ ثمّ لا يُفتح؟ الخريطةُ كانت تُعلّم المربّعَ
         وتَقف، والطالبُ حافظٌ — أولى الناسِ بأن يَقرأ ما علّمه. */
      if (App.Quran) {
        var go = App.el('button', 'mk-read');
        go.type = 'button';
        go.innerHTML = App.icon('book', 17);
        go.appendChild(App.el('span', null, 'اقرأ الصفحة'));
        go.onclick = function () { App.go('qpage', { p: p }); };
        pg.appendChild(go);
      }
      pickJuz(Q.juzOf(p), false);       /* المَشهدان مرتبطان: الخليّةُ تُنتقي جزأها */
    }

    svg.addEventListener('click', function (e) {
      var g = e.target.closest('.mk-seg');
      if (g) pickJuz(+g.dataset.j, true);
    });
    svg.addEventListener('keydown', function (e) {
      var g = e.target.closest('.mk-seg'); if (!g) return;
      var j = +g.dataset.j, n = null;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = j + 1;
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = j - 1;
      else if (e.key === 'Home') n = 1;
      else if (e.key === 'End') n = NJUZ;
      else if (e.key === ' ' || e.key === 'Enter') n = j;
      if (n === null) return;
      e.preventDefault();
      pickJuz(((n - 1 + NJUZ) % NJUZ) + 1, true);
    });
    prev.onclick = function () { pickJuz(((selJ - 2 + NJUZ) % NJUZ) + 1, false); };
    next.onclick = function () { pickJuz((selJ % NJUZ) + 1, false); };

    map.addEventListener('click', function (e) {
      var c = e.target.closest('.mk-c');
      if (c) pickPage(+c.dataset.p);
    });

    /* أوّلُ ما يُنتقى: الجزءُ الذي يقف عنده الطالبُ الآن، وإلّا الأوّل */
    var startJ = front.size ? Q.juzOf(Math.min.apply(null, Array.from(front))) : 1;
    pickJuz(startJ, false);

    /* الامتلاءُ: إزاحةُ الشَّرطة وحدَها تتحرّك، قوسًا بعد قوسٍ بتدرّج.
       وإن طُلب تقليلُ الحركة وُضعت القيمةُ النهائيّةُ فورًا بلا إطار. */
    var still = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    function fill() {
      segs.forEach(function (s, i) {
        var off = (ARCLEN * (1 - s.d.cov / s.d.pages)).toFixed(2);
        if (!still) s.fil.style.transitionDelay = (i * 17) + 'ms';
        s.fil.style.strokeDashoffset = off;
      });
    }
    if (still) fill(); else requestAnimationFrame(fill);

    /* ── التبويب ───────────────────────────────────────────────
       الحلقةُ والخريطةُ مَشهدان لشيءٍ واحد: نقرُ خليّةٍ يُضيء قوسَها،
       ونقرُ قوسٍ يُظلّل شريطَها. فيُبنَيان معًا كما كانا ثمّ يُسلَّمان
       للتبويب جاهزَين — ولو أُجّل بناءُ أحدهما لَطلب الآخرُ خلايا
       لم تُخلق بعدُ فانقطع الربطُ ورمى. */
    /* المثالُ لسانٌ ثالثٌ لا ذيلٌ تحتَ الخريطة.
       كان يُضاف أسفلَ الشاشةِ فيَزيدها ٦٩٣ بكسلًا — أي يَجعلها
       شاشتَين — ويَعرض الشيءَ نفسَه مملوءًا تحتَ الشيءِ نفسِه خاليًا.
       واللسانُ يُبقيه ظاهرًا بلمسةٍ ويَرُدّ الشاشةَ إلى حدِّها. */
    /* يُبنى المثالُ قبلَ الألسنةِ لا بعدَها: لسانٌ يُسأل عن وجودِه قبل
       أن يُخلَق لا يُخلَق أبدًا. */
    var exPane = null;
    if (empty && App.Example && App.Example.roomy()) {
      var ex = App.Example.borrow(function () { draw(); return LAST; });
      if (ex && ex.map) {
        exPane = App.Example.frame(
          'هكذا يمتلئ مصحفُك بعد أربعين يومًا', ex.map,
          /* النصُّ يَصف ما تُرى لا ما تَمنّيتُه: الخريطةُ تصبغ المقروءَ
             بلونٍ واحدٍ وتُعلّم الموضعَ الحاضر، ولا تُفرّق الأنواع. */
          /* لسانُه اسمُه «مثال»: فتحُه طلبٌ له، فلا يُطلَب مرّتين */
          'هكذا يمتلئ مصحفُك صفحةً صفحة.', { open: true });
      }
    }

    var tabs = [
      { key:'ring', label:'الأجزاء',  icon:'target', render:function () { return s1; } },
      { key:'map',  label:'الخريطة', icon:'mushaf', render:function () { return s2; } }
    ];
    if (exPane) tabs.push({ key:'ex', label:'مثال', icon:'info',
                            render:function () { return exPane; } });
    /* المحتوى لسانٌ هنا: هذه حِزَمُ مصحفِه، ومَن أرادها يَقصد
       المصحفَ لا دُرجَ الإعدادات. ولا يُبنى حتّى يُلمَس. */
    if (App.Packs && App.Packs.pane) {
      tabs.push({ key:'pack', label:'تحميلُ المصحف', icon:'page',
                  render:function () { return App.Packs.pane(); } });
    }
    wrap.appendChild(App.seg(tabs, {
      cls: 'mk-seg-bar',
      start: (params && params.tab) || (App.state.settings || {}).mushafTab,
      onchange: function (k) {
        var st = App.state.settings || (App.state.settings = {});
        if (st.mushafTab === k) return;   /* لا كتابةَ إلّا عند التبدّل */
        st.mushafTab = k;
        App.save();
      }
    }));

    App.mushafRenderMs = +(performance.now() - t0).toFixed(1);
    LAST = { ring: s1, map: s2 };

    return wrap;
  }

  App.screen('mushaf', draw);

  App.tab('mushaf', 'المصحف', 'book');   /* كان 'mushaf' فيُرسَم شبكةً تُقرأ جدولًا */
})(window.App);

/* ══ 62-page.js ══ */
/* ══ 62-page.js — صفحةُ المصحف: موضعُ قراءةٍ لا شاشةُ تطبيق ═══════
   كانت خريطةُ المصحفِ تُري مربّعًا ملوّنًا لكلِّ صفحة، فإن لُمس لم
   يُقرأ شيء. فصارت الصفحةُ تُفتح وتُقرأ.

   ثمّ كانت تُفتح وفيها ترويسةٌ وشريطُ متشابهاتٍ وأزرارُ تنقّلٍ تُحيط
   بالنصِّ من فوقِه ومن تحتِه، فيُقرأ القرآنُ في زحامِ واجهة. وهذه
   الصفحةُ اليومَ على ثلاثِ طبقات:

     الورقةُ   — النصُّ وحدَه، في وسطِ الشاشةِ وهوامشُه فسيحة.
     الحافّةُ  — الموضعُ وبابُ الخروجِ وضابطُ الحرف. تَسكن حين تَبدأ
                القراءةُ (نزولُ عشرين بكسلًا يَكفي) وتعود بلمسةٍ على
                الورقةِ أو برجوعٍ إلى أعلاها أو بأوّلِ ضغطةِ Tab.
     الذيلُ    — ما يُحتاج بعد الفراغِ من الصفحة: أدواتُ الوحداتِ
                الأخرى، والمتشابهاتُ، والتقليب. تحت النصِّ لا فوقه،
                فلا يُزاحمه شيءٌ في أثناءِ القراءة.

   وحجمُ الحرفِ يُضبَط من الصفحةِ نفسِها ويُحفَظ: كثيرٌ ممّن يَحفظ
   كبارُ سنّ، والمصحفُ لا يُقرأ بخطٍّ صغير. وضابطُه هنا لا في شاشةِ
   الإعدادات — يُجرَّب الحجمُ على النصِّ الذي يُقرأ، لا على وصفِه.

   والصفحةُ تُفتح على حالَين: النصُّ المدموجُ يَظهر فورًا دون اتّصال،
   ورسمُ المدينةِ يَحلّ محلَّه متى نزل خطُّه. فلا يَنتظر قارئٌ شبكةً. */
(function (App) {
  'use strict';

  var Q = App.Quran;

  /* ── مقاييسُ الحرف ──
     سبعُ درجاتٍ تَنتهي عند ٣٦ بكسلًا: أكبرُ ممّا يَحتاجه شابٌّ بكثير،
     وهو ما تَحتاجه عينٌ جاوزت الستّين. والسطرُ يَضيق كلّما كبُر
     الحرفُ — تباعدٌ ثابتٌ مع حرفٍ كبيرٍ يُمزّق الكتلةَ أشلاءً. */
  var SIZES = [18, 20, 22, 25, 28, 32, 36];
  var LEADS = [2.6, 2.55, 2.5, 2.4, 2.3, 2.2, 2.12];
  var DEF = 2;

  var here = false;      /* أنحن في الصفحةِ الآن؟ لحارسِ المفاتيح */
  var bare = false;      /* أسكنت الحافّة؟ — حالُ جلسةٍ لا تُحفَظ:
                            من يَدخل الصفحةَ يَرى بابَ الخروجِ أوّلًا */
  var lock = null;       /* قُفلُ اليقظة */
  var wrap = null;       /* غلافُ الصفحةِ المرسومةِ الآن */
  var sizeBox = null;    /* لوحُ ضبطِ الحرف */
  var curP = 1;
  var backTo = 0;        /* صفحةٌ نَعود إليها إن أُغلقت صحيفةٌ فوقَنا */

  function cfg() {
    var s = App.state.settings;
    if (!s) { s = {}; App.state.settings = s; }
    return s;
  }
  function sizeIx() {
    var i = +cfg().qpSize;
    return (i >= 0 && i < SIZES.length) ? i : DEF;
  }

  /* ── الورقةُ تُقاس بمتغيّرَين فحسب ──
     الحجمُ والتباعدُ يُكتبان على الغلاف، فيَتبعهما كلُّ ما في الصفحةِ
     بالـem: رقمُ الآيةِ واسمُ السورةِ والسجدة. تكبيرُ الحرفِ لا يَترك
     رقمًا صغيرًا وحيدًا في وسطِ نصٍّ كبير. */
  function applySize(node, i) {
    node.style.setProperty('--qp-size', SIZES[i] + 'px');
    node.style.setProperty('--qp-lead', String(LEADS[i]));
    /* المدُّ بين الحافّتَين يَحسُن ما دام في السطر كلماتٌ
       تحمله. فإن كبُر الحرف حتّى لا يسع السطر إلّا ثلاثًا
       صار المدّ فُرَجًا تَشقّ الكتلة، فيُترَك الطرف الأيسر على
       سجيّته: تفاوتٌ في أطراف السطور أهونُ من أنهار بيضاءَ في وسطه. */
    node.classList.toggle('qp-loose', i >= 5);
  }

  /* تكبيرُ الحرفِ يُزحزح ما تحتَ العينِ صفحةً كاملة، فيَضيع السطرُ
     الذي كان يُقرأ. فيُمسَك أقربُ آيةٍ إلى أعلى الشاشةِ قبل التغيير
     ويُردّ موضعُها بعده — السطرُ ثابتٌ وإن تبدّل المقياس. */
  function anchored(fn) {
    var sc = scroller();
    var marks = wrap ? App.$$('.qp-v', wrap) : [];
    var keep = null, i, r;
    for (i = 0; i < marks.length; i++) {
      r = marks[i].getBoundingClientRect();
      if (r.bottom > 56) { keep = marks[i]; break; }
    }
    var before = keep ? keep.getBoundingClientRect().top : 0;
    fn();
    if (!keep || !keep.isConnected) return;
    var after = keep.getBoundingClientRect().top;
    var by = after - before;
    if (!by) return;
    if (sc === window) window.scrollBy(0, by);
    else sc.scrollTop += by;
  }

  function setSize(i) {
    i = Math.max(0, Math.min(SIZES.length - 1, i));
    if (i === sizeIx()) return;
    anchored(function () {
      cfg().qpSize = i;
      App.save();
      if (wrap) applySize(wrap, i);
      if (sizeBox) sizeBox.refresh();
    });
  }

  /* ── الحافّةُ تَسكن ──
     لا تُمحى من الصفحةِ بل تَخفت: من يَضغط Tab يَجدها، وقارئُ الشاشةِ
     يَقرؤها، واليدُ وحدَها هي التي لا تَصطدم بها حين تَقرأ العين. */
  function setBare(on) {
    if (bare === on || !wrap) return;
    bare = on;
    wrap.classList.toggle('qp-bare', on);
    if (on) {
      openSize(false);
      var s = cfg();
      if (!s.qpHint) {
        s.qpHint = 1;
        App.save();
        App.toast('المِس الصفحةَ ليعودَ ما حولَها');
      }
    }
  }

  function openSize(on) {
    if (!sizeBox) return;
    sizeBox.wrap.hidden = !on;
    sizeBox.btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }

  /* ── الشاشةُ لا تَنطفئ تحت عينِ القارئ ──
     من يَقرأ لا يَلمس زجاجَه، فتُطفئه الهواتفُ بعد نصفِ دقيقة. ويُطلَب
     صامتًا: من مَنعه متصفّحُه لا يُقال له شيء — إعلانُ عطبٍ لا حيلةَ
     للقارئِ فيه قلقٌ بلا فائدة. */
  function hold() {
    try {
      if (lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
      var pr = navigator.wakeLock.request('screen');
      if (pr && pr.then) pr.then(function (s) {
        if (!here) { try { s.release(); } catch (e) {} return; }
        lock = s;
        try { s.addEventListener('release', function () { lock = null; }); } catch (e) {}
      }, function () {});
    } catch (e) {}
  }
  function unhold() {
    try { if (lock) lock.release(); } catch (e) {}
    lock = null;
  }
  document.addEventListener('visibilitychange', function () {
    if (!here) return;
    if (document.visibilityState === 'visible') hold(); else unhold();
  });

  /* ── النصُّ المدموج ──
     آيةً آية، ورقمُها بعدها في حَلقة. واسمُ السورةِ يُثبَت حيث تَبدأ
     حقًّا — أي عند آيتِها الأولى لا عند أوّلِ آيةٍ في الصفحة: في ٦٠٤
     ثلاثُ سورٍ تَتوالى بلا فاصلٍ فيُقرأ آخِرُ الإخلاصِ موصولًا بأوّلِ
     الفلق، وفي ٢ لا سورةَ تَبدأ فلا عنوان. والاسمُ بيانٌ لا نصٌّ
     قرآنيّ — ولا بسملةَ تُكتب في الشيفرة. */
  function textView(verses) {
    var box = App.el('div', 'qp-text');
    verses.forEach(function (v) {
      if (v.a === 1) {
        var h = App.el('div', 'qp-sura');
        var nm = App.el('span');
        nm.textContent = 'سورة ' + v.name;
        h.appendChild(nm);
        box.appendChild(h);
      }
      var sp = App.el('span', 'qp-v');
      /* الرقم وآخر كلمة قبله وحدة واحدة لا تُكسر: الفراغ الذي لا يُكسر
         لا يكفي وحده — المتصفّح يكسر قبل عنصر مُصمَت كالرقم على كلّ حال،
         فيسقط رقم الآية وحده في سطر لا نصّ معه، وهو منظر لا يقع في مصحف قطّ. */
      var words = v.t.split(' ');
      var tail = App.el('span', 'qp-end');
      tail.appendChild(document.createTextNode(words.pop()));
      if (words.length) sp.appendChild(document.createTextNode(words.join(' ') + ' '));
      var n = App.el('span', 'qp-num');
      n.textContent = App.ar(v.a);
      tail.appendChild(n);
      if (v.sajda) {
        var sj = App.el('span', 'qp-sajda');
        sj.textContent = 'سجدة';
        tail.appendChild(sj);
      }
      sp.appendChild(tail);
      box.appendChild(sp);
      box.appendChild(document.createTextNode(' '));
    });
    return box;
  }

  /* ── رسمُ المدينة ──
     كلُّ كلمةٍ رمزٌ واحدٌ في خطِّ الصفحة، والسطرُ يُمدّ بين حافّتَيه
     كما في المصحف، إلّا سطرَ العنوانِ والبسملةِ فيُوسَّط. */
  function madaniView(p) {
    var L = App.Layout.page(p);
    if (!L) return null;
    var box = App.el('div', 'qp-madani');
    L.l.forEach(function (ln) {
      var row = App.el('div', 'qp-line' + (ln.t === 'h' ? ' qp-head' : ''));
      ln.w.forEach(function (w) {
        var s = App.el('span');
        s.style.fontFamily = '"' + App.Layout.fonts[w[1]] + '"';
        s.textContent = String.fromCodePoint(w[0]);
        row.appendChild(s);
      });
      box.appendChild(row);
    });
    return box;
  }

  /* ── الحافّةُ العليا: أين أنا، وكيف أخرج، وبأيِّ حرفٍ أقرأ ──
     ثلاثةُ أشياءَ لا رابع: ما سوى ذلك يَنزل إلى الذيل. */
  function topBar(p, verses) {
    var top = App.el('div', 'qp-top');
    var bar = App.el('div', 'qp-rail');

    var out = App.el('button', 'qp-ic');
    out.type = 'button';
    out.setAttribute('aria-label', 'إغلاق المصحف');
    out.innerHTML = App.icon('close', 21);
    out.onclick = function () {
      if (App.isSheet('qpage')) App.closeSheet(); else App.go('mushaf');
    };
    bar.appendChild(out);

    var mid = App.el('div', 'qp-where');
    var sur = App.el('div', 'qp-sur');
    sur.textContent = Q.pageSurahs(p).map(function (s) { return s.name; }).join(' · ');
    mid.appendChild(sur);
    var meta = App.el('div', 'qp-meta');
    meta.textContent = App.join('صفحة ' + App.ar(p), 'الجزء ' + App.ar(Q.juzOf(p)));
    mid.appendChild(meta);
    bar.appendChild(mid);

    /* الضابطُ حرفٌ لا رمز: «أ» صغيرةٌ وكبيرةٌ تَقول ما تَفعل بلا شرح */
    var az = App.el('button', 'qp-ic qp-az');
    az.type = 'button';
    az.setAttribute('aria-label', 'حجمُ الحرف');
    az.setAttribute('aria-expanded', 'false');
    az.setAttribute('aria-controls', 'qp-sizebox');
    az.innerHTML = '<span class="qp-a1">أ</span><span class="qp-a2">أ</span>';
    bar.appendChild(az);

    top.appendChild(bar);
    top.appendChild(sizePanel(az));
    return top;
  }

  function sizePanel(btn) {
    var box = App.el('div', 'qp-sizebox');
    box.id = 'qp-sizebox';
    box.hidden = true;

    var row = App.el('div', 'qp-size-row');
    var less = App.el('button', 'qp-step qp-step-s');
    less.type = 'button';
    less.textContent = 'أ';
    less.setAttribute('aria-label', 'حرفٌ أصغر');

    var val = App.el('div', 'qp-size-val');
    val.setAttribute('aria-live', 'polite');

    var more = App.el('button', 'qp-step qp-step-l');
    more.type = 'button';
    more.textContent = 'أ';
    more.setAttribute('aria-label', 'حرفٌ أكبر');

    row.appendChild(less);
    row.appendChild(val);
    row.appendChild(more);
    box.appendChild(row);

    var note = App.el('p', 'qp-size-note');
    note.textContent = 'يبقى ما تختاره في كلِّ صفحةٍ تفتحها';
    box.appendChild(note);

    function refresh() {
      var i = sizeIx();
      val.textContent = 'الحجم ' + App.ar(i + 1) + ' من ' + App.ar(SIZES.length);
      less.disabled = i === 0;
      more.disabled = i === SIZES.length - 1;
    }
    less.onclick = function () { setSize(sizeIx() - 1); };
    more.onclick = function () { setSize(sizeIx() + 1); };
    refresh();

    sizeBox = { wrap: box, btn: btn, refresh: refresh };
    btn.onclick = function () {
      if (bare) setBare(false);
      openSize(box.hidden);
    };
    return box;
  }

  /* المتشابهاتُ أنفسُ ما يُعرَض لمن يَحفظ — لكنّها بعد الصفحةِ لا
     قبلَها: تنبيهٌ فوق النصِّ يُقرأ قبل أن يُقرأ القرآن. */
  function shabihLine(verses, go) {
    if (!App.Shabih) return null;
    var n = App.Shabih.onPage(verses);
    if (!n) return null;
    var b = App.el('button', 'qp-shabih');
    b.type = 'button';
    b.innerHTML = App.icon('info', 18);
    var s = App.el('span');
    s.textContent = App.ar(n) + (n === 1 ? ' آيةٌ لها متشابه' : ' آياتٍ لها متشابهات');
    b.appendChild(s);
    b.onclick = go;
    return b;
  }

  function navBtn(dir, label, on) {
    var b = App.el('button', 'qp-nb ' + (dir < 0 ? 'qp-prev' : 'qp-next'));
    b.type = 'button';
    b.disabled = !on;
    b.setAttribute('aria-label', 'الصفحة ' + label);
    /* «chevron» وحدَها في المعجم، وتُدار بالـCSS: الاتّجاهُ في RTL
       يُقلَب، فلا يُسمّى سهمٌ بيمينٍ ولا شمالٍ في الشيفرة. */
    b.innerHTML = App.icon('chevron', 20);
    var s = App.el('span');
    s.textContent = label;
    b.appendChild(s);
    b.onclick = function () { turn(dir); };
    return b;
  }

  function turn(dir) {
    var p = curP + dir;
    if (p < 1 || p > Q.TOTAL_PAGES) return;
    App.go('qpage', { p: p });
  }

  /* ── أين يُمرَّر النصّ ──
     الصفحةُ تُفتح صحيفةً فوق الهيكل، والصحيفةُ هي الوعاءُ الذي
     يُمرَّر لا النافذة. ويُسأل عنها عند الحاجةِ لا عند الرسم: الغلافُ
     لم يَدخل الوثيقةَ بعدُ حين تُنشئه الشاشة. */
  function scroller() {
    var sh = document.getElementById('sheet');
    return (sh && sh.classList.contains('on')) ? sh : window;
  }
  function scrollTop(sc) {
    return sc === window ? (window.scrollY || 0) : sc.scrollTop;
  }

  /* ── حارسُ المفاتيح ──
     يُعلَّق مرّةً على الوثيقةِ لا على كلِّ رسم: تعليقٌ في كلِّ رسمٍ
     يُراكم المستمعين صفحةً بعد صفحة. والأسهمُ عربيّةُ الاتّجاه:
     اليسارُ تُقدِّم كما يُقدِّم زرُّ «التالية» على يسار الذيل. */
  document.addEventListener('keydown', function (e) {
    if (!here || e.defaultPrevented) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable ||
      /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''))) return;
    var k = e.key;
    if (k === 'ArrowLeft') turn(1);
    else if (k === 'ArrowRight') turn(-1);
    else if (k === '+' || k === '=') setSize(sizeIx() + 1);
    else if (k === '-' || k === '_') setSize(sizeIx() - 1);
    else return;
    e.preventDefault();
  });

  /* ── الورقةُ نفسُها هي المفتاح ──
     لمسةٌ على النصِّ تُسكن الحافّةَ وتُعيدها. ولا تُحسَب اللمسةُ إن
     كان القارئُ يُظلّل نصًّا أو يُقلّب بإصبعه — وإلّا بدا التطبيقُ
     يُومض كلّما مرّت يدُه. */
  function bindPaper(paper) {
    var x0 = 0, y0 = 0, t0 = 0, moved = false;

    paper.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); moved = false;
    });

    paper.addEventListener('pointerup', function (e) {
      if (!t0) return;
      var dx = e.clientX - x0, dy = e.clientY - y0, dt = Date.now() - t0;
      t0 = 0;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      /* تقليبٌ بالإصبع: أفقيٌّ غالبٌ على الرأسيّ وفي نَفَسٍ قصير */
      if (dt < 800 && Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.7) {
        turn(dx < 0 ? 1 : -1);
      }
    });

    paper.addEventListener('click', function (e) {
      if (moved) { moved = false; return; }
      if (e.target.closest('button,a,input,[role="button"]')) return;
      var sel = window.getSelection();
      if (sel && String(sel)) return;
      setBare(!bare);
    });
  }

  /* نزولُ العينِ في النصِّ بدءُ قراءةٍ، فتَسكن الحافّة. والرجوعُ إلى
     أعلى الصفحةِ طلبُ ما حولَها، فتعود. ويُعلَّق مرّةً كالمفاتيح. */
  var lastY = 0, bound = false;
  function bindScroll() {
    if (bound) return;
    var sh = document.getElementById('sheet');
    if (!sh) return;
    bound = true;
    sh.addEventListener('scroll', function () {
      if (!here) return;
      var y = sh.scrollTop;
      if (y > 20 && y > lastY + 6) setBare(true);
      else if (y < 12) setBare(false);
      lastY = y;
    }, { passive: true });
  }

  App.screen('qpage', function (params) {
    var p = Math.max(1, Math.min(Q.TOTAL_PAGES, (params && +params.p) || 1));
    curP = p;
    here = true;
    hold();

    /* ── الحزمةُ قبل الصفحة ───────────────────────────────────────
       في البناءِ الخفيفِ النصُّ حزمةٌ تُحمَّل. ولو فُتحت الصفحةُ قبلَها
       لَرأى القارئُ صفحةً بيضاءَ لا يَدري ما عِلّتُها. فيُقال له
       صراحةً، ويُفتَح له البابُ في لمسة. */
    var gate = App.Packs && App.Packs.gate('المصحف', 'read');
    if (gate) return gate;

    var verses = Q.page(p);

    var w = App.el('div', 'screen qp');
    wrap = w;
    sizeBox = null;
    applySize(w, sizeIx());
    if (bare) w.classList.add('qp-bare');

    w.appendChild(topBar(p, verses));

    /* الورقة: النصُّ في وسطِ الشاشةِ وحولَه بياض. والصندوقُ يَبقى
       هو هو حين يَحلّ الرسمُ محلَّ النصّ، فلا تَقفز الصفحةُ تحت العين. */
    var paper = App.el('div', 'qp-paper');
    var body = App.el('div', 'qp-body');
    body.appendChild(textView(verses));
    paper.appendChild(body);
    bindPaper(paper);
    w.appendChild(paper);

    var foot = App.el('div', 'qp-foot');

    /* ── مَشجبٌ موثَّق ──
       موضعٌ تُعلَّق فيه أدواتُ وحداتٍ أخرى على الصفحة (التسميعُ،
       الصوتُ) دون أن تُحرّر هذا الملفّ. لا يُحذف ولا يُعاد تسميتُه:
       وحداتٌ تَبحث عنه بالاسم. وموضعُه تحت النصِّ لا فوقه. */
    var slot = App.el('div', 'qp-slot');
    slot.id = 'qp-slot';
    slot.dataset.page = String(p);
    foot.appendChild(slot);
    App.emit('qpage', { p: p, slot: slot, verses: verses });

    var sb = shabihLine(verses, function () {
      /* المتشابهاتُ صحيفةٌ تَحلّ محلَّ هذه، فتُحفَظ الصفحةُ لنعودَ
         إليها متى أُغلقت — وإلّا خرج القارئُ من المصحفِ كلِّه وهو
         إنّما سأل عن آيةٍ فيه. */
      backTo = p;
      App.sheet('shabih', { p: p });
    });
    if (sb) foot.appendChild(sb);

    var nav = App.el('div', 'qp-turn');
    nav.appendChild(navBtn(-1, 'السابقة', p > 1));
    nav.appendChild(navBtn(1, 'التالية', p < Q.TOTAL_PAGES));
    foot.appendChild(nav);

    var mark = App.el('p', 'qp-mark');
    mark.textContent = 'صفحة ' + App.ar(p) + ' من ' + App.ar(Q.TOTAL_PAGES);
    foot.appendChild(mark);

    /* رسمُ المدينةِ يَحلّ محلَّ النصِّ متى نزل خطُّه — ولا يُنتظر */
    if (App.QFont && App.QFont.enabled() && App.Layout) {
      var note = App.el('p', 'qp-wait');
      note.textContent = 'يُنزَّل خطُّ المدينة لهذه الصفحة…';
      if (!App.QFont.ready(p)) foot.appendChild(note);
      App.QFont.forPage(p).then(function (ok) {
        if (note.parentNode) note.parentNode.removeChild(note);
        if (!ok || !body.parentNode) return;
        var m = madaniView(p);
        if (!m) return;
        body.innerHTML = '';
        body.appendChild(m);
      });
    }

    w.appendChild(foot);
    lastY = 0;
    requestAnimationFrame(bindScroll);
    return w;
  }, { full: true });

  /* مغادرةُ الصفحةِ تُطلق القُفلَ وتُعيد الحافّة: من يَعود إليها غدًا
     يَرى بابَ خروجِه أوّلَ ما يَرى.

     والعودةُ من صحيفةٍ فُتحت من فوقِنا (المتشابهات) تَرُدّ إلى الصفحة:
     النواةُ تُغلق الصحيفةَ إلى اللسانِ الذي تحتَها، فيَجد القارئُ
     نفسَه في خريطةِ المصحفِ وهو لم يَطلبها. ويُفرَّق بين إغلاقٍ
     وانتقال: الإغلاقُ يَردّ إلى اللسانِ الذي جئنا منه بعينِه، أمّا
     لمسُ لسانٍ آخرَ فقصدٌ صريحٌ إلى غيرِ المصحف فلا يُعارَض. */
  var ground = null;
  App.on_('route', function (r) {
    if (r && r.name === 'qpage') { backTo = 0; return; }
    here = false;
    bare = false;
    wrap = null;
    sizeBox = null;
    unhold();
    if (!r) return;
    if (r.sheet) return;                 /* صحيفةٌ أخرى فُتحت فوقنا */
    var back = backTo;
    backTo = 0;
    if (back && r.name === ground) {
      setTimeout(function () {
        if (App.route().name !== 'qpage') App.go('qpage', { p: back });
      }, 0);
      return;
    }
    ground = r.name;
  });

}(window.App));

/* ══ 64-shabih.js ══ */
/* ══ 64-shabih.js — المتشابهات ═══════════════════════════════════
   لا شيءَ يُوقع الحافظَ كالمتشابهات: آيتان تَتّفقان إلّا في حرفٍ أو
   كلمة، فيَنتقل لسانُه من هذه إلى تلك وهو لا يَشعر. وأكثرُ ما يُصلح
   هذا ليس التكرارَ بل المقابلة: أن يَرى الموضعَين جنبًا إلى جنبٍ
   والفرقَ بينهما مُعلَّمًا.

   فالعرضُ هنا مقابلةٌ لا قائمة: الآياتُ المتشابهةُ تحت بعضِها،
   والكلماتُ التي تَفترق فيها مُبرَزة، وآيةُ الصفحةِ التي جئتَ منها
   مُعلَّمةٌ لتَعرف أيَّهما تَحفظ الآن. */
(function (App) {
  'use strict';

  var Q = App.Quran, S = App.Shabih;

  function styleOnce() {
    if (document.getElementById('sh-css')) return;
    var el = App.el('style');
    el.id = 'sh-css';
    el.textContent = CSS.join('\n');
    document.head.appendChild(el);
  }

  /* ── إبرازُ الفروق ──
     المصدرُ يُعطي قائمةَ «الكلماتِ المتغيّرة»، وهي عريضةٌ جدًّا: في
     أوّلِ مجموعةٍ جرّبتُها عَلّمت الآيةَ كلَّها تقريبًا — وما عُلّم
     كلُّه لم يُعلَّم منه شيء. وفيها كلماتٌ تَرِد في الآيتَين جميعًا،
     فلا تكون فرقًا بينهما.

     فيُحسَب الفرقُ هنا لا يُؤخَذ: مقابلةُ كلماتٍ بأطولِ تتابُعٍ
     مشترك (LCS) على الصورةِ المجرّدة، فما خرج عن المشتركِ فهو
     الفرقُ وحدَه. والمقارنةُ بالمجرّدِ لأنّ الاختلافَ قد يكون في
     الشكلِ وحدَه فلا يُرى في الرسم. */
  function lcsKeep(a, b) {
    /* يُعيد مصفوفةَ منطقٍ بطولِ a: true لما كان من المشترك */
    var n = a.length, m = b.length, i, j;
    if (!n || !m) return new Array(n).fill(false);
    /* جدولٌ (n+1)×(m+1) — الآيةُ أقصرُ من أن يُثقل هذا */
    var T = [];
    for (i = 0; i <= n; i++) T.push(new Array(m + 1).fill(0));
    for (i = 1; i <= n; i++) {
      for (j = 1; j <= m; j++) {
        T[i][j] = a[i - 1] === b[j - 1]
          ? T[i - 1][j - 1] + 1
          : Math.max(T[i - 1][j], T[i][j - 1]);
      }
    }
    var keep = new Array(n).fill(false);
    i = n; j = m;
    while (i > 0 && j > 0) {
      if (a[i - 1] === b[j - 1]) { keep[i - 1] = true; i--; j--; }
      else if (T[i - 1][j] >= T[i][j - 1]) i--;
      else j--;
    }
    return keep;
  }

  /* نصُّ آيةٍ مع تعليمِ ما خالف المرجع */
  function markAgainst(text, refText) {
    var box = App.el('span', 'sh-t');
    var w = text.split(/\s+/).filter(Boolean);
    if (!refText) { box.textContent = text; return box; }
    var a = w.map(Q.strip);
    var b = refText.split(/\s+/).filter(Boolean).map(Q.strip);
    var keep = lcsKeep(a, b);
    w.forEach(function (word, i) {
      if (i) box.appendChild(document.createTextNode(' '));
      if (keep[i]) { box.appendChild(document.createTextNode(word)); return; }
      var m = App.el('mark', 'sh-d');
      m.textContent = word;
      box.appendChild(m);
    });
    return box;
  }

  function verseRow(v, isSelf, refText) {
    var r = App.el('article', 'sh-v' + (isSelf ? ' is-self' : ''));
    var head = App.el('div', 'sh-h');
    var nm = App.el('b', null, Q.name(v.s) + ' ' + App.ar(v.a));
    head.appendChild(nm);
    var full = Q.verse(v.s, v.a);
    var go = App.el('button', 'sh-go');
    go.type = 'button';
    go.textContent = 'صفحة ' + App.ar(full ? full.p : 0);
    go.onclick = function () {
      App.closeSheet();
      App.go('qpage', { p: full ? full.p : 1 });
    };
    head.appendChild(go);
    r.appendChild(head);
    /* نصُّ المصحفِ المدموجِ أولى من نصِّ المصدر: واحدٌ لا اثنان */
    r.appendChild(markAgainst(full ? full.t : v.t, refText));
    return r;
  }

  function groupCard(g) {
    var c = App.el('section', 'sh-g');
    if (g.kind) {
      var k = App.el('p', 'sh-k');
      k.textContent = g.kind;
      c.appendChild(k);
    }
    /* المرجعُ آيةُ الصفحةِ التي جئتَ منها إن كانت في المجموعة،
       وإلّا فأُولاها: الفرقُ يُقاس إلى ما تَحفظه الآن. */
    var ref = null, i;
    for (i = 0; i < g.verses.length; i++) {
      if (('' + g.verses[i].s + ':' + g.verses[i].a) === g.self) { ref = g.verses[i]; break; }
    }
    if (!ref) ref = g.verses[0];
    var rf = Q.verse(ref.s, ref.a);
    var refText = rf ? rf.t : ref.t;

    g.verses.forEach(function (v) {
      var isSelf = ('' + v.s + ':' + v.a) === ('' + ref.s + ':' + ref.a);
      c.appendChild(verseRow(v, isSelf, isSelf ? null : refText));
    });
    return c;
  }

  App.screen('shabih', function (params) {
    var gate = App.Packs && App.Packs.gate('المتشابهات', 'exam');
    if (gate) return gate;
    styleOnce();
    var p = (params && +params.p) || 0;
    var verses = p ? Q.page(p) : [];

    var w = App.el('div', 'screen sh');
    var h = App.el('div', 'sh-top');
    h.appendChild(App.el('b', 'h2', 'متشابهاتُ هذه الصفحة'));
    var sub = App.el('p', 'sh-sub');
    sub.textContent = 'قابِل بعينك قبل أن يَزِلّ لسانُك. المُعلَّمُ هو '
      + 'الكلمةُ التي تَفترق فيها الآيتان.';
    h.appendChild(sub);
    w.appendChild(h);

    var groups = [], seen = {};
    verses.forEach(function (v) {
      S.forVerse(v.s, v.a).forEach(function (g) {
        if (seen[g.id]) return;
        seen[g.id] = 1;
        groups.push(g);
      });
    });

    if (!groups.length) {
      var e = App.el('p', 'sh-none');
      e.textContent = 'ليس في هذه الصفحة ما يُشبه غيرَه مما أُحصي.';
      w.appendChild(e);
      return w;
    }

    groups.forEach(function (g) { w.appendChild(groupCard(g)); });
    return w;
  }, { full: true });

  var CSS = [
    '.sh-top{padding-block:2px 14px}',
    '.sh-sub{margin-top:6px;font-size:13px;line-height:1.8;color:var(--ink-mut)}',
    '.sh-g{margin-block-start:16px;padding:13px 14px;background:var(--surface);',
    '  border:1px solid var(--hair);border-radius:var(--r-lg)}',
    '.sh-k{margin-bottom:9px;font-size:11.5px;font-weight:800;color:var(--ink-faint)}',
    '.sh-v{padding-block:11px}',
    '.sh-v + .sh-v{border-top:1px solid var(--hair-2)}',
    '.sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;',
    '  margin-bottom:7px;font-size:12.5px;color:var(--ink-mut)}',
    '.sh-go{padding:3px 10px;border-radius:var(--r-pill);background:var(--surface-2);',
    '  color:var(--ink-mut);border:1px solid var(--hair);',
    '  font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}',
    '.sh-t{display:block;font-size:19px;line-height:2.3;color:var(--ink)}',
    /* الفرقُ يُعلَّم بالذهبِ لا بالأحمر: هذا تنبيهٌ لا خطأ */
    '.sh-d{background:var(--gold-soft);color:var(--gold-lit);',
    '  border-radius:5px;padding:0 3px;font-weight:700}',
    /* آيةُ الصفحةِ التي جئتَ منها: حافّةٌ تقول «هذه التي تَحفظُها» */
    '.sh-v.is-self{border-inline-start:3px solid var(--accent);',
    '  padding-inline-start:11px;margin-inline-start:-14px}',
    '.sh-none{margin-top:18px;font-size:13.5px;line-height:1.9;color:var(--ink-mut)}'
  ];

}(window.App));

/* ══ 66-find.js ══ */
/* ══ 66-find.js — البحثُ في المصحف ═══════════════════════════════
   الحافظُ يَعرف الآيةَ ولا يَعرف موضعَها: «أين ﴿وما أرسلناك إلا
   رحمة﴾؟». فالبحثُ هنا ليس ترفًا — هو الطريقُ من الآيةِ إلى صفحتها،
   ومن الصفحةِ إلى منهجٍ يُبنى عليها.

   ولا يَعبأ بالحركاتِ ولا بالفراغات: المصحفُ يَصِل «يَاأَيُّهَا»
   كلمةً واحدةً والطالبُ يَكتبها كلمتَين، ومن طلب المشكولَ تامًّا
   لم يَجد شيئًا. (التجريدُ في App.Quran.strip.) */
(function (App) {
  'use strict';

  var Q = App.Quran;
  var last = '';

  function styleOnce() {
    if (document.getElementById('fd-css')) return;
    var el = App.el('style');
    el.id = 'fd-css';
    el.textContent = CSS.join('\n');
    document.head.appendChild(el);
  }

  /* يُبرز موضعَ المطابقةِ في نصِّ الآية */
  function hilite(v) {
    var box = App.el('p', 'fd-t');
    if (!v.hit) { box.textContent = v.t; return box; }
    box.appendChild(document.createTextNode(v.t.slice(0, v.hit.from)));
    var m = App.el('mark', 'fd-m');
    m.textContent = v.t.slice(v.hit.from, v.hit.to);
    box.appendChild(m);
    box.appendChild(document.createTextNode(v.t.slice(v.hit.to)));
    return box;
  }

  function hit(v) {
    var c = App.el('button', 'fd-hit');
    c.type = 'button';
    var h = App.el('div', 'fd-h');
    h.appendChild(App.el('b', null, v.name + ' ' + App.ar(v.a)));
    h.appendChild(App.el('span', 'fd-p', 'صفحة ' + App.ar(v.p)));
    c.appendChild(h);
    c.appendChild(hilite(v));
    c.onclick = function () {
      App.closeSheet();
      App.go('qpage', { p: v.p });
    };
    return c;
  }

  App.screen('find', function () {
    var gate = App.Packs && App.Packs.gate('ابحث في المصحف', 'text');
    if (gate) return gate;
    styleOnce();
    var w = App.el('div', 'screen fd');

    var top = App.el('div', 'fd-top');
    top.appendChild(App.el('b', 'h2', 'ابحث في المصحف'));
    var sub = App.el('p', 'fd-sub');
    sub.textContent = 'اكتب ما تذكره من الآية — بلا تشكيلٍ إن شئت — '
      + 'تَجدها وتَجد صفحتَها.';
    top.appendChild(sub);
    w.appendChild(top);

    var bar = App.el('div', 'fd-bar');
    var inp = App.el('input');
    inp.type = 'search';
    inp.className = 'fd-in';
    inp.placeholder = 'آيةٌ أو بعضُها';
    inp.setAttribute('aria-label', 'نصُّ البحث');
    inp.value = last;
    bar.appendChild(inp);
    w.appendChild(bar);

    var out = App.el('div', 'fd-out');
    w.appendChild(out);

    function run() {
      var q = inp.value;
      last = q;
      out.innerHTML = '';
      var n = Q.strip(q).replace(/ /g, '');
      if (n.length < 2) {
        if (q) {
          var few = App.el('p', 'fd-note');
          few.textContent = 'اكتب حرفَين فأكثر.';
          out.appendChild(few);
        }
        return;
      }
      var res = Q.search(q, 40);
      var cap = App.el('p', 'fd-note');
      cap.textContent = res.length
        ? (res.length >= 40
            ? 'أكثرُ من أربعين موضعًا — زِد من الآيةِ ليَقِلّ العدد.'
            : App.ar(res.length) + (res.length === 1 ? ' موضع' : ' مواضع'))
        : 'لا شيء. راجع الكتابة، أو اكتب كلماتٍ متتاليةً من الآية.';
      out.appendChild(cap);
      res.forEach(function (v) { out.appendChild(hit(v)); });
    }

    /* يُؤجَّل قليلًا: ستّةُ آلافِ آيةٍ تُمسَح مع كلِّ حرفٍ وإلّا */
    var t = null;
    inp.oninput = function () {
      if (t) clearTimeout(t);
      t = setTimeout(run, 160);
    };
    if (last) run();
    setTimeout(function () { inp.focus(); }, 60);
    return w;
  }, { full: true });

  var CSS = [
    '.fd-top{padding-block:2px 12px}',
    '.fd-sub{margin-top:6px;font-size:13px;line-height:1.8;color:var(--ink-mut)}',
    '.fd-in{width:100%;min-height:48px;padding:11px 14px;',
    '  background:var(--surface);color:var(--ink);',
    '  border:1px solid var(--hair);border-radius:var(--r-lg);',
    '  font:inherit;font-size:16px}',   /* ١٦px فأكثر، وإلّا قرّب iOS الشاشة */
    '.fd-in:focus{outline:2px solid var(--accent);outline-offset:1px}',
    '.fd-note{margin:14px 2px 4px;font-size:12.5px;color:var(--ink-faint)}',
    '.fd-hit{display:block;width:100%;margin-block-start:10px;padding:12px 14px;',
    '  background:var(--surface);color:var(--ink);text-align:start;',
    '  border:1px solid var(--hair);border-radius:var(--r-lg);',
    '  font:inherit;cursor:pointer}',
    '.fd-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;',
    '  margin-bottom:6px;font-size:12.5px;color:var(--ink-mut)}',
    '.fd-p{color:var(--ink-faint)}',
    '.fd-t{font-size:18px;line-height:2.2;color:var(--ink)}',
    '.fd-m{background:var(--accent-soft);color:var(--accent);',
    '  border-radius:5px;padding:0 3px;font-weight:700}'
  ];

}(window.App));

/* ══ 67-samme.js ══ */
/* ══ 67-samme.js — سمِّع: التسميعُ الحُرّ ═══════════════════════════
   كان التسميعُ فعلًا لا يُبلَغ إلّا بصفحة: تَفتح المصحفَ، وتَنتقي
   خليّةً من ستّمئةٍ وأربع، وتَقرأ، ثمّ تَجد تحتَ اللوحِ «سمِّع هذه
   الصفحة». وهذا صحيحٌ في المنطقِ وخاطئٌ في المرتبة: التسميعُ هو
   ما جاء القارئُ من أجلِه، فلا يُجعَل ذيلًا لشاشةِ قراءة.

   قال صاحبُ التطبيق: «أريد في الصفحةِ الرئيسيّةِ أيقونةً اسمُها
   سمِّع، هي أهمُّ عندي من حلقتي — التسميعُ الحرُّ الذي ليس مربوطًا
   بمنهج.» فصار لسانًا من ألسنةِ الشريطِ السفليّ، وخرجت «حلقتي»
   إلى رأسِ «تقدُّمي» — والشريطُ خمسةٌ لا يَزيد: ستّةُ ألسنةٍ على
   عرضِ ٣٩٠ تُضيّق العمودَ عن «الإعدادات» فتَلتفّ الكلمةُ أو تُقَصّ.

   وهذه الشاشةُ سؤالان لا ثالثَ لهما:
     أيَّ موضعٍ تُسمِّع؟   ·   وكيف تُسمِّعه؟
   فالموضعُ سورةٌ ثمّ صفحةٌ من صفحاتها، والكيفُ طريقتان:
   سترٌ وكشفٌ باليد، أو سَردٌ بالصوتِ والصفحةُ تَتبعك.

   ولا رقمَ لاتينيًّا في قائمةٍ ولا في حقل: الصفحاتُ تُعرَض أسماءً
   مرقومةً بالهنديّة في ‎<option>‎، فلا يُحتاج إلى ‎input[number]‎
   وهو الذي يَفرض أرقامَ لوحةِ المفاتيح على عينِ القارئ. */
(function (App) {
  'use strict';

  var Q = App.Quran, ar = App.ar;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  /* ── ذاكرةُ الموضع ───────────────────────────────────────────
     مفتاحٌ أعلى مملوكٌ لهذه الوحدة، ويُسجَّل في ‎ownState‎ لئلّا
     يَحذفه الاستيرادُ بقائمتِه البيضاء. */
  function lastPage() {
    var s = App.state.samme;
    return (s && +s.p > 0 && +s.p <= 604) ? +s.p : 0;
  }
  function remember(p) {
    App.state.samme = { p: +p, at: App.dateKey() };
    App.save();
  }

  /* ── صفحاتُ السورة ──────────────────────────────────────────
     تُؤخَذ من آياتِها لا من حسابِ «أوّلُ التالية ناقصًا واحدًا»:
     الصفحةُ الواحدةُ تَحمل آخرَ سورةٍ وأوّلَ أخرى، فالحسابُ يُسقِط
     صفحةً مشتركةً من إحداهما. */
  function pagesOf(s) {
    var vs = Q.surah(s) || [], out = [], seen = {};
    for (var i = 0; i < vs.length; i++) {
      var p = vs[i].p;
      if (!seen[p]) { seen[p] = 1; out.push(p); }
    }
    return out;
  }

  /* ── صفحاتٌ فيها زلل ────────────────────────────────────────
     السجلُّ مفاتيحُه «سورة:آية»، والقارئُ يُسمِّع صفحةً لا آية.
     فتُجمَع الآياتُ على صفحاتها، وتُقدَّم الأكثرُ زللًا. */
  function slipPages() {
    var b = App.state.slips || {}, by = {}, k;
    for (k in b) {
      if (!b.hasOwnProperty(k)) continue;
      var r = b[k];
      if (!r || !(+r.n > 0)) continue;
      var kk = String(k).split(':');
      var v = Q.verse(+kk[0], +kk[1]);
      if (!v) continue;
      by[v.p] = (by[v.p] || 0) + 1;
    }
    var out = [];
    for (k in by) if (by.hasOwnProperty(k)) out.push({ p: +k, n: by[k] });
    out.sort(function (a, b2) { return b2.n - a.n || a.p - b2.p; });
    return out;
  }

  function ayaWord(n) {
    return n === 1 ? 'آيةٌ واحدة'
         : n === 2 ? 'آيتان'
         : n <= 10 ? ar(n) + ' آيات'
         : ar(n) + ' آية';
  }

  function placeLine(p) {
    return 'سورة ' + Q.name(Q.surahOf(p)) + ' · الجزء ' + ar(Q.juzOf(p));
  }

  /* ── الشاشة ─────────────────────────────────────────────────── */
  App.screen('samme', function () {

/* ══ 68-tasmee.js — التسميع ═══════════════════════════════════════
   كان التطبيقُ يُخطّط ويُسجّل ويُحصي، وبين «هذا وِردك» و«أتممتُه»
   لا شيء: فعلُ الحفظِ نفسُه غائبٌ من تطبيقِ حفظ. وقد صار المصحفُ
   بداخله نصًّا، فلا عُذر.

   وما يُصنَع في التسميعِ أربعةٌ لا خامسَ لها: يُستر الموضعُ،
   ويُستذكَر، ثمّ يُكشَف ليُقابَل، ثمّ يُحكَم على النفسِ فيه. فهذه
   الوحدةُ هذه الأربعةُ وحدَها: **ستر · استذكار · كشف · إقرار**.

   وثلاثةُ قراراتٍ تَحكُم شكلَها:

   ١ — آيةٌ واحدةٌ على الشاشة لا الصفحةُ كلُّها. الصفحةُ المستورُ
       بعضُها تُقرأ قراءةً: تَسبِق العينُ اللسانَ فيُظَنّ الاستذكارُ
       وما كان إلّا قراءة. والواحدةُ تُلزِم الحفظَ إلزامًا.

   ٢ — الكلمةُ المستورةُ يَبقى امتدادُها. الكفُّ على الصفحةِ تُخفي
       الحرفَ ولا تُخفي طولَ الكلمة، وذاك الطولُ عَونٌ صادقٌ يَعرفه
       كلُّ مَن سمّع بيدِه: به يُعرَف موضعُ الوقفِ وقَدرُ ما بقي.
       والبياضُ المحضُ ليس سترًا بل محوٌ يُربك.

   ٣ — «أصبتُ» و«زَلَلتُ» سِيّان في الشكلِ والوزن. لو كان أحدُهما
       أضخمَ أو أبهجَ صار الإقرارُ مُشترى، والتسميعُ على النفسِ لا
       يَغشّ فيه إلّا صاحبُه. ولا درجةَ ولا نقطةَ ولا نسبة. */
(function (App) {
  'use strict';

  var Q = App.Quran, ar = App.ar;

  /* الخطابُ يَعرف صاحبَه. ويُسأل عند النداءِ لا عند الضمِّ لأنّ
     الهويّةَ تَتبدّل من الإعداداتِ بعدَ أن تُضَمّ الوحدة. */
  function vg(m, f) {
    if (App.Words && App.Words.vg) return App.Words.vg(m, f);
    return (App.state.profile && App.state.profile.gender === 'f') ? f : m;
  }

  /* ورقةٌ نصفُها مستور — استعارةُ التسميعِ الصريحة: كفٌّ على الصفحة.
     وتُعرَّف هنا لا في معجمِ الأيقونات لأنّها أيقونةُ هذه الوحدةِ
     وحدَها، ومفتاحُها مُصدَّرٌ فلا يُزاحم مفتاحًا قائمًا. */
  App.defIcons({
    'tm-veil': '<path d="M5.4 12.4V4.4a1 1 0 0 1 1-1h8l4.2 4.2v4.8"/>' +
               '<path d="M14.2 3.5V8h4.6"/><path d="M8.4 7.7h3.4"/>' +
               '<rect x="3.2" y="15.1" width="17.6" height="5.5" rx="2"/>'
  });

  /* ═══ مِقدارُ الكشف ═══════════════════════════════════════════
     سلّمٌ من أربعِ درجاتٍ، أكثرُها كشفًا أوّلُها: فالمبتدئُ لا يَصلح
     له ما يَصلح للمتقن، ومَن حُجب عنه كلُّ شيءٍ قبل أوانه يَقِف
     ويَيأس. والنزولُ في السلّمِ هو التدرّجُ نفسُه.

     ودرجةُ «أوائلِ الكلمات» ليست زينةً: هي أقدمُ وسائلِ التسميعِ
     عند الحفّاظ، لأنّها تُعين على الترتيبِ ولا تُعين على اللفظ. */
  var RUNGS = [
    { t: 'نصفُها',         d: 'يَظهر النصفُ الأوّل' },
    { t: 'أوائلُ كلماتها', d: 'يَظهر أوّلُ كلِّ كلمة' },
    { t: 'أوّلُ كلمةٍ',    d: 'تَظهر الأولى وحدَها' },
    { t: 'مستورةٌ',        d: 'لا يَظهر حرف' }
  ];

  /* ═══ سجلُّ الزلل ══════════════════════════════════════════════
     ‎state.slips‎ وحدَها لهذه الوحدة: مفاتيحُها «سورة:آية» وقيمتُها
     ‎{n, at}‎ — ‎n‎ ما تبقّى من زلّاتٍ لم تُكفّرها إصابة، و‎at‎ يومُ
     آخرِها. ومعها مفتاحٌ واحدٌ لا نقطتَين فيه: ‎_veil‎ للدرجةِ
     المختارة، فلا تُسأل في كلِّ جلسة.

     ولماذا عَدَدٌ لا راية: الزللُ في موضعٍ مرّتَين ليس كالزللِ فيه
     مرّةً، والمتشابهاتُ تَعود. والإصابةُ تُنقص واحدًا ولا تَمحو
     السجلَّ: موضعٌ زُلّ فيه ثلاثًا يُطلَب له ثلاثُ إصابات. */
  function bag() {
    var S = App.state;
    if (!S.slips || typeof S.slips !== 'object') S.slips = {};
    return S.slips;
  }
  function vkey(v) { return v.s + ':' + v.a; }
  function slipOf(v) {
    var r = bag()[vkey(v)];
    return (r && +r.n > 0) ? +r.n : 0;
  }
  function markSlip(v) {
    var b = bag(), k = vkey(v);
    var r = (b[k] && typeof b[k] === 'object') ? b[k] : { n: 0 };
    r.n = Math.min(9, (+r.n || 0) + 1);
    r.at = App.dateKey(new Date());
    b[k] = r;
    App.save();
  }
  function markOk(v) {
    var b = bag(), k = vkey(v), r = b[k];
    if (!r) return;
    r.n = (+r.n || 0) - 1;
    /* أصاب الآيةَ كلَّها فقد أصاب كلَّ كلمةٍ فيها: تَنقص عدادُ كلِّ
       كلمةٍ واحدًا كما يَنقص عدادُ الآية. وما بَلغ الصفرَ سقط. */
    if (r.w) {
      var any = false, i;
      for (i in r.w) if (r.w.hasOwnProperty(i)) {
        r.w[i] = (+r.w[i] || 0) - 1;
        if (r.w[i] <= 0) delete r.w[i]; else any = true;
      }
      if (!any) delete r.w;
    }
    if (r.n <= 0 && !r.w) delete b[k];
    else { if (r.n < 0) r.n = 0; b[k] = r; }
    App.save();
  }

  /* ═══ الكلمةُ بعينها ═══════════════════════════════════════════
     كان الإقرارُ على الآيةِ كلِّها: «زَلَلتُ فيها». وأكثرُ الزللِ
     ليس في الآيةِ بل في كلمةٍ منها — لفظٌ يَلتبس بأخيه في موضعٍ
     آخر، أو مدٌّ يَسبق. فمن عَلِم موضعَ تعثّرِه بعينه أعاده، ومن
     عَلِم الآيةَ وحدَها أعاد ما يَعرفه معها.

     ولا تُطلَب الكلمةُ قبل الكشف: الإشارةُ إلى موضعِ الصعوبةِ وهو
     مستورٌ عَونٌ يُفسد الاستذكار. وبعد الكشفِ تُلمَس، فيَكون
     الإقرارُ على ما جرى لا على ما سيَجري.

     والعَدُّ كعَدِّ الآية: كلمةٌ زُلّ فيها ثلاثًا تُطلَب لها ثلاثُ
     إصابات. ولا تُرسَم على المسطّراتِ المستورةِ البتّة — إنّما
     تُرسَم على الكلمةِ مكشوفةً، فيَرى صاحبُها سِجِلَّه بعد أن
     يُحاسِب نفسَه لا قبلَه. */
  function wordsOf(v) {
    var r = bag()[vkey(v)];
    return (r && r.w && typeof r.w === 'object') ? r.w : null;
  }
  function wordSlip(v) {
    var w = wordsOf(v), i, n = 0;
    if (w) for (i in w) if (w.hasOwnProperty(i) && +w[i] > 0) n++;
    return n;
  }
  function markWords(v, idx) {
    if (!idx || !idx.length) return;
    var b = bag(), k = vkey(v);
    var r = (b[k] && typeof b[k] === 'object') ? b[k] : { n: 0 };
    if (!r.w || typeof r.w !== 'object') r.w = {};
    idx.forEach(function (i) {
      r.w[i] = Math.min(9, (+r.w[i] || 0) + 1);
    });
    r.at = App.dateKey(new Date());
    b[k] = r;
    App.save();
  }
  function rung() {
    var n = +bag()._veil;
    return (n >= 0 && n < RUNGS.length) ? n : 0;
  }
  function setRung(n) { bag()._veil = n; App.save(); }
  function slipsIn(verses) {
    return verses.filter(function (v) { return slipOf(v) > 0; });
  }

  /* ═══ الستر ════════════════════════════════════════════════════ */

  /* الحركاتُ تُطرح ولا تُوحَّد صورُ الألف: ‎Q.strip‎ تَرُدّ «أ» إلى «ا»
     وهو في البحثِ صوابٌ وفي أوائلِ الكلماتِ إتلافُ دليل. */
  var MARKS = /[ؐ-ًؚ-ٰٟۖ-ۭـ‍]/g;
  function bare(s) { return String(s).replace(MARKS, ''); }

  /* أوّلُ الكلمةِ حرفٌ، إلّا ما لا يَدلّ وحدَه: «ال» التعريفِ وواوُ
     العطفِ وفاؤه — فصفحةٌ كلُّها ألفاتٌ وواواتٌ لا تدلّ على شيء. */
  function head(word) {
    var b = bare(word), i = 0;
    if (!b) return '';
    if (b.charAt(0) === 'و' || b.charAt(0) === 'ف') i = 1;
    if (b.charAt(i) === 'ا' && b.charAt(i + 1) === 'ل') i += 1;
    return b.length > i + 1 ? b.slice(0, i + 1) : b;
  }

  function bar(word) {
    var e = App.el('span', 'tm-bar');
    /* العَرْضُ من عددِ الحروف: كلمةٌ قصيرةٌ لا تُستر بمِسطرةٍ طويلة */
    var n = Math.max(1, bare(word).length);
    e.style.width = Math.min(6.4, Math.max(1, n * 0.56)).toFixed(2) + 'em';
    e.setAttribute('aria-hidden', 'true');
    return e;
  }

  /* الآيةُ مستورةً على درجةٍ: كلماتٌ ظاهرةٌ ومسطّراتٌ مستورة.
     والمسطّرةُ بلا نصٍّ البتّة، فلا يَقرؤها قارئُ الشاشةِ هواءً. */
  function veilBox(v, r) {
    var box = App.el('div', 'tm-ayah tm-dim');
    var words = String(v.t).split(/\s+/).filter(Boolean);
    var half = Math.ceil(words.length / 2);
    words.forEach(function (word, i) {
      if (i) box.appendChild(document.createTextNode(' '));
      if (r === 1) {                                   /* أوائلُ الكلمات */
        var h = App.el('span', 'tm-h');
        h.textContent = head(word);
        box.appendChild(h);
        return;
      }
      var open = r === 0 ? i < half : (r === 2 ? i === 0 : false);
      if (open) box.appendChild(document.createTextNode(word));
      else box.appendChild(bar(word));
    });
    return box;
  }

  /* ‎pick‎ مصفوفةٌ تَجمع ما لُمِس. وبها تَصير كلُّ كلمةٍ زرًّا، ولا

  function fullBox(v, pick) {
    var box = App.el('div', 'tm-ayah');
    var was = wordsOf(v);

    words.forEach(function (word, i) {

      if (!pick) { box.appendChild(document.createTextNode(word)); return; }

    n.textContent = ar(v.a);
    box.appendChild(n);
    return box;
  }

  function wordWord(n) {
    if (n === 1) return 'كلمةٌ';
    if (n === 2) return 'كلمتان';
    if (n <= 10) return ar(n) + ' كلماتٍ';
    return ar(n) + ' كلمةً';
  }

  function ayatWord(n, gen) {
    if (n === 1) return gen ? 'آيةٍ واحدة' : 'آيةً واحدة';
    if (n === 2) return 'آيتَين';
    if (n <= 10) return ar(n) + ' آيات';
    return ar(n) + (gen ? ' آيةٍ' : ' آيةً');
  }

  /* ═══ الجلسة ═══════════════════════════════════════════════════ */
  App.screen('tasmee', function (params) {
    var gate = App.Packs && App.Packs.gate('التسميع', 'text');
    if (gate) return gate;
    styleOnce();
    var p = Math.max(1, Math.min(Q.TOTAL_PAGES, (params && +params.p) || 1));
    var all = Q.page(p);
    var only = !!(params && params.only === 'slips');
    var list = only ? slipsIn(all) : all.slice();
    /* الحارسُ يَزور كلَّ شاشةٍ بلا وسائطَ، وقد تُطلَب «ما زُلّ فيه»
       وقد كُفّر: فلا تُترك الجلسةُ فارغةً — تُفتح الصفحةُ كلُّها. */
    if (!list.length) { list = all.slice(); only = false; }

    var at = 0, open = false, over = !list.length;
    var slips = [], hits = 0, words = 0;

    var w = App.el('div', 'screen tm');

    /* ── الترويسة: مِن أين أنت، ومَخرجٌ واحدٌ ── */
    var top = App.el('div', 'tm-top');
    var tt = App.el('div', 'tm-tt');
    var t1 = App.el('b', 'tm-sur');
    t1.textContent = Q.pageSurahs(p).map(function (s) { return s.name; }).join(' · ');
    tt.appendChild(t1);
    var t2 = App.el('div', 'tm-meta');
    /* يُقدَّم اسمُ الفعلِ على الموضع: الصفحةُ معلومةٌ ممّا جاء منه،
       والذي يُسأل عنه عندَ النظرةِ الأولى «ما هذه الشاشة؟» */
    t2.textContent = App.join(only ? 'ما زُلّ فيه' : 'تسميع', 'صفحة ' + ar(p));
    tt.appendChild(t2);
    top.appendChild(tt);
    var quit = App.el('button', 'btn btn-quiet btn-sm tm-quit');
    quit.type = 'button';
    quit.textContent = 'إنهاء';
    quit.onclick = function () { finish(); };
    top.appendChild(quit);
    w.appendChild(top);

    /* موضعٌ تَنزل فيه طرائقُ تسميعٍ أخرى — كما تَنزل على صفحةِ
       المصحف. وأوّلُها السردُ بالصوت: قال صاحبُ التطبيقِ وهو في
       هذه الشاشةِ «هذه الطريقةُ القديمة»، وكانت الجديدةُ في ملفٍّ
       لا يَبلغه أحد. فصارت تُعرَض ههنا بجوارها. */
    var slot = App.el('div', 'tm-slot');
    w.appendChild(slot);
    App.emit('tasmee', { p: p, slot: slot, verses: list });

    /* ── الموضعُ من الجلسة: خبرٌ لا درجة ── */
    var posWrap = App.el('div', 'tm-pos');
    var posT = App.el('span', 'tm-pos-t');
    posWrap.appendChild(posT);
    var track = App.el('div', 'progress');
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', 'الموضعُ من الجلسة');
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');
    var fill = App.el('div', 'progress-fill');
    track.appendChild(fill);
    posWrap.appendChild(track);
    w.appendChild(posWrap);

    /* ── سلّمُ الكشف: مَخرجُ مَن وقف، فلا يُحتاج زرُّ «أعِنّي» ── */
    var rungBox = App.el('div', 'tm-rungs');
    var rl = App.el('p', 'tm-rl');
    rl.id = 'tm-rl';
    rl.textContent = 'مِقدارُ الكشف';
    rungBox.appendChild(rl);
    var rrow = App.el('div', 'tm-rrow');
    rrow.setAttribute('role', 'radiogroup');
    rrow.setAttribute('aria-labelledby', 'tm-rl');
    var rbtns = RUNGS.map(function (g, i) {
      var b = App.el('button', 'chip tm-chip');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.textContent = g.t;
      b.onclick = function () { setRung(i); paint(); };
      rrow.appendChild(b);
      return b;
    });
    rungBox.appendChild(rrow);
    var rhint = App.el('p', 'tm-rh');
    rungBox.appendChild(rhint);
    w.appendChild(rungBox);

    var stage = App.el('div', 'tm-stage');
    w.appendChild(stage);

    paint();
    return w;

    /* ── الرسم: المسرحُ وحدَه يُعاد، فلا يَقفز ما تحتَ الإصبع ── */
    function paint() {
      var r = rung();
      rbtns.forEach(function (b, i) {
        b.classList.toggle('on', i === r);
        b.setAttribute('aria-checked', i === r ? 'true' : 'false');
        b.tabIndex = i === r ? 0 : -1;
      });
      rhint.textContent = RUNGS[r].d;
      stage.innerHTML = '';

      if (over) {
        rungBox.hidden = true; posWrap.hidden = true; quit.hidden = true;
        stage.appendChild(closing());
        return;
      }

      posT.textContent = 'الآية ' + ar(at + 1) + ' من ' + ar(list.length);
      var pct = Math.round((at / list.length) * 100);
      fill.style.width = pct + '%';
      track.setAttribute('aria-valuenow', String(pct));

      var v = list[at];
      /* الآيةُ المسبوقةُ تُذكَر بأوّلِها خافتًا: مَن يُسمّع يَحتاج أن
         يَعرف موضعَه، وذلك لا يَكشف عن الآيةِ الحاضرةِ شيئًا. */
      if (at > 0) {
        var prv = App.el('p', 'tm-prev');
        prv.textContent = String(list[at - 1].t);
        stage.appendChild(prv);
      }

      /* الزللُ السابقُ يُكشَف له دَرَجةً: العَونُ حيث الضعفُ، وهذه
         ثمرةُ السجلّ لا زينتُه. ويُقال صريحًا فلا يُظَنّ عَبَثًا. */
      var eff = r, had = slipOf(v);
      if (had && eff > 0) eff = eff - 1;

      var card = App.el('div', 'tm-card');
      var cap = App.el('div', 'tm-cap');
      cap.textContent = Q.name(v.s) + ' ' + ar(v.a);
      card.appendChild(cap);

      if (open) {
        var pick = [];
        card.appendChild(fullBox(v, pick));
        var tip = App.el('p', 'tm-pick');
        tip.textContent = vg('إن تعثّرتَ في كلمةٍ فالمسْها.',
                             'إن تعثّرتِ في كلمةٍ فالمسيها.');
        card.appendChild(tip);
        if (v.sajda) {
          var sj = App.el('span', 'tm-sajda');
          sj.textContent = 'سجدة';
          card.appendChild(sj);
        }
        stage.appendChild(card);
        stage.appendChild(judge(v, pick));
      } else {
        var btn = App.el('button', 'tm-reveal');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'اكشِف الآية ' + ar(v.a));
        btn.appendChild(veilBox(v, eff));
        var hint = App.el('span', 'tm-hint');
        hint.innerHTML = App.icon('tm-veil', 16);
        hint.appendChild(App.el('span', null,
          vg('استذكِرها ثمّ المسْ لتَكشف', 'استذكريها ثمّ المسي لتَكشفي')));
        btn.appendChild(hint);
        btn.onclick = function () { open = true; paint(); };
        card.appendChild(btn);
        if (had && eff < r) {
          var nt = App.el('p', 'tm-note');
          nt.textContent = vg('كُشِف أكثرُ: زَلَلتَ فيها قبلُ.',
                              'كُشِف أكثرُ: زَلَلتِ فيها قبلُ.');
          card.appendChild(nt);
        }
        stage.appendChild(card);
      }
    }

    /* ── الإقرار: زرّان متساويان، ولا ثالثَ يُغري بالتهرّب ── */
    function judge(v, pick) {
      var row = App.el('div', 'tm-judge');
      var a = App.el('button', 'btn tm-j tm-j-ok');
      a.type = 'button';
      a.textContent = 'أصبتُ';
      /* مَن لمَس كلماتٍ ثمّ قال «أصبتُ» فقد بدا له: يُؤخَذ بقولِه
         الآخرِ ويُطرَح اللمس. ولا يُعارَض إقرارُ المرءِ على نفسِه. */
      a.onclick = function () { markOk(v); hits++; next(); };
      var b = App.el('button', 'btn tm-j tm-j-slip');
      b.type = 'button';
      b.textContent = 'زَلَلتُ';
      b.onclick = function () {
        markSlip(v);
        markWords(v, pick);
        if (pick && pick.length) words += pick.length;
        if (slips.indexOf(v) < 0) slips.push(v);
        next();
      };
      row.appendChild(a);
      row.appendChild(b);
      return row;
    }

    function next() {
      open = false;
      if (at + 1 >= list.length) { finish(); return; }
      at++;
      paint();
      /* الآيةُ الطويلةُ تُنزِل العينَ إلى أسفلِها، فتُستقبَل التاليةُ
         من وسطِها. والصحيفةُ تُردّ إلى أوّلِها فيَرجع سلّمُ الكشفِ
         والموضعُ إلى المَرأى مع مَطلعِ الآية. */
      var sh = document.getElementById('sheet');
      if (sh) sh.scrollTop = 0; else window.scrollTo(0, 0);
    }

    function finish() { over = true; paint(); }

    /* ── الختام: ما صَنَعتَه، وأينَ زَلَلت، وما يُفعَل به الآن ── */
    function closing() {
      var box = App.el('div', 'tm-end');
      var seen = hits + slips.length;
      var h = App.el('b', 'h2');
      h.textContent = seen
        ? vg('سمّعتَ ', 'سمّعتِ ') + ayatWord(seen) + '.'
        : 'لم يُسمَّع شيءٌ بعد.';
      box.appendChild(h);

      var s = App.el('p', 'tm-end-s');
      if (!seen) {
        s.textContent = vg('ارجِع إلى الصفحةِ متى شئت.',
                           'ارجعي إلى الصفحةِ متى شئتِ.');
      } else if (!slips.length) {
        s.textContent = 'مضت بلا زَلل.';
      } else {
        s.textContent = vg('زَلَلتَ في ', 'زَلَلتِ في ')
          + ayatWord(slips.length, true)
          + (words ? '، و' + wordWord(words) + ' بعينها' : '')
          + '، وهي مُسجَّلةٌ لتُعاد.';
      }
      box.appendChild(s);

      /* المواضعُ تُسمّى واحدًا واحدًا: «ثلاثُ آيات» لا تَدلّ على
         موضعٍ، والاسمُ والرقمُ يَدلّان. وصفوفٌ تُقرأ ولا تُلمس. */
      if (slips.length) {
        var ul = App.el('ul', 'tm-list');
        slips.forEach(function (v) {
          var li = App.el('li', 'tm-li');
          var k = App.el('b', 'tm-li-k');
          k.textContent = Q.name(v.s) + ' ' + ar(v.a);
          li.appendChild(k);
          /* وههنا ثمرةُ اللمس: الكلمةُ التي تعثّر فيها تَبين في
             سياقها لا في قائمةٍ مجرّدة — فالكلمةُ وحدَها لا تُحفَظ،
             وإنّما تُحفَظ في موضعِها من الآية. */
          var tx = App.el('span', 'tm-li-t');
          var mk = wordsOf(v);
          String(v.t).split(/\s+/).filter(Boolean).forEach(function (word, i) {
            if (i) tx.appendChild(document.createTextNode(' '));
            if (mk && +mk[i] > 0) {
              var em = App.el('b', 'tm-li-w');
              em.textContent = word;
              tx.appendChild(em);
            } else tx.appendChild(document.createTextNode(word));
          });
          li.appendChild(tx);
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }

      var acts = App.el('div', 'tm-acts');
      if (slips.length) {
        acts.appendChild(act('أعِد ما زَلَلتُ فيه', 'btn-pri', function () {
          App.go('tasmee', { p: p, only: 'slips' });
        }));
      }
      /* «أعِد الصفحة» تُعرَض حيث لا زَلل: الزللُ له إعادتُه الأخصّ،
         وأربعةُ أفعالٍ في ختامٍ واحدٍ تُشتّت مَن فرغ لتوّه. */
      else if (seen) {
        acts.appendChild(act('أعِد الصفحة', 'btn-pri',
          function () { App.go('tasmee', { p: p }); }));
      }
      if (p < Q.TOTAL_PAGES) {
        acts.appendChild(act('سمِّع الصفحةَ التالية', 'btn-ghost', function () {
          App.go('tasmee', { p: p + 1 });
        }));
      }
      acts.appendChild(act('إلى الصفحة', 'btn-quiet', function () {
        App.go('qpage', { p: p });
      }));
      box.appendChild(acts);
      return box;
    }

    function act(label, kind, fn) {
      var b = App.el('button', 'btn ' + kind + ' btn-block');
      b.type = 'button';
      b.textContent = label;
      b.onclick = fn;
      return b;
    }
  }, { full: true });

  /* ═══ المدخل: من صفحةِ المصحفِ حيث يَعمل ═════════════════════
     ولا مدخلَ من الشريطِ السفليّ: التسميعُ ليس قسمًا يُزار بل فعلٌ
     يُفعَل بصفحةٍ بعينِها، ولا معنى له بلا صفحة. */
  App.on_('qpage', function (d) {
    if (!d || !d.slot || !d.verses || !d.verses.length) return;
    styleOnce();
    var box = App.el('div', 'tm-entry');
    var b = App.el('button', 'btn btn-pri btn-block');
    b.type = 'button';
    b.innerHTML = App.icon('tm-veil', 19);
    b.appendChild(App.el('span', null, 'سمِّع هذه الصفحة'));
    b.onclick = function () { App.go('tasmee', { p: d.p }); };
    box.appendChild(b);

    var sl = slipsIn(d.verses);
    if (sl.length) {
      var n = App.el('p', 'tm-entry-n');
      n.textContent = vg('زَلَلتَ قبلُ في ', 'زَلَلتِ قبلُ في ')
        + ayatWord(sl.length, true) + ' منها.';
      box.appendChild(n);
      var b2 = App.el('button', 'btn btn-ghost btn-block');
      b2.type = 'button';
      b2.textContent = 'سمِّع ما زَلَلتُ فيه';
      b2.onclick = function () { App.go('tasmee', { p: d.p, only: 'slips' }); };
      box.appendChild(b2);
    }
    /* في رأسِ ما تحتَ الصفحةِ لا في ذيلِه. كان يُلحَق آخرًا فيَقع
       تحتَ لوحِ التلاوةِ وطولُه خمسُ مئةِ بكسل — أي بعدَ الطَّيِّ
       بمئةٍ وخمسةٍ وسبعين — فلا يَراه إلّا من مَرَّ بالسمعِ كلِّه
       ليَصِل إلى السرد. وظنَّ صاحبُ التطبيقِ أنّ التسميعَ الحرَّ
       غيرُ موجود، وهو موجودٌ منذ حين — وما لا يُرى كالذي ليس.

       والترتيبُ يَحكي المرتبة: أن تَسرُد من حفظك أوّلُ ما يُطلَب في
       تطبيقِ حفظ، والاستماعُ عَونٌ عليه. فليَكن السردُ أوّلًا. */
    d.slot.insertBefore(box, d.slot.firstChild);
  });

  function styleOnce() {
    if (document.getElementById('tm-css')) return;
    var el = App.el('style');
    el.id = 'tm-css';
    el.textContent = CSS.join('\n');
    document.head.appendChild(el);
  }

  var CSS = [

    '.tm-entry-n{margin-block-start:2px;font-size:12.5px;line-height:1.7;',

       المتصفّح، فالعنصرُ «المخفيُّ» يَبقى مرئيًّا. تُعلَن صراحةً. */

    '.tm-rh{font-size:12px;color:var(--ink-mut)}',

    /* ── المسرح ──
       البطاقةُ أرضُ الآيةِ وحدَها: ما حولَها هادئٌ لأنّ الاستذكارَ

    /* النصُّ فسيحُ السطرِ لأنّ الحركاتِ تَعلو وتَسفُل، ومبدوءٌ من

    '.tm-bar{display:inline-block;height:.6em;border-radius:var(--r-sm);',

    '  background:color-mix(in srgb, var(--ink-faint) 26%, transparent)}',
    '.tm-h{color:var(--ink);font-weight:700}',
    '.tm-dim .tm-h{letter-spacing:0}',
    '.tm-sajda{display:inline-block;margin-block-start:8px;padding:1px 9px;',
    '  border-radius:var(--r-pill);background:var(--accent-soft);',
    '  color:var(--accent);font-size:11.5px;font-weight:800}',

    /* زرُّ الكشف: البطاقةُ كلُّها هدفُ لمسٍ، فلا يُطلَب تصويبُ إصبعٍ
       على زرٍّ صغيرٍ في أثناءِ التسميع. */
    '.tm-reveal{display:block;width:100%;text-align:start;',
    '  background:none;border:0;font:inherit;color:inherit;cursor:pointer;',
    '  padding:0;min-height:var(--tap)}',
    '.tm-hint{display:flex;align-items:center;gap:7px;margin-block-start:14px;',
    '  font-size:12.5px;font-weight:600;color:var(--ink-mut)}',
    '.tm-hint .ico{flex:none;color:var(--ink-mut)}',
    '.tm-slot:not(:empty){margin-block:4px 10px}',
    '.tm-note{margin-block-start:8px;font-size:12px;color:var(--ink-mut)}',
