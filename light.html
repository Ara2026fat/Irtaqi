/* ══ 15-theme.css ══ */
/* ═══════════════════════════════════════════════════════════════════
   الهويّتان البصريّتان · اللونُ والحرفُ والحقل
   ───────────────────────────────────────────────────────────────────
   الشكوى كانت: «الألوانُ كئيبة»، و«المربّعاتُ دفترُ رياضيّات»، و«نريد
   الحافظَ سعيدًا مبتهجًا». وهذه شكوى صحيحةٌ لها سببٌ **مقيس**، لا ذوق:

   اللوحُ القديمُ كان يَدفع كلَّ لونٍ إلى ٦:١ و٧:١ والحدُّ ٤٫٥:١. ومن
   دفع لونًا فوقَ حدِّه بدرجتَين فقد أخذ من بهجتِه ولم يُعطِ قارئَه
   شيئًا: اللونُ يُظلم ليَزيد تباينًا لا يُحتاج. فكان الذهبُ ‎#7C5A0E‎
   — وهو أصفرُ داكنٌ أي **زيتونيّ** في العين، لونُ طينٍ لا لونُ ذهب —
   وكان المميّزُ غابةً سوداء. والكآبةُ منهما لا من السّمة.

   فالعملُ كلُّه: ردُّ كلِّ لونٍ إلى حدِّه الحقيقيِّ بهامشٍ يكفي،
   وإنفاقُ ما وُفِّر على **التشبُّع والدفء** لا على الظُّلمة.
     · الذهبُ نُقل من ٤٢° (زيتونيّ) إلى ٣٣° (نُحاسيّ كارَميليّ).
     · الأنواعُ الأربعةُ فُرِّقت في الرماد لا في اللون وحدَه.
     · حقلُ الضوء صار **رحلةَ لونٍ** من فجرٍ أبيضَ في أعلى الصفحة
       إلى رملٍ دافئٍ في قدمِها — لا بقعةَ وهجٍ واحدة.

   والأرضُ ليست لونًا واحدًا بل طبقاتٌ تتراكب، فلا يكفي أن يُقاس
   اللونُ على ‎--ground‎ مجرّدةً: قِيس كلُّ لونٍ هنا على **ستَّ عشرةَ
   بقعةً** — كلُّ تراكبٍ ممكنٍ لطبقاتِ الحقلِ الأربعِ المُلوِّنة —
   وعلى السطحَين، في الحالات الأربع: (طالب·طالبة) × (نهار·ليل).
   أدنى ما مرَّ به نصٌّ ٤٫٥٦:١، وأدنى ما مرَّ به نصٌّ على رقعةِ نوعِه
   ٤٫٧٧:١، والحدُّ ٤٫٥. لا لونَ هنا اختير بالعين.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* ما لا يتبدّل بالهويّة.
     وأُضيئت الثلاثةُ عن سابقتها لأنّ السطحَ الثاني ارتفع درجتَين:
     الحذفُ كان ٤٫٤٢:١ عليه — دون الحدّ — ونصُّ الحذفِ أولى الناسِ
     بأن يُقرأ. وهي الآن ٦٫٠٨ و٦٫٥٦ و٥٫٤٨ على أدنى سطح. */
  --ok:#4ACB97; --warn:#EDB253; --danger:#FA8E84;
  --wa:#25D366;                      /* أخضر واتساب — علامةٌ تجاريّةٌ لا تُبدَّل */
  --wa-deep:#075E54;                 /* أخضرُها الداكنُ، لحافّةِ النهار ورمزِه */
  --ease:cubic-bezier(.32,.9,.36,1);
  --fast:.14s; --mid:.26s; --slow:.5s;
  --pad:18px;
  --tap:44px;                        /* أدنى هدفِ لمس */
  --nav-h:68px;
  --maxw:560px;

  /* لمعةُ الحافّةِ العليا — ظِلٌّ لا لون.
     كانت تُسمّى ‎--lift‎ وكانت هنا **لونًا**، والهيكلُ يَطلبها ظِلًّا في
     ثلاثةَ عشرَ موضعًا (‎box-shadow:…,var(--lift)‎). واللونُ في موضعِ
     الظِّلِّ يُبطِل التصريحَ كلَّه، فكانت بطاقاتُ التطبيقِ **بلا ظلٍّ
     البتّة** — وذاك نصفُ ما يُقرأ «بَردًا»: أسطحٌ لا ترتفع. فتُركت
     ‎--lift‎ ظِلًّا كما يَطلبها الهيكل، وانتقل حقلُ الضوء إلى أسماءٍ
     خاصّةٍ به أدناه. */
  --lift:inset 0 1px 0 0 var(--hair-2);
}

/* ── هويّةُ الطالب: ليلٌ زمرّديٌّ وذهب، زوايا أضيق ── */
html[data-id="m"]{
  --ground:#07191B;  --surface:#0F2A2E;  --surface-2:#17393E;
  --ink:#EAF6F3;     --ink-mut:#A3BFBB;  --ink-faint:#8FA8A5;
  --accent:#3FDCBC;  --accent-2:#22B49C; --accent-soft:rgba(63,220,188,.20);
  --gold:#F2CC80;    --gold-lit:#FBE4B4; --gold-soft:rgba(242,204,128,.20);
  --on-accent:#03201D;
  --hair:rgba(234,246,243,.12); --hair-2:rgba(234,246,243,.06);
  /* الزاويةُ جزءٌ من المِزاج: ضيّقةٌ تقول صرامةً، وواسعةٌ تقول لِينًا.
     وُسِّعت درجتَين عن القديم لأنّ الهيبةَ لا تُطلَب من الحادّ. */
  --r-lg:22px; --r-md:15px; --r-sm:11px; --r-pill:999px;
}
/* ── هويّةُ الطالبة: أُرجوانٌ وذهبٌ ورديّ، زوايا أوسع ── */
html[data-id="f"]{
  --ground:#191320;  --surface:#241B2C;  --surface-2:#31253C;
  --ink:#F6EEF6;     --ink-mut:#BCA9BE;  --ink-faint:#AF9DAD;
  --accent:#E39BCB;  --accent-2:#C372AA; --accent-soft:rgba(227,155,203,.20);
  --gold:#EFBE94;    --gold-lit:#F9D8BC; --gold-soft:rgba(239,190,148,.20);
  --on-accent:#1A1220;
  --hair:rgba(246,238,246,.12); --hair-2:rgba(246,238,246,.06);
  --r-lg:28px; --r-md:20px; --r-sm:14px; --r-pill:999px;
}

/* ═══════════════════════════════════════════════════════════════════
   السِّمةُ الفاتحة — وهي الأصل
   ───────────────────────────────────────────────────────────────────
   الفاتحُ هو ما يراه الطالبُ أوّلَ مرّةٍ وأكثرَ الوقت، فهو موضعُ
   الحُكم. وفيه ضاقَ الأمرُ من قبل: الأبيضُ الخالصُ ‎#FFFFFF‎ للبطاقات
   فوق رماديٍّ كريميّ — وهو مِزاجُ عيادةٍ لا مِزاجُ مصحف. فصار الورقُ
   دافئًا ‎#FFFCF4‎ على رملٍ ‎#FAF4E6‎: ورقٌ فوق رمل، لا قُصاصةٌ فوق رماد.
   ═══════════════════════════════════════════════════════════════════ */
html[data-mode="light"]{
  /* مقيسةٌ على أدكنِ بقعةٍ في حقلِ الضوء لا على الورقِ وحدَه:
     ٥٫٥١ و٥٫٢٠ و٥٫٧٦ — لا على ٤٫٤ التي كانت تُفلت هناك. */
  --ok:#176A47; --warn:#855312; --danger:#B3261E;
  /* الهيكلُ يُثبّت ‎color-scheme:dark‎ على الجذرِ بلا شرط، فتخرج
     أشرطةُ التمرير وعناصرُ النظامِ داكنةً فوق ورقٍ فاتح. والسِّمةُ
     محورُ هذا الملفِّ فالتصحيحُ فيه. */
  color-scheme:light;

  /* الظِّلُّ يُولَّد في الهيكل من **لون الأرضيّة** — وهذا صوابٌ في
     الليلِ حيث الأرضُ سوداء، وقلبٌ للمعنى في النهارِ حيث الأرضُ
     كريميّة: فيخرج «ظِلٌّ» أفتحُ ممّا يقع عليه، أي ضوءٌ تحت البطاقة.
     وبه كانت البطاقاتُ لا ترتفع عن الورقِ ولو رُسم ظلُّها. فمصدرُ
     الظِّلِّ في النهارِ هو المِدادُ لا الأرض، ويبقى في عائلة اللون. */
  --shade-1:color-mix(in srgb, var(--ink) 10%, transparent);
  --shade-2:color-mix(in srgb, var(--ink) 15%, transparent);
  --shade-3:color-mix(in srgb, var(--ink) 22%, transparent);
}
html[data-mode="light"][data-id="m"]{
  --ground:#FAF4E6;  --surface:#FFFCF4;  --surface-2:#F7F0E0;
  --ink:#13322B;     --ink-mut:#48605A;  --ink-faint:#566A64;
  --accent:#087054;  --accent-2:#05573F; --accent-soft:rgba(8,112,84,.14);
  --gold:#985605;    --gold-lit:#7A4404; --gold-soft:rgba(152,86,5,.12);
  --on-accent:#FFFFFF;
  --hair:rgba(19,50,43,.15); --hair-2:rgba(19,50,43,.075);
}
html[data-mode="light"][data-id="f"]{
  --ground:#FDF5F9;  --surface:#FFFCFD;  --surface-2:#FAEFF5;
  --ink:#2E1B2A;     --ink-mut:#5B4255;  --ink-faint:#6E5569;
  --accent:#9C3474;  --accent-2:#7E2A5D; --accent-soft:rgba(156,52,116,.14);
  --gold:#9E4D27;    --gold-lit:#7F3D1F; --gold-soft:rgba(158,77,39,.12);
  --on-accent:#FFFFFF;
  --hair:rgba(46,27,42,.15); --hair-2:rgba(46,27,42,.075);
}

/* ═══════════════════════════════════════════════════════════════════
   حقلُ الضوء — الأرضُ ضوءٌ لا ورق
   ───────────────────────────────────────────────────────────────────
   لا نقشَ ولا شبكةَ مربّعات. النقشُ المتكرّرُ الذي لا يقول شيئًا ليس
   زينةً بل ضجيجٌ مُهذَّب، وشبكةُ المربّعاتِ تَستدعي دفترَ الرياضيّات
   استدعاءً لا فكاكَ منه فتُصغّر التطبيقَ إلى واجبٍ بيتيّ.

   والبهجةُ في النهار لا تُشترى بخفضِ الأرض: كلُّ ما يَطلي الأرضَ
   يَطلي النصَّ الذي عليها. قِيست عشراتُ التركيباتِ فتبيّن أنّ وهجًا
   مُشبَعًا بشفافيّةٍ عاليةٍ يُسقط المميّزَ والذهبَ تحت الحدّ. فالحيلةُ
   أن تكون الرحلةُ **في درجة اللون لا في مقدار الضوء**: فجرٌ أبيضُ في
   الصدر، ومسحةُ مشمشٍ على اليمين، ونَفَسٌ من نَعناعِ الهويّةِ على
   اليسار، وقرارٌ دافئٌ عند القدم — وكلُّها في مستوًى واحدٍ من اللمعان،
   فالعينُ ترى رحلةً والمقياسُ لا يرى هبوطًا.

   وست طبقاتٍ لا ثلاث، وفي صدرِ الضوء نواةٌ وهالة: الوهجُ بغير نواةٍ
   ضبابٌ يُولَّد آليًّا، وبنواةٍ يصير **مطلعَ فجرٍ** له موضعٌ يُقصَد.
   وترتيبُها من فوقُ إلى تحتُ هو معنى «ارتقِ» نفسُه: الأرضُ تَصعَد. */

/* ── الحَبّة ──
   التدرّجُ وحدَه سطحٌ لدائنيّ: نظيفٌ مَيتٌ تتخلّله حُزَمٌ (banding) على
   الشاشات الرخيصة. وحبّةٌ رقيقةٌ فوقَه تُعطي إحساسَ مادّةٍ لا شاشة.
   ولا يصلح فيها ‎overlay‎: يَحفَظ شديدَ البياضِ وشديدَ السوادِ على
   حالهما وأرضانا طرفان، فيخرج أثرُه صفرًا مقيسًا. فعلى الورقِ
   ‎multiply‎ — ذرّاتٌ تُغمّق كحَبّ الورق؛ وفي الليلِ ‎screen‎ — ذرّاتٌ
   تُضيء كحَبّ الفِلم. */
:root{
  --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.03"/></feComponentTransfer></filter><rect width="180" height="180" filter="url(%23g)"/></svg>');
  --grain-blend:screen;
}
/* الورقُ يَبتلع الحَبّةَ ضربًا أكثرَ ممّا يَبتلعها السوادُ شفًّا،
   فضُبطت على حدةٍ حتّى يستويَ أثرُهما. وخُفّضت عن ‎.09‎ إلى ‎.055‎
   لأنّ الضربَ يُغمّق الأرضَ وقد صار هامشُ الألوانِ أضيقَ عمدًا. */
html[data-mode="light"]{
  --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer></filter><rect width="180" height="180" filter="url(%23g)"/></svg>');
  --grain-blend:multiply;
}

/* طبقاتُ الحقل. ‎--dawn‎ نواةُ الفجر و‎--crest‎ هالتُه، و‎--warm‎ مسحةُ
   الورقِ مُزاحةٌ عن المحورِ قصدًا فلا يستوي الجانبان استواءَ المولَّد،
   و‎--aura‎ نَفَسُ الهويّةِ من الجهة المقابلة، و‎--settle‎ قرارُ الأرض. */
html[data-id="m"]{
  --dawn:rgba(63,220,188,.06);
  --crest:rgba(63,220,188,.08);
  --warm:rgba(242,204,128,.055);
  --aura:rgba(46,142,158,.06);
  --settle:rgba(0,0,0,.34);
}
html[data-id="f"]{
  --dawn:rgba(227,155,203,.06);
  --crest:rgba(227,155,203,.08);
  --warm:rgba(239,190,148,.055);
  --aura:rgba(138,106,176,.07);
  --settle:rgba(0,0,0,.32);
}
/* في النهار ينقلب معنى الطبقات: الفجرُ **يُضيء** فلا يأكل من تباينِ
   النصّ شيئًا — بل يَزيده — والدفءُ والهالةُ تدرّجان في اللون لا في
   اللمعان، والقرارُ أخفُّ ما يكون. */
html[data-mode="light"][data-id="m"]{
  --dawn:rgba(255,255,253,.35);
  --crest:rgba(255,255,253,.45);
  --warm:rgba(255,231,200,.34);
  --aura:rgba(228,249,239,.32);
  --settle:rgba(138,107,60,.04);
}
html[data-mode="light"][data-id="f"]{
  --dawn:rgba(255,254,255,.35);
  --crest:rgba(255,254,255,.45);
  --warm:rgba(255,226,216,.34);
  --aura:rgba(253,236,250,.32);
  --settle:rgba(122,80,104,.04);
}

/* الحقلُ يُرسَم هنا لا في الهيكل: الزخرفةُ من هذا الملفّ، وطبقاتُها
   ستٌّ لا أربع. و‎html:root‎ أرفعُ خصوصيّةً من ‎html‎ فتَغلب مهما كان
   ترتيبُ الضمّ. وهي على الجذرِ لا على الجسد: خلفيّةُ الجذرِ هي خلفيّةُ
   اللوحة، تمتدّ تحت الشدِّ الزائدِ في iOS، و‎fixed‎ عليها أرخصُ ما يكون. */
html:root{
  background-color:var(--ground);
  background-image:
    var(--grain),
    /* طبقةُ الموسم. ساكنةٌ طولَ العامِ (‎transparent‎ احتياطُ ‎var‎)
       فلا تُكلّف الرسمَ شيئًا، وتَنطق في موسمها وحدَه. وهي **سابعة**
       لا سادسة: كلُّ قوائمِ ‎background-*‎ أدناه زيدت معها سطرًا،
       ولو نُسي واحدٌ منها لانزاحت الطبقاتُ كلُّها عن أدوارها. */
    radial-gradient(900px 420px at 50% -8%, var(--sea, transparent), transparent 74%),
    radial-gradient(460px 240px at 50% -4%,  var(--dawn),   transparent 70%),
    radial-gradient(1180px 560px at 50% -14%, var(--crest),  transparent 72%),
    radial-gradient(820px 680px at 88% 22%,  var(--warm),   transparent 66%),
    radial-gradient(760px 640px at 6% 64%,   var(--aura),   transparent 70%),
    linear-gradient(to top, var(--settle) 0%, transparent 34%);
  background-repeat:repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  background-size:180px 180px, auto, auto, auto, auto, auto, auto;
  background-attachment:fixed, fixed, fixed, fixed, fixed, fixed, fixed;
  background-blend-mode:var(--grain-blend), normal, normal, normal, normal, normal, normal;
}
/* الصحيفةُ تُغطّي الحقلَ فتَفقد الغرفةُ ضوءَها تحتها؛ فلها صدرُها
   الخاصّ — أخفتُ، لأنّها سطحٌ مرفوعٌ لا أرضٌ موضوعة. */
html #sheet{
  background-image:
    radial-gradient(900px 420px at 50% -10%, var(--crest), transparent 70%);
  background-repeat:no-repeat;
  background-attachment:local;
}

/* ═══════════════════════════════════════════════════════════════════
   هويّةُ كلِّ نوعِ منهج
   ───────────────────────────────────────────────────────────────────
   الحفظُ والمراجعةُ والتلاوةُ والتثبيتُ كانت أربعةَ ألوانٍ **رمادُها
   واحد**: ٩٦ و٨٥ و٩٨ و٩٤ من ٢٥٥ — أي أربعةٌ تَؤول إلى لونٍ واحدٍ عند
   من لا يرى اللون، ومدًى كلُّه ثلاثَ عشرةَ درجة. واللونُ الذي لا
   ينفع إلّا مُبصِرَه ليس تمييزًا بل زينة.

   فصار التمييزُ على ثلاثة محاور معًا:
     ١ · درجةُ اللون — أربعُ درجاتٍ متباعدةٌ على الدائرة.
     ٢ · **الرماد** — سُلّمٌ مقصودٌ مداه ٣٥ درجةً في النهار و٤٤ في
         الليل، وأدنى فارقٍ بين جارَين ١٠ و١٢.
     ٣ · رقعةُ النوع — شفافيّةٌ مختلفةٌ لكلِّ نوعٍ تُضاعف السُّلّمَ
         نفسَه في اتّجاهِه، فتختلف الرقاعُ رمادًا كما تختلف الدرجات.
   والزوجُ الذي ينهار عند عمى الأحمر والأخضر — الذهبيُّ والأخضر —
   وُضِع على **طرفَي** السُّلّم: ٣٥ درجةَ رمادٍ بينهما في النهار و٤٤
   في الليل. فلا يلتبسان ولو ذهب اللونُ كلُّه.

   وألوانُ الأنواعِ واحدةٌ في الهويّتَين قصدًا: لونُ النوعِ يقول «هذا
   حفظ»، ولونُ الهويّةِ يقول «هذا أنت» — ولو تبدّل الأوّلُ بالثاني
   لضاع المعنيان. ولونُ الحفظِ هو ذهبُ اللوحِ نفسُه عمدًا — الحفظُ هو
   الفعلُ الذهبيّ — ولو أُعطي لونًا خامسًا لصار في الشاشة ذهبان لا
   يُعرف فرقُهما. */
:root{
  --k-hifz:#F2CC80;    --k-hifz-dim:rgba(242,204,128,.20);
  --k-tilawa:#82CFEF;  --k-tilawa-dim:rgba(130,207,239,.18);
  --k-review:#B4A8F3;  --k-review-dim:rgba(180,168,243,.16);
  --k-tathbit:#63B689; --k-tathbit-dim:rgba(99,182,137,.14);
}
/* على الورقِ يَنقلب السُّلّمُ رأسًا على عقب — الأفتحُ في الليل هو
   الأدكنُ في النهار — لأنّ المقروءَ هو الفارقُ لا اللمعانُ نفسُه. */
html[data-mode="light"]{
  --k-hifz:#985605;    --k-hifz-dim:rgba(152,86,5,.10);
  --k-tilawa:#0C6279;  --k-tilawa-dim:rgba(12,98,121,.13);
  --k-review:#533BA8;  --k-review-dim:rgba(83,59,168,.16);
  --k-tathbit:#134B2B; --k-tathbit-dim:rgba(19,75,43,.19);
}
/* صنفٌ يُلبَس للبطاقة أو الصفّ فيَرِث كلُّ ما بداخله لونَ نوعه */
.k-hifz   { --kind:var(--k-hifz);    --kind-dim:var(--k-hifz-dim) }
.k-review { --kind:var(--k-review);  --kind-dim:var(--k-review-dim) }
.k-tilawa { --kind:var(--k-tilawa);  --kind-dim:var(--k-tilawa-dim) }
.k-tathbit{ --kind:var(--k-tathbit); --kind-dim:var(--k-tathbit-dim) }
/* احتياطٌ لئلّا يَسقط لونٌ إن نُسي الصنف */
:root{ --kind:var(--accent); --kind-dim:var(--accent-soft) }

/* ═══════════════════════════════════════════════════════════════════
   صوتُ الحرف
   ───────────────────────────────────────────────────────────────────
   لا خطَّ يُحمَّل — لا شبكةَ — فالشخصيّةُ تُصنَع من الوزنِ والإيقاعِ
   والتباعد وحدَها. والعربيّةُ تَقبل من ذلك ما لا تَقبله اللاتينيّة
   وتَرفض ما تَقبله:

     · ‎letter-spacing‎ **محرَّم**: يَقطع وصلاتِ الحرف فتصير الكلمةُ
       حروفًا منثورة. ولا يُكتب هنا ولو صفرًا.
     · ‎word-spacing‎ مباحٌ ونافع: الفرجةُ بين الكلماتِ لا بين الحروف،
       وهي أداةُ الوقارِ في العنوانِ والوضوحِ في الحاشية.
     · الارتفاعُ السطريُّ هو مِقوَدُ الصوت: العنوانُ يَضيق فيُقرأ
       منقوشًا، والمتنُ يتّسع فيُقرأ متمهّلًا.

   فثلاثةُ أصوات: عنوانٌ منقوشٌ، ومتنٌ متمهّلٌ، وحاشيةٌ مُفرَّجةٌ أثقلُ
   وزنًا لتَصمد في حجمها الصغير. ولا يُمَسُّ حجمُ خطٍّ هنا — المقاييسُ
   في الهيكلِ ولصاحبِه — بل إيقاعُها وحدَه. */
html .h1{ line-height:1.2;  word-spacing:.05em }
html .h2{ line-height:1.3;  word-spacing:.04em; font-weight:700 }
html .h3{ line-height:1.45; word-spacing:.03em }
html .body{ line-height:1.75 }
html .small{ word-spacing:.06em }
html .cap{ word-spacing:.08em }

/* ولا شيءَ من هذا يُستثنى من تقليل الحركة — لأنّه ليس حركةً أصلًا. */

/* ═══════════════════════════════════════════════════════════════════
   تنفُّسُ اليوم — أن يَعرف المصحفُ متى هو
   ───────────────────────────────────────────────────────────────────
   شكلُ التطبيقِ عند الفجرِ كان شكلَه في الحاديةَ عشرةَ ليلًا، وشكلُه
   في رمضانَ شكلَه في شوّال. وذاك في تطبيقِ قرآنٍ فقدُ أثمنِ ما يُملَك:
   الحافظُ يَفتح مصحفَه في السَّحَرِ وفي الأصيلِ وفي جوفِ الليل، ويَعرف
   الفرقَ بين هذه الأوقاتِ معرفةً جسديّةً لا تُعلَّم. فإن لم يَعرفها
   مصحفُه عُدَّ غائبًا عن صاحبه.

   وأربعةُ حدود: السادسةُ صباحًا، والثالثةُ بعد الظهر، والسادسةُ
   مساءً، والرابعةُ فجرًا. ساعةُ الجهازِ وحدَها — لا موقعَ ولا شبكةَ
   ولا إذن. وحدودٌ ثابتةٌ تُخطئ المغربَ بنصفِ ساعةٍ في الصيفِ أهونُ
   بما لا يُقاس من إذنِ موقعٍ يُطلَب من قارئِ قرآن.

   ── ما يتبدّل وما لا يتبدّل ──
   **الهويّةُ لا تَتنفّس.** الأخضرُ أخضرُ في السَّحَرِ والأصيل، والذهبُ
   ذهبٌ، والمِدادُ مِدادٌ، وألوانُ الأنواعِ الأربعةِ كما قِيست. ولو
   مالَ المميّزُ مع الساعةِ لصار لونُ «الحفظ» لونَين في يومٍ واحد،
   فانتُقضت الدلالةُ التي بُنيت عليها الشاشاتُ كلُّها.
   فالذي يَميل **حقلُ الضوءِ وحدَه**: الأرضُ، وصدرُها، وهالتُها،
   ودفؤها، وقرارُها عند القدم. أي حرارةُ الغرفةِ لا أثاثُها.

   **والسطحانِ لا يَميلان** — ‎--surface‎ و‎--surface-2‎ — وهذا قرارٌ
   مقيسٌ لا تورُّع: أسطحُ البطاقاتِ صَمّاءُ فلا يَبلغها الحقلُ أصلًا
   (الحقلُ على الجذرِ والبطاقةُ لونٌ صريحٌ فوقَه)، فكلُّ نصٍّ على
   بطاقةٍ يَبقى على تباينِه المقيسِ مهما مال الحقل. وأضيقُ نصٍّ في
   التطبيقِ — رقعةُ «حفظ»، ٤٫٨٤:١ وحدُّها ٤٫٥ — على ‎--surface-2‎
   بعينِها؛ فتَدكينُها ثلاثَ درجاتٍ يَأكل الهامشَ كلَّه. وأدنى ما
   على الأرضِ ٦٫١٥:١ (سطرُ التاريخ)، أي أنّ للأرضِ من الهامشِ أضعافَ
   ما للسطح. فأُنفِق الفرقُ حيث هو موفورٌ وتُرك حيث هو ضنين.
   والنتيجةُ صادقةٌ بصريًّا أيضًا: الورقةُ على المكتبِ تَبقى ورقةً،
   والذي يَصفَرّ ويَزرَقّ هو ضوءُ الغرفةِ حولَها.

   ── ولا يَتنفّس الوضعُ الداكن ──
   وافقتُ صاحبَ التكليف، ولي سببٌ ثانٍ غيرُ سببِه: مَن اختار الليلَ
   اختار سكونًا واحدًا — هذا سببُه، وهو كافٍ. والثاني مقيس: هامشُ
   التباينِ في الليلِ أضيقُ منه في النهار، لأنّ الطبقاتَ تُضيء أرضًا
   سوداءَ فكلُّ زيادةِ ضوءٍ تَخصِم من مِدادٍ فاتح؛ وفي تلك الإضاءاتِ
   المنخفضةِ لا تُرى ميلةُ اللونِ أصلًا. فالثمنُ مقيسٌ والربحُ معدوم.

   والقسمةُ من ذلك سطرٌ واحدٌ لا استثناءَ فيه: **ما كان ضوءًا فهو
   في النهارِ وحدَه، وما كان خبرًا فهو في الوضعَين.** فأوجهُ اليومِ
   ولمسةُ الجمعةِ وسَهَرُ العشرِ — كلُّها ضوءٌ — لا تَمسّ أرضَ الليل
   البتّة؛ وسِجِلُّ رمضانَ وختمُ العشرِ — وهما خبر — يَظهران للفريقَين
   سواء. ورمضانُ واقعةٌ في تقويمِ القارئِ لا ذوقٌ في شاشته، ومنعُ
   الخبرِ عمّن اختار الليلَ عيبٌ لا تحفُّظ.
   ═══════════════════════════════════════════════════════════════════ */

/* الطبقاتُ تَسري ولا تَقفز. ومن غيرِ ‎@property‎ لا يَسري متغيّرٌ
   مخصَّصٌ البتّة — يُبدَّل دَفعةً — فيَرى مَن فتح التطبيقَ عند الحدِّ
   قفزةَ لونٍ في أرضِه. والتسجيلُ يُعطي المتغيّرَ نوعًا فيُدرِك
   المتصفّحُ أنّه **لونٌ** يُمزَج لا نصٌّ يُستبدَل.
   وما لا يَعرف ‎@property‎ يَتجاهل القاعدةَ ويُبدّل دَفعةً: نَقصُ
   سلاسةٍ لا نَقصُ وظيفة. */
@property --ground { syntax:'<color>'; inherits:true; initial-value:#FAF4E6 }
@property --dawn   { syntax:'<color>'; inherits:true; initial-value:transparent }
@property --crest  { syntax:'<color>'; inherits:true; initial-value:transparent }
@property --warm   { syntax:'<color>'; inherits:true; initial-value:transparent }
@property --aura   { syntax:'<color>'; inherits:true; initial-value:transparent }
@property --settle { syntax:'<color>'; inherits:true; initial-value:transparent }
@property --sea    { syntax:'<color>'; inherits:true; initial-value:transparent }

/* ثانيةٌ وربعٌ: دونها يُقرأ تبديلًا، وفوقها يُقرأ عطلًا في الرسم.
   والتبدُّلُ يقع مرّةً في أربعِ ساعاتٍ وسطًا، فلا ثمنَ لمدّةٍ سخيّة. */
@media (prefers-reduced-motion:no-preference){
  html{
    transition:
      --ground 1250ms var(--ease), --dawn 1250ms var(--ease),
      --crest  1250ms var(--ease), --warm 1250ms var(--ease),
      --aura   1250ms var(--ease), --settle 1250ms var(--ease),
      --sea    1250ms var(--ease);
  }
}
/* وتحت الهدوءِ لا سَرَيان: الحدُّ يُعبَر دَفعةً ولا حركةَ البتّة.
   والهيكلُ يَقصُر كلَّ مدّةٍ إلى ‎0.01ms‎، وهذا أصرحُ منه هنا. */
@media (prefers-reduced-motion:reduce){
  html{ transition:none }
}

/* ═══ القانونُ الحاكمُ للأوجهِ الأربعة ═══
   **لا وجهَ أدكنُ من وجهِ النهار.** الميلةُ في درجةِ اللونِ وحدَها
   وإضاءةُ الأرضِ مساويةٌ أو أرفع. وهذا ليس احتياطًا بل قياسٌ:
   أضيقُ عنصرٍ في التطبيقِ كلِّه رقعةُ «نصفُها» في شاشة التسميع
   (‎button.chip.tm-chip.on‎) — مميَّزٌ على ‎--accent-soft‎ فوق الأرضِ
   **عاريةً**، لا فوق بطاقة — وهي في لوحِ النهارِ الأصليِّ **٤٫٥١:١**
   وحدُّها ٤٫٥. أي أنّ للأرضِ في هويّةِ الطالبِ هامشًا قدرُه مئةُ جزءٍ
   من الواحد، فخفضُ إضاءتِها درجةً واحدةً يُسقطها.
   جُرّب أوّلًا وجهُ ليلٍ أرضُه ‎#F2ECDE‎ — أدكنُ بثماني درجات —
   فقرأت الرقعةُ ‎٤٫٢١:١‎، وأسقط الحارسُ البناءَ مأخذَين. وهذا هو
   القانونُ الذي كتبه صاحبُ هذا الملفِّ في صدرِه بعينه: «الرحلةُ في
   درجة اللون لا في مقدار الضوء». فأُعيدت الأوجهُ كلُّها عليه.
   والمقيسُ بعد الإعادة، في كلِّ شاشةٍ وفي الهويّتَين:
     النهارُ ٤٫٥١ · السَّحَرُ ٤٫٦٠ · الأصيلُ ٤٫٦٦ · الليلُ ٤٫٦٠
   أي أنّ كلَّ وجهٍ يَتنفّس **أسلمُ** من اللوحِ الذي كان.

   ═══ فخٌّ ثانٍ: قدمُ الصفحةِ ليست كصدرِها ═══
   شريطُ التنقّلِ شفّافٌ بـ‎backdrop-filter:blur(18px) saturate(1.3)‎،
   أي أنّه **يُعيد رسمَ ما تحتَه** مُشبَّعًا. وحين وُضعت أرضٌ زرقاءُ
   تحتَه تفرّقت بكسلاتُ الطمسِ على عشراتِ القيمِ المتقاربةِ بدل قيمةٍ
   واحدة (المنوالُ هبط من ٨٨ بكسلًا إلى ٢٣)، فصار **منوالُ** صندوقِ
   الأيقونةِ هو هالةَ تنعيمِها لا أرضَها، وقرأ الحارسُ ١٫٨٣:١ على
   أيقونةٍ تباينُها الحقيقيُّ ٥٫٧. جُرّبت اثنتا عشرةَ أرضًا باردةً
   فسقطت كلُّها، وعشرُ أرضٍ دافئةٍ فنجت كلُّها — فالمسألةُ في
   التشبُّعِ تحت الطمس، لا في درجةِ اللون.
   فالقاعدةُ المستخلَصة: **البردُ في السماءِ لا في الأرض.** يُحمَل
   ميلُ السَّحَرِ في ‎--dawn‎ و‎--crest‎ — وهما في صدرِ الصفحةِ بعيدًا
   عن الشريط — وتَبقى الأرضُ والهالةُ والقرارُ قريبةً من النهار.
   وهذا أصدقُ بصريًّا أيضًا: السماءُ هي التي تَزرقّ قبل الفجر، لا
   الورقةُ التي في يدك.

   ── ١ · السَّحَر ──
   ضوءٌ باردٌ عالٍ لم تَدفأ فيه الأرضُ بعد: الصدرُ أزرقُ الميلِ وهو
   **أقوى** ما يكون (الفجرُ فجرٌ)، والدفءُ يَنسحب فلا يكاد يُرى،
   والأرضُ محايدةٌ رفيعةُ الإضاءة. والقرارُ في هويّةِ الطالبةِ هو
   قرارُ النهارِ نفسُه بلا تبديل — ذاك ما نجا من الفخِّ أعلاه. */
html[data-breath="sahar"][data-mode="light"][data-id="m"]{
  --ground:#F7F8F4;
  --dawn:rgba(228,246,255,.56);
  --crest:rgba(196,228,250,.60);
  --warm:rgba(255,242,222,.10);
  --aura:rgba(192,224,246,.48);
  --settle:rgba(56,84,116,.05);
}
html[data-breath="sahar"][data-mode="light"][data-id="f"]{
  --ground:#FAF7F8;
  --dawn:rgba(234,244,255,.56);
  --crest:rgba(206,224,252,.58);
  --warm:rgba(255,240,236,.10);
  --aura:rgba(236,238,252,.40);
  --settle:rgba(122,80,104,.04);
}

/* ── ٢ · النهار ──
   وجهُ النهارِ هو اللوحُ كما قِيس في هذا الملفِّ أعلاه، ولا يُكتب له
   هنا تصريحٌ واحد. وهذا قصدٌ لا تقصير: النهارُ أكثرُ الأوجهِ ساعاتٍ
   وأكثرُها نظرًا، فلا يُعرَّض لِما يَنقضه. والسِّمةُ تَرِثه بغير وسم،
   فمَن أطفأ التنفُّسَ رجع إليه هو. */

/* ── ٣ · الأصيل ──
   الضوءُ يَطول ويَصفرّ: الدفءُ يَغلب على اليمينِ غلبةً مقصودة —
   وهي جهةُ الشمسِ المائلةِ في الحقلِ أصلًا — والقرارُ يَثقل كظلٍّ
   يَمتدّ. والأرضُ ذهبٌ عالي الإضاءة، لا ذهبٌ داكن: فالأصفرُ وحدَه
   من الألوانِ الدافئةِ يَبلغ إضاءةَ العاجِ ويُقرأ دفئًا، لأنّ
   الأخضرَ — وهو ثلاثةُ أرباعِ الإضاءةِ المحسوبة — يَبقى مرفوعًا
   فيه. ولو طُلب برتقاليٌّ حقيقيٌّ لَلزم خفضُ الأخضرِ وسقطت الرقعة. */
html[data-breath="aseel"][data-mode="light"][data-id="m"]{
  --ground:#FFF8DC;
  --dawn:rgba(255,252,238,.32);
  --crest:rgba(255,244,214,.46);
  --warm:rgba(255,201,138,.50);
  --aura:rgba(253,232,196,.32);
  --settle:rgba(150,104,40,.07);
}
html[data-breath="aseel"][data-mode="light"][data-id="f"]{
  --ground:#FFF2EC;
  --dawn:rgba(255,250,246,.32);
  --crest:rgba(255,240,230,.46);
  --warm:rgba(255,204,184,.46);
  --aura:rgba(253,224,228,.32);
  --settle:rgba(148,76,74,.065);
}

/* ── ٤ · الليل (على الورقِ لا في الظُّلمة) ──
   مَن اختار النهارَ وفتح في الحاديةَ عشرةَ ليلًا لا يُقلَب عليه
   اللوحُ — ذاك اختيارٌ لا يُصادَر. والليلُ لا يُقال هنا بالظُّلمةِ
   لأنّ الظُّلمةَ محجوزةٌ عن الأرضِ بالقياسِ أعلاه، فيُقال **بإطفاءِ
   السماء**: ‎--dawn‎ و‎--crest‎ — نواةُ الفجرِ وهالتُه — تَهبطان من
   ‎.35/.45‎ إلى ‎.12‎، فيَذهب الوهجُ الذي يَعلو كلَّ شاشةٍ في النهارِ
   ويُقرأ «سماء»، ويَبقى دفءٌ واطئٌ وقرارٌ ثقيلٌ عند القدم: ورقةٌ
   تحت مِصباحٍ في غرفةٍ لا نافذةَ فيها.
   وهو **أخفتُ الأوجهِ الأربعةِ فرقًا** بإقرارٍ لا باختيار: مع تثبيتِ
   الإضاءة، لم يَبقَ من الاتّجاهاتِ المميَّزةِ إلّا الأزرقُ (للسَّحَر)
   والأصفرُ (للأصيل) والحِياد (للنهار)، فنصيبُ الليلِ عاجٌ دافئٌ
   مسطَّحٌ بينها. ولو رُفع تباينُ رقعةِ التسميعِ في موضعِها لَأمكن
   أن يَنزل هذا الوجهُ فيَصير ليلًا حقًّا.
   وقرارُه ‎.055‎ لا ‎.095‎: جُرّب الأثقلُ فأوقع فخَّ الشريطِ الشفّافِ
   المذكورَ أعلاه في هويّةِ الطالبة، والفرقُ بين القدرَين لا يُرى. */
html[data-breath="night"][data-mode="light"][data-id="m"]{
  --ground:#FFF6E0;
  --dawn:rgba(255,248,230,.12);
  --crest:rgba(253,245,228,.12);
  --warm:rgba(250,226,188,.30);
  --aura:rgba(252,236,212,.26);
  --settle:rgba(118,88,46,.095);
}
html[data-breath="night"][data-mode="light"][data-id="f"]{
  --ground:#FFF6F0;
  --dawn:rgba(255,250,248,.12);
  --crest:rgba(253,245,244,.12);
  --warm:rgba(250,222,214,.30);
  --aura:rgba(250,230,238,.26);
  --settle:rgba(118,80,100,.055);
}

/* ═══════════════════════════════════════════════════════════════════
   الموسم
   ───────────────────────────────────────────────────────────────────
   ثلاثُ درجاتٍ لا درجةٌ واحدة، وكلٌّ بأداةٍ تُناسب قدرَها:

     · **الجمعة** لمسةٌ في الضوءِ وحدَها — يومٌ يَتكرّر اثنتَين
       وخمسين مرّةً في العام، فلو نُصب له إعلانٌ صار الإعلانُ أثاثًا.
     · **رمضان** سِجِلٌّ يُقرأ: شريطٌ مسطورٌ يَعلو الشاشةَ يَنطق
       بالشهرِ وبموضعِ القارئِ من عشراته. وهو في الوضعَين كلَيهما.
     · **العشرُ الأواخر** تَزيد على السِّجِلِّ **شيئًا لا يُرى إلّا
       فيها**: ختمُ الهالةِ كاملًا بلُبِّه ومِحوره في الشريط — في
       الوضعَين — وسَهَرٌ ذهبيٌّ في صدرِ الصفحةِ في النهار: طبقةٌ
       سابعةٌ ساكنةٌ ثلاثَ مئةٍ وأربعًا وخمسين ليلةً من السنة.

   ولا فانوسَ ولا هلالَ متلألئ. سكينةُ التطبيقِ هي هويّتُه، وأوّلُ
   ما يَنقضها زخرفةٌ موسميّةٌ تُعلِن نفسَها. والشكلُ الموسميُّ الوحيدُ
   مشتقٌّ من ‎App.Rosette‎ — مَوتيفِ التطبيقِ الواحد — فلا يُزاحمه
   شكلٌ ثانٍ يُحفَظ بلا سبب.
   ═══════════════════════════════════════════════════════════════════ */

/* والقاعدةُ الجامعةُ لطبقةِ الموسمِ سطرٌ واحد: **الأرضُ لا تَتبدّل
   في الوضعِ الداكنِ البتّة — لا بساعةٍ ولا بموسم.** فكلُّ ما دونَه
   مشروطٌ بـ‎[data-mode="light"]‎، والداكنُ يَنال الموسمَ من السِّجِلِّ
   وختمِه لا من أرضِه. وبه يَستقيم القولُ ولا يُستثنى منه شيء.
   أمّا رفعُ ‎--sea‎ في الليلِ فجُرِّب وتُرك: الذهبُ الفاتحُ على أرضٍ
   سوداءَ لا يُرى إلّا إذا بلغ قدرًا يَخصم من مِدادٍ فاتحٍ فوقه. */

/* ── الجمعة ──
   لمسةٌ واحدة: نَفَسٌ من لونِ الهويّةِ في صدرِ الصفحة — نَعناعٌ عند
   الطالبِ وبنفسَجٌ عند الطالبة — كأنّ ضوءَ الصباحِ أصفى قليلًا.
   وجُرّب البياضُ الخالصُ أوّلًا (‎rgba(255,255,255,.22)‎) فخرج أثرُه
   ثلاثَ درجاتٍ مقيسةً من ٢٥٥، أي لا شيء: الحقلُ أبيضُ أصلًا في
   صدرِه، والبياضُ فوق البياضِ عدم. فالميلةُ في **درجةِ اللون** كما
   هو قانونُ هذا الملفِّ كلِّه، لا في مقدارِ الضوء. */
html[data-season~="friday"][data-mode="light"][data-id="m"]{ --sea:rgba(206,238,226,.30) }
html[data-season~="friday"][data-mode="light"][data-id="f"]{ --sea:rgba(232,222,246,.30) }

/* ── سَهَرُ العشرِ الأواخر ──
   ذهبٌ في صدرِ الصفحةِ كضوءِ قِنديلٍ على أعلى الورقة، وهو **أقوى
   ما في الموسمِ كلِّه** لأنّه عشرُ ليالٍ من ثلاثِ مئةٍ وأربعٍ وخمسين.
   ويَغلب لمسةَ الجمعةِ إن اجتمعتا — ترتيبُ المَلفِّ هو الحَكَم، وهو
   ترتيبٌ مقصود: جمعةُ العشرِ الأواخرِ عشرٌ أواخرُ قبل أن تكون جمعة. */
html[data-season~="vigil"][data-mode="light"][data-id="m"]{ --sea:rgba(255,234,180,.44) }
html[data-season~="vigil"][data-mode="light"][data-id="f"]{ --sea:rgba(255,228,200,.44) }

/* ══ 20-shell.css ══ */
/* ═══════════════════════════════════════════════════════════════════
   الهيكلُ العامّ ومعجمُ العناصر
   ───────────────────────────────────────────────────────────────────
   هذا الملفُّ هو اللغةُ البصريّةُ كاملةً: كلُّ وحدةٍ تبني شاشتَها من
   هذه الأصناف ولا تكتب لنفسها لونًا ولا ظلًّا ولا نصفَ قطر. وإنّما
   وُحِّدت هنا لأنّ عشرَ وحداتٍ تُكتب على التوازي، ولو ترك لكلِّ وحدةٍ
   ذوقُها لخرج التطبيقُ عشرةَ تطبيقات.

   ثلاثُ قواعدَ لا تُخالَف في هذا الملفّ:
     ١ · لا لونَ حرفيًّا — رموزُ ‎15-theme.css‎ وحدَها، فالهويّتان
         تتبدّلان بـ‎html[data-id]‎ ولا يُعاد النظرُ في شيء.
     ٢ · الفصلُ بالارتفاع والفراغ لا بالحدود — إطارٌ ذهبيٌّ حول كلّ
         شيءٍ يُشبه قوالبَ قديمة، فالشعيرةُ لا تُرسم إلّا عند حدٍّ حقيقيّ.
     ٣ · ‎inset-inline‎ و‎padding-inline‎ لا ‎left/right‎ — الصفحةُ
         ‎rtl‎ وما لا ينعكس يكسِر القراءة.
   ═══════════════════════════════════════════════════════════════════ */

/* ── رموزٌ مشتقّةٌ من الهويّة ──
   الظلُّ يُولَّد من لون الأرضيّة نفسِها لا من أسودَ ثابت: فوق أرضيّةٍ
   أرجوانيّةٍ يبدو الأسودُ الخالصُ ثقبًا، وهذا يبقى في عائلة اللون. */
:root{
  --shade-1:color-mix(in srgb, var(--ground) 42%, transparent);
  --shade-2:color-mix(in srgb, var(--ground) 72%, transparent);
  --shade-3:color-mix(in srgb, var(--ground) 92%, transparent);
  /* ارتفاعُ اللمعة العليا: حرفٌ رقيقٌ من المداد يُحدّد أعلى السطح
     بلا إطار، فتُقرأ الحافّةُ من الضوء لا من الخطّ. */
  --lift:inset 0 1px 0 0 var(--hair-2);

  /* الأميريُّ أوّلًا، وخطُّ الجهازِ احتياطُه. ولا يُسجَّل الأميريُّ
     إلّا حين يُفتَح التطبيقُ من رابطٍ (انظر 08-amiri.js)، فمَن فتحه
     من قرصِه نزل إلى الاحتياطِ بلا خطأٍ ولا طلبِ شبكة. */
  --font:'Amiri', system-ui, -apple-system, 'Segoe UI', 'Noto Naskh Arabic',
         'Noto Kufi Arabic', 'Geeza Pro', 'Dubai', 'Tajawal', Tahoma, sans-serif;

  /* إيقاعٌ رأسيٌّ واحدٌ لكلّ الشاشات، فلا تختلف المسافاتُ بين وحدةٍ وأخرى. */
  --gap-xs:6px; --gap-sm:10px; --gap:14px; --gap-lg:20px; --gap-xl:28px;
}

/* ═════════ ١ · الأساس ═════════ */

*,*::before,*::after{ box-sizing:border-box }

/* الهوامشُ تُصفَّر هنا مرّةً: لو تُركت لتصفّرها كلُّ وحدةٍ لتناقضت. */
html,body,h1,h2,h3,h4,p,ul,ol,li,figure,fieldset,legend{ margin:0; padding:0 }
ul,ol{ list-style:none }

html{
  /* ── حقلُ الضوء ──
     مُسنَدٌ كاملًا إلى 15-theme.css، لأنّ الحقلَ لونٌ والهويّةُ تملك
     اللون. وكان هنا نسخةٌ ثانيةٌ منه تَستعمل ‎--lift‎ لونًا، و‎--lift‎
     رمزُ ظِلٍّ معرَّفٌ أعلاه ومستعمَلٌ في خمسةَ عشرَ موضعًا — فلمّا
     أُعيد تعريفُه لونًا بَطَل كلُّ ‎box-shadow‎ فيه، وصار التطبيقُ بلا
     ظلٍّ البتّة: ‎getComputedStyle(.card).boxShadow === "none"‎ مقيسًا.
     وذلك نصفُ ما كان يُقرأ بَردًا — أسطحٌ لا ترتفع عن أرضها.
     فلا تُعرَّف ألوانُ الحقلِ هنا، ولا يُسمّى رمزٌ باسمٍ مأخوذ. */
  color-scheme:dark;
  -webkit-text-size-adjust:100%;
  /* الأرقامُ العربيّةُ الهنديّةُ متفاوتةُ العرض في خطوط النظام، فالأعمدةُ
     والنسبُ ترتجف بين إطارٍ وإطار. التثبيتُ عامٌّ لا موضعيّ. */
  font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum' 1;
}

body{
  position:relative;
  min-height:100dvh;
  /* شفّافٌ عمدًا: الأرضُ على الجذرِ وحدَه، ولو طُليت هنا أيضًا
     لحجبت الحقلَ كما كانت تحجبه. */
  background:transparent;
  color:var(--ink);
  font-family:var(--font);
  /* جُرّب رفعُه إلى ستّةَ عشرَ فلم يَبِن أثرُه: كلُّ وحدةٍ تَفرض
     مقاسَها بنفسها، فلا يَبلغ الأساسُ إلّا ما لم يُقَس. فرُدَّ. */
  font-size:15px;
  /* ── وزنُ الأساس: الغامق ──
     الأميريُّ خطُّ كتابٍ لا خطُّ واجهة: قلمُه رفيعٌ وارتفاعُ سِينِه
     قصير، فإذا نزل إلى خمسةَ عشرَ بكسلًا على شاشةِ هاتفٍ بَدا
     شاحبًا، ولا سيّما على الأرضِ الكريميّةِ فتباينُه معها أقلُّ من
     تباينِ الأسودِ مع البياض.

     والوزنانِ المحمَّلانِ أربعُ مئةٍ وسبعُ مئة، فما بينهما يَنزل إلى
     الأدنى. فجُعل الأساسُ سبعَ مئةٍ ليُقرأ الخطُّ بقَلَمِه الغامقِ
     المرسومِ لا بتغليظٍ يَصطنعه المتصفّح. والنثرُ الطويلُ وحدَه
     يَرجع إلى أربعِ مئةٍ أدناه، فالغامقُ في الفقرةِ يُتعب العين. */
  font-weight:700;
  line-height:1.65;                  /* العربيّةُ ذاتُ نُزولٍ طويلٍ فتحتاج فرجة */
  letter-spacing:0;                  /* لا تُفكّ العربيّةُ أبدًا — تنقطع وصلاتُها */
  overflow-x:hidden;                 /* عرضٌ ثابتٌ على الهاتف، لا جَرَّ أفقيًّا */
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}


/* البؤرةُ ظاهرةٌ دائمًا وبقاعدةٍ واحدة: لو تُركت لكلّ عنصرٍ لسقطت
   من أحدها، ولوحةُ المفاتيحُ وحدَها طريقُ بعض المستخدمين. */
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--r-sm);
}
:focus:not(:focus-visible){ outline:none }

::selection{ background:var(--accent-soft); color:var(--ink) }

/* الأيقونةُ تأخذ لونَ نصِّها دائمًا، فلا تُلوَّن في موضعٍ وتُنسى في آخر. */
.ico{ display:block; flex:none; color:currentColor; stroke:currentColor }
/* بعضُ الأيقونات مرسومٌ على عُرف اليسار-إلى-اليمين، فتُقلَب عند الحاجة. */
.mirror{ transform:scaleX(-1) }

button,input,select,textarea{
  font:inherit; color:inherit;
  font-variant-numeric:inherit;      /* الحقولُ لا ترث التثبيتَ تلقائيًّا */
}
button{ background:none; border:0; cursor:pointer }
img,svg{ max-width:100% }
a{ color:var(--accent); text-decoration:none }
a:hover{ text-decoration:underline }

/* ═════════ ٢ · الهيكل ═════════ */

/* الجسمُ محدودُ العرض ووسطُ الشاشة: على الحاسب يبقى سطرُ القراءة
   قصيرًا، وعلى الهاتف لا يتغيّر شيء. */
#app{
  position:relative;
  width:100%;
  max-width:var(--maxw);
  margin-inline:auto;
  padding-inline:var(--pad);
  padding-top:max(10px, env(safe-area-inset-top));
  /* القاعُ يُفرَّغ لارتفاعِ الشريط السفليّ وشفةِ الهاتف معًا، وإلّا
     اختفى آخرُ زرٍّ في الشاشة تحت التنقّل. */
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--gap-xl));
}

/* ── الشريطُ السفليّ ──
   النواةُ تضبط ‎grid-template-columns‎ بعددِ التبويبات، فلا يُفترض
   هنا عددٌ معيّن. وثابتٌ لا لاصق: الانتقالُ متاحٌ من أيّ موضعِ تمرير. */
#nav{
  position:fixed;
  inset-inline:0; bottom:0; z-index:60;
  display:grid;
  align-items:stretch;
  max-width:var(--maxw);
  margin-inline:auto;
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  backdrop-filter:blur(18px) saturate(1.3);
  /* شعيرةٌ عُلويّةٌ وحدَها: هذا حدٌّ حقيقيٌّ بين المحتوى والتنقّل. */
  border-top:1px solid var(--hair-2);
  box-shadow:0 -14px 34px -22px var(--shade-3);
}

#nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:var(--nav-h);
  min-width:var(--tap);              /* هدفُ اللمس لا يقلّ عن ٤٤ */
  padding:8px 4px 10px;
  color:var(--ink-mut);
  font-size:11.5px;
  font-weight:600;
  line-height:1;
  position:relative;
  transition:color var(--fast) var(--ease);
}
#nav button span{ display:block }
#nav button .ico{ transition:transform var(--mid) var(--ease) }
#nav button:active .ico{ transform:translateY(1px) scale(.94) }

/* التبويبُ الحاضر: لونٌ ووزنٌ وشارةٌ فوق الأيقونة — ثلاثُ علاماتٍ لا
   اللونُ وحدَه، فعُسرُ تمييزِ الألوان لا يُحرَم من معرفةِ موضعه. */
#nav button[aria-current="page"]{
  color:var(--accent);
  font-weight:700;
}
#nav button[aria-current="page"]::before{
  content:'';
  position:absolute; top:0;
  inset-inline-start:50%;
  translate:-50% 0;
  width:26px; height:3px;
  border-radius:var(--r-pill);
  background:var(--accent);
}

/* ── الإشعارُ العابر ──
   يُركَّب في ‎body‎ من النواة، فلا يملك أبًا يُحدّد موضعَه: التثبيتُ
   والتوسيطُ بالهوامش لا بالإزاحة، كي تبقى ‎translate‎ للحركة وحدَها. */
#toast{
  position:fixed;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  inset-inline:var(--pad);
  z-index:90;
  width:fit-content;
  max-width:min(420px, calc(100% - var(--pad) * 2));
  margin-inline:auto;
  padding:12px 18px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  color:var(--ink);
  font-size:14px;
  font-weight:600;
  text-align:center;
  box-shadow:0 10px 30px -12px var(--shade-3), var(--lift);
  /* مخفيٌّ بلا ‎display‎ كي تعمل الحركةُ في الاتّجاهين. */
  opacity:0;
  translate:0 14px;
  pointer-events:none;
  transition:opacity var(--mid) var(--ease), translate var(--mid) var(--ease);
}
#toast.on{ opacity:1; translate:0 0 }

/* ═════════ ٣ · الطباعة ═════════ */

/* سلّمٌ فيه تفاوتُ وزنٍ حقيقيّ: ٨٠٠ مقابل ٤٠٠. لو تقاربت الأوزانُ
   احتاج الفصلُ إلى خطوطٍ وإطارات، والتفاوتُ يكفي وحدَه. */
.h1{ font-size:26px;   font-weight:800; line-height:1.3;  color:var(--ink) }
.h2{ font-size:20px;   font-weight:800; line-height:1.35; color:var(--ink) }
.h3{ font-size:16.5px; font-weight:700; line-height:1.45; color:var(--ink) }
.body{ font-size:15px;   font-weight:400; line-height:1.7;  color:var(--ink) }
/* النثرُ الطويلُ يَرجع إلى القلم العاديّ: الغامقُ يَحسُن في الكلمةِ
   والسطرِ، ويَثقُل في الفقرة. */
p.body,p.small,.t-alert p,.ex-note,.pr-inv-p,.sa-note{ font-weight:400 }
.small{ font-size:12.5px; font-weight:500; line-height:1.6;  color:var(--ink-mut) }

/* الفوقيّةُ تُعلو العنوانَ وتُصغَّر وتُباعَد: العربيّةُ لا تُفكّ حروفُها،
   فالتمييزُ بالوزن واللون لا بالتشكيل الحرفيّ. */
.eyebrow{
  font-size:12px; font-weight:700; line-height:1.4;
  color:var(--ink-mut);
}

.mut{ color:var(--ink-mut) }
.faint{ color:var(--ink-faint) }      /* ٣٫١٤ — للشعيرات والرموز لا للنصّ */
.on-gold{ color:var(--gold) }
.on-accent{ color:var(--accent) }
.ok{ color:var(--ok) }
.warn{ color:var(--warn) }
.danger{ color:var(--danger) }
.center{ text-align:center }
.strong{ font-weight:700 }
.tnum{ font-variant-numeric:tabular-nums }

/* القطعُ بسطرٍ أو سطرين: الأسماءُ والعناوينُ تطول فتكسِر الصفوف. */
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
.clamp2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }

/* ═════════ ٤ · التخطيط ═════════ */

.screen{ display:flex; flex-direction:column; gap:var(--gap-lg) }

/* ترويسةُ الشاشة: زرُّ أيقونةٍ قائدٌ (اختياريّ) ثمّ العنوان. القائدُ
   أوّلُ العنصر في الـ‎DOM‎ فينعكس موضعُه مع الاتّجاه بلا قاعدةٍ ثانية. */
.bar{
  display:flex;
  align-items:center;
  gap:var(--gap-sm);
  min-height:52px;
  padding-top:4px;
}
.bar > .bar-t{ flex:1 1 auto; min-width:0 }
.bar .h1,.bar .h2{ min-width:0 }
.bar > .bar-end{ margin-inline-start:auto }

.sec{ display:flex; flex-direction:column; gap:var(--gap) }
/* رأسُ القسم: اسمٌ ثمّ فعلٌ طرفيٌّ اختياريّ، بلا خطٍّ فاصلٍ تحته —
   الفراغُ يفصل أوضحَ من الشعيرة. */
.sec-h{
  display:flex;
  align-items:baseline;
  gap:var(--gap-sm);
  flex-wrap:wrap;
}
/* الوصفُ سطرٌ تحت العنوان لا جارٌ له: جنبَه يقتسمان العرضَ فيلتفّ
   العنوانُ سطرَين ويُزاحم — وهو الأكبرُ فلا يُزاحَم. */
.sec-h > p{ flex:1 1 100%; margin:3px 0 0 }
.sec-h > :first-child{ flex:1 1 auto; min-width:0 }
/* أيقونةُ العنوان أوّلُ أبنائه، فلولا هذا نالتها flex:1 1 auto من
   القاعدةِ أعلاه فتمطّطت وأقصت الاسمَ إلى الوسط. */
.sec-h > svg:first-child{ flex:none; color:var(--ink-mut) }
.sec-h .h2,.sec-h .h3{ margin:0 }

.stack{ display:flex; flex-direction:column; gap:var(--gap) }
.stack-sm{ display:flex; flex-direction:column; gap:var(--gap-sm) }
.stack-lg{ display:flex; flex-direction:column; gap:var(--gap-lg) }

.row{ display:flex; align-items:center; gap:var(--gap-sm) }
.row-top{ display:flex; align-items:flex-start; gap:var(--gap-sm) }
.row-wrap{ display:flex; align-items:center; gap:var(--gap-sm); flex-wrap:wrap }
.spread{ justify-content:space-between }
.grow{ flex:1 1 auto; min-width:0 }
.none{ flex:none }

.grid-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--gap-sm) }
.grid-3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--gap-sm) }

/* شعيرةٌ فاصلةٌ تُطلب صراحةً: لا تُرسم تلقائيًّا في أيّ مكان. */
.hair{ height:1px; background:var(--hair-2); border:0; margin-block:var(--gap-xs) }

/* ═════════ ٥ · الأزرار ═════════ */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:var(--tap);
  min-width:var(--tap);
  padding:11px 20px;
  border-radius:var(--r-pill);
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  text-align:center;
  text-decoration:none;
  white-space:nowrap;
  -webkit-user-select:none; user-select:none;
  /* الكبسُ يُحسُّ لا يُرى فقط: تصغيرٌ طفيفٌ يُغني عن تغيير اللون. */
  transition:background var(--fast) var(--ease),
             color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease),
             scale var(--fast) var(--ease);
}
.btn:active{ scale:.965 }
.btn .ico{ margin-block:-2px }
.btn-block{ display:flex; width:100% }
.btn-sm{
  /* يصغر نصُّه وحشوُه ولا يصغر هدفُ لمسِه — ٤٤ حدٌّ لا ينزل. */
  min-height:var(--tap);
  padding:8px 14px;
  font-size:13.5px;
  gap:6px;
}

/* الفعلُ الأوّل: مملوءٌ باللون المميّز، ومدادُه ‎--on-accent‎ المقيس. */
.btn-pri{
  background:linear-gradient(180deg, var(--accent), var(--accent-2));
  color:var(--on-accent);
  box-shadow:0 8px 20px -12px var(--shade-2), var(--lift);
}
.btn-pri:hover{ background:var(--accent) }

/* الذهبُ للإنجاز والختم: يُحتفظ به للحظاتٍ قليلةٍ وإلّا فقد معناه. */
.btn-gold{
  background:linear-gradient(180deg, var(--gold-lit), var(--gold));
  color:var(--on-accent);
  box-shadow:0 8px 20px -12px var(--shade-2), var(--lift);
}
.btn-gold:hover{ background:var(--gold-lit) }

/* الفعلُ الثاني: سطحٌ مرتفعٌ بلا إطار، يُقرأ ثانيًا بالضوء لا بالخطّ. */
.btn-ghost{
  background:var(--surface-2);
  color:var(--ink);
  box-shadow:var(--lift);
}
.btn-ghost:hover{ background:color-mix(in srgb, var(--surface-2) 70%, var(--ink-faint)) }

/* الفعلُ الثالث: نصٌّ وحدَه — للإلغاء وما لا يُراد جذبُ العين إليه. */
.btn-quiet{
  background:none;
  color:var(--ink-mut);
  padding-inline:12px;
}
.btn-quiet:hover{ color:var(--ink); background:var(--hair-2) }

.btn-danger{ background:none; color:var(--danger); box-shadow:inset 0 0 0 1px var(--hair) }
.btn-danger:hover{ background:color-mix(in srgb, var(--danger) 14%, transparent) }

/* واتساب علامةٌ تجاريّةٌ لها أخضرُها، ولذلك لم يُجعل من رموز الهويّة. */
/* مِدادٌ داكنٌ ثابتٌ لا --on-accent: ذاك يتبع السِّمة، فصار أبيضَ
   في النهار — وأبيضُ على أخضر واتساب ١٫٩٨:١. والداكنُ ٨٫١٤:١،
   ويُبقي الأخضرَ كما يعرفه الناس فلا تُبدَّل علامةٌ تجاريّة. */
.btn-wa{ background:var(--wa); color:#0A2614; box-shadow:var(--lift) }

/* على الورقِ كان الزرُّ شريحةً نيونيّةً بعرض الصفحة، ويتكرّر مع كلِّ
   حلقة، فيزاحم أخضرَ الهويّةِ ويصيح فوق ما تحته. فصار على الفاتحِ
   محدَّدًا: العلامةُ تبقى بأخضرِها في الرمز والحافّة، والنصُّ مِداد،
   ويمتلئ عند اللمس. */
html[data-mode="light"] .btn-wa{
  background:var(--surface); color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--wa);
}
/* أخضرُ واتساب الفاتحُ (‎#25D366‎) على البياض ١٫٩٨:١ — دون حدِّ
   الرسوم. فيُؤخَذ أخضرُها الداكنُ ‎#075E54‎ (٧٫٦٧:١) للرمزِ والحافّة:
   لونُ العلامةِ نفسِها لا لونٌ مُختَرَع. */
html[data-mode="light"] .btn-wa{ box-shadow:inset 0 0 0 1.5px var(--wa-deep) }
html[data-mode="light"] .btn-wa .ico{ color:var(--wa-deep) }
html[data-mode="light"] .btn-wa:hover,
html[data-mode="light"] .btn-wa:active{
  background:var(--wa); color:#0A2614;
}
html[data-mode="light"] .btn-wa:hover .ico,
html[data-mode="light"] .btn-wa:active .ico{ color:inherit }

.btn[disabled],.btn[aria-disabled="true"]{
  /* المعطّلُ يبقى مقروءًا: الشفافيّةُ الشديدةُ تهوي بالتباين تحت الحدّ. */
  background:var(--surface-2);
  color:var(--ink-faint);
  box-shadow:none;
  cursor:not-allowed;
  scale:1;
}
.btn[disabled]:active,.btn[aria-disabled="true"]:active{ scale:1 }

/* زرُّ الأيقونة: دائرةٌ بحجم هدف اللمس كاملًا، فالأيقونةُ وحدَها صغيرة. */
.iconbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:var(--tap); height:var(--tap);
  border-radius:var(--r-pill);
  color:var(--ink);
  transition:background var(--fast) var(--ease), scale var(--fast) var(--ease);
}
.iconbtn:hover{ background:var(--hair-2) }
.iconbtn:active{ scale:.92 }
.iconbtn-fill{ background:var(--surface-2); box-shadow:var(--lift) }
.iconbtn-mut{ color:var(--ink-mut) }

/* ═════════ ٦ · الحقول ═════════ */

.field{ display:flex; flex-direction:column; gap:7px }
.field > label,.field > .field-l{
  font-size:12.5px; font-weight:700; color:var(--ink-mut);
}
.field input,.field select,.field textarea,
input.inp,select.inp,textarea.inp{
  width:100%;
  min-height:48px;                   /* أوسعُ من ٤٤ — الكتابةُ تحتاج راحة */
  padding:12px 14px;
  border:0;
  border-radius:var(--r-md);
  background:var(--surface-2);
  color:var(--ink);
  font-size:15.5px;                  /* تحت ١٦ يُقرّب iOS الصفحةَ عند التركيز */
  /* الحقلُ يُعرَف بغَوره لا بإطاره: شعيرةٌ داخليّةٌ خفيفةٌ تكفي حدًّا حقيقيًّا. */
  box-shadow:inset 0 0 0 1px var(--hair-2);
  transition:box-shadow var(--fast) var(--ease), background var(--fast) var(--ease);
  appearance:none; -webkit-appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus,
input.inp:focus,select.inp:focus,textarea.inp:focus{
  box-shadow:inset 0 0 0 1px var(--accent);
}
.field textarea,textarea.inp{ min-height:96px; line-height:1.7; resize:vertical }
.field input::placeholder,textarea::placeholder{ color:var(--ink-faint) }
/* السهمُ في القوائم يُرسم بالخلفيّة لا بأيقونةٍ، لأنّ ‎select‎ لا يقبل أبناء. */
.field select,select.inp{ padding-inline-end:38px }
.field-help{ font-size:12px; color:var(--ink-faint) }
.field-err{ font-size:12px; color:var(--danger); font-weight:600 }
.field-row{ display:flex; gap:var(--gap-sm) }
.field-row > .field{ flex:1 1 0; min-width:0 }

/* ═════════ ٧ · الرقائق والشارات ═════════ */

/* الرقاقةُ خيارٌ يُلمس: ‎aria-pressed‎ هي الحقيقةُ، والشكلُ يتبعها. */
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:var(--tap);
  padding:9px 16px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  color:var(--ink-mut);
  font-size:14px; font-weight:600; line-height:1.2;
  white-space:nowrap;
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease), scale var(--fast) var(--ease);
}
.chip:active{ scale:.96 }
/* ‎aria-checked‎ مع ‎aria-pressed‎: الأوّلُ لمجموعةِ اختيارٍ واحدٍ من
   عدّة (‎radio‎)، والثاني لزرٍّ يُطفأ ويُشعَل. وكان المذكورَ هنا
   الثاني وحدَه، فمجموعةُ «مستواك» تُبدّل ‎aria-checked‎ ولا يَتبدّل
   شكلُها — يَضغط الطالبُ فلا يَرى شيئًا فيَحسبها لا تُضغَط. */
.chip[aria-pressed="true"],.chip[aria-checked="true"],.chip.on{
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--accent);   /* حدٌّ حقيقيٌّ للاختيار */
}
.chip[disabled]{ color:var(--ink-faint); cursor:not-allowed; scale:1 }

/* الشارةُ تُقرأ ولا تُلمس، فلا يُشترط لها هدفُ لمس. */
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  color:var(--ink-mut);
  font-size:11.5px; font-weight:700; line-height:1.7;
  white-space:nowrap;
}
.pill-accent{ background:var(--accent-soft); color:var(--accent) }
.pill-quiet{ background:var(--hair-2); color:var(--ink-mut);
  box-shadow:inset 0 0 0 1px var(--hair) }
/* شارةٌ تَرِث لونَ نوعِها من الصنف الملبوس (.k-hifz وأخواتها) */
.pill-kind{ background:var(--kind-dim); color:var(--kind);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--kind) 34%, transparent) }
.pill-gold{ background:var(--gold-soft);   color:var(--gold) }
.pill-ok{ background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok) }
.pill-warn{ background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn) }

/* ═════════ ٨ · المِقدار والأيّام والمفتاح ═════════ */

/* المقدار: ناقصٌ ورقمٌ كبيرٌ وزائد. الرقمُ وسطٌ بعرضٍ ثابتٍ كي لا يقفز
   الزرّانِ عند انتقال العدد من رقمٍ إلى رقمين. */
.stepper{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  box-shadow:var(--lift);
  width:fit-content;
}
.stepper button{
  display:flex; align-items:center; justify-content:center;
  flex:none;
  width:var(--tap); height:var(--tap);
  border-radius:var(--r-pill);
  color:var(--accent);
  transition:background var(--fast) var(--ease), scale var(--fast) var(--ease);
}
.stepper button:hover{ background:var(--accent-soft) }
.stepper button:active{ scale:.9 }
.stepper button[disabled]{ color:var(--ink-faint); cursor:not-allowed; scale:1 }
.stepper .val{
  min-width:62px;
  text-align:center;
  font-size:22px; font-weight:800; line-height:1.2;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.stepper .val small{ display:block; font-size:10.5px; font-weight:600; color:var(--ink-mut) }

/* أيّامُ الأسبوع: سبعُ دوائرَ متساويةٌ في شبكةٍ، فلا تنكسر على الهاتف
   الضيّق ولا تتفاوت أحجامُها باختلافِ طولِ الحرف. */
.daypicker{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}
.daypicker button{
  display:flex; align-items:center; justify-content:center;
  aspect-ratio:1;
  min-width:var(--tap); min-height:var(--tap);
  border-radius:var(--r-pill);
  background:var(--surface-2);
  color:var(--ink-mut);
  font-size:14.5px; font-weight:700; line-height:1;
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease), scale var(--fast) var(--ease);
}
.daypicker button:active{ scale:.92 }
.daypicker button[aria-pressed="true"]{
  background:var(--accent);
  color:var(--on-accent);
  box-shadow:0 6px 14px -9px var(--shade-2);
}

/* المفتاح: الزرُّ نفسُه هدفُ اللمس (٥٢×٤٤)، والمسلكُ يُرسم داخلَه
   ‎::before‎ أصغرَ — فالمنظرُ رقيقٌ واللمسُ واسع. */
.switch{
  position:relative;
  flex:none;
  width:52px; height:var(--tap);
  border-radius:var(--r-pill);
}
.switch::before{
  content:'';
  position:absolute; top:50%;
  inset-inline-start:2px;
  translate:0 -50%;
  width:48px; height:28px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--hair-2);
  transition:background var(--mid) var(--ease);
}
.switch::after{
  content:'';
  position:absolute; top:50%;
  inset-inline-start:5px;
  translate:0 -50%;
  width:22px; height:22px;
  border-radius:var(--r-pill);
  background:var(--ink-mut);
  /* الإزاحةُ منطقيّةٌ لا أفقيّة: في ‎rtl‎ يسير الزرُّ يسارًا من تلقائه. */
  transition:translate var(--mid) var(--ease), background var(--mid) var(--ease);
}
.switch[aria-checked="true"]::before,
.switch[aria-pressed="true"]::before{ background:var(--accent) }
.switch[aria-checked="true"]::after,
.switch[aria-pressed="true"]::after{
  translate:20px -50%;
  background:var(--on-accent);
}
/* في الاتّجاه من اليمين إلى اليسار تُقلَب إشارةُ الإزاحة وحدَها. */
[dir="rtl"] .switch[aria-checked="true"]::after,
[dir="rtl"] .switch[aria-pressed="true"]::after{ translate:-20px -50% }

/* صفُّ إعدادٍ: اسمٌ وشرحٌ ثمّ مفتاحٌ طرفيّ. */
.setrow{ display:flex; align-items:center; gap:var(--gap) }
.setrow > .grow{ min-width:0 }

/* ═════════ ٩ · الأسطح ═════════ */

/* البطاقةُ بلا إطارٍ قطعًا: الفصلُ بارتفاعِ السطح وظلٍّ مركّبٍ طبقتين —
   طبقةٌ قريبةٌ تُحدّد الحافّة وأخرى بعيدةٌ تُعطي العُمق. */
.card{
  position:relative;
  padding:var(--pad);
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:
    0 1px 2px -1px var(--shade-1),
    0 14px 30px -20px var(--shade-3),
    var(--lift);
}
/* سطحٌ ثانٍ داخلَ البطاقة: يُرتفع فيُقرأ أقربَ بلا خطٍّ يحدّه. */
.card-2{
  padding:var(--gap);
  border-radius:var(--r-md);
  background:var(--surface-2);
  box-shadow:var(--lift);
}
/* بطاقةٌ تُلمس كلُّها: الكبسُ يُحسّ في جسم البطاقة نفسِه. */
.card-tap{
  display:block; width:100%; text-align:start;
  transition:scale var(--fast) var(--ease), background var(--fast) var(--ease);
}
.card-tap:active{ scale:.985 }
/* البطاقةُ المميّزةُ بالذهب: شعيرةٌ ذهبيّةٌ لحظةَ الختم فقط لا عادةً. */
.card-gold{
  background:
    linear-gradient(180deg, var(--gold-soft), transparent 46%),
    var(--surface);
  box-shadow:
    inset 0 0 0 1px var(--gold-soft),
    0 14px 30px -20px var(--shade-3);
}

/* المربّعُ: بطاقةٌ صغيرةٌ في شبكةٍ، محتواها موسَّطٌ ومختصر. */
.tile{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:96px;
  padding:var(--gap);
  border-radius:var(--r-md);
  background:var(--surface);
  color:var(--ink);
  text-align:center;
  box-shadow:0 1px 2px -1px var(--shade-1), var(--lift);
  transition:scale var(--fast) var(--ease), background var(--fast) var(--ease);
}
.tile:active{ scale:.97 }
.tile[aria-pressed="true"]{
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 1.5px var(--accent);
}

/* ── الصفُّ القابلُ للّمس ──
   خاتمٌ قائدٌ ثمّ عنوانٌ ووصفٌ ثمّ سهمٌ طرفيّ. السهمُ يُدفع بـ
   ‎margin-inline-start:auto‎ فينعكس موضعُه مع الاتّجاه بلا قاعدةٍ ثانية. */
.listrow{
  display:flex;
  align-items:center;
  gap:var(--gap);
  width:100%;
  min-height:64px;
  padding:12px var(--gap);
  border-radius:var(--r-md);
  background:var(--surface);
  color:var(--ink);
  text-align:start;
  box-shadow:0 1px 2px -1px var(--shade-1), var(--lift);
  transition:background var(--fast) var(--ease), scale var(--fast) var(--ease);
}
.listrow:active{ scale:.985 }
.listrow:hover{ background:color-mix(in srgb, var(--surface) 82%, var(--surface-2)) }
.listrow-b{ flex:1 1 auto; min-width:0 }   /* جسمُ الصفّ — يقبل القطع */
.listrow-t{ font-size:15px; font-weight:700; line-height:1.4; color:var(--ink) }
.listrow-s{ font-size:12.5px; font-weight:500; line-height:1.5; color:var(--ink-mut) }
.listrow .chev{ margin-inline-start:auto; flex:none; color:var(--ink-faint) }
/* داخلَ البطاقة تُجرَّد الصفوفُ من سطحها: سطحٌ على سطحٍ يُثقل. */
.card > .stack-sm > .listrow,.card .listrow-flat{ background:none; box-shadow:none; padding-inline:0 }

/* الخاتم: مربّعٌ مستديرٌ يحمل أيقونةً، أرضيّتُه ‎accent-soft‎ ومدادُه
   ‎accent‎ — تباينُ الأيقونة فوقه مقيسٌ فوق الثلاثة. */
.emblem{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:44px; height:44px;
  border-radius:var(--r-md);
  background:var(--accent-soft);
  color:var(--accent);
}
.emblem-gold{ background:var(--gold-soft); color:var(--gold) }
.emblem-quiet{ background:var(--surface-2); color:var(--ink-mut) }
.emblem-sm{ width:34px; height:34px; border-radius:var(--r-sm) }
.emblem-lg{ width:64px; height:64px; border-radius:var(--r-lg) }

/* ── شريطُ التقدّم ──
   مسلكٌ وملءٌ وحدَهما، والنسبةُ تُكتب في ‎style.width‎ من الوحدة.
   وتُرفَق دائمًا بـ‎role="progressbar"‎ وقيمِها كي يُقرأ ولا يُرى فقط. */
.progress{
  position:relative;
  height:8px;
  border-radius:var(--r-pill);
  background:var(--surface-2);
  overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--hair-2);
}
.progress-fill{
  height:100%;
  width:0;
  border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--accent-2), var(--accent));
  transition:width var(--slow) var(--ease);
}
.progress-gold .progress-fill,
.progress-fill.gold{ background:linear-gradient(90deg, var(--gold), var(--gold-lit)) }
.progress-lg{ height:12px }

/* الإحصاءة: رقمٌ كبيرٌ ثمّ اسمٌ صغير. الرقمُ ثمانُ مئاتٍ وحجمٌ كبيرٌ
   فيكفيه تباينُ ٣:١، واللفظُ تحته بالمداد الخافت. */
.stat{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0 }
.stat-n{
  font-size:28px; font-weight:800; line-height:1.15;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.stat-n.gold{ color:var(--gold) }
.stat-n.accent{ color:var(--accent) }
.stat-l{ font-size:11.5px; font-weight:600; color:var(--ink-mut); text-align:center }
.stat-start{ align-items:flex-start }
.stat-start .stat-l{ text-align:start }

/* الفراغُ: حالةٌ مقصودةٌ لا خطأ — خاتمٌ كبيرٌ وكلمةٌ تشرح وفعلٌ واحد. */
.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--gap);
  padding:var(--gap-xl) var(--pad);
  text-align:center;
}
.empty .emblem{ width:68px; height:68px; border-radius:var(--r-lg) }
.empty-t{ font-size:17px; font-weight:700; color:var(--ink) }
.empty-s{ font-size:13.5px; color:var(--ink-mut); max-width:34ch; line-height:1.7 }

/* ═════════ ١٠ · الطبقةُ العائمة ═════════ */

/* غشاءٌ ولوحٌ سفليّ: تحتاجهما وحداتُ المشاركة والبناء، ووُحِّدا هنا
   لئلّا يختلف انزلاقُ اللوح بين شاشةٍ وأخرى. */
.backdrop{
  position:fixed; inset:0; z-index:80;
  background:var(--shade-2);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  animation:fade var(--mid) var(--ease);
}
.sheet{
  position:fixed;
  inset-inline:0; bottom:0; z-index:81;
  max-width:var(--maxw);
  margin-inline:auto;
  max-height:88dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:var(--pad);
  padding-bottom:calc(var(--pad) + env(safe-area-inset-bottom));
  border-start-start-radius:var(--r-lg);
  border-start-end-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:0 -18px 44px -24px var(--shade-3), var(--lift);
  animation:rise var(--mid) var(--ease);
}
/* مقبضُ اللوح: علامةُ أنّه يُسحب، لا زينة. */
.sheet-grip{
  width:40px; height:4px;
  margin:0 auto var(--gap);
  border-radius:var(--r-pill);
  background:var(--hair);
}

@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
@keyframes rise{ from{ translate:0 18px; opacity:0 } to{ translate:0 0; opacity:1 } }
/* ظهورٌ هادئٌ للبطاقات عند الرسم: يُطلب بصنفٍ ولا يُفرض على كلّ عنصر. */
@keyframes in-up{ from{ translate:0 10px; opacity:0 } to{ translate:0 0; opacity:1 } }
.anim-in{ animation:in-up var(--mid) var(--ease) both }

/* ═════════ ١١ · الشاشةُ الأوسع ═════════ */

/* فوق ٦٠٠px يصير التنقّلُ شريطًا عائمًا لا ملتصقًا بالحافّة: الشاشةُ
   أوسعُ من المحتوى فالالتصاقُ بالقاع يبدو مقطوعًا. */
@media (min-width:600px){
  #app{ padding-top:var(--gap-lg) }
  #nav{
    bottom:14px;
    border-radius:var(--r-pill);
    border-top:0;
    max-width:calc(var(--maxw) - 40px);
    padding-bottom:0;
    overflow:hidden;
    box-shadow:0 14px 34px -16px var(--shade-3), var(--lift);
  }
  #nav button{ min-height:62px }
  #nav button[aria-current="page"]::before{ top:6px }
  .h1{ font-size:30px }
}

/* ═════════ ١٢ · تخفيفُ الحركة ═════════ */

/* مَن طلب سكونَ الواجهة فله: الحركةُ تُقصَّر إلى ما لا يُدرَك ولا
   تُحذَف، كي تبقى أحداثُ النهاية تُطلَق ولا يتعطّل منطقُ أيّ وحدة. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-delay:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    transition-delay:0.01ms !important;
    scroll-behavior:auto !important;
  }
  html{ scroll-behavior:auto }
  .btn:active,.chip:active,.tile:active,.listrow:active,
  .card-tap:active,.iconbtn:active,.stepper button:active{ scale:1 }
}

/* شدّةُ التباين العالية: تُظهَر الحدودُ الحقيقيّةُ لمن يحتاجها، ولا
   تُظهَر لغيره — فالفصلُ الأصلُ فيه الارتفاعُ لا الخطّ. */
@media (prefers-contrast:more){
  .card,.tile,.listrow,.card-2{ box-shadow:inset 0 0 0 1px var(--hair) }
  .pill,.chip{ box-shadow:inset 0 0 0 1px var(--hair) }
  .small,.stat-l,.listrow-s{ color:var(--ink) }
}

/* ── التبويب ────────────────────────────────────────────────────
   شريطٌ واحدٌ لا يلتفّ ولا ينزلق. كان ينزلق أُفقيًّا إن ضاق، وهو
   أسوأُ ما يكون في العربيّة: الجهتان مقلوبتان عن المألوف، ولسانٌ
   مخبوءٌ خارج الحافّةِ لا دليلَ عليه — فيُظنّ أن ليس ثَمّ غيرُ ما
   يُرى. وقِيس: «تقدُّمي» بثلاثةِ ألسنةٍ يتجاوز عرضَ ٣٢٠ بعشرِ
   بكسلات.

   فلا انزلاق: تُحذَف الأيقوناتُ أوّلًا عند الضيقِ لأنّها زينةُ
   اللسانِ لا اسمُه، ويبقى الاسمُ كاملًا مقروءًا. */
.segwrap{ margin-block:4px }
.seg{
  display:flex; gap:4px; padding:4px;
  background:var(--surface); border:1px solid var(--hair);
  border-radius:var(--r-pill);
  overflow:hidden;
}
/* ══ ألسنةُ التبويبِ نصٌّ بلا أيقونة — دائمًا ══
   كانت قاعدتان تُخفيان الأيقونةَ نفسَها عند حدَّين مختلفَين: هذه
   عند ٣٦٥ بكسلًا، وأخرى في «الإعدادات» عند ٤٦٠. فكان العنصرُ
   الواحدُ بسلوكَين على الجهازِ الواحد: ألسنةُ «تقدُّمي» لها أيقوناتٌ
   وألسنةُ «الإعدادات» بلا أيقونات، ثمّ تَغيب أيقوناتُ «تقدُّمي» إن
   ضاقت الشاشةُ قليلًا. ظهورٌ واختفاءٌ بلا قاعدةٍ يُدركها الناظر.

   والحكمُ واحدٌ قاطع: **الاسمُ هو الذي يُقرأ، والأيقونةُ زينة** —
   وهي في لسانٍ مكتوبٍ لا تُضيف معنًى وتَسرق عرضًا تَحتاجه الكلمةُ
   العربيّة. فلا أيقونةَ في لسانٍ، على أيِّ شاشةٍ كانت. */
.seg-b .ico{ display:none }
.seg-b{
  flex:1 1 0; min-width:0;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  /* ٤٤ لا ٤٠: اللسانُ هدفُ لمسٍ كامل، وكلُّ وحدةٍ كانت تتجاوزه عندها
     بقاعدةٍ خاصّة — والأصلُ أن يصحّ هنا مرّةً للجميع. */
  min-height:var(--tap); padding-inline:15px;
  border:0; border-radius:var(--r-pill); background:none; cursor:pointer;
  font:inherit; font-size:14px; font-weight:600; color:var(--ink-mut);
  white-space:nowrap;
}
.seg-b svg{ flex:none; opacity:.85 }
.seg-b.on{ background:var(--accent); color:var(--on-accent); font-weight:700 }
.seg-b.on svg{ opacity:1 }
.seg-b:not(.on):hover{ color:var(--ink); background:var(--hair-2) }
.seg-b:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
.segpane{ padding-block-start:16px }

/* ══ الشاشاتُ القصيرة: يَثبت الهيكلُ ويَتحرّك اللوحُ ══
   على هاتفٍ طويلٍ تَسَع كلُّ لوحةٍ شاشةً واحدةً كاملة. وعلى هاتفٍ قصيرٍ
   ‏(٦٦٧ أو ٧٤٠ بكسلًا)‏ لا يُقصَّر النصُّ إلى ما لا نهاية، فيُقلَب الأمرُ:
   الترويسةُ والألسنةُ والشريطُ السفليُّ ثوابتُ لا تُزاح، واللوحُ وحدَه
   يَنزلق داخلَ إطاره. فتبقى الشاشةُ شاشةً واحدةً: لا يَضيع اللسانُ عن
   العينِ ولا يَهرب الشريطُ إلى أسفلِ صفحةٍ ثانية.
   وللألسنةِ الداخليّةِ لا انزلاقٌ ثانٍ — انزلاقٌ في انزلاقٍ تشويشٌ. */
/* ولا تُقيَّد بطولٍ دونَ طول: قاعدةٌ تَعمل على هاتفٍ قصيرٍ وتَنام على
   طويلٍ تَترك شاشاتٍ تَنقسم حيث لا يُتوقَّع. الهيكلُ ثابتٌ دائمًا. */
@media (min-height:1px){
  .segpane{
    max-height:calc(100dvh - var(--pane-cap, 236px));
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    /* ══ لا شيءَ يُخفى بلا دلالة ══
       سقفُ اللوحِ يَمنع الشاشةَ أن تَنقسم، لكنّه إن أخفى بلا علامةٍ صار
       عيبًا أسوأَ من الانقسام: يَظنّ القارئُ أنّ السطرَ الأخيرَ هو
       الأخيرُ وقد بقي تحته سطر. فيُترَك شريطُ الانزلاقِ رفيعًا ظاهرًا
       — وفي الغالبِ الأعمِّ لا يَظهر أصلًا لأنّ كلَّ لوحٍ يَسَع تمامًا. */
    scrollbar-width:thin;
    scrollbar-color:var(--hair) transparent;
  }
  /* علامةُ «تحته بقيّة»: ظلٌّ داخليٌّ في الحافّةِ السفلى. وهي
     ضرورةٌ لا زينة — شريطُ الانزلاقِ لا يَظهر على آيفون وهو ساكن،
     فيُقرأ السطرُ المقطوعُ منتهًى وليس به. وتَزول عند بلوغِ القاع. */
  .segpane.is-more{
    box-shadow:inset 0 -26px 20px -20px var(--shade-3);
    transition:box-shadow var(--mid) var(--ease);
  }
  .segpane::-webkit-scrollbar{ width:4px }
  .segpane::-webkit-scrollbar-thumb{
    background:var(--hair); border-radius:var(--r-pill) }
  .segpane .segpane{ max-height:none; overflow:visible }
}

.segpane:focus{ outline:none }
.segpane:focus-visible{ outline:2px solid var(--gold); outline-offset:4px;
  border-radius:var(--r-md) }
@media (prefers-reduced-motion:no-preference){
  .seg-b{ transition:background var(--fast) var(--ease), color var(--fast) var(--ease) }
}

/* الشريطُ الذي ينزلق يجب أن يبدوَ منزلقًا: بلا دلالةٍ يُظَنّ اللسانُ
   الأخيرُ مقطوعًا لا مخفيًّا، فيُحسب عيبًا ولا يُطلب. والقناعُ يتلاشى
   عند الحافّة فيقول «ثَمَّ بقيّة» دون شريطِ تمريرٍ يأكل الارتفاع. */
.seg{
  -webkit-mask-image:linear-gradient(to left,#000 calc(100% - 22px),transparent);
          mask-image:linear-gradient(to left,#000 calc(100% - 22px),transparent);
}
/* وإن اتّسع الشريطُ لكلّ ألسنته فلا تلاشيَ: القناعُ يقضم اللسانَ الأخير
   بلا سبب. ‏scroll-state تُدرَك في المتصفّحات الحديثة، وما دونها يبقى
   على التلاشي وهو أهونُ من لسانٍ مخفيٍّ بلا دلالة. */
@supports (container-type:scroll-state){
  .segwrap{ container-type:scroll-state }
  @container scroll-state(scrollable: left){
    .seg{ -webkit-mask-image:none; mask-image:none }
  }
}

/* ── الصحيفة: التفاصيلُ فوق الشاشة لا بدلًا منها ─────────────────
   كان المنهجُ والبنّاءُ والمشاركةُ شاشاتٍ تمحو ما تحتَها، فيرجع
   الطالبُ بسهمٍ إلى لسانٍ قد لا يكون الذي جاء منه. الصحيفةُ تعلو
   وتُغلَق فيعود كلُّ شيءٍ كما تركه. */
#sheet{
  position:fixed; inset:0; z-index:90;
  display:none;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:var(--ground);
  /* صدرُ الصحيفةِ في «الهويّة» لا هنا: ‎--lift‎ رمزُ ظلٍّ لا لون،
     وقد كان مكتوبًا هنا في موضعِ لونِ تدرُّجٍ فيَبطُل التصريحُ كلُّه
     بصمتٍ لا يُنبَّه إليه. وهو الفخُّ عينُه الذي أطفأ ظلالَ التطبيقِ
     كلِّها من قبل. فلا يُعاد كتابُه هنا. */
}
#sheet.on{ display:block }
#sheet-body{
  max-width:var(--maxw); margin-inline:auto;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad)
          calc(env(safe-area-inset-bottom) + 28px);
}
/* الخلفيّةُ لا تُمرَّر تحت صحيفةٍ مفتوحة: تمريرُها يُفقد الطالبَ
   موضعَه حين تُغلق، وهو عيبٌ مألوفٌ في الهواتف. */
body.sheet-open{ overflow:hidden }
body.sheet-open #nav{ pointer-events:none; opacity:0 }

@media (prefers-reduced-motion:no-preference){
  #sheet.on{ animation:sheet-rise var(--mid) var(--ease) }
  @keyframes sheet-rise{
    from{ opacity:0; transform:translateY(14px) }
    to  { opacity:1; transform:none }
  }
  #nav{ transition:opacity var(--fast) var(--ease) }
}

/* اللسانُ المختارُ يُعلَّم بالخطّ واللون لا باللون وحدَه: من لا يُميّز
   الألوانَ يحتاج علامةً أخرى. */
#nav button.on{ color:var(--accent); font-weight:700 }
#nav button.on::after{
  content:''; position:absolute; inset-inline:30%; bottom:6px; height:2px;
  border-radius:2px; background:var(--accent);
}

/* يُسمَع ولا يُرى: حين يحمل الشعارُ الاسمَ لا يُكتب تحته نصًّا، لكنّ
   قارئَ الشاشة يحتاج عنوانَ الصفحة — والصورةُ لا تُغني عنه. */
.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}

/* ═══ الشعار ═════════════════════════════════════════════════════
   هيئةٌ واحدةٌ أينما ظهر — في الدخولِ الأوّل، وفي صدرِ «اليوم»،
   وفي «عن التطبيق». الأرضُ الكريميّةُ ليست زينة: أخضرُ الشعار
   ١٫٧:١ على سمتَينا الداكنتين، فلولاها لَاختفى. وهي ورقُ المصحفِ
   المرسومِ فيه نفسُه، فتُقرأ بطاقةً مطبوعةً لا رقعةً مُقحَمة —
   وتَذوب في السمتين الفاتحتين لأنّها لونُ أرضِهما. */
.appmark{
  display:inline-block; max-width:100%; line-height:0;
  padding:9px 13px; border-radius:var(--r-lg);
  background:#FAF4E6;
}
.appmark img,.appmark svg{ display:block; max-width:100%; height:auto }

/* ── الشعارُ في صدر كلِّ صفحةٍ رئيسة ──
   سُئل: «كيف نَعرف أنّ هذا التطبيقَ هو رتِّل وارتقِ؟» — والجوابُ أن
   يكون الاسمُ في أعلى كلِّ صفحةٍ يَفتحها، لا في شاشتَين فحسب. وهو
   مُوسَّطٌ لأنّ الشعارَ كلمةٌ عريضةٌ لا خاتمٌ يَصطفّ في زاوية. */
.brandbar{
  display:flex; justify-content:center; align-items:center;
  padding-block:2px 10px;
  /* بعضُ الشاشاتِ عمودٌ مرن بـ‎align-items:center‎ (شاشةُ اليومِ
     الفارغةُ منها)، فيَنكمش الشريطُ إلى عرضِ الشعارِ وحدَه —
     ومعه يَنكمش مُسنَدُ الزرِّ المطلَقِ فيَقع على الشعارِ لا في
     الطرف. فيُمدّ الشريطُ عرضَ الشاشةِ أيًّا كان أبوه. */
  align-self:stretch;
}
.brandbar .appmark{ padding:6px 10px }

/* ── الإعداداتُ عن يسارِ الشعار ──
   الشعارُ يَبقى مُوسَّطًا على الشاشةِ لا على ما بقي منها، فالزرُّ
   مرفوعٌ من مجرى الصفِّ ومثبَّتٌ في الطرف. و‎inset-inline-end‎ هي
   اليسارُ في اتّجاهِ العربيّة، فلا يُكتَب ‎left‎ فيَنقلب في غيرها. */
.brand-set{
  position:absolute; inset-inline-end:0; top:50%;
  translate:0 -50%;
  width:var(--tap); height:var(--tap);
  display:grid; place-items:center;
  color:var(--ink-mut);
  border-radius:var(--r-sm);
  transition:color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.brand-set:hover{ color:var(--ink); background:var(--hair-2) }
.brand-set:active{ scale:.94 }
.brand-set[aria-current="page"]{ color:var(--accent) }
.brand-set:focus-visible{ outline:2px solid var(--gold-lit); outline-offset:2px }

/* ══ 21-motion.css ══ */
/* ═══════════════════════════════════════════════════════════════════
   الانتقال — أن يُفهَم أين ذهبتَ لا أن تُبهَر
   ───────────────────────────────────────────────────────────────────
   الطلبُ كان «تنقّلًا سلسًا وديناميكيًّا»، وأكثرُ ما يُفسد هذا المعنى
   أن يُقرأ «حركةً كثيرة». الحركةُ هنا تؤدّي عملًا واحدًا: تقول للعين
   **من أين جاء هذا السطحُ وإلى أين ذهب سابقُه**، فتَفهم العينُ
   الترتيبَ بلا جهد. فإن لم تَقل ذلك فهي ضجيجٌ يُؤخّر اللمسةَ التالية.

   فلا ارتدادَ ولا دورانَ ولا قفزة: إزاحةٌ قصيرةٌ مع ظهور، على منحنى
   التطبيقِ نفسِه (‎--ease‎) — منحنًى واحدٌ للنظامِ كلِّه، فلا تَختلف
   «شخصيّةُ» الشاشةِ عن شخصيّةِ اللسان.

   والمدّة: ٢٢٠ مللي ثانيةً للشاشة و١٨٠ للسانِ داخلَها. وما دون ١٨٠
   يُقرأ ومضةً لا انتقالًا، وما فوق ٢٦٠ يُقرأ بطأً في يدِ من يَلمس
   عشرَ لمساتٍ في الدقيقة.

   ولا جافاسكربت في هذا: النواةُ تُفرغ ‎#pane‎ وتَبني محتواه من جديد
   في كلِّ رسم (وكذلك ‎#sheet-body‎ و‎.segpane‎)، وإدخالُ عنصرٍ جديدٍ
   إلى الشجرة يُشغّل حركتَه من تلقائه. فالانتقالُ خاصّيّةٌ من خواصِّ
   السطحِ لا أمرٌ يُصدَر إليه.

   وفي RTL: التقدُّمُ إلى الأمامِ معناه في العربيّة اليسار، فالسطحُ
   الجديدُ يَدخل **من اليسار** زاحفًا إلى موضعه. وهذه إزاحةٌ ماديّةٌ
   لا منطقيّة (‎translate‎ بالسالب) فلا تَنعكس مع الاتّجاه: لو كُتبت
   بالمنطقيّ لانقلبت في لغةٍ أخرى ولم تَنقلب جهةُ القراءة معها.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* مدّتان لا أكثر، ومنحنى النظامِ كما هو — لا يُعاد تعريفُ --ease */
  --nav:.22s;
  --nav-in:.18s;
}

/* ── الشاشة ──
   تَدخل من اليسار (جهةُ التقدُّم في العربيّة) مع ظهورٍ قصير. ولا
   تُحرَّك الشاشةُ الخارجةُ: إخراجُها يَقتضي إبقاءَ سطحَين معًا في
   الشجرة، وذاك ثمنٌ في الذاكرةِ والرسمِ لا يُشترى بربع ثانية. */
@keyframes nav-in{
  from{ opacity:0; translate:-16px 0 }
  to  { opacity:1; translate:0 0 }
}
/* بلا ‎both‎ عمدًا: ‎translate‎ غيرُ الصِّفريّ — وحتّى ‎0 0‎ — يَجعل
   العنصرَ حاضنًا لكلِّ ‎position:fixed‎ تحته، فلو ثَبتت القيمةُ بعد
   انتهاء الحركة لعلِق كلُّ غشاءٍ أو لوحٍ عائمٍ داخلَ الشاشة. */
#pane > *{ animation:nav-in var(--nav) var(--ease) }

/* ── الصحيفة ──
   تَرتفع من القاعِ لأنّها جاءت من تحتِ الشاشةِ لا من جانبها، وهي
   حركةٌ قائمةٌ في الهيكل (‎sheet-rise‎) — وُحِّدت مدّتُها هنا بمدّةِ
   النظامِ فلا يختلف إيقاعُ البابين. */
@media (prefers-reduced-motion:no-preference){
  #sheet.on{ animation-duration:var(--nav) }
}

/* ── اللسانُ داخلَ الشاشة ──
   أقصرُ وأخفُّ من انتقال الشاشة: الانتقالُ هنا داخلَ سطحٍ واحدٍ
   لا بين سطحين، فالإزاحةُ نصفُ تلك والمدّةُ أقلّ. وجهتُها الجهةُ
   نفسُها، فلا تَختلف لغةُ الحركةِ في مستويين متجاورين. */
@keyframes seg-in{
  from{ opacity:0; translate:-9px 0 }
  to  { opacity:1; translate:0 0 }
}
.segpane > *{ animation:seg-in var(--nav-in) var(--ease) }

/* ── اللوحُ الزجاجيّ عند اللمس ──
   لوحُ البطولةِ جسمٌ له سُمك، فاللمسُ يَغمِسه لا يُخفيه: نزولٌ قدرَ
   بكسلٍ ونصفٍ مع تضاؤلٍ يسير. ولا يُحرَّك في الحَوْم (hover) شيءٌ:
   الحَوْمُ في هاتفٍ يَقع مع اللمسة نفسِها فيُقرأ ارتعاشًا. */
@media (prefers-reduced-motion:no-preference){
  .pg-b .pg-ico{ transition:translate var(--nav-in) var(--ease),
                            scale var(--nav-in) var(--ease) }
  .pg-b:active .pg-ico{ translate:0 1.5px; scale:.97 }
}

/* ═══ تقليلُ الحركة: صفرٌ لا تقريبُ صفر ═══
   الهيكلُ يَقصُر كلَّ حركةٍ إلى ‎0.01ms‎ ليَبقى ‎animationend‎ يُطلَق
   فلا يتعطّل منطقُ وحدةٍ تَنتظره. وما في هذا الملفّ لا يَنتظره أحدٌ
   — زخرفةٌ خالصةٌ — فيُحذَف حذفًا: لا اسمَ حركةٍ ولا مدّةَ ولا إزاحة. */
@media (prefers-reduced-motion:reduce){
  #pane > *,
  .segpane > *,
  #sheet.on{ animation:none !important }
  .pg-b .pg-ico{ transition:none !important }
  .pg-b:active .pg-ico{ translate:none; scale:1 }
}

/* ══ 21-nav3d.css ══ */
/* ══ الشريطُ السفليُّ مرتفعًا ══════════════════════════════════

   ثلاثةُ تغييرات:
   ١) يَرتفع الشريطُ عن حافّةِ الشاشة فيَصير لوحًا طافيًا له ظلٌّ
      تحته — وهو ما يَصنع الإحساسَ بالعمق، لا التدرّجاتُ الكثيرة.
   ٢) اللسانُ الحاضرُ يَجلس في مِحبسٍ مرفوع: حافّةٌ عُليا فاتحةٌ
      وأخرى سفلى غامقة، فيُقرأ زرًّا بارزًا لا لونًا مسطّحًا.
   ٣) الضغطُ يَغوص: اللوحُ ينزل بكسلًا والمِحبسُ يَنكمش، ثمّ
      يَثب راجعًا — ومعه اهتزازةٌ قصيرةٌ من ‎11-nav3d.js‎.

   والبروزُ ليس زينةً وحدَه: المِحبسُ شكلٌ يُميّز الحاضرَ لمن لا
   يُميّز الألوان، فيَنوب عن الشارةِ العلويّةِ التي أُلغيت هنا. */

#nav{
  inset-inline:10px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  padding:7px 8px;
  padding-bottom:7px;
  border:0;
  border-top:0;
  border-radius:24px;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow:
    0 1px 0 color-mix(in srgb, #fff 55%, transparent) inset,  /* حافّةٌ عُليا */
    0 -1px 0 color-mix(in srgb, var(--shade-3) 22%, transparent) inset,
    0 2px 5px -2px var(--shade-3),
    0 18px 34px -18px var(--shade-3);
}

/* الفُرجةُ تحت الشريطِ تُضاف لما يُفسَح أسفلَ المحتوى، وإلّا
   اختفى آخرُ سطرٍ تحته. */
#app{
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)
                      + 10px + var(--gap-lg));
}

#nav button{
  min-height:58px;
  padding:7px 2px 8px;
  border-radius:17px;
  position:relative;
  isolation:isolate;
  transition:transform var(--fast) var(--ease),
             color var(--fast) var(--ease);
}

/* المِحبسُ: طبقةٌ خلف الأيقونةِ والاسم، لا تَظهر إلّا للحاضر.
   وتُذكَر حالةُ ‎.on‎ معها صراحةً لأنّ الأساسَ يَرسم بها شعيرةً
   سفليّةً بمقاساتٍ أخصَّ، فلولا ذِكرُها لَغلبت هذه. */
#nav button::after,
#nav button.on::after,
#nav button[aria-current="page"]::after{
  content:'';
  position:absolute;
  inset:0; inset-inline:0; bottom:0; height:auto;
  border-radius:inherit;
  z-index:-1;
  opacity:0;
  transform:scale(.88);
  background:linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 17%, transparent) 0%,
    color-mix(in srgb, var(--accent) 9%,  transparent) 100%);
  box-shadow:
    0 1px 0 color-mix(in srgb, #fff 48%, transparent) inset,
    0 -1px 0 color-mix(in srgb, var(--accent) 24%, transparent) inset,
    0 3px 7px -3px color-mix(in srgb, var(--accent) 42%, transparent);
  transition:opacity var(--mid) var(--ease),
             transform var(--mid) var(--ease);
}

/* الشارةُ العلويّةُ القديمةُ لا تَصلح على لوحٍ طافٍ: المِحبسُ
   بَدَلُها، وهو شكلٌ أيضًا لا لون. */
#nav button::before,
#nav button.on::before,
#nav button[aria-current="page"]::before{ display:none }

#nav button.on,
#nav button[aria-current="page"]{ color:var(--accent); font-weight:700 }

#nav button.on::after,
#nav button[aria-current="page"]::after{
  opacity:1;
  transform:none;
}

/* الأيقونةُ تَعلو قليلًا في الحاضر، فيَزيد إحساسُ البروز */
#nav button .ico{
  transition:transform var(--mid) var(--ease);
}
#nav button.on .ico,
#nav button[aria-current="page"] .ico{ transform:translateY(-1.5px) }

/* الغوصُ عند الضغط: اللسانُ كلُّه ينزل والمِحبسُ ينكمش */
#nav button:active{ transform:translateY(1.5px) }
#nav button:active::after{ transform:scale(.95) }
#nav button:active .ico{ transform:translateY(0) scale(.93) }

/* لمسةُ الشحن: ومضةٌ واحدةٌ تَنتشر من موضعِ اللمسِ عند الاختيار،
   تُضاف بالشيفرةِ وتُحذَف من نفسِها. */
#nav .nav-spark{
  position:absolute;
  inset-inline-start:var(--x, 50%);
  top:50%;
  width:10px; height:10px; margin:-5px 0 0 -5px;
  border-radius:50%;
  background:color-mix(in srgb, var(--accent) 55%, transparent);
  pointer-events:none;
  z-index:-1;
  animation:nav-spark 420ms var(--ease) forwards;
}
@keyframes nav-spark{
  from{ transform:scale(.4); opacity:.55 }
  to  { transform:scale(9);  opacity:0 }
}

/* فوق ٦٠٠px كان الشريطُ طافيًا أصلًا: تُوحَّد الحوافُّ فحسب */
@media (min-width:600px){
  #nav{ bottom:14px; inset-inline:auto; max-width:calc(var(--maxw) - 40px) }
  #nav button{ min-height:58px }
}

/* مَن طلب سكونَ الواجهةِ لا يُعطى وثبًا ولا ومضة */
@media (prefers-reduced-motion:reduce){
  #nav button:active{ transform:none }
  #nav .nav-spark{ display:none }
}

/* الإشعارُ العابرُ يُقاس من حافّةِ الشاشةِ لا من الشريط، فلمّا
   ارتفع الشريطُ عشرةً صار الإشعارُ يُلامسه. تُضاف العشرةُ له. */
#toast{
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px + 16px);
}

   مربّعانِ متساويانِ في نصفِ القطر بينهما خمسٌ وأربعون درجة، كلٌّ
   منهما شريطٌ عريضٌ بزوايا قائمة، يَمرّ فوقَ الآخرِ وتحتَه بالتناوب
   في ثمانيةِ معابر — فيُقرأ نسجًا لا تراكبًا. وهو المعروفُ في
   المصاحفِ والعِمارة، ومنه عَلامةُ رُبعِ الحزب.

   على اتّجاهِ الأعلى أوسعُ منه بفجوتين، ثمّ يُعاد الأعلى بعرضه — فما
   زاد عن عرضِه فجوةٌ تَظهر على الشريطِ الأسفلِ وحدَه، وخارجَه يَقع
   على الفراغِ فلا يُرى. وكلُّ ذلك ثلاثةُ آلافِ حرفٍ لا صورةً تُحمَل.
