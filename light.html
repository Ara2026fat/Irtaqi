    text(ctx, 'رتِّل وارتقِ', MID, y, 56, alpha(p.gold, 0.92), 'center', '700', true);
    y -= 54;
    /* سطرُ الذيل مِدادُه ‎--ink-mut‎ لا ‎--ink-faint‎: الخفيُّ قيسَ ٣٫١٤
       فهو للشعيرات لا للكلام، وهذا سطرٌ يُقرأ فيه التاريخُ والعددُ. */
    if (sub2) { text(ctx, sub2, MID, y, 28, p['ink-mut'], 'center', '400', false); y -= 40; }
    if (sub) { text(ctx, sub, MID, y, 32, p['ink-mut'], 'center', '400', false); y -= 44; }
    /* ‎noHair‎ لمن رسم فاصلَه بنفسه: فاصلان متجاوران ضجيجٌ، والبطاقةُ
       التي لها فاصلُ هالةٍ لا تَحتاج شعيرةً صمّاءَ تَحتها بأربعين. */
    if (!noHair) {
      ctx.save();
      ctx.strokeStyle = alpha(p.gold, 0.22); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke();
      ctx.restore();
    }
    return y;   /* أعلى ما بلغه الذيل: ما فوقه وحدَه متاحٌ للمحتوى */
  }

  /* ── صفوفُ التفصيل: عنوانٌ يمينًا وقيمةٌ شمالًا بشعيرةٍ بينها ────
     وكان الحارسُ يَقطع قبل الرسم فيَبتلع الصفَّ الأخيرَ صامتًا: سقط
     «يومُ الختام» من بطاقة المنهج و«المواظبة» من بطاقة اليوم ولا
     أثرَ يدلّ. فصار التباعدُ يَضيق ليَسَعَ ما طُلب، ولا يُحذف صفٌّ
     بغير علمنا. */
  /* نزل الذيلُ عن حرفِ اللوحِ فصعد، فصعد معه منتهى الصفوف: الشعيرةُ
     الفاصلةُ تَقف الآن عند ‎١١٦٠‎، ولو بقي المنتهى ‎١١٥٠‎ لَمرّت في
     ذيولِ حروفِ آخرِ صفّ. والصفوفُ تَنضغط من تلقائها فلا يَسقط صفّ.
     و‎١١٣٦‎ لا ‎١١١٨‎: جُرّب الأضيقُ فانضغطت صفوفُ «رحلتي» إلى ٤٩
     فتلاصقت شعيراتُها بالنصّ، وبين آخرِ قرارٍ والشعيرةِ اثنتا عشرةَ
     تَسَعُ ذيولَ الحروفِ ولا تَزيد. */
  var ROWS_END = 1136;
  function rows(ctx, p, list, y0, lh) {
    list = (list || []).filter(Boolean);
    if (list.length > 1) {
      var room = (ROWS_END - y0) / (list.length - 1);
      if (room < lh) lh = Math.max(46, Math.floor(room));
    }
    var y = y0;
    for (var i = 0; i < list.length && y <= ROWS_END; i++) {
      var r = list[i];
      if (i) {
        ctx.save();
        ctx.strokeStyle = alpha(p.hair, 0.9); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(M, y - lh + 20); ctx.lineTo(W - M, y - lh + 20); ctx.stroke();
        ctx.restore();
      }
      var lw = measure(ctx, r[0], 34, '400', false);
      text(ctx, r[0], RIGHT, y, 34, p['ink-mut'], 'right', '400', false);
      /* القيمةُ تُقاس أوّلًا فلا تلتقي بالعنوان أبدًا */
      var avail = CW - lw - 30;
      var b = fit(ctx, r[1], avail, 36, 1, '700', false, 22);
      put(ctx, b, LEFT, y, lh, 'left', p.ink);
      y += lh;
    }
    return y;
  }

  /* ── حلقةُ النسبة ───────────────────────────────────────────────── */
  /* وعند التمامِ لا تُغلَق الحلقةُ قوسًا: تَصير **هالة**. وهي قسمةُ
     ‎App.Rosette.ring‎ نفسُها — «ليس في المصحفِ هالةٌ نصفُها»، فما دام
     ناقصًا فقوسٌ نظيف، فإذا تمّ فخَتْمٌ. ولحظةُ التحوُّلِ هي المكافأة،
     وكانت البطاقةُ تُفوّتها فتُخرج دائرةً مغلقةً كأيِّ دائرة. */
  function ring(ctx, p, cx, cy, rad, pct, big, small) {
    var t = Math.PI * 1.5, sweep = Math.PI * 2 * Math.max(0, Math.min(100, pct)) / 100;
    if (pct >= 99.5) {
      var rr = rosSeal(ctx, p, cx, cy, (rad + 13) * 2, { coreA: 0.1 });
      /* قياسُ «١٠٠٪» لا يَثبت: الحلقةُ كانت تَضعه ١٤٠ حيث الفراغُ
         كلُّ ما داخلَ القوس، أمّا اللُّبُّ فأضيقُ منه بالثلث — فخرجت
         «٪١٠٠» تَركب الذهبَ من الجانبَين. فيُقاس ويُصغَّر حتّى يَسَعه
         اللُّبّ، ولا يُقَصّ ولا يَفيض. */
      var room = rr * 0.64 * 2 * 0.90, fs = 140;
      while (fs > 48 && measure(ctx, big, fs, '700', true) > room) fs -= 4;
      if (big) text(ctx, big, cx, cy + (small ? 8 : fs * 0.34), fs,
        p['gold-lit'], 'center', '700', true);
      if (small) text(ctx, small, cx, cy + 66, 30, p['ink-mut'], 'center', '400', false);
      return;
    }
    ctx.save();
    ctx.lineWidth = 26; ctx.lineCap = 'round';
    ctx.strokeStyle = alpha(p.ink, 0.1);
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    if (sweep > 0.001) {
      var g = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
      g.addColorStop(0, p.gold); g.addColorStop(1, p['gold-lit']);
      ctx.strokeStyle = g;
      /* عكسُ الاتّجاه: تمتلئ الحلقةُ يمينًا كما يُقرأ العربيّ */
      ctx.beginPath(); ctx.arc(cx, cy, rad, t - sweep, t); ctx.stroke();
    }
    ctx.lineWidth = 1; ctx.strokeStyle = alpha(p.gold, 0.2);
    ctx.beginPath(); ctx.arc(cx, cy, rad - 42, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    if (big) text(ctx, big, cx, cy + 46, 140, p['gold-lit'], 'center', '700', true);
    if (small) text(ctx, small, cx, cy + 112, 30, p['ink-mut'], 'center', '400', false);
  }

  /* ── خريطةُ المصحف: ٦٠٤ خليّةً تُقرأ من أعلى اليمين ─────────────── */
  function mushafGrid(ctx, p, y0, covered) {
    var cols = 38, cell = 17, gap = 4, step = cell + gap;
    var gw = cols * step - gap, gx = Math.round(MID - gw / 2);
    var total = App.Quran ? App.Quran.PAGES : 604;
    for (var i = 1; i <= total; i++) {
      var idx = i - 1, r = Math.floor(idx / cols), c = idx % cols;
      var x = gx + (cols - 1 - c) * step, y = y0 + r * step;
      var on = covered && covered.has && covered.has(i);
      rrect(ctx, x, y, cell, cell, 3.5);
      ctx.fillStyle = on ? p.gold : alpha(p.ink, 0.085);
      ctx.fill();
    }
    return y0 + Math.ceil(total / cols) * step;
  }

  /* ── بياناتُ البطاقات ───────────────────────────────────────────── */
  function gender() {
    var pr = App.state && App.state.profile;
    return (pr && pr.gender === 'f') ? 'f' : 'm';
  }
  /* ── الاسمُ لا يَخرج إلّا بإذنٍ صريح ──────────────────────────────
     كان اسمُ صاحبِ الحساب يُطبَع على كلِّ بطاقةٍ لمجرّدِ أنّه مكتوبٌ
     في «الإعدادات». والاسمُ هناك ليَخاطبه التطبيقُ به في شاشته، لا
     ليُنشَر في مجموعةٍ لا يَعرف أعضاءَها. وفرقُ ما بين الاثنين أنّ
     الصورةَ تُحفَظ وتُعاد إرسالُها بعد أن يَنساها صاحبُها.

     فالافتراضُ **مُطفأ**، ومن أراد اسمَه رفعه بمفتاحٍ في المعاينةِ
     يَراه ويَرى أثرَه في البطاقةِ قبل أن يُرسل. */
  function nameOn() {
    var s = App.state && App.state.settings;
    return !!(s && s.cardName);
  }
  function setNameOn(v) {
    if (!App.state) return;
    App.state.settings = App.state.settings || {};
    App.state.settings.cardName = !!v;
    App.save();
    palCache = {};
  }
  function rawName() {
    var pr = App.state && App.state.profile;
    return pr && pr.name ? String(pr.name).trim() : '';
  }
  function studentName() {
    /* بلا لقبٍ: من لم يكتب اسمَه لا يُسمّى «طالبَ القرآن» نيابةً
       عنه — تُذكَر الحلقةُ أو يُترك الموضعُ خاليًا. */
    return nameOn() ? rawName() : '';
  }
  function kindOf(plan) {
    var K = (App.Plans && App.Plans.KINDS) || {};
    var k = plan && K[plan.kind];
    return (k && k.t) || 'منهج';
  }
  function safePct(plan) {
    try { return Math.max(0, Math.min(100, App.Plans.pct(plan) || 0)); } catch (e) { return 0; }
  }
  function safeTotal(plan) {
    try { return App.Plans.total(plan) || 0; } catch (e) { return 0; }
  }
  /* كان الفاصلُ نقطةً وسطى، فرُسم على اللوحة بحجم «٠» وفي موضعه،
     فقُرئت «ح · ث · خ» «ح٠ث٠خ» — وهو عينُ اللبسِ الذي نَحذره.
     فصارت الفاصلةُ العربيّةُ فاصلًا لا يُشبه رقمًا، والأيّامُ القليلةُ
     تُكتب بأسمائها فلا تُفَكّ حروفُها أصلًا. */
  function daysLabel(plan) {
    var d = (plan && plan.days) || [];
    if (!d.length) return '—';
    if (d.length === 7) return 'كلَّ يوم';
    var s = d.slice().sort(function (a, b) { return a - b; });
    var names = s.length <= 3;
    return s.map(function (i) {
      return (names ? App.DAY_NAME[i] : App.DAY_SHORT[i]) || '';
    }).filter(Boolean).join('، ');
  }
  function doneToday(plan) {
    try {
      if (App.Plans.doneToday) return App.Plans.doneToday(plan) || 0;
    } catch (e) {}
    return (plan && plan.log && plan.log[App.dateKey()]) || 0;
  }
  function pagesWord(n) {
    /* تمييزُ العدد: صفحةٌ، صفحتان، ثمّ صفحات — فالعربيّةُ لا تُجمع كالإنجليزيّة */
    if (n === 1) return 'صفحةٌ واحدة';
    if (n === 2) return 'صفحتان';
    if (n >= 3 && n <= 10) return App.ar(n) + ' صفحات';
    return App.ar(n) + ' صفحة';
  }
  function daysWord(n) {
    if (n === 1) return 'يومٌ واحد';
    if (n === 2) return 'يومان';
    if (n >= 3 && n <= 10) return App.ar(n) + ' أيّام';
    return App.ar(n) + ' يومًا';
  }
  function todayStamp() {
    try { return App.hijri(new Date()); } catch (e) { return ''; }
  }
  /* الميلاديُّ بجوارِ الهجريّ: البطاقةُ تُحفَظ سنين، ومن يَفتحها بعدُ
     قد لا يُحسن ردَّ «٨ جمادى الآخرة» إلى يومٍ يَعرفه. والهجريُّ
     أوّلًا لأنّه تاريخُ هذا العمل، والميلاديُّ خادمٌ له لا بديلٌ عنه.
     والفاصلُ من ‎App.join‎: الميلاديُّ يبدأ برقمٍ هنديٍّ فالنقطةُ
     الوسطى قبلَه تُقرأ صفرًا — «١٤٤٨ هـ · ١٨» تَصير «١٨٠». */
  function todayGreg() {
    /* «م» تُلحَق هنا لا في النواة: ‎App.greg‎ تُستعمَل في الشاشةِ حيث
       لا يُلتبس التقويم، وعلى البطاقةِ يَقع السطران متجاورَين فيجب
       أن يُعرَف أيُّهما أيّ — والهجريُّ يَحمل «هـ» من ‎Intl‎ أصلًا. */
    try { var s = App.greg(new Date()); return s ? s + ' م' : ''; }
    catch (e) { return ''; }
  }
  function bothDates() { return App.join(todayStamp(), todayGreg()); }

  /* ── أربعُ بطاقات ───────────────────────────────────────────────── */

  function drawPlan(ctx, plan, g, p) {
    plan = plan || {};
    var pct = safePct(plan), tot = safeTotal(plan), done = Math.min(tot, plan.done || 0);
    var title = plan.title || (App.Plans.titleFor ? safeTitle(plan) : '') || 'منهجٌ جديد';
    var pj = {};
    try { pj = App.Plans.project(plan) || {}; } catch (e) { pj = {}; }

    chrome(ctx, p, g, 'منهجُ ' + kindOf(plan), studentName());
    ring(ctx, p, MID, 560, 198, pct, App.ar(pct) + '٪', 'من المنهج');

    var tb = fit(ctx, title, CW, 64, 2, '700', true, 34);
    put(ctx, tb, MID, 848, 76, 'center', p.ink);

    var endLine = pj.done ? 'تمَّ بفضل الله' : (pj.bad ? '—' : (pj.hij || '—'));
    rows(ctx, p, [
      ['المنجَز', App.ar(done) + ' من ' + pagesWord(tot)],
      ['وردُ الجلسة', pagesWord(plan.rate || 0)],
      ['أيّامُ الأسبوع', daysLabel(plan)],
      ['يومُ الختام', endLine]
    ], 964, 62);

    footer(ctx, p, bothDates());
  }

  function safeTitle(plan) {
    try { return App.Plans.titleFor(plan); } catch (e) { return ''; }
  }

  function drawDay(ctx, g, p) {
    var plans = (App.state && App.state.plans) || [];
    var items = [], sum = 0;
    plans.forEach(function (pl) {
      var n = doneToday(pl);
      /* App.join يَختار الفاصل: عنوانُ المنهج قد يبدأ برقمٍ عربيٍّ هنديٍّ
         («٣ أجزاء») والنقطةُ الوسطى قبلَه تُقرأ صفرًا. */
      if (n > 0) { sum += n; items.push([App.join(kindOf(pl), planTitle(pl)), pagesWord(n)]); }
    });
    var streak = 0;
    try { streak = App.Plans.streak() || 0; } catch (e) {}

    chrome(ctx, p, g, 'وردُ اليوم', studentName());

    /* الرقمُ هو البطل: يُقرأ من مسافةِ إبهامٍ في قائمة المحادثات */
    text(ctx, App.ar(sum), MID, 620, 260, p['gold-lit'], 'center', '700', true);
    text(ctx, sum === 0 ? 'لم يُسجَّل وردٌ بعد' : 'صفحةً اليوم', MID, 696, 44, p['ink-mut'], 'center', '400', false);

    var tb = fit(ctx, todayStamp(), CW, 46, 2, '400', true, 28);
    put(ctx, tb, MID, 800, 56, 'center', p.ink);

    var list = items.slice(0, 3);
    list.push(['المواظبة', streak ? daysWord(streak) : 'ابدأ اليوم']);
    if (items.length > 3) list.splice(3, 0, ['ومناهجُ أخرى', App.ar(items.length - 3)]);
    rows(ctx, p, list.slice(0, 4), 964, 62);

    footer(ctx, p, sum > 0 ? 'الحمدُ لله على التمام' : '');
  }

  function drawJourney(ctx, g, p) {
    var total = (App.Quran && App.Quran.PAGES) || 604;
    var covered = null, n = 0;
    try { covered = App.Plans.coveredPages(); n = covered ? covered.size : 0; } catch (e) {}
    var pct = total ? Math.round(n / total * 100) : 0;
    var streak = 0;
    try { streak = App.Plans.streak() || 0; } catch (e) {}
    var plans = (App.state && App.state.plans) || [];

    chrome(ctx, p, g, 'رحلتي في المصحف', studentName());

    text(ctx, App.ar(pct) + '٪', MID, 430, 170, p['gold-lit'], 'center', '700', true);
    text(ctx, 'من المصحف كلِّه', MID, 490, 36, p['ink-mut'], 'center', '400', false);

    /* الخريطةُ تُقرأ من أعلى اليمين كصفحاتِ المصحف — كلُّ مربّعٍ صفحة */
    mushafGrid(ctx, p, 552, covered);

    rows(ctx, p, [
      ['المنجَز', App.ar(n) + ' من ' + pagesWord(total)],
      ['المواظبة', streak ? daysWord(streak) : '—'],
      ['المناهجُ القائمة', plans.length ? App.ar(plans.length) : '—']
    ], 1020, 62);

    footer(ctx, p, bothDates());
  }

  function drawCircle(ctx, circle, g, p) {
    var mem = (circle && circle.members) || [];
    var sorted = mem.slice().sort(function (a, b) { return (b.pages || 0) - (a.pages || 0); });
    var sum = 0;
    sorted.forEach(function (m) { sum += (m.pages || 0); });

    chrome(ctx, p, g, 'حلقتي', studentName());

    var nb = fit(ctx, (circle && circle.name) || 'لا حلقةَ بعد', CW, 62, 2, '700', true, 34);
    put(ctx, nb, MID, 392, 74, 'center', p.ink);

    text(ctx, App.ar(sum), MID, 578, 150, p['gold-lit'], 'center', '700', true);
    text(ctx, 'صفحةً جمعتها الحلقة', MID, 636, 34, p['ink-mut'], 'center', '400', false);

    /* رتبةٌ ثمّ اسم: نقطةُ ترقيمٍ لا نقطةٌ وسطى، فالوسطى بعد رقمٍ
       عربيٍّ هنديٍّ تُقرأ صفرًا فيصير «١ ·» عشرةً. */
    var list = sorted.slice(0, 5).map(function (m, i) {
      return [App.ar(i + 1) + '. ' + (m.name || 'عضو'), pagesWord(m.pages || 0)];
    });
    if (!list.length) list = [['الأعضاء', '—'], ['الدعوة', 'شارِك رابطَ الحلقة']];
    /* عددُ الرفاق يتبدّل، فلو ثبتَ المبدأُ تركت حلقةُ الثلاثةِ ربعَ
       البطاقة خاليًا أسفلَها فبدت ناقصةً لا هادئة. فيُركَّز الجدولُ
       في الفراغ الذي تحت المجموع مهما كان عددُهم. */
    var LH = 72, TOP = 740;
    var y0 = Math.round(TOP + Math.max(0, (ROWS_END - TOP) - (list.length - 1) * LH) / 2);
    rows(ctx, p, list, y0, LH);

    var sub = mem.length ? App.ar(mem.length) + ' من الأعضاء' : '';
    footer(ctx, p, sub || bothDates());
  }

  /* ── النصُّ البديل: نفسُ الحقائق لمن لا يريد صورة ──────────────── */
  function planText(plan) {
    plan = plan || {};
    var tot = safeTotal(plan), done = Math.min(tot, plan.done || 0), pj = {};
    try { pj = App.Plans.project(plan) || {}; } catch (e) {}
    /* العنوانُ من titleFor كما في اللوحة: plan.title قد يكون فارغًا
       فيطبع النصُّ «منهجُ حفظ — منهج» وهي كلمةٌ لا تدلّ على شيء. */
    return ['منهجُ ' + kindOf(plan) + ' — ' + planTitle(plan),
      'المنجَز: ' + App.ar(done) + ' من ' + pagesWord(tot) + ' (' + App.ar(safePct(plan)) + '٪)',
      'وردُ الجلسة: ' + pagesWord(plan.rate || 0),
      pj.done ? 'تمَّ بفضل الله' : (pj.hij ? 'يومُ الختام: ' + pj.hij : ''),
      '', 'رتِّل وارتقِ'].filter(function (l) { return l !== ''; }).join('\n');
  }
  function dayText() {
    var plans = (App.state && App.state.plans) || [], sum = 0, ls = [];
    plans.forEach(function (pl) {
      var n = doneToday(pl);
      if (n > 0) { sum += n; ls.push('• ' + App.join(kindOf(pl), planTitle(pl)) + ': ' + pagesWord(n)); }
    });
    var st = 0; try { st = App.Plans.streak() || 0; } catch (e) {}
    return ['وردُ اليوم — ' + todayStamp(),
      sum ? 'المجموع: ' + pagesWord(sum) : 'لم يُسجَّل وردٌ بعد'].concat(ls)
      .concat([st ? 'المواظبة: ' + daysWord(st) : '', '', 'رتِّل وارتقِ'])
      .filter(function (l) { return l !== ''; }).join('\n');
  }
  function journeyText() {
    var total = (App.Quran && App.Quran.PAGES) || 604, n = 0, st = 0;
    try { var c = App.Plans.coveredPages(); n = c ? c.size : 0; } catch (e) {}
    try { st = App.Plans.streak() || 0; } catch (e) {}
    return ['رحلتي في المصحف',
      'المنجَز: ' + App.ar(n) + ' من ' + pagesWord(total) +
        ' (' + App.ar(total ? Math.round(n / total * 100) : 0) + '٪)',
      st ? 'المواظبة: ' + daysWord(st) : '', '', 'رتِّل وارتقِ']
      .filter(function (l) { return l !== ''; }).join('\n');
  }
  function circleText(circle) {
    var mem = (circle && circle.members) || [], sum = 0;
    mem.forEach(function (m) { sum += (m.pages || 0); });
    var ls = mem.slice().sort(function (a, b) { return (b.pages || 0) - (a.pages || 0); })
      .slice(0, 5).map(function (m, i) {
        return App.ar(i + 1) + '. ' + (m.name || 'عضو') + ': ' + pagesWord(m.pages || 0);
      });
    return [circleTitle(circle),
      'مجموعُ الحلقة: ' + pagesWord(sum)].concat(ls)
      .concat(['', 'رتِّل وارتقِ']).filter(function (l) { return l !== ''; }).join('\n');
  }

  /* التعليقُ المرفقُ بالصورة قصير: واتساب يقصّ الطويل.
     والوصلُ بـApp.join لأنّ الاسمَ قد ينتهي برقمٍ عربيٍّ هنديٍّ فتُقرأ
     النقطةُ الوسطى بعده صفرًا. */
  function caption(kind, payload) {
    var nm = studentName();
    if (kind === 'plan') {
      var pl = payload || {};
      return App.join('منهجُ ' + kindOf(pl) + ' — ' + planTitle(pl) + ': ' +
                      App.ar(safePct(pl)) + '٪ بإذن الله', nm, 'رتِّل وارتقِ');
    }
    if (kind === 'day') {
      var sum = 0;
      ((App.state && App.state.plans) || []).forEach(function (q) { sum += doneToday(q); });
      return App.join('وردُ اليوم: ' + pagesWord(sum), nm, 'رتِّل وارتقِ');
    }
    if (kind === 'circle') {
      return App.join(circleTitle(payload), nm, 'رتِّل وارتقِ');
    }
    if (kind === 'mark') {
      return App.join(Card() ? Card().line(payload) : '', nm, 'رتِّل وارتقِ');
    }
    var total = (App.Quran && App.Quran.PAGES) || 604, n = 0;
    try { var c = App.Plans.coveredPages(); n = c ? c.size : 0; } catch (e) {}
    return App.join('رحلتي في المصحف: ' +
      App.ar(total ? Math.round(n / total * 100) : 0) + '٪', nm, 'رتِّل وارتقِ');
  }

  /* ── المحرّك ─────────────────────────────────────────────────────── */
  /* ‎App.Card‎ وحدةٌ تالية (‎71‎) تُحمَّل بعدنا، فتُسأل عند الرسمِ لا
     عند التعريف. وإن غابت فالبطاقةُ تَرجع إلى «الرحلة» ولا تَسقط. */
  function Card() { return App.Card || null; }

  var KINDS = {
    plan:    { title: 'بطاقةُ المنهج',  draw: function (c, pl, g, p) { drawPlan(c, pl, g, p); },  txt: function (pl) { return planText(pl); } },
    day:     { title: 'بطاقةُ اليوم',   draw: function (c, pl, g, p) { drawDay(c, g, p); },        txt: function () { return dayText(); } },
    journey: { title: 'بطاقةُ الرحلة',  draw: function (c, pl, g, p) { drawJourney(c, g, p); },    txt: function () { return journeyText(); } },
    circle:  { title: 'بطاقةُ الحلقة',  draw: function (c, pl, g, p) { drawCircle(c, pl, g, p); }, txt: function (pl) { return circleText(pl); } },
    /* خَتْمُ التمام: بطاقةٌ تُعطى مرّةً لِما لا يَتكرّر، لا في كلِّ يوم */
    mark:    { title: 'خَتْمُ التمام',  draw: function (c, m, g, p) { Card().draw(c, m, g, p); },  txt: function (m) { return Card().text(m); } }
  };

  function normalize(kind, payload) {
    kind = KINDS[kind] ? kind : 'journey';
    if (kind === 'mark') {
      if (!Card()) return { kind: 'journey', payload: null };
      payload = Card().resolve(payload);
      if (!payload) return { kind: 'journey', payload: null };
    }
    if (kind === 'circle' && !payload) {
      payload = ((App.state && App.state.circles) || [])[0] || null;
    }
    if (kind === 'plan' && !payload) {
      payload = ((App.state && App.state.plans) || [])[0] || null;
    }
    return { kind: kind, payload: payload };
  }

  function identityFor(kind, payload) {
    /* بطاقةُ حلقةٍ قد تحمل هويّةَ الحلقة لا هويّةَ صاحبها */
    if (kind === 'circle' && payload && (payload.gender === 'f' || payload.gender === 'm')) return payload.gender;
    return gender();
  }

  /* ── قياسُ التصدير: واحدٌ لا كثافةُ الشاشة ───────────────────────
     كان يُضرَب في ‎devicePixelRatio‎ فيَخرج لوحُ ٢١٦٠×٢٧٠٠ ومعه PNG
     **٣٫٣ ميغابايت**. وذاك خطأٌ محضٌ لا جودة: ١٠٨٠×١٣٥٠ هو مقاسُ
     التصميمِ نفسُه، وهو أصلًا ضِعفا ما يَعرضه واتساب ونحوُه. فما زاد
     لا يُرى، ويُرى فقط في عدّادِ البيانات وفي الرفعِ على شبكةٍ ضعيفة
     — ويُضاعف زمنَ ‎toBlob‎ أربعةَ أضعاف.

     والمعاينةُ على الشاشةِ تُعرَض في ٤٢٠ بكسلًا، و١٠٨٠ لها ٢٫٦ ضعفًا
     فلا تَنكسر على شاشةٍ كثيفة. */
  function scale() { return 1; }

  function render(canvas, kind, payload) {
    var n = normalize(kind, payload), g = identityFor(n.kind, n.payload), p = palette(g);
    var s = scale();
    canvas.width = Math.round(W * s);
    canvas.height = Math.round(H * s);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, W, H);
    try { KINDS[n.kind].draw(ctx, n.payload, g, p); }
    catch (e) {
      /* لا تُسقط الشاشةَ لأجل بطاقة: أرضٌ نظيفةٌ وعلامةٌ خيرٌ من فراغ */
      ctx.fillStyle = p.ground; ctx.fillRect(0, 0, W, H);
      footer(ctx, p, '');
    }
    return canvas;
  }

  /* عنوانُ المنهج: نفسُ ما يُعرض في التطبيق. وصحيفةُ المنهج تُقدّم
     ما سمّاه الطالبُ بنفسه وترجع إلى titleFor إن خلا — فلو قلبنا
     الترتيبَ هنا أرسلَ «الجزء ١» وهو يَرى «الجزءُ الأوّل». */
  function planTitle(pl) {
    var t = pl && pl.title ? String(pl.title).trim() : '';
    if (t) return t;
    try { return App.Plans.titleFor(pl) || 'منهج'; } catch (e) { return 'منهج'; }
  }
  /* «حلقة حلقة الفجر» تكرارٌ ركيك: الكلمةُ تُضاف إن لم يبدأ بها الاسم */
  function circleTitle(c) {
    var nm = (c && c.name || '').trim();
    if (!nm) return 'حلقة';
    return /^حلق(ة|تي)\b|^حلقة/.test(nm) ? nm : 'حلقة ' + nm;
  }

  function makeCanvas(kind, payload) {
    var c = document.createElement('canvas');
    return render(c, kind, payload);
  }

  function toBlob(canvas) {
    return new Promise(function (res) {
      if (canvas.toBlob) canvas.toBlob(function (b) { res(b); }, 'image/png');
      else res(null);
    });
  }

  function fileName(kind) { return 'irtaqi-' + kind + '.png'; }

  function download(blob, name) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }

  function waLink(cap) { return 'https://wa.me/?text=' + encodeURIComponent(cap); }

  function copyText(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(str).then(function () { return true; },
        function () { return legacyCopy(str); });
    }
    return Promise.resolve(legacyCopy(str));
  }
  function legacyCopy(str) {
    try {
      var t = document.createElement('textarea');
      t.value = str; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.inset = 'auto'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, str.length);
      var ok = document.execCommand && document.execCommand('copy');
      t.remove(); return !!ok;
    } catch (e) { return false; }
  }

  /* هل يَقبل هذا المتصفّحُ مشاركةَ ملفٍّ أصلًا؟ وجودُ navigator.share
     لا يَعني قبولَ الصور: متصفّحاتُ الحاسوب تُعلنها وتردُّ الملفّات.
     فلا يُفترض شيءٌ، بل يُسأل canShare عن هذا الملفِّ بعينه. */
  function fileOf(blob, kind) {
    if (!blob || !window.File || !navigator.share || !navigator.canShare) return null;
    var f;
    try { f = new File([blob], fileName(kind), { type: 'image/png' }); } catch (e) { return null; }
    try { return navigator.canShare({ files: [f] }) ? f : null; } catch (e) { return null; }
  }

  /* الصورةُ أجملُ ما يُرسَل، فتُجرَّب المشاركةُ الأصليّةُ أوّلًا — ولوحُ
     النظام يَعرض واتساب فيها هدفًا. وإن رُدَّت تولّى البديلُ. */
  function shareImage(blob, kind, cap, onNo) {
    var f = fileOf(blob, kind);
    if (!f) { onNo(); return false; }
    navigator.share({ files: [f], text: cap }).then(null, function (err) {
      if (err && err.name === 'AbortError') return;  /* أغلق اللوحَ بنفسه: لا بديلَ يُفرض عليه */
      onNo();
    });
    return true;
  }

  /* البديلُ صادقٌ لا صامت: النصُّ ذاهبٌ إلى واتساب بالرابط، والبطاقةُ
     تُحفَظ في الجهاز ليُرفقها بيده — ويُقال له ذلك صريحًا. */
  function saveAndTell(blob, kind) {
    if (blob && download(blob, fileName(kind))) {
      App.toast('حُفظت البطاقةُ في جهازك — أرفقها في المحادثة');
    } else {
      App.toast('ذهب النصُّ إلى واتساب، وللبطاقةِ زرُّ «حفظُ البطاقة»');
    }
  }

  /* ── شاشةُ المعاينة ─────────────────────────────────────────────── */
  /* الرجوعُ يَحفظ المعاملاتِ لا الاسمَ وحدَه: المعاينةُ تُفتح غالبًا من
     صحيفة المنهج، وApp.go('plan') بلا معرّفٍ يُظهر «لم نجد هذا المنهج».
     فالرجوعُ إلى صحيفةٍ يُعيدها بمعرّفها، وإلى لسانٍ يُغلق الصحيفةَ فقط. */
  var back = { name: 'home', params: null, sheet: false };
  var live = null;                 /* لوحُ المعاينة القائم: يُعاد لمن نادى بطاقةً */
  var noMotion = false;
  try { noMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches; } catch (e) {}

  function remember() {
    var r = App.route();
    if (r && r.name && r.name !== 'share') {
      back = { name: r.name, params: r.params || null, sheet: !!r.sheet };
    }
  }
  function goBack() {
    if (back.sheet) { App.go(back.name, back.params); return; }
    App.closeSheet();
  }

  function btn(label, iconKey, cls, fn) {
    var b = App.el('button', 'btn btn-block ' + (cls || ''), App.icon(iconKey, 21));
    b.type = 'button';
    b.appendChild(App.el('span')).textContent = label;
    b.onclick = fn;
    return b;
  }

  /* زرُّ واتساب رابطٌ حقيقيٌّ لا window.open: مانعُ النوافذ يأكل ما
     يُفتح بالشيفرة بعد أيِّ انتظار، أمّا الوسمُ <a> فيَفتح دائمًا.
     والنصُّ يُلفّ بencodeURIComponent فيَصل العربيُّ سليمًا. */
  function waAnchor(label, txt) {
    var a = App.el('a', 'btn btn-block btn-wa', App.icon('whatsapp', 21));
    a.href = waLink(txt);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.appendChild(App.el('span')).textContent = label;
    return a;
  }

  App.screen('share', function (params) {
    params = params || {};
    var n = normalize(params.kind, params.payload);
    var meta = KINDS[n.kind];
    var wrapEl = App.el('div', 'screen');

    /* الرجوعُ أوّلًا كما في بقيّة الصحائف: المعاينةُ صحيفةٌ فوق ما كان */
    var bar = App.el('div', 'bar');
    var isBack = back.sheet;
    var close = App.el('button', 'btn btn-ghost', App.icon(isBack ? 'chevron' : 'close', 20));
    close.type = 'button';
    close.appendChild(App.el('span')).textContent = isBack ? 'رجوع' : 'إغلاق';
    close.setAttribute('aria-label', isBack ? 'رجوعٌ من المعاينة' : 'إغلاق المعاينة');
    close.onclick = goBack;
    var h = App.el('h1', 'h2', meta.title);
    h.style.margin = '0';
    bar.appendChild(close); bar.appendChild(h);
    wrapEl.appendChild(bar);

    var sec = App.el('div', 'sec');

    /* المعاينة: الكانفاسُ نفسُه مُقَلَّصٌ بالعرض — ما يراه هو ما يُرسل */
    var frame = App.el('div');
    frame.style.cssText = 'margin:0 auto;max-width:min(100%,420px);border-radius:var(--r-lg,20px);' +
      'overflow:hidden;border:1px solid var(--hair);background:var(--surface);';
    var cv = document.createElement('canvas');
    cv.style.cssText = 'display:block;width:100%;height:auto;';
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', meta.title + ' — صورةٌ جاهزةٌ للمشاركة');
    if (!noMotion) {
      cv.style.opacity = '0';
      cv.style.transition = 'opacity var(--mid,.26s) var(--ease,ease)';
      requestAnimationFrame(function () { cv.style.opacity = '1'; });
    }
    frame.appendChild(cv);
    sec.appendChild(frame);

    var hint = App.el('p', 'small',
      'يَصل النصُّ إلى واتساب فورًا، وتُرسَل البطاقةُ صورةً إن سمح جهازُك، '
      + 'وإلّا حُفظت لك لترفقها.');
    hint.style.cssText = 'text-align:center;margin:14px 0 2px;';
    sec.appendChild(hint);

    /* ── مفتاحُ الاسم ───────────────────────────────────────────────
       موضعُه المعاينةُ لا «الإعدادات»: القرارُ يُتّخذ والبطاقةُ أمام
       عينه، فيَرى اسمَه يَظهر ويَختفي قبل أن يُرسل. ومن وضعه في
       الإعدادات وضعَه حيث لا يُذكَر وقتَ الحاجة.
       وهو مُطفأٌ لمن لم يَرفعه قطّ، فالصمتُ ليس إذنًا. */
    var who = rawName();
    if (who) {
      var row = App.el('div', 'setrow card');
      row.style.cssText = 'margin-top:14px;padding:10px 14px;';
      var lab = App.el('div', 'grow');
      var lb = App.el('div'); lb.textContent = 'اسمي على البطاقة';
      var ls = App.el('div', 'small'); ls.textContent = nameOn()
        ? 'يَظهر «' + who + '» لكلِّ من تَصله الصورة'
        : 'لا يَخرج اسمُك في الصورة';
      lab.appendChild(lb); lab.appendChild(ls);
      var sw = App.el('button', 'switch');
      sw.type = 'button';
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', String(nameOn()));
      sw.setAttribute('aria-label', 'إظهارُ اسمي على البطاقة');
      sw.onclick = function () {
        setNameOn(!nameOn());
        sw.setAttribute('aria-checked', String(nameOn()));
        ls.textContent = nameOn()
          ? 'يَظهر «' + who + '» لكلِّ من تَصله الصورة'
          : 'لا يَخرج اسمُك في الصورة';
        draw();
        cap = caption(n.kind, n.payload);
        try { txt = meta.txt(n.payload); } catch (e2) {}
        wa.href = waLink(txt);
      };
      row.appendChild(lab); row.appendChild(sw);
      sec.appendChild(row);
    }

    /* ── خَتْماتٌ أخرى: الأثرُ يَبقى ولا يَمضي مع لحظتِه ─────────────
       محطّةُ التمامِ تُعلَن في لوحٍ يَغيب بعد ثلاثِ ثوانٍ ولا يُستعاد.
       وهذه الصفوفُ تُحصى من الحالةِ لا تُخزَّن، فكلُّ جزءٍ تمَّ يومًا
       يَبقى له خَتْمٌ يُستخرَج متى شاء صاحبُه. */
    if (n.kind === 'mark' && Card()) {
      var all = Card().marks();
      if (all.length > 1) {
        var picks = App.el('div');
        picks.style.cssText = 'display:flex;gap:8px;overflow-x:auto;margin-top:14px;'
          + 'padding-bottom:4px;-webkit-overflow-scrolling:touch;';
        picks.setAttribute('role', 'tablist');
        picks.setAttribute('aria-label', 'خَتْماتٌ بلغتَها');
        all.slice(0, 12).forEach(function (m) {
          var c2 = App.el('button', 'btn btn-ghost');
          c2.type = 'button';
          c2.style.cssText = 'flex:0 0 auto;white-space:nowrap;min-height:44px;';
          c2.textContent = Card().chip(m);
          c2.setAttribute('role', 'tab');
          /* ‎btn-ghost‎ تُنزَع ولا يُكتفى بإضافةِ ‎btn-gold‎: قاعدتُها
             بعدَها في الورقةِ وبخصوصيّةٍ مثلِها فتَغلبها، فكانت رقعةُ
             المختارِ تُضاف ولا تُرى — والصفُّ كلُّه سواء. */
          function lit(el, on) {
            el.setAttribute('aria-selected', String(on));
            el.classList.toggle('btn-gold', on);
            el.classList.toggle('btn-ghost', !on);
          }
          lit(c2, Card().same(m, n.payload));
          c2.onclick = function () {
            n.payload = m;
            App.$$('[role="tab"]', picks).forEach(function (o) { lit(o, false); });
            lit(c2, true);
            draw();
            cap = caption(n.kind, n.payload);
            try { txt = meta.txt(n.payload); } catch (e2) {}
            wa.href = waLink(txt);
          };
          picks.appendChild(c2);
        });
        sec.appendChild(picks);
      }
    }

    var acts = App.el('div');
    acts.style.cssText = 'display:grid;gap:10px;margin-top:14px;';

    var blob = null, cap = caption(n.kind, n.payload), txt = '';
    try { txt = meta.txt(n.payload); } catch (e) { txt = 'رتِّل وارتقِ'; }

    function draw() {
      render(cv, n.kind, n.payload);
      live = cv;
      blob = null;
      toBlob(cv).then(function (b) { blob = b; });
    }
    draw();
    /* إن تأخّر الخطُّ لحظةً أُعيد الرسمُ بعد جهوزه، فلا تُقاس الأحرفُ بخطٍّ بديل */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { if (cv.isConnected) draw(); });
    }

    /* الفعلُ الأوّل: رابطُ واتساب يَحمل نصَّ البطاقة كاملًا، فلو لم
       تُرسَل الصورةُ وصلت الخطّةُ مقروءةً على كلِّ حال. والصورةُ
       تُشارَك أصليًّا إن قَبِلها الجهاز، وإلّا حُفظت والرابطُ ماضٍ. */
    var wa = waAnchor('أرسِل في واتساب', txt);
    wa.onclick = function (e) {
      var sent = shareImage(blob, n.kind, cap, function () { saveAndTell(blob, n.kind); });
      /* نجحت المشاركةُ الأصليّة: لا يُفتح واتساب مرّتين */
      if (sent) e.preventDefault();
    };
    acts.appendChild(wa);

    acts.appendChild(btn('حفظُ البطاقة صورةً', 'download', 'btn-gold', function () {
      function go2(b) {
        if (b && download(b, fileName(n.kind))) App.toast('حُفظت البطاقةُ في جهازك');
        else App.toast('تعذّر حفظُ الصورة — انسخ النصَّ وأرسله');
      }
      if (blob) go2(blob); else toBlob(cv).then(function (b) { blob = b; go2(b); });
    }));
    acts.appendChild(btn('نسخُ النصّ', 'copy', 'btn-ghost', function () {
      copyText(txt).then(function (ok) {
        App.toast(ok ? 'نُسخ النصُّ' : 'تعذّر النسخ');
      });
    }));
    sec.appendChild(acts);
    wrapEl.appendChild(sec);

   والامتحانُ غيرُه: جوابٌ يُقاس بميزانٍ خارجِ النفس، ومنه تُعرَف

       الخاطئُ **آيةٌ أخرى صحيحةٌ** من موضعٍ آخر. وأصدقُ المُلهِياتِ
       المتشابهاتُ: هي ما يَزِلّ فيه اللسانُ حقًّا، فتُقدَّم على
       غيرِها في كلِّ سؤال.

   ٢ — **الاختيارُ من متعدّدٍ لا الاستظهارُ المفتوح.** والاستظهارُ
       أصدقُ، لكنّه لا يُقاس إلّا بإقرارِ صاحبِه — وذاك موجودٌ في
       «التسميع» ولا يُعاد هنا. والامتحانُ إنّما وُضع ليُخرِج رقمًا
