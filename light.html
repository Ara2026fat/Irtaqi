     تُقرأ قبل كلِّ شيءٍ وتُمحى فورًا: تحديثُ الصفحة بعدها لا يُعيد
     الانضمام، ورابطٌ منسوخٌ في السجلّ لا يبقى حاملًا لحلقة. */
  var pending = null;

  function clearHash() {
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {
      try { location.hash = ''; } catch (e2) {}
    }
  }

  (function captureHash() {
    var h = '';
    try { h = String(location.hash || ''); } catch (e) { return; }
    var i = h.indexOf('join=');
    if (i < 0) return;
    var raw = h.slice(i + 5).split('&')[0];
    clearHash();
    if (raw) pending = raw.slice(0, MAX_PAYLOAD + 1);
  })();

  function runPending() {
    if (!pending) return;
    if (!me()) return;                 /* يُنتظر إنشاءُ الملفّ ثمّ يُستأنف */
    var raw = pending; pending = null;
    var r = join(raw);
    if (!r.ok) {
      /* الرفضُ يُشرَح في مكانه لا يَمرّ إشعارًا: من فتح رابطًا ليس له
         يَحتاج أن يَقرأ لماذا رُدَّ، لا أن يُقال له «غير صالح» ويَذهب. */
      notice = r.msg;
      App.toast(r.msg);
      App.go('circles');
      return;
    }
    App.toast(r.already ? 'أنت في هذه الحلقة بالفعل.' : 'انضممتَ إلى ' + r.circle.name + '.');
    App.go('circle', { id: r.circle.id });
  }

  /* أوّلُ رسمةٍ هي أوّلُ لحظةٍ يصحّ فيها التنقّلُ والإشعار */
  var first = true;
  App.on_('drawn', function () {
    if (!first) return;
    first = false;
    if (pending) setTimeout(runPending, 0);
  });
  /* إن لم يكن ثَمّ ملفٌّ بعد، استُؤنفت الدعوةُ لحظةَ إنشائه */
  App.on_('save', function () { if (pending && me()) setTimeout(runPending, 0); });

  /* واجهةٌ صغيرةٌ للفحص الآليّ وللوحدات التي تحتاج حسابَ الحلقة */
  App.Circles = {

    addMate: addMate, setPages: setPages,

  };
})(window.App);

  /* كلُّ ما سُجّل: مفتاحُ يومٍ ← صفحات، مجموعًا من كلّ المناهج */
  function allLogs() {
    var m = {};
    (App.state.plans || []).forEach(function (p) {
      var lg = p.log || {};
      for (var k in lg) if (lg[k] > 0) m[k] = (m[k] || 0) + lg[k];
    });
    return m;
  }

  /* تجميعُ المناهج بنوعها: الطالبُ يسأل «أين أنا من حفظي؟» لا عن
     منهجٍ بعينه، وقد يكون له في النوع الواحد منهجان. */
  function byKind() {
    var out = {};
    (App.state.plans || []).forEach(function (p) {
      var k = P.KINDS[p.kind] ? p.kind : 'hifz';
      var g = out[k] || (out[k] = { kind: k, done: 0, total: 0, n: 0, today: 0 });
      g.done += (p.done || 0);
      g.total += P.total(p);
      g.today += (p.log && p.log[App.dateKey()]) || 0;
      g.n++;
    });
    return out;
  }

  /* مَن يحتاج انتباهًا: أبعدُ منهجٍ عن وتيرته المرسومة.
     المتوقَّعُ = المقدارُ × أيّامُ العمل المنقضية، والفارقُ هو الدَّين. */
  function needsCare() {
    var worst = null;
    (App.state.plans || []).forEach(function (p) {
      if (!p.days || !p.days.length || !p.rate) return;
      var st = p.startedAt && /^\d{4}-\d{2}-\d{2}$/.test(p.startedAt)
        ? p.startedAt.split('-') : null;
      if (!st) return;
      var d = new Date(+st[0], +st[1] - 1, +st[2], 12);
      var today = new Date(); today.setHours(12, 0, 0, 0);
      var due = 0, guard = 0;
      while (d <= today && guard++ < 3000) {
        if (p.days.indexOf(d.getDay()) >= 0) due += p.rate;
        d.setDate(d.getDate() + 1);
      }
      var debt = due - (p.done || 0);
      if (debt > 0 && (!worst || debt > worst.debt)) worst = { plan: p, debt: debt };
    });
    return worst;
  }

  /* صيغُ العدد العربيّةُ الأربع: «٢ صفحة» ركيكةٌ و«صفحتان» صواب */
  function pages(n) {
    if (n === 1) return 'صفحةٌ واحدة';
    if (n === 2) return 'صفحتان';
    if (n >= 3 && n <= 10) return ar(n) + ' صفحات';
    return ar(n) + ' صفحة';
  }

  /* العددُ من ثلاثةٍ إلى عشرةٍ يأخذ جمعَ القلّة: «٧ جلسات» لا «٧ جلسة» */
  function sessions(n) {
    if (n === 1) return 'جلسةً واحدة';
    if (n === 2) return 'جلستَين';
    if (n >= 3 && n <= 10) return ar(n) + ' جلسات';
    return ar(n) + ' جلسة';
  }

  /* ‎icon‎ يُستقبَل ولا يُرسَم: كانت أربعُ أيقوناتٍ متجاورةٍ فوقَ أربعةِ
     أرقامٍ في صفٍّ واحد — تقويمٌ وصحٌّ ومخطَّطٌ ومصحف — فيَبتدئ القارئُ
     صفحةَ تقدُّمِه بأربعةِ رموزٍ يَحلُّها قبل أن يَبلغ رقمًا واحدًا.
     والرقمُ تحتَه اسمُه، فما بَقِي للرمزِ معنًى يَحمله. أُبقي الوسيطُ
     لئلّا يُغيَّر كلُّ نداءٍ لها، ولأنّ موضعَه قد يَعود. */
  function tile(icon, big, label, cls) {
    var t = el('div', 'pr-tile' + (cls ? ' ' + cls : ''));
    var b = el('b'); b.textContent = big;
    var s = el('span'); s.textContent = label;
    t.appendChild(b); t.appendChild(s);
    return t;
  }

  function sec(title, icoKey) {
    var s = el('section', 'sec');
    if (title) {
      var h = el('h2', 'sec-h h3', icoKey ? App.icon(icoKey, 18) : '');
      h.appendChild(document.createTextNode(title));
      s.appendChild(h);
    }
    return s;
  }

  /* ── البؤرة: حلقةٌ لِما بلغَه من المصحف ──────────────────────── */
  function hero(covered) {
    var pct = Math.round(covered / Q.PAGES * 100);
    var box = el('div', 'pr-hero');

    var R = 48, C = 2 * Math.PI * R;
    var ring = el('div', 'pr-ring');
    ring.innerHTML =
      '<svg viewBox="0 0 112 112" aria-hidden="true">' +
      '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke="var(--hair-2)" stroke-width="10"/>' +
      '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke="var(--gold)" stroke-width="10" ' +
      'stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" ' +
      'stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(1) + '"/></svg>';
    var n = el('div', 'pr-ring-n'); n.textContent = ar(pct) + '٪';
    ring.appendChild(n);
    ring.setAttribute('role', 'img');
    /* الخطابُ كلُّه يمرّ ببنك العبارات: كان مذكّرًا على الطالبةِ في
       كلِّ سطرٍ من هذه اللوحة — «بلغتَ» و«أنجزتَ» و«أحسنتَ». */
    ring.setAttribute('aria-label', App.Words.reachedAria(pct));

    var b = el('div', 'pr-hb');
    var t = el('h3', 'h3'); t.textContent = App.Words.reachedTitle();
    var s = el('p', 'small');
    s.textContent = ar(covered) + ' من ' + ar(Q.PAGES) + ' صفحة';
    var bar = el('div', 'pr-bar');
    var fil = el('i'); fil.style.width = Math.max(pct, covered > 0 ? 2 : 0) + '%';
    bar.appendChild(fil);
    var note = el('p', 'small');
    note.textContent = App.Words.ringNote(covered);
    b.appendChild(t); b.appendChild(s); b.appendChild(bar); b.appendChild(note);

    box.appendChild(ring); box.appendChild(b);
    return box;
  }

  /* ── صفوفُ الأنواع ──────────────────────────────────────────── */
  function kindRows() {
    /* لوحةٌ لا قائمةُ ما بدأ: كانت تَعرض الأنواعَ التي لها مناهجُ وحدَها،
       فيَرى من لم يَبدأ لوحًا فارغًا لا يُعلّمه أنّ ثَمَّ حفظًا ومراجعةً
       وتلاوةً وتثبيتًا. فتُرسَم الأربعةُ دائمًا، وما لم يُبدأ يَقف على
       صفرِه ويقول «لم يبدأ بعد» — صفٌّ ينتظر لا بياضٌ يَسكت. */
    var g = byKind(), box = el('div'), any = true;
    ['hifz', 'review', 'tilawa', 'tathbit'].forEach(function (k) {
      var d = g[k] || { done: 0, total: 0, n: 0, today: 0 };
      var K = P.KINDS[k];
      var pct = d.total ? Math.round(d.done / d.total * 100) : 0;
      var row = el('div', 'pr-k ' + K.cls);
      row.appendChild(el('span', 'pr-k-em', App.icon(K.icon, 20)));

      var b = el('div', 'pr-k-b');
      var top = el('div', 'pr-k-t');
      var nm = el('span', 'pr-k-n'); nm.textContent = K.t;
      var pc = el('span', 'pr-k-p'); pc.textContent = ar(pct) + '٪';
      top.appendChild(nm); top.appendChild(pc);
      var sub = el('span', 'pr-k-s');
      sub.textContent = d.n
        ? App.join(
            ar(d.done) + ' من ' + ar(d.total) + ' صفحة',
            d.n > 1 ? ar(d.n) + ' مناهج' : 'منهجٌ واحد',
            d.today ? 'اليومَ ' + pages(d.today) : null)
        : 'لم يبدأ بعد';
      if (!d.n) row.classList.add('pr-k-off');
      var bar = el('div', 'pr-k-bar');
      var fil = el('i'); fil.style.width = Math.max(pct, d.done > 0 ? 2 : 0) + '%';
      bar.appendChild(fil);
      b.appendChild(top); b.appendChild(sub); b.appendChild(bar);
      row.appendChild(b);
      row.setAttribute('aria-label', App.join(K.t, ar(pct) + '٪',
        ar(d.done) + ' من ' + ar(d.total) + ' صفحة'));
      box.appendChild(row);
    });
    return any ? box : null;
  }

  /* ── نموُّ أربعةَ عشرَ يومًا ─────────────────────────────────── */
  function chart(logs) {
    var N = 14, days = [], d = new Date(); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - (N - 1));
    for (var i = 0; i < N; i++) {
      days.push({ n: logs[App.dateKey(d)] || 0, dow: d.getDay(), t: new Date(d) });
      d.setDate(d.getDate() + 1);
    }
    var max = 1;
    days.forEach(function (x) { if (x.n > max) max = x.n; });

    var wrap = el('div', 'pr-chart');
    wrap.setAttribute('role', 'img');
    var tot = days.reduce(function (a, x) { return a + x.n; }, 0);
    wrap.setAttribute('aria-label',
      'نموُّك في أربعةَ عشرَ يومًا: ' + ar(tot) + ' صفحة');
    days.forEach(function (x) {
      var col = el('div', 'pr-col' + (x.n === max && x.n > 0 ? ' pr-top' : ''));
      var bar = el('div', 'pr-cb');
      var f = el('i');
      f.style.height = Math.max(Math.round(x.n / max * 100), x.n > 0 ? 8 : 0) + '%';
      bar.appendChild(f);
      var lb = el('span', 'pr-cl');
      lb.textContent = App.DAY_LETTER[x.dow];
      lb.setAttribute('aria-hidden', 'true');
      bar.title = App.hijri(x.t) + ' — ' + ar(x.n) + ' صفحة';
      col.appendChild(bar); col.appendChild(lb);
      wrap.appendChild(col);
    });
    return wrap;
  }

  /* ── نشاطُ ثمانيةٍ وعشرينَ يومًا ─────────────────────────────── */
  function dots(logs) {
    var N = 28, box = el('div', 'pr-dots'), d = new Date();
    d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - (N - 1));
    var vals = [];
    for (var i = 0; i < N; i++) {
      vals.push(logs[App.dateKey(d)] || 0);
      d.setDate(d.getDate() + 1);
    }
    var max = Math.max.apply(null, vals.concat([1]));
    var on = 0;
    vals.forEach(function (v) {
      if (v > 0) on++;
      box.appendChild(el('i', v === 0 ? '' : (v >= max ? 'hi' : 'on')));
    });
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', App.Words.dotsAria(on));
    return { node: box, on: on };
  }

  /* ── الشاشة ─────────────────────────────────────────────────── */
  /* تُلتقَط الألواحُ ليُولَّد المثالُ من هذه الشاشةِ نفسِها */
  var LAST = null;

  function render() {
    styleOnce();
    var wrap = el('div', 'stack-lg pr');

    var bar = el('div', 'bar');
    var ttl = el('h1', 'h1 bar-t'); ttl.textContent = 'تقدُّمي';
    bar.appendChild(ttl);
    /* موضعٌ تَنزل فيه أفعالٌ طرفيّةٌ من وحداتٍ أخرى. وهو اليومَ
       خالٍ: رجعت «حلقتي» إلى الشريطِ السفليّ. */
    App.emit('stats-bar', { bar: bar });
    wrap.appendChild(bar);

    var plans = App.state.plans || [], logs = allLogs();
    var total = 0, k;
    for (k in logs) total += logs[k];

    /* «لا منهجَ بعد» تُقاس بالمناهجِ وحدَها — وهذا يَصدق ما دام
       المنهجُ هو الطريقَ الوحيد. فإن كان محرِّكُ الوِردِ الموحَّدِ
       قائمًا وللقارئِ جردٌ، فله تقدُّمٌ يُعرَض وإن لم يُنشئ منهجًا
       واحدًا — وعرضُ المثالِ له حينئذٍ يُخفي عملَه خلفَ أرقامِ غيره.
       والسطرُ ساكنٌ حين لا محرِّك. */
    /* ══ لوحةٌ تَظهر من أوّلِ يوم ══
       كانت هذه الشاشةُ تُخفي نفسَها حتى يُبنى منهج، فيَرى مَن فتحها
       أوّلَ مرّةٍ دعوةً إلى البناءِ ولا يَرى ما الذي يُقاس له. والأصفارُ
       ليست فراغًا: هي أوّلُ سطرٍ في سجلٍّ سيَمتلئ، وهي تُعلّمه ما الذي
       سيَنمو قبل أن يَنمو. فتُرسَم اللوحةُ كلُّها دائمًا — الحلقةُ
       والبلاطاتُ والأنواعُ والنموّ — ولو كانت كلُّها أصفارًا، ويَسقط
       معها لسانُ «مثال»: لا حاجةَ إلى صورةِ غيرِه وقد رأى لوحتَه. */

    /* ── ثلاثةُ ألسنة ─────────────────────────────────────────────
       كانت سبعةَ أقسامٍ في عمودٍ واحدٍ طولُه شاشةٌ وسبعةُ أعشار: تُقرأ
       البلاطاتُ في أعلاه ويُبحث عن سببِها في أسفلِه، فلا يُجمَع الخبرُ
       وعلّتُه في نظرةٍ واحدة.

       فصارت ثلاثةَ ألسنةٍ لكلٍّ منها سؤالٌ تُجيبه وحدَها:
         أين أنا الآن؟ · أين أنا من كلِّ نوع؟ · كيف أنمو؟
       ولسانٌ يُلمَس لا يُسحَب: لا انتقالَ باليمينِ والشمال. */
    var PANE = { now: el('div', 'stack-lg'),
                 kinds: el('div', 'stack-lg'),
                 grow: el('div', 'stack-lg') };

    /* ١ · أربعُ بلاطات */
    var covered = P.coveredPages().size;
    var todayN = 0;
    plans.forEach(function (p) { todayN += (p.log && p.log[App.dateKey()]) || 0; });
    /* محرِّكُ الوِردِ الموحَّد — إن وُجد — يَحمل عملَ اليومِ خارجَ
       المناهج. ولولا هذا السطرُ لَقالت البطاقةُ «صفرَ صفحات» وقد
       سُجّلت عشر: كذبٌ على القارئِ في شاشةٍ وُضعت لتَصدقه.
       وهو ساكنٌ تمامًا حين لا محرِّك، فلا أثرَ له في البناءِ الحيّ. */
    var hw = App.state.hifz && App.state.hifz.log
          && App.state.hifz.log[App.dateKey()];
    if (hw) todayN += (hw.n || 0) + (hw.r || 0);
    /* ══ قبل أوّلِ وِرد: اللوحةُ وعدٌ، ومعها سطرٌ يَدلّ ══════════
       كنتُ طَويتُ البلاطاتِ والحلقةَ والشبكةَ قبل أوّلِ وِرد، ورأيتُها
       «جدارَ أصفارٍ» وتقريرَ فشلٍ عن عملٍ لم يَبدأ. وقال صاحبُ
       التطبيق: بل كانت تُعطي الحافظَ تصوُّرًا عمّا سيَكون، وكانت
       تَجذبه. وحُجّتُه أقوى: الأداةُ الفارغةُ تُري الحافظَ شكلَ
       الطريقِ قبل أن يَسلكه — والعدّادُ على صفرٍ ليس حُكمًا عليه،
       إنّما هو موضعٌ ينتظره.

       فعادت الأدواتُ كما كانت، وبَقي من المراجعةِ ما كان ناقصًا
       حقًّا: سطرٌ يَقول ما الذي يَملؤها، وزرٌّ يَمضي إلى العمل. فلا
       تُحجَب اللوحةُ ولا يُترَك القارئُ بلا دَلالة. */
    var bare = !total && !todayN;   /* لم يُسجَّل شيءٌ بعد */
    if (bare) {
      var inv = el('section', 'sec pr-invite');
      var ih = el('h2', 'pr-inv-h');
      ih.textContent = 'هذه لوحتُك، وهي تَنتظر';
      inv.appendChild(ih);
      var ip = el('p', 'pr-inv-p');
      ip.textContent = plans.length
        ? 'ما تَراه تحتَها يَمتلئ بأوّلِ وِردٍ تُتمّه: ما بلغتَه من '
          + 'المصحف، وأيّامُ مواظبتك، ومواضعُ زللك.'
        : 'ابنِ منهجًا، ثمّ أتمِمْ وِردَ يومٍ واحد — تَبدأ بالامتلاء '
          + 'من يومها.';
      inv.appendChild(ip);
      /* زرٌّ هادئ: اللوحةُ هي المقصودةُ بالنظر، والدَّلالةُ خادمةٌ
         لها. ولو كان عريضًا أخضرَ لَسرق البصرَ ممّا جاء يُقدّمه. */
      var ib = el('button', 'btn btn-ghost pr-inv-b');
      ib.type = 'button';
      ib.textContent = plans.length ? 'افتح وِردَ اليوم' : 'ابنِ منهجك';
      ib.onclick = function () {
        if (plans.length) App.go('home');
        else App.go('builder');
      };
      inv.appendChild(ib);
      PANE.now.appendChild(inv);
    }

    var s1 = el('section', 'sec');
    var tiles = el('div', 'pr-tiles');
    tiles.appendChild(tile('calendar', ar(P.streak()), 'يومَ مواظبة'));
    tiles.appendChild(tile('check', ar(todayN), 'صفحةَ اليوم'));
    tiles.appendChild(tile('chart', ar(total), 'صفحةً سُجّلت'));
    tiles.appendChild(tile('book', ar(plans.length), 'منهجًا'));
    s1.appendChild(tiles);
    PANE.now.appendChild(s1);

    /* ٢ · البؤرة */
    var s2 = el('section', 'sec');
    var c2 = el('article', 'card');
    c2.appendChild(hero(covered));
    s2.appendChild(c2);
    PANE.now.appendChild(s2);

    /* ٣ · الأنواع — عمودُ اللوحة */
    var rows = kindRows();
    if (rows) {
      var s3 = sec('أين أنا من كلِّ نوع', 'target');
      var c3 = el('article', 'card');
      c3.appendChild(rows);
      s3.appendChild(c3);
      PANE.kinds.appendChild(s3);
    }

    /* ٤ · النموّ */
    var s4 = sec('نموُّك في آخر أربعةَ عشرَ يومًا', 'review');
    var c4 = el('article', 'card');
    c4.appendChild(chart(logs));
    var f4 = el('p', 'small');
    f4.style.marginBlockStart = '12px';
    f4.textContent = App.Words.chartNote(total);
    c4.appendChild(f4);
    s4.appendChild(c4);
    PANE.grow.appendChild(s4);

    /* ٥ · بطاقتان — تُفرَّقان على لسانَيهما
       كانتا صفًّا واحدًا لأنّ الصفحةَ كانت واحدة. والآنَ لكلٍّ سؤالُها:
       «نشاطُك ٢٨ يومًا» جوابُ «أين أنا الآن؟» فيَلحق بالخلاصة، و«يحتاج
       انتباهًا» يُسمّي نوعًا بعينِه تعثّر فيَلحق بالأنواع. */
    var dd = dots(logs);
    var cA = el('article', 'card');
    /* ‎b‎ و‎span‎ سطريّان، و‎.h3‎/‎.small‎ لا تُغيّران ذلك، فكان العنوانُ
       يلتصق بسطرِه: «نشاطُك ٢٨ يومًاأنجزتَ في ٢٤ منها». وسائرُ البطاقاتِ
       سَلِمت لأنّ عناوينَها على عناصرَ كُتليّة. فيُصحَّح العنصرُ نفسُه
       لا يُحشى فراغًا. */
    cA.appendChild(el('div', 'h3', 'نشاطُك ٢٨ يومًا'));
    cA.appendChild(el('div', 'small', App.Words.dotsNote(dd.on)));
    cA.appendChild(dd.node);
    PANE.now.appendChild(cA);

    var care = needsCare();
    var cB = el('article', 'card');
    cB.appendChild(el('div', 'h3', 'يحتاج انتباهًا'));
    if (care) {
      var K = P.KINDS[care.plan.kind] || P.KINDS.hifz;
      cB.classList.add(K.cls);
      var nm = el('span', 'pr-warn-n');
      nm.textContent = P.titleFor ? P.titleFor(care.plan) : (care.plan.title || K.t);
      var ws = el('span', 'pr-warn-s');
      /* الرقمُ المجرّدُ يَجلد ولا يُرشد: «تأخّرتَ ٤٢٨ صفحة» تقول للطالب
         إنّه فشل، وإنّما الخللُ في وتيرةٍ رسمها أوسعَ من طاقته. فيُقاس
         الدَّينُ بأيّام عملِه لا بعدد الصفحات، ويُقال له ما يفعل. */
      var rate = care.plan.rate || 1;
      var late = Math.round(care.debt / rate);
      ws.textContent = App.Words.behind(late, sessions(late));
      cB.appendChild(nm); cB.appendChild(ws);
      cB.style.cursor = 'pointer';
      cB.onclick = function () { App.go('plan', { id: care.plan.id }); };
    } else {
      cB.appendChild(el('span', 'pr-warn-s',
        plans.length ? App.Words.onPace() : 'لا منهجَ بعد.'));
    }
    /* «يحتاج انتباهًا» بطاقةٌ تُجيب عن تعثُّرٍ بعينِه. فإن لم يكن ثَمَّ
       منهجٌ أصلًا فلا تعثُّرَ ولا جوابَ — وقد قالت الصفوفُ فوقَها «لم
       يبدأ بعد» أربعَ مرّات، فبطاقةٌ خامسةٌ تقول «لا منهجَ بعد» تكرارٌ
       يأكل من اللوحة ولا يُضيف. */
    if (care || plans.length) PANE.kinds.appendChild(cB);

    /* ٦ · البابُ إلى خريطة المصحف */
    var go2 = el('button', 'btn btn-pri btn-block');
    go2.type = 'button';
    go2.textContent = 'خريطةُ مصحفي كاملةً';
    go2.onclick = function () { App.go('mushaf'); };
    PANE.grow.appendChild(go2);

    /* ٧ · المشاركة، إن حُزمت وحدتُها */
    if (window.IrtaqiShare && typeof window.IrtaqiShare.open === 'function') {
      var sh = el('button', 'btn btn-ghost btn-block', App.icon('share', 19));
      sh.type = 'button';
      sh.appendChild(document.createTextNode(App.Words.shareProgress()));
      sh.onclick = function () {
        try { window.IrtaqiShare.open('journey'); }
        catch (err) { App.toast(App.Words.shareFailed()); }
      };
      PANE.grow.appendChild(sh);
    }

    LAST = { now: PANE.now, kinds: PANE.kinds, grow: PANE.grow };

    wrap.appendChild(App.seg([
      { key: 'now',   label: 'خلاصتي', icon: 'chart',
        render: function () { return PANE.now; } },
      { key: 'kinds', label: 'الأنواع', icon: 'target',

/* ═══════════════════════════════════════════════════════════════════

   ───────────────────────────────────────────────────────────────────
   هذه الشاشةُ مِلكُ الطالب لا مِلكُ التطبيق: فيها اسمُه، وهويّتُه،
   وبياناتُه يأخذها معه أو يمحوها كلَّها. ولمّا كان التطبيقُ بلا خادم
   فالنسخةُ المصدَّرةُ هي حبلُ النجاة الوحيد، ولهذا أُفرد لها لسانٌ

   وكانت قائمةً واحدةً طويلةً تُمَطُّ أربعةَ أقسامٍ فوق بعضها، فصار
   الطالبُ ينزل ويصعد ليبدّل اسمًا. فقُسّمت على أربعةِ ألسنةٍ بـApp.seg:
   كلُّ قسمٍ على بُعد لمسة، وفوقها ترويسةٌ تقول له مَن هو وما حصيلتُه
   قبل أن يُبدّل شيئًا.

   والمُستورَدُ يُعامل معاملةَ العدوّ: لا نثق بحرفٍ منه قبل الفحص، ولا
   يُكتب شيءٌ منه في الصفحة إلّا كنصٍّ (textContent)، ولا يُؤخذ منه
   حقلٌ لم نسمِّه بأنفسنا. وإن أخطأ قيل للطالب ما الخطأ بعينه، ولم
   تُمسَّ بياناتُه القائمة.
   ═══════════════════════════════════════════════════════════════════ */
(function (App) {
  'use strict';

  /* ── حدودٌ للطول ──

     فكلُّ نصٍّ يُقَصُّ على حدٍّ معلومٍ قبل أن يُخزَّن. */
  var LIM = {
    name: 40, title: 80, id: 48, scope: 16,
    circle: 60, code: 24, member: 40,
    plans: 300, circles: 80, members: 80, logKeys: 4000

  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var PAGES = App.Quran.PAGES;                 /* ٦٠٤ */

     تبديلِ اسمٍ ينبغي ألّا تُرجع الطالبَ إلى أوّل لسانٍ كلَّ مرّة. */
  var TAB = 'me';
  var ID_TAB = 'talk';
  var DATA_TAB = 'keep';  /* اللسانُ الداخليُّ في «بياناتي» */   /* اللسانُ الداخليُّ في «هويّتي» */

  /* ── مُعِينات ─────────────────────────────────────────────────── */

  /* الأيقوناتُ من وحدة المعجم؛ وقد يختلف اسمُ المفتاح فنجرّب البدائل
     بدلًا من أن تخلو الواجهةُ من أيقونةٍ بسبب اسم. */
  function ic(keys, size, cls) {
    for (var i = 0; i < keys.length; i++) {
      var s = App.icon(keys[i], size, cls);
      if (s) return s;
    }
    return '';
  }

  function isInt(v) {
    return typeof v === 'number' && isFinite(v) && Math.floor(v) === v;
  }

  /* نصٌّ نظيف: بلا محارفِ تحكّمٍ تُفسد السطر، ومقصوصٌ على الحدّ */
  function str(v, max) {
    if (typeof v !== 'string') return '';
    return v.replace(/[\u0000-\u001F\u007F]/g, ' ').slice(0, max).trim();
  }

  function dayDate(k) {
    if (!DATE_RE.test(k || '')) return null;
    var p = k.split('-');
    /* منتصفُ النهار: حتّى لا يزحف اليومُ بفارق المناطق الزمنيّة */
    var d = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }

  function txt(tag, cls, text) {

  }

  /* العربيّةُ تُعدّ على أربعِ صيغٍ لا على صيغةٍ واحدة: «منهجان» لا
     «٢ منهج». والعدّادُ الحرفيُّ يفضح الآلةَ من أوّل سطر. */
  function countWord(n, one, two, few, many) {
    if (n === 0) return 'لا ' + one;
    /* الصفةُ تَتبع موصوفَها في إعرابه: «منهجٌ واحد» خبرٌ مرفوع،
       و«يومًا واحدًا» مفعولٌ بعد «واظبتَ». وكان يُكتَب «واظبتَ يومًا
       واحد» — لحنٌ ظاهر. والمُنادي يُمرّر المفردَ في حالتِه التي
       يُريدها، فتُؤخَذ منه حالةُ الصفة: ما نُوِّن بالفتح نُوِّن معه. */
    if (n === 1) return one + (/ًا?$/.test(one) ? ' واحدًا' : ' واحد');
    if (n === 2) return two;
    if (n <= 10) return App.ar(n) + ' ' + few;
    return App.ar(n) + ' ' + many;
  }

  /* ════════════════════════════════════════════════════════════════
     زخرفةُ الهويّة — تُحسب ولا تُحمَّل
     ────────────────────────────────────────────────────────────────
     صورةٌ خارجيّةٌ تعني طلبَ شبكةٍ في تطبيقٍ تعهّد ألّا يطلب، وصورةٌ
     مضمّنةٌ تعني لونًا محبوسًا لا يتبع الهويّة. فالزخرفةُ هندسةٌ
     تُحسب عند الرسم: نقاطُها من المثلّثات، وألوانُها تُمرَّر إليها.
     ════════════════════════════════════════════════════════════════ */

  function fx(v) { return Math.round(v * 100) / 100; }

  /* ── لا زخرفةَ هويّةٍ هنا ──
     كانت النجمةُ الثمانيّةُ تُرسم للطالب والإسليميُّ للطالبة، وهما
     شعاران أُزيلا مع بقيّة الشعارات. وبقي شعارٌ واحدٌ للتطبيق كلِّه
     هو المصحف، يأتي من App.mark؛ وما لم يُرفَع فلا يُرسم شيء.

     وبطاقتا المعاينةِ لا تَخسران بإزالته: ما تَعِد به هو اللونُ لا
     الزخرفة، والمربّعاتُ الخمسةُ تقوله أصدقَ من رمز. */

  /* ════════════════════════════════════════════════════════════════
     قراءةُ لوحِ هويّةٍ غيرِ الجارية
     ────────────────────────────────────────────────────────────────
     المعاينةُ لا تُنسخ ألوانُها يدويًّا: نسخةٌ يدويّةٌ تكذب في أوّل
     يومٍ يُعدَّل فيه اللوح، فيَعِد الزرُّ بلونٍ ويُعطي غيرَه. واللوحان
     معلّقان على html[data-id] وحدَه، فلا يُقرأ لوحُ «طالبة» ونحن في
     «طالب» إلّا بأن نُبدّل الوسمَ لحظةَ القياس ثمّ نردَّه. والقياسُ
     والردُّ في نبضةٍ واحدةٍ لا يتخلّلها رسمٌ، فلا يرى الطالبُ وميضًا.
     ════════════════════════════════════════════════════════════════ */
  var PAL_KEYS = ['--ground', '--surface', '--surface-2', '--ink', '--ink-mut',
                  '--accent', '--gold', '--on-accent', '--hair', '--r-lg'];

  /* يُقرأ اللوحُ من الورقةِ نفسِها لا يُنسَخ يدويًّا: نسخةٌ يدويّةٌ

     إن غاب فاللوحُ المعروضُ هو لوحُ الوضعِ الجاري. */
  function palette(g, mode) {
    var html = document.documentElement;
    var prevG = html.getAttribute('data-id');
    var prevM = html.getAttribute('data-mode');
    if (prevG !== g) html.setAttribute('data-id', g);
    if (mode && prevM !== mode) html.setAttribute('data-mode', mode);
    var cs = getComputedStyle(html), out = {}, i;
    for (i = 0; i < PAL_KEYS.length; i++) {
      out[PAL_KEYS[i].slice(2)] = cs.getPropertyValue(PAL_KEYS[i]).trim();
    }
    if (mode && prevM !== mode) html.setAttribute('data-mode', prevM);
    if (prevG !== g) html.setAttribute('data-id', prevG);
    return out;
  }

  /* ════════════════════════════════════════════════════════════════
     فحصُ النسخة المستوردة
     ────────────────────────────────────────────────────────────────
     يُعيد {ok:true, next} أو {ok:false, why}. ولا يرمي أبدًا: كلُّ
     طريقٍ فيه ينتهي بجوابٍ مفهوم، لأنّ استثناءً غيرَ ملقوفٍ هنا يعني
     شاشةً ميّتةً وطالبًا لا يدري ما جرى.
     ════════════════════════════════════════════════════════════════ */
  function validate(text) {
    var raw;
    try { raw = JSON.parse(text); }
    catch (e) { return bad('الملفُّ ليس JSON سليمًا — تأكّد أنّه الملفُّ الذي صدّرتَه من التطبيق.'); }

    if (raw === null || typeof raw !== 'object' || Array.isArray(raw)) {
      return bad('محتوى الملفّ ليس كائنًا — لعلّه ملفٌّ آخر لا نسخةَ التطبيق.');
    }
    if (raw.v !== 1) {
      return bad('إصدارُ الملفّ غير مدعوم: المنتظَر ' + App.ar(1) + '، والموجودُ ' + shown(raw.v) + '.');
    }
    if (!Array.isArray(raw.plans))  return bad('قائمةُ المناهج (plans) مفقودةٌ أو ليست قائمة.');
    if (!Array.isArray(raw.circles)) return bad('قائمةُ الحلقات (circles) مفقودةٌ أو ليست قائمة.');
    if (raw.plans.length > LIM.plans) {
      return bad('المناهجُ أكثرُ من الحدّ: ' + App.ar(LIM.plans) + ' منهجًا على الأكثر.');
    }
    if (raw.circles.length > LIM.circles) {
      return bad('الحلقاتُ أكثرُ من الحدّ: ' + App.ar(LIM.circles) + ' حلقةً على الأكثر.');
    }

    /* ── المناهج ── */
    var plans = [], i;
    for (i = 0; i < raw.plans.length; i++) {
      var r = validatePlan(raw.plans[i], i + 1);
      if (!r.ok) return r;
      plans.push(r.plan);
    }

    /* ── الحلقات ── */
    var circles = [];
    for (i = 0; i < raw.circles.length; i++) {
      var c = raw.circles[i];
      if (c === null || typeof c !== 'object' || Array.isArray(c)) {
        return bad('الحلقةُ رقم ' + App.ar(i + 1) + ' ليست كائنًا.');
      }
      if (c.members != null && !Array.isArray(c.members)) {
        return bad('الحلقةُ رقم ' + App.ar(i + 1) + ': أعضاؤها (members) ليسوا قائمة.');
      }
      circles.push(cleanCircle(c));
    }

    /* ── الملفُّ الشخصيّ ── */
    var profile = null;
    if (raw.profile != null) {
      if (typeof raw.profile !== 'object' || Array.isArray(raw.profile)) {
        return bad('الملفُّ الشخصيّ (profile) ليس كائنًا.');
      }
      var g = raw.profile.gender === 'f' ? 'f' : 'm';
      profile = {
        /* نسخةٌ بلا اسمٍ تبقى بلا اسم: لقبٌ نُقحِمه مكانَه يُنادى به

           «بلا اسم»، والحقلُ إلى جانبها ينتظر. */
        name: str(raw.profile.name, LIM.name),
        gender: g,
        createdAt: DATE_RE.test(raw.profile.createdAt) ? raw.profile.createdAt : App.dateKey()
      };
    }

    /* الإعداداتُ تُنسخ بمفاتيحَ بسيطةٍ فقط: لا دوالَ ولا أعماقَ مجهولة */
    var settings = {};
    if (raw.settings && typeof raw.settings === 'object' && !Array.isArray(raw.settings)) {
      Object.keys(raw.settings).forEach(function (k) {
        if (POISON[k]) return;

        var t = typeof v;
        if (t === 'string') settings[k] = str(v, LIM.title);
        else if (t === 'number' && isFinite(v)) settings[k] = v;
        else if (t === 'boolean') settings[k] = v;

    }

    return { ok: true, next: { v: 1, profile: profile, plans: plans, circles: circles, settings: settings } };
  }

  function bad(why) { return { ok: false, why: why }; }

  /* قيمةٌ مجهولةٌ تُعرض للطالب بلا خطر: نوعُها أو رقمُها لا أكثر */
  function shown(v) {
    if (v === undefined) return 'لا شيء';
    if (v === null) return 'لا شيء';
    if (typeof v === 'number' && isFinite(v)) return App.ar(v);
    if (typeof v === 'string') return '«' + str(v, 12) + '»';
    return typeof v === 'object' ? 'كائن' : 'قيمةٌ أخرى';
  }

  function validatePlan(p, n) {
    var at = 'المنهجُ رقم ' + App.ar(n) + ': ';
    if (p === null || typeof p !== 'object' || Array.isArray(p)) {
      return bad('المنهجُ رقم ' + App.ar(n) + ' ليس كائنًا.');
    }
    if (!isInt(p.from) || !isInt(p.to)) {
      return bad(at + 'بدايةُ الصفحات أو نهايتُها ليست رقمًا صحيحًا.');
    }
    if (p.from < 1 || p.from > PAGES || p.to < 1 || p.to > PAGES) {
      return bad(at + 'الصفحاتُ خارج المصحف — المنتظَر بين ' +
                 App.ar(1) + ' و' + App.ar(PAGES) + '.');
    }
    if (p.from > p.to) {
      return bad(at + 'البدايةُ بعد النهاية (' + App.ar(p.from) + ' › ' + App.ar(p.to) + ').');
    }
    if (!p.kind || !App.Plans.KINDS[p.kind]) {
      return bad(at + 'نوعُ المنهج غير معروف: ' + shown(p.kind) + '.');
    }
    if (!Array.isArray(p.days)) {
      return bad(at + 'أيّامُ الأسبوع (days) ليست قائمة.');
    }
    for (var i = 0; i < p.days.length; i++) {
      if (!isInt(p.days[i]) || p.days[i] < 0 || p.days[i] > 6) {
        return bad(at + 'يومٌ غير صحيح في القائمة: ' + shown(p.days[i]) +

  }

  /* يُبنى منهجٌ جديدٌ بحقولٍ مسمّاةٍ لا يُنسخ المستورَدُ كما هو:
     حقلٌ زائدٌ مجهولٌ اليومَ قد يصير ثقبًا غدًا. */
  function cleanPlan(p) {
    var scope = (p.scope === 'surah' || p.scope === 'page' || p.scope === 'juz') ? p.scope : 'page';
    var total = p.to - p.from + 1;
    var days = [];
    p.days.forEach(function (d) { if (days.indexOf(d) < 0) days.push(d); });
    days.sort(function (a, b) { return a - b; });

    var log = {}, keys = 0;
    if (p.log && typeof p.log === 'object' && !Array.isArray(p.log)) {
      Object.keys(p.log).forEach(function (k) {
        if (keys >= LIM.logKeys || POISON[k] || !DATE_RE.test(k)) return;
        var v = p.log[k];
        if (!isInt(v) || v <= 0 || v > PAGES) return;
        log[k] = v; keys++;
      });
    }

    var out = {
      id: str(p.id, LIM.id) || App.uid(),
      kind: p.kind,
      scope: scope,
      from: p.from, to: p.to,
      rate: (isInt(p.rate) && p.rate >= 1) ? Math.min(p.rate, total) : 1,
      days: days,
      startedAt: DATE_RE.test(p.startedAt) ? p.startedAt : App.dateKey(),
      done: (isInt(p.done) && p.done > 0) ? Math.min(p.done, total) : 0,
      log: log,
      title: str(p.title, LIM.title)
    };
    if (!out.title) out.title = App.Plans.titleFor(out);
    /* وسمُ المنهجيّة يُحفظ إن عُرف: المُنقّي يُسقط كلَّ حقلٍ مجهولٍ —

    if (p.manhaj && window.App && App.Manhaj && App.Manhaj.byId(String(p.manhaj))) {
      out.manhaj = String(p.manhaj);
    }
    return out;
  }

  function cleanCircle(c) {
    var g = c.gender === 'f' ? 'f' : 'm';
    var members = [];
    (c.members || []).slice(0, LIM.members).forEach(function (m) {
      if (m === null || typeof m !== 'object' || Array.isArray(m)) return;
      members.push({
        id: str(m.id, LIM.id) || App.uid(),
        name: str(m.name, LIM.member) || 'عضو',
        pages: (isInt(m.pages) && m.pages >= 0) ? Math.min(m.pages, PAGES * 60) : 0,
        updatedAt: DATE_RE.test(m.updatedAt) ? m.updatedAt : App.dateKey()
      });
    });
    return {
      id: str(c.id, LIM.id) || App.uid(),
      name: str(c.name, LIM.circle) || 'حلقة',
      gender: g,
      code: str(c.code, LIM.code),
      role: c.role === 'owner' ? 'owner' : 'member',
      members: members,
      createdAt: DATE_RE.test(c.createdAt) ? c.createdAt : App.dateKey()

  }

  /* الحالةُ تُستبدل في موضعها لأنّ App.state قارئةٌ لا تُسنَد إليها:
     تُمحى المفاتيحُ الغريبةُ ثمّ تُكتب المعروفة. */
  function replaceState(next) {
    var S = App.state, known = { v: 1, profile: 1, plans: 1, circles: 1, settings: 1 };
    /* ومفاتيحُ الوحداتِ المسجَّلة: القائمةُ البيضاءُ تَحمي من تلويثِ
       ملفٍّ مستورَد، لكنّها كانت تَحذف معه ما تَملكه وحداتُ التطبيقِ
       نفسُها — فيَضيع سجلُّ الزللِ في كلِّ استيرادٍ بلا خبر. */
    (App.ownedKeys ? App.ownedKeys() : []).forEach(function (k) { known[k] = 1; });
    Object.keys(S).forEach(function (k) { if (!known[k]) delete S[k]; });

    /* كانت ههنا زخرفةٌ مُحلَّقةٌ بلون الهويّة. وهي عند اثنين وأربعين
       بكسلًا لا تُقرأ فصوصًا بل لطخةً خضراءَ بجانب الاسم، لا تَقول
       شيئًا ولا تُزيّن. والشعارُ صار في صدر كلِّ صفحةٍ يَقول ما
       كانت تُوهِم أنّها تقوله. فحُذفت. */
    var heroT = App.el('div', 'st-hero-t');
    /* لا اسمَ للتطبيق فوق اسم الطالب: الشعارُ ملاصقٌ له يقوله،
       فكتابتُه مرّةً ثالثةً في شاشةٍ واحدةٍ حشو. */
    var heroName = txt('strong', 'st-name', '');
    var heroTally = txt('span', 'st-tally', '');
    heroT.appendChild(heroName);
    heroT.appendChild(heroTally);
    hero.appendChild(heroT);
    /* الترويسةُ على «حسابي» وحدَها لا على الألسنةِ الأربعة: هي
       خلاصةُ الحساب، وتَكرارُها في «بياناتي» و«عن التطبيق» يَأكل مئةَ
       بكسلٍ من كلِّ لسانٍ ويَدفع محتواه تحتَ حافّةِ الشاشة. */
    wrap.appendChild(hero);

    /* الحصيلةُ تُقرأ من الحالة والخططِ لا تُخزَّن: رقمٌ مخزونٌ يَبلى */
    function tally() {
      var n = App.state.plans.length;
      var s = App.Plans.streak();
      var plans = countWord(n, 'منهج', 'منهجان', 'مناهج', 'منهجًا');
      var verb = gender === 'f' ? 'واظبتِ' : 'واظبتَ';
      var days = s === 0
        ? 'ولم تُسجَّل مواظبةٌ بعد'
        : 'و' + verb + ' ' + countWord(s, 'يومًا', 'يومين', 'أيّام', 'يومًا');
      return plans + '، ' + days;
    }

    function refreshHero() {
      var p = App.state.profile;
      heroName.textContent = (p && p.name) || 'بلا اسم';
      heroTally.textContent = tally();
      /* الهالةُ لا الشعار: الشعارُ صار كلمةً عريضةً لا تُقرأ في
         مربّعِ ٦٦، والهالةُ مَوتيفُ التطبيقِ المرسومُ للمقاساتِ
         الصغيرة — وهي زخرفةُ صدرٍ لا علامةُ هويّةٍ تُكرَّر. */
      /* ‎core:false‎ تَحذف الحلقتَين الداخليّتَين فتَبقى الهالةُ
         مصمتةً — وهي عند ٤٢ بكسلًا تُقرأ فصوصًا، أمّا المُحلَّقةُ
         فتَذوب دائرةً. */
    }
    refreshHero();

    /* ═══ ١ · حسابي ═══════════════════════════════════════════════ */
    function paneAccount() {
      var box = App.el('div', 'st-card');

      /* تاريخُ الانضمام بالهجريّ: هو تقويمُ الطالب في حفظه */
      var p0 = App.state.profile;
      var jd = p0 ? dayDate(p0.createdAt) : null;
      var meta = App.el('div', 'st-meta');
      meta.innerHTML = ic(['calendar'], 17);
      meta.appendChild(txt('span', null, jd
        ? (gender === 'f' ? 'انضممتِ في ' : 'انضممتَ في ') + App.ar(App.hijri(jd))
        : 'تاريخُ الانضمام غيرُ معروف'));
      box.appendChild(meta);

      var lab = App.el('label', 'st-field');
      lab.htmlFor = 'st-name';
      lab.appendChild(txt('span', null, 'اسمك كما تحبّ أن نناديك'));
      var input = document.createElement('input');
      input.className = 'st-in';
      input.id = 'st-name';
      input.type = 'text';
      input.name = 'name';
      input.autocomplete = 'name';
      input.placeholder = 'اكتب اسمك';
      input.maxLength = 32;
      input.spellcheck = false;
      input.value = (p0 && p0.name) || '';
      input.setAttribute('enterkeyhint', 'done');
      lab.appendChild(input);
      box.appendChild(lab);

      var save = App.el('button', 'st-save');
      save.type = 'button';
      save.disabled = true;
      save.innerHTML = ic(['check'], 18) + '<span>حفظ الاسم</span>';
      box.appendChild(save);

      function dirty() {
        var v = input.value.trim();
        return v.length > 0 && v !== (App.state.profile ? App.state.profile.name : '');
      }
      function syncSave() { save.disabled = !dirty(); }

      /* الاسمُ يُحفظ عند مغادرة الحقل أو بالزرّ صراحةً: الطالبُ قد
         يكتب ويمضي، ولا ينبغي أن يضيع ما كتب لأنّه لم يضغط زرًّا. */
      function commit() {
        if (!dirty()) { syncSave(); return false; }
        var v = input.value.trim().slice(0, LIM.name);
        App.state.profile = App.state.profile ||
          { gender: gender, createdAt: App.dateKey() };
        App.state.profile.name = v;
        App.save();
        refreshHero();
        syncSave();
        App.toast('حُفظ اسمك: ' + v);
        return true;
      }
      commitName = commit;

      input.oninput = syncSave;
      input.onblur = function () { commit(); };
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      };
      save.onclick = function () { commit(); };
      syncSave();

      var out = App.el('div', 'st-stack');
      out.appendChild(box);
      /* لا شرحَ لما لا يُسأل عنه: الحافظُ جاء ليَحفظ ويُراجع، لا ليَقرأ
         أين يُخزَّن اسمُه. */
      return out;
    }

    /* ═══ ٢ · هويّتي ══════════════════════════════════════════════ */
    var idCards = {}, idNote = null;

    function idCard(g, label) {
      var pal = palette(g);
      var b = App.el('button', 'st-idcard');
      b.type = 'button';
      b.dataset.g = g;
      b.setAttribute('role', 'radio');
      /* البطاقةُ ترتدي لوحَ هويّتها كاملًا: أرضُها وحدودُها ومِدادُها
         ونصفُ قطرها. فمن نظر إليها رأى الشاشةَ التي ستصير إليها. */
      b.style.background = pal.surface;
      b.style.color = pal.ink;
      b.style.borderColor = pal.hair;
      b.style.borderRadius = pal['r-lg'];
      b.innerHTML =
        '<span class="st-tick" style="background:' + pal.accent + ';color:' + pal['on-accent'] + '">' +
          ic(['check'], 15) + '</span>' +
        ''  +
        '<span class="st-idname">' + label + '</span>' +
        '<span class="st-chips" aria-hidden="true">' +
          chip(pal.ground, pal.hair) + chip(pal['surface-2'], pal.hair) +
          chip(pal.ink, pal.hair) + chip(pal.accent, pal.hair) + chip(pal.gold, pal.hair) +
        '</span>';
      b.__pal = pal;
      b.onclick = function () { pickId(g); };
      b.onkeydown = function (e) {
        var k = e.key;
        if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowUp' || k === 'ArrowDown') {
          e.preventDefault();
          pickId(g === 'm' ? 'f' : 'm');
          var n = idCards[g === 'm' ? 'f' : 'm'];
          if (n) n.focus();
        }
      };
      idCards[g] = b;
      return b;
    }

    function chip(bg, line) {
      return '<i style="background:' + bg + ';border-color:' + line + '"></i>';
    }

    function markId() {
      ['m', 'f'].forEach(function (g) {
        var b = idCards[g];
        if (!b) return;
        var on = g === gender;
        b.setAttribute('aria-checked', String(on));
        b.tabIndex = on ? 0 : -1;
        b.style.boxShadow = on ? '0 0 0 2.5px ' + b.__pal.accent : 'none';
      });
      if (idNote) {
        /* كان السطرُ يَصف اللونَ («أُرجوانٌ وذهبٌ ورديّ») والبطاقةُ
           تَعرضه، فيُقال ما يُرى. والمختارُ هنا صيغةُ الخطابِ لا لقبُ
           صاحبِه، فيُسمّى بما يَفعل ويُقال سببُ تبدّلِ اللوحِ معه. */
        idNote.textContent = App.Words.gNote(gender);
      }
    }

    /* تتبدّل الهويّةُ كلُّها تحت إصبعه بلا إعادةِ رسمٍ للشاشة: اللونُ
       كلُّه معلّقٌ على وسمِ الجذر، فتبديلُه وحدَه يُبدّل كلَّ شيءٍ في
       نبضةٍ واحدة. وإعادةُ الرسم كانت تُطيّر التركيزَ من تحت إصبعِ
       مَن يستعمل لوحةَ المفاتيح، وتُرجعه إلى أوّل لسان. */
    function pickId(g) {
      if (g === ((App.state.profile && App.state.profile.gender) || 'm')) return;
      commitName();                 /* ما كُتب ولم يُحفظ لا يضيع */
      App.state.profile = App.state.profile || { name: '', createdAt: App.dateKey() };
      App.state.profile.gender = g;
      App.save();
      App.applyIdentity();
      gender = g;
      markId();
      /* لوحُ النهارِ والليلِ يتبع الهويّة، فبطاقتاهما تُعادُ رسمُهما
         وإلّا بقيتا تَعرِضان ألوانَ هويّةٍ هُجِرت. */
      repaintModes();
      refreshHero();
      App.toast(App.Words.gSwitched(g));
    }

    /* ═══ النهارُ والليل ══════════════════════════════════════════
       كان الوضعُ لا يُبلَغ إلّا من الشيفرة، والطالبُ يُقلّب تطبيقَه
       لا شيفرتَه. وهو مَن قال «الألوانُ كئيبة»، فأولى الناسِ بمفتاحِ
       الضوء. والبطاقتان تُريانِ اللوحَ لا تَصِفانه، كبطاقتَي الهويّة.
       ولا يُترك للجهازِ يختار: المختارُ يُرى، والمفروضُ يُشتكى. */
    var mdCards = {}, mdNote = null;

    function curMode() {
      return (App.state.settings && App.state.settings.mode) === 'dark'
        ? 'dark' : 'light';
    }

    function mdCard(mode, label) {
      var pal = palette(gender, mode);
      var b = App.el('button', 'st-idcard st-mdcard');
      b.type = 'button';
      b.dataset.m = mode;
      b.setAttribute('role', 'radio');
      b.style.background = pal.ground;
      b.style.color = pal.ink;
      b.style.borderColor = pal.hair;
      b.style.borderRadius = pal['r-lg'];
      b.innerHTML =
        '<span class="st-tick" style="background:' + pal.accent
          + ';color:' + pal['on-accent'] + '">' + ic(['check'], 15) + '</span>' +
        '<span class="st-mdface" style="background:' + pal.surface
          + ';border-color:' + pal.hair + '">' +
          '<i style="background:' + pal.ink + '"></i>' +
          '<i style="background:' + pal['ink-mut'] + '"></i>' +
          '<i style="background:' + pal.accent + '"></i>' +
        '</span>' +
        '<span class="st-idname">' + label + '</span>';
      b.__pal = pal;
      b.onclick = function () { pickMode(mode); };
      b.onkeydown = function (e) {
        var k = e.key;
        if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowUp' || k === 'ArrowDown') {
          e.preventDefault();
          var other = mode === 'light' ? 'dark' : 'light';
          pickMode(other);
          if (mdCards[other]) mdCards[other].focus();
        }
      };
      mdCards[mode] = b;
      return b;
    }

    function markMode() {
      var cur = curMode();
      ['light', 'dark'].forEach(function (m) {
        var b = mdCards[m];
        if (!b) return;
        var on = m === cur;
        b.setAttribute('aria-checked', String(on));
        b.tabIndex = on ? 0 : -1;
        b.style.boxShadow = on ? '0 0 0 2.5px ' + b.__pal.accent : 'none';
      });
      if (mdNote) {
        mdNote.textContent = cur === 'dark'
          ? 'الليل: أريحُ للعينِ في العتمة.'
          : 'النهار: الأوضحُ تحت الشمس.';
      }
    }

    function repaintIds() {
      ['m', 'f'].forEach(function (g) {
        var b = idCards[g];
        if (!b || !b.parentNode) return;
        b.parentNode.replaceChild(idCard(g, App.Words.gForm(g)), b);
      });
      markId();
    }

    function repaintModes() {
      ['light', 'dark'].forEach(function (k) {
        var b = mdCards[k];
        if (!b || !b.parentNode) return;
        b.parentNode.replaceChild(mdCard(k, k === 'dark' ? 'ليل' : 'نهار'), b);
      });
      markMode();
    }

    function pickMode(m) {
      if (m === curMode()) return;
      commitName();
      App.state.settings = App.state.settings || {};
      App.state.settings.mode = m;
      App.save();
      App.applyIdentity();
      /* البطاقتان تُعيدان رسمَ نفسَيهما: لوحُهما صارَ غيرَ لوحِهما.
         وبطاقتا الهويّةِ كذلك — ألوانُهما مكتوبةٌ في السطر، فلو
         تُركت بقيت بيضاءَ ورقيّةً على أرضِ الليل. */
      repaintModes();
      repaintIds();
      refreshHero();
      App.toast(m === 'dark' ? 'أُطفئ الضوء.' : 'أُضيء النهار.');
    }

    /* ═══ «هويّتي» ثلاثةُ ألسنةٍ لا صحيفةٌ تُمرَّر ═══
       كانت المجموعاتُ الأربعُ مرصوفةً في عمودٍ واحدٍ طولُه ٩٤٦ بكسلًا
       في شاشةٍ ارتفاعُها ٨٤٤ — فيَنزل القارئُ ليَبلغ «المصحف». وهي
       مجموعاتٌ مستقلّةٌ لا يُقرأ بعضُها ببعض، فاللسانُ أصدقُ لها من
       التمرير: كلُّ لسانٍ يَسَع نفسَه ولا يَخفى تحته شيء. */
    function paneIdentity() {
      return App.seg([
        { key: 'talk',   label: 'الخطاب',  render: paneTalk },
        { key: 'light',  label: 'الضوء',   render: paneLight },
        { key: 'mushaf', label: 'المصحف',  render: paneMushaf }
      ], { start: ID_TAB, onchange: function (k) { ID_TAB = k; } });
    }

    function paneTalk() {
      var out = App.el('div', 'st-stack');
      /* عنوانٌ للمجموعةِ كأختَيها: كان اللسانُ وحدَه يُسمّيها
         «هويّتي»، فلم يُعرَف أنّ المختارَ صيغةُ الخطابِ لا لقبُ أحد. */
      out.appendChild(cap(App.Words.gGroup()));
      var pair = App.el('div', 'st-pair');
      pair.setAttribute('role', 'radiogroup');
      pair.setAttribute('aria-label', App.Words.gGroup());
      pair.appendChild(idCard('m', App.Words.gForm('m')));
      pair.appendChild(idCard('f', App.Words.gForm('f')));
      out.appendChild(pair);
      idNote = txt('p', 'st-note', '');
      out.appendChild(idNote);
      markId();
      return out;
    }

    function paneLight() {
      var out = App.el('div', 'st-stack');
      out.appendChild(cap('الضوء'));
      var mpair = App.el('div', 'st-pair');
      mpair.setAttribute('role', 'radiogroup');
      mpair.setAttribute('aria-label', 'وضعُ الضوء');
      mpair.appendChild(mdCard('light', 'نهار'));
      mpair.appendChild(mdCard('dark', 'ليل'));
      out.appendChild(mpair);
      mdNote = txt('p', 'st-note', '');
      out.appendChild(mdNote);
      markMode();

      /* تنفُّسُ اليومِ تحتَ «الضوء» لأنّه منه: ميلةُ أرضٍ بالساعةِ
         والموسم، لا هيكلٌ ولا خطّ. والبطاقةُ تُبنى في وحدتِها
         بأصنافِ هذه الشاشةِ نفسِها فلا سطرَ نمطٍ جديد. */
      if (App.Breath && App.Breath.row) {
        out.appendChild(cap('تنفُّسُ اليوم'));
        out.appendChild(App.Breath.row());
      }
      return out;
    }

    function paneMushaf() {
      var out = App.el('div', 'st-stack');
      out.appendChild(cap('المصحف'));
      out.appendChild(madaniRow());
      return out;
    }

    /* ── رسمُ المدينة ──
       بنيةُ الصفحةِ مدموجةٌ في التطبيق، والخطوطُ وحدَها خارجَه:
       ثمانيةٌ وأربعون خطًّا جملتُها ٣٦ ميغابايت، لا تُدمَج ولا
       تُنزَّل جملةً — يُنزَّل خطُّ الصفحةِ المفتوحةِ وحدَه ويُخزَّن.
       والخطُّ يَخدم نحوَ ثلاثَ عشرةَ صفحة. */
    function madaniRow() {
      var box = App.el('div', 'st-card');
      var row = App.el('label', 'st-sw');
      var t = App.el('div', 'st-sw-t');
      t.appendChild(App.el('b', null, 'ارسم الصفحةَ برسم المدينة'));
      var note = txt('span', 'st-note', '');
      t.appendChild(note);
      row.appendChild(t);

      var cb = App.el('input');
      cb.type = 'checkbox';
      cb.className = 'st-cb';
      /* الملفُّ المفتوحُ من القرصِ لا يَبلغ خطًّا: المتصفّحُ يَمنع ذلك
         منعًا باتًّا. فلا يُترك المفتاحُ يَعِد بما لا يَكون — يُعطَّل
         ويُقال السببُ صريحًا. */
      var onFile = !!(App.QFont && App.QFont.fromFile && App.QFont.fromFile());
      cb.checked = !onFile
        && !(App.state.settings && App.state.settings.madani === false);
      cb.disabled = onFile;
      if (onFile) box.classList.add('st-card-off');
      row.appendChild(cb);
      box.appendChild(row);

      function refresh() {
        var st = App.QFont ? App.QFont.stats() : { loaded: 0, total: 0 };
        note.textContent = onFile
          ? 'يَحتاج رسمُ المدينةِ أن يُفتح التطبيقُ من رابطِه على الشبكة؛ '
            + 'والمتصفّحُ يَمنع تحميلَ الخطوطِ من ملفٍّ على قرصك.'
          : cb.checked
          ? (st.loaded
              ? ('نُزّل ' + App.ar(st.loaded) + ' من ' + App.ar(st.total)
                 + ' خطًّا، ويُقرأ ما نُزّل دون اتّصال.')
              : 'يُنزَّل خطُّ كلِّ صفحةٍ عند فتحها أوّلَ مرّة، ثمّ يبقى — '
                + 'من مجلَّدِ التطبيقِ نفسِه، لا من موقعٍ آخر.')
          : 'يُعرض نصُّ المصحفِ مُشكَّلًا بخطِّ جهازك — دون تنزيلِ شيء.';
      }

      cb.onchange = function () {
        App.state.settings = App.state.settings || {};
        App.state.settings.madani = cb.checked;
        App.save();
        refresh();
        App.toast(cb.checked ? 'سيُرسَم المصحفُ برسم المدينة.'
                             : 'عاد المصحفُ إلى النصّ.');
      };
      refresh();

      /* مسحُ الخطوطِ المخزَّنة: مَن ضاق بمساحةِ جهازِه له بابٌ يُفرغها */
      var clr = App.el('button', 'st-clear');
      clr.type = 'button';
      clr.textContent = 'امسح الخطوطَ المخزَّنة';
      clr.onclick = function () {
        if (!App.QFont) return;
        App.QFont.clear().then(function () {
          refresh();
          App.toast('مُسحت الخطوط.');
        });
      };
      box.appendChild(clr);
      return box;
    }

    /* ═══ ٣ · بياناتي ═════════════════════════════════════════════ */
    /* ═══ «بياناتي» لسانان ═══
       بطاقةُ النسخةِ ٤٤٣ بكسلًا وبطاقةُ المحوِ ٢٦٩ — ومجموعُهما
       يَفيض عن الشاشة. وهما فعلان متباعدان: أحدُهما يَحفظ والآخرُ
       يَمحو، فلا يُجمعان في صحيفةٍ واحدةٍ تُمرَّر. واللسانُ يَزيدهما
       تباعدًا، وهو مقصودٌ ههنا: المحوُ لا رجعةَ فيه فلا يُجاور
       الآمنَ فتُخطئه اليد. */
    /* ══ المحتوى ══════════════════════════════════════════════════
       ثلاثُ حِزَمٍ لكلٍّ حالتُها: حاضرةٌ أو تُجلَب. ولكلٍّ ثلاثةُ
       أبوابٍ إلى الحضور — الجلبُ من الموقع، والاستيرادُ من ملفٍّ
       وصل الطالبَ من دارِه، والتنزيلُ ليُعطيَها غيرَه. */
    function paneData() {
      var pair = buildData();
      return App.seg([
        { key: 'keep', label: 'نسختي', render: function () { return pair.box; } },
        { key: 'wipe', label: 'المحو',  render: function () { return pair.danger; } }
      ], { start: DATA_TAB, onchange: function (k) { DATA_TAB = k; } });
    }

    function buildData() {
      var RET = null;
      var out = App.el('div', 'st-stack');

      var box = App.el('div', 'st-card');
      box.appendChild(cap('نسختُك'));
      /* يَبقى هذا وحدَه لأنّه فعلٌ يُطلَب منه لا خبرٌ عن البناء:
         من لم يَحتفظ بنسخةٍ ضاع حفظُه عند تبديل الجهاز. */
      box.appendChild(txt('p', 'st-note',
        'احتفظ بنسخةٍ قبل أن تُبدّل جهازك أو تمحو بيانات المتصفّح.'));

      var rows = App.el('div', 'st-rows');
      rows.style.marginTop = '13px';

      /* — تصدير — */
      var bExp = App.el('button', 'st-row');
      bExp.type = 'button';
      bExp.innerHTML = ic(['download'], 22) +
        '<span class="st-rt"><b>تصدير نسخة</b>' +
        '<small>ملفٌّ فيه ملفُّك ومناهجُك وحلقاتُك.</small></span>';
      bExp.onclick = function () { doExport(); };
      rows.appendChild(bExp);

      /* — تصديرٌ مختوم —
         النسخةُ فيها سجلُّ حفظِك كلِّه، وهي تَخرج من التطبيقِ إلى
         مجلَّدِ التنزيلاتِ وربّما إلى محادثة. فمَن شاء خَتَمها بكلمةٍ
         لا يَملكها غيرُه، فلا تُقرأ إن وقعت في يدٍ أخرى. */
      if (App.Seal && App.Seal.able()) {
        var bSeal = App.el('button', 'st-row');
        bSeal.type = 'button';
        bSeal.innerHTML = ic(['lock'], 22) +
          '<span class="st-rt"><b>تصدير نسخةٍ مختومة</b>' +
          '<small>بكلمةٍ تَختارها. إن نَسيتَها لم تُفتَح.</small></span>';
        bSeal.onclick = function () {
          var pass = window.prompt(
            'كلمةُ الختم — اكتبها في موضعٍ تَأمَنه.\n' +
            'لا تُحفَظ في التطبيق، ولا سبيلَ إلى فتحِ النسخةِ بدونها.');
          if (pass === null) return;
          if (String(pass).length < 6) {
            say('كلمةُ الختمِ ستّةُ أحرفٍ فأكثر.', true);
            return;
          }
          say('يُختَم…', false);
          doExport(String(pass));
        };
        rows.appendChild(bSeal);
      }

      /* — استيراد — */
      var fwrap = App.el('div', 'st-wrapfile');
      var file = document.createElement('input');
      file.type = 'file';
      file.id = 'st-import';
      file.className = 'st-file';
      file.accept = '.json,.irtaqi,application/json,text/plain';
      var bImp = App.el('label', 'st-row');
      bImp.htmlFor = 'st-import';
      bImp.innerHTML = ic(['upload', 'import', 'copy', 'download'], 22) +
        '<span class="st-rt"><b>استيراد نسخة</b>' +
        '<small>تحلّ محلَّ بياناتك الحاليّة بعد فحصِ الملفّ.</small></span>';
      file.onchange = function () { readFile(file.files && file.files[0]); };
      fwrap.appendChild(file);
      fwrap.appendChild(bImp);
      rows.appendChild(fwrap);

      box.appendChild(rows);
      var msg = App.el('p', 'st-msg');
      msg.setAttribute('aria-live', 'polite');
      box.appendChild(msg);
      out.appendChild(box);

      /* — المحو في بطاقةٍ على حدة: الفعلُ الذي لا رجعةَ فيه لا يُجاور
           الأفعالَ الآمنةَ في صندوقٍ واحدٍ فتُخطئه اليد — */
      var danger = App.el('div', 'st-card');
      danger.appendChild(cap('ما لا رجعةَ فيه'));
      var warn = App.el('div', 'st-warn');
      warn.innerHTML = ic(['info'], 20);
      warn.appendChild(txt('p', null,
        'المحوُ يُزيل ملفَّك ومناهجَك وحلقاتِك من هذا المتصفّح إزالةً تامّة. ' +
        'لا يُستعاد شيءٌ منها إلّا من نسخةٍ صدّرتَها قبل المحو.'));
      danger.appendChild(warn);
      var wipeSlot = App.el('div', 'st-wipe');
      wipeSlot.style.marginTop = '11px';
      danger.appendChild(wipeSlot);
      out.appendChild(danger);

      /* يُرَدّان منفصلَين ليُوضَع كلٌّ في لسانه، والدوالُّ أدناه
         تَبقى في مجالِهما فتَعمل كما كانت. */
      RET = { box: box, danger: danger };

      function say(text, isErr) {
        msg.textContent = text;
        msg.className = 'st-msg' + (isErr ? ' st-err' : '');
      }

      /* الحفظُ بـBlob ورابطٍ مؤقّت، ويُسحب الرابطُ بعد النقر فلا يبقى
         في الذاكرة مرجعٌ لنسخةٍ كاملةٍ من بيانات الطالب. */
      function doExport(pass) {
        if (pass) {
          /* الختمُ يَأخذ جزءًا من الثانية (اشتقاقٌ مقصودُ الثِّقَل)،
             فيُؤجَّل الحفظُ إلى أن يَتمّ ولا يُحجَب الزرُّ بانتظار. */
          App.Seal.seal(JSON.stringify(App.state), pass).then(function (env) {
            write(env, 'irtaqi-' + App.dateKey() + '.irtaqi', 'text/plain');
            say('صُدّرت نسخةٌ مختومة. احفظ كلمتَها — لا بديلَ عنها.', false);
            App.toast('خُتمت النسخة.');
          }).catch(function () {
            say('تعذّر ختمُ النسخةِ في هذا المتصفّح.', true);
            App.toast('تعذّر الختم.');
          });
          return;
        }
        var n0 = App.state.plans.length;
        if (!write(JSON.stringify(App.state, null, 2),
                   'irtaqi-' + App.dateKey() + '.json', 'application/json')) return;
        say('صُدّرت نسخةٌ فيها ' + App.ar(n0) + ' ' +
            (n0 === 1 ? 'منهج' : 'منهجًا') + '.', false);
        App.toast('حُفظت النسخة.');
      }

      function write(data, name, type) {
        var url = null, a = null;
        try {
          var blob = new Blob([data], { type: type });
          url = URL.createObjectURL(blob);
          a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
        } catch (e) {
          say('تعذّر إنشاءُ ملفّ النسخة في هذا المتصفّح.', true);
          App.toast('تعذّر التصدير.');
          return false;
        } finally {
          setTimeout(function () {
            if (a && a.parentNode) a.parentNode.removeChild(a);
            if (url) URL.revokeObjectURL(url);
          }, 1200);
        }
        return true;
      }

      function readFile(f) {
        file.value = '';                       /* حتّى يُقبل الملفُّ نفسه مرّةً أخرى */
        if (!f) return;
        if (f.size > 8 * 1024 * 1024) {
          say('الملفُّ أكبرُ من الحدّ المعقول لنسخةِ التطبيق.', true);
          App.toast('الملفُّ كبيرٌ جدًّا.');
          return;
        }
        var fr = new FileReader();
        fr.onerror = function () {
          say('تعذّرت قراءةُ الملفّ.', true);
          App.toast('تعذّرت القراءة.');
        };
        fr.onload = function () {
          var text = typeof fr.result === 'string' ? fr.result : '';
          /* المِظروفُ المختومُ يُعرَف من صدرِه قبل أن يُقرأ: فلا
             يُرَدُّ على صاحبه «ملفٌّ فاسد» وإنّما تُطلَب كلمتُه. */
          if (App.Seal && App.Seal.sealed(text)) {
            var pass = window.prompt('كلمةُ ختمِ هذه النسخة:');
            if (pass === null) { say('أُلغي الاستيراد.', false); return; }
            say('يُفَكّ…', false);
            App.Seal.open(text, String(pass)).then(function (plain) {
              applyImport(plain);
            }).catch(function () {
              say('لم تُفتَح النسخة: الكلمةُ خاطئةٌ أو الملفُّ تالف.', true);
              App.toast('لم تُفتَح النسخة.');
            });
            return;
          }
          applyImport(text);
        };
        try { fr.readAsText(f); }
        catch (e) { say('تعذّرت قراءةُ الملفّ.', true); }
      }

      function applyImport(text) {
        var r;
        /* الفحصُ لا يرمي، لكنّ الحذرَ واجبٌ على كلّ حال */
        try { r = validate(text); }
        catch (e) { r = bad('تعذّر فحصُ الملفّ.'); }

        if (!r.ok) {
          /* لا تُمسُّ بياناتُ الطالب القائمةُ بحرف */
          say('رُفض الملفّ: ' + r.why, true);
          App.toast('رُفض الملفّ.');
          return;
        }
        var n = r.next.plans.length;
        replaceState(r.next);
        App.save();
        App.applyIdentity();
        if (!App.state.profile) { App.go('onboard'); App.toast('استُوردت النسخة.'); return; }
        App.redraw();
        App.toast('استُوردت النسخةُ: ' + App.ar(n) + ' ' + (n === 1 ? 'منهج' : 'منهجًا') + '.');
      }

      /* المحوُ لا رجعةَ فيه، فخطوتان: صفٌّ يسأل ثمّ زرٌّ يؤكّد */
      function drawWipe(armed) {
        wipeSlot.innerHTML = '';
        if (!armed) {
          var b = App.el('button', 'st-row st-danger');
          b.type = 'button';
          b.innerHTML = ic(['trash'], 22) +
            '<span class="st-rt"><b>محو كلّ شيء</b>' +
            '<small>يُمحى ملفُّك ومناهجُك وحلقاتُك من هذا المتصفّح.</small></span>';
          b.onclick = function () { drawWipe(true); };
          wipeSlot.appendChild(b);
          return;
        }
        var ask = App.el('div', 'st-ask');
        ask.setAttribute('role', 'group');
        ask.setAttribute('aria-label', 'تأكيد محو البيانات');
        var p = txt('p', null,
          'سيُمحى كلُّ شيء: ' + App.ar(App.state.plans.length) + ' منهجًا و' +
          App.ar(App.state.circles.length) + ' حلقة. ولا رجعةَ بعدها إلّا من نسخةٍ صدّرتَها.');
        p.setAttribute('aria-live', 'polite');
        ask.appendChild(p);
        var bs = App.el('div', 'st-ask-b');
        var yes = txt('button', 'st-yes', 'نعم، امحُ كلّ شيء');
        yes.type = 'button';
        var no = txt('button', 'st-no', 'إلغاء');
        no.type = 'button';
        yes.onclick = function () {
          App.reset();
          App.applyIdentity();
          App.go('onboard');
          App.toast('مُحيت كلُّ البيانات.');
        };
        no.onclick = function () { drawWipe(false); };
        bs.appendChild(yes);
        bs.appendChild(no);
        ask.appendChild(bs);
        wipeSlot.appendChild(ask);
        yes.focus();
      }
      drawWipe(false);

      return RET;
    }

    /* الساعةُ باثنتَي عشرة ومساءً/صباحًا: هكذا تُقرأ عندنا */
    function clock(d) {
      var h = d.getHours(), m = d.getMinutes();
      var am = h < 12;
      var h12 = h % 12; if (!h12) h12 = 12;
      return App.ar(h12) + ':' + App.ar(m < 10 ? '0' + m : m) +
             ' ' + (am ? 'صباحًا' : 'مساءً');
    }

    /* ── حالُ النسخةِ وحالُ التثبيت ──────────────────────────────
       الخبرُ قبل الزرّ: يُقال للقارئ أين هو أوّلًا، ثمّ يُعرَض عليه
       الفعلُ إن كان ثَمَّ فعل. ومن لا شيءَ عنده يَفعله يَقرأ سطرًا
       مطمئنًّا ويَمضي — لا زرَّ رماديًّا يَحتار فيه.

       وسفاري لا يُعطي زرَّ تثبيتٍ البتّة، فلا يُصطنَع له زرٌّ كاذب:
       يُقال لصاحبِه بأيِّ يدٍ يُثبّته بنفسه. */
    function liveState() {
      var P = App.PWA;
      var box = App.el('div', 'st-live');
      if (!P) return box;

      function row(text, label, go) {
        var r = App.el('div', 'st-live-r');
        r.appendChild(txt('span', 'st-live-t', text));
        if (label) {
          var b = App.el('button', 'st-live-go', label);
          b.type = 'button';
          b.onclick = go;
          r.appendChild(b);
        }
        return r;
      }

      function paint() {
        box.innerHTML = '';
        if (P.hasUpdate()) {
          box.appendChild(row('نسخةٌ أحدثُ جاهزةٌ على جهازك.',
            'حدِّثْ الآن', function () { P.apply(); }));
        } else {
          box.appendChild(row('نسختُك هي الأحدث.', null, null));
        }

        if (P.installed()) {
          box.appendChild(row('التطبيقُ مُثبَّتٌ على جهازك.', null, null));
        } else if (P.canInstall()) {
          box.appendChild(row('التطبيقُ غيرُ مُثبَّت.',
            'ثبِّتْه', function () { P.install(); }));
        } else if (P.apple()) {
          box.appendChild(row('التطبيقُ غيرُ مُثبَّت. افتح زِرَّ المشاركة ' +
            'في أسفلِ سفاري، ثمّ «إضافة إلى الشاشة الرئيسية».', null, null));
        } else {
          box.appendChild(row('التطبيقُ غيرُ مُثبَّت. يُثبِّته متصفّحُك من ' +
            'قائمته حين يَراك عُدتَ إليه مرّاتٍ.', null, null));
        }
      }

      /* يُنصَت ما دام اللوحُ معروضًا: فإن نزلت نسخةٌ والقارئُ ههنا
         تبدّل السطرُ تحت عينِه. وإذا زال اللوحُ رُفع الإنصات. */
      var upd = function () {
        if (!box.isConnected) { P.off(upd); return; }
        paint();
      };
      P.on(upd);
      paint();
      return box;
    }

    /* ═══ ٤ · عن التطبيق ══════════════════════════════════════════ */
    function paneAbout() {
      var box = App.el('div', 'st-card st-about');

      /* الشعارُ يَحمل الاسمَ مكتوبًا، فكتابتُه بجانبه تكرارٌ لكلمةٍ
         واحدةٍ مرّتين في سطرٍ واحد. فهو وحدَه، والإصدارُ تحته. */
      var brand = App.el('div', 'st-brand');
      /* كان ههنا الشعارُ بمئةٍ وستّةٍ وسبعين. ولمّا صار في صدر كلِّ
         صفحةٍ صار في هذه الشاشةِ شعارانِ لا يَفصل بينهما إلّا لسانٌ
         واحد — وهو التكرارُ الذي نَعيبه. فبَقي في صدر الصفحةِ وحدَه،
         وبَقي ههنا ما لا يَقوله غيرُه: أيُّ نسخةٍ بين يديك ومتى. */
      /* رقمُ النسخةِ ووقتُ بنائها: يُحقنان في البناءِ نفسِه من ملفِّ
         VERSION ومن ساعةِ الجهازِ الباني، فلا يُكتبان بيدٍ فيَشيخان.
         وبهما يَعرف صاحبُ التطبيقِ أيَّ نسخةٍ يَرى مستخدمُه، ويَعرف
         المستخدمُ أنّ ما بين يديه حديث. */
      var B = window.__BUILD || {};
      /* الرقمُ بالأرقام العربيّةِ كسائرِ أرقامِ التطبيق، وداخلَ عازلِ
         اتّجاهٍ (‎U+2066…U+2069‎) لئلّا تَنقلب النقطةُ في سطرٍ عربيّ
         فتُقرأ «٢٦٫١». */
      brand.appendChild(txt('span', 'st-ver',
        'الإصدار \u2066' + App.ar(B.v || '—') + '\u2069'));
      if (B.at) {
        var d = new Date(B.at);
        if (!isNaN(d.getTime())) {
          brand.appendChild(txt('span', 'st-built',
            'آخرُ تحديث: ' + App.hijri(d) + ' · ' + clock(d)));
        }
      }
      box.appendChild(brand);

      /* حالُ النسخةِ وحالُ التثبيت: خبرانِ لا يَعرفهما القارئُ إلّا
         من ههنا — أعندي أحدثُ نسخةٍ أم نزلت واحدةٌ تَنتظر؟ وهل
         التطبيقُ على شاشتي أم أنا في متصفّحٍ أَفقِده إن أُغلق؟ */
      box.appendChild(liveState());

      /* ثلاثُ فقراتٍ كانت تَشرح للحافظِ كيف بُني التطبيق: لا خادمَ، ولا
         حساب، وأين تُخزَّن بياناتُه، وكيف تعمل الحلقات. وهو لم يَفتح
         «ارتقِ» ليَعرف هذا — فتحه ليَحفظ ويُراجع ويُثبّت. فيَبقى سطرٌ
         واحدٌ يقول ما يَصنعه التطبيقُ له، لا كيف صُنع. */
      box.appendChild(txt('p', null,
        'تبني منهجَ حفظك ومراجعتك بنفسك، ويَحسب لك وردَ كلِّ يومٍ ويومَ خِتامك.'));

      /* إشعارُ رخصةِ المصدرِ انتقل إلى صدرِ الملفِّ المُوزَّع تعليقًا:
         الرخصةُ تَشترط بقاءَ الإشعارِ في النسخةِ لا عرضَه في الواجهة،
         فالشرطُ قائمٌ والشاشةُ خالصةٌ للقارئِ بلغتِه وحدَها. */
      var sign = App.el('div', 'st-sign');
      /* سطران مقصودان لا سطرٌ يَنكسر حيث اتّفق: الاسمُ أوّلًا
         والتاريخُ تحته، فلا يَقع الكسرُ في وسطِ «ارتقِ ٢٠٢٦م». */
      sign.appendChild(txt('p', 'st-sign-c',
        'جميع الحقوق محفوظة © عرفات الراجحي'));
      sign.appendChild(txt('p', 'st-sign-y',
        'رتِّل وارتقِ — ٢٠٢٦م / ١٤٤٨هـ'));
      sign.appendChild(txt('p', 'st-sign-p',
        'اللهمّ اغفرْ لمطوِّرها ومستخدميها ووالديهم والمسلمين أجمعين'));
      box.appendChild(sign);
      return box;
    }

    /* ═══ الألسنة ═════════════════════════════════════════════════ */
    wrap.appendChild(App.seg([
      { key: 'me',    label: 'حسابي',      icon: 'user',    render: paneAccount },
      { key: 'id',    label: 'المظهر',      icon: 'user', render: paneIdentity },
      { key: 'data',  label: 'بياناتي',     icon: 'page',    render: paneData },
      { key: 'about', label: 'عن التطبيق', icon: 'info',    render: paneAbout }
    ], {
      start: TAB,
      onchange: function (k) {
        TAB = k;
        hero.style.display = (k === 'me') ? '' : 'none';
      }
    }));
    hero.style.display = (TAB === 'me') ? '' : 'none';

    return wrap;
  }

  App.screen('settings', render);
  /* ولا لسانَ لها في الشريطِ السفليّ: صعدت إلى يسارِ الشعارِ في
     صدرِ كلِّ صفحة (‎brandBar‎ في ‎00-core‎)، وأخلت موضعَها
     لـ«حلقتي». وهي فعلٌ يُقصَد مرّةً في الشهر، والشريطُ لما
     يُقصَد كلَّ يوم. */
})(window.App);

/* نمطُ الشعارِ كلُّه في ‎.appmark‎ بـ‎20-shell‎ — موضعٌ واحدٌ
   لهيئتِه أينما وقع، فلا تُعاد هنا. */
</script>
<script>
/* الإقلاعُ آخرَ شيء: كلُّ الوحدات سجّلت شاشاتِها وتبويباتِها قبله. */
App.boot(document.getElementById('app'), document.getElementById('nav'));
</script>
<script>
/* عاملُ الخدمة — للعملِ دون اتصالٍ وقَبولِ التثبيت. يُضيفه deploy.py، وليس

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});

}
</script>
